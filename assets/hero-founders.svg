<svg width="900" height="720" viewBox="0 0 900 720" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Dodidis.Media Gründer mit Laptop und Kamera</title>
  <desc id="desc">Stilisierte Hero-Illustration von zwei Personen: links mit Laptop, rechts mit Videokamera.</desc>
  <defs>

name: Claude Code Review

# Automatisches Code-Review bei jedem neuen / aktualisierten Pull Request
# (entspricht dem Verhalten, das du von Codex kennst).
on:
  pull_request:
    types: [opened, synchronize]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Bitte reviewe diesen Pull Request. Achte auf:
            - Korrektheit & mögliche Bugs
            - Sicherheit (z. B. Eingaben, XSS in PHP/HTML-Ausgaben)
            - Performance- und Lesbarkeits-/Wartbarkeitsprobleme
            - Einhaltung bestehender Code-Konventionen

            Gib das Feedback auf Deutsch über inline review comments
            (`mcp__github_inline_comment__create_inline_comment`) an den
            relevanten Stellen ab. Halte dich kurz und priorisiere.

          # Leserechte fürs Review + Tool zum Setzen von Inline-Kommentaren
          claude_args: |
            --allowed-tools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*)"

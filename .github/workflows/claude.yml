name: Claude Code

# Reagiert auf "@claude"-Erwähnungen in Issues, PR-Kommentaren und Reviews.
# Schreibe z. B. in einem PR-Kommentar "@claude bitte behebe den Lint-Fehler".
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Nur starten, wenn irgendwo "@claude" steht
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          # In den Repo-Secrets als ANTHROPIC_API_KEY hinterlegen
          # (Settings -> Secrets and variables -> Actions).
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

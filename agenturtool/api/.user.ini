; PHP settings for /api/ — streaming large NAS uploads without buffering to Netcup disk.
; Applied automatically by PHP-FPM for all scripts in this directory.
; Protected from web access by the root .htaccess (<FilesMatch "^\.">) rule.

; Disable POST body size limit — streaming reads from php://input, not $_FILES.
post_max_size = 0

; $_FILES-Uploads (upload.php/contracts.php) NICHT vor der App-Pruefung mit
; UPLOAD_ERR_INI_SIZE abweisen: mind. so hoch wie config.php max_upload_bytes
; (2 GiB). Hinweis: ein niedrigeres Hosting-Limit kann dies deckeln.
upload_max_filesize = 2048M

; Kein Zeitlimit fuer lange NAS-Transfers (grosse Up-/Downloads, mehrere GB).
; 0 = unbegrenzt. Hinweis: Ein evtl. request_terminate_timeout der PHP-FPM-Pool-
; Konfig des Webhostings kann trotzdem greifen (Shared-Hosting-Deckel) -> dann
; sehr grosse Rohdateien direkt auf dem NAS ablegen und "Aktualisieren".
max_execution_time = 0
max_input_time     = 0

; Keep memory footprint low — streaming, not buffering.
memory_limit = 256M

; Output buffering off — necessary for passthru() to send chunks immediately.
output_buffering = Off

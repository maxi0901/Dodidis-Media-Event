/* ----- KORREKTUR-MODAL ----- */
let correctionRecorder = null;
let correctionAudioChunks = [];
let correctionAudioBlob = null;
let correctionAudioUrl = null;

function openCorrectionModal(projectId) {
  const p = store.projects.find(x => x.id === projectId);
  if (!p) return;
  correctionAudioBlob = null;
  correctionAudioUrl = null;
  correctionAudioChunks = [];

  const html = `
    <div class="modal-backdrop" onclick="if(event.target===this)closeModal()">
      <div class="modal" style="max-width:560px;">
        <div class="modal-header">
          <div>
            <div class="modal-title">Korrektur anfragen</div>
            <div class="text-sm text-muted" style="margin-top:4px;">${escape(p.title)}</div>
          </div>
          <button class="modal-close" onclick="closeModal()">×</button>
        </div>
        <div class="modal-body">
          <div class="info-box">
            Der Cutter bekommt deine Notiz sofort. Du kannst sie als Text und/oder als Sprachnachricht aufnehmen.
          </div>

          <div class="form-group">
            <label class="form-label">Textnotiz</label>
            <textarea id="correction-text" placeholder="Was soll geändert werden?"></textarea>
          </div>

          <div class="form-group">
            <label class="form-label">Sprachnachricht</label>
            <div class="flex gap-2" style="align-items:center; flex-wrap:wrap;">
              <button type="button" id="rec-btn" class="btn btn-secondary btn-sm" onclick="toggleCorrectionRecording()">
                🎙️ Aufnahme starten
              </button>
              <span id="rec-status" class="text-sm text-muted"></span>
            </div>
            <div id="rec-preview" style="margin-top:10px;"></div>
            <div class="text-sm text-muted mt-2">Mikrofonzugriff wird beim ersten Klick angefragt.</div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-ghost" onclick="closeModal()">Abbrechen</button>
          <button type="button" class="btn btn-primary" onclick="submitCorrection('${projectId}')">Korrektur senden</button>
        </div>
      </div>
    </div>
  `;
  $('#modal-container').innerHTML = html;
}

async function toggleCorrectionRecording() {
  const btn = $('#rec-btn');
  const status = $('#rec-status');
  if (correctionRecorder && correctionRecorder.state === 'recording') {
    correctionRecorder.stop();
    return;
  }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    alert('Audio-Aufnahme wird in diesem Browser nicht unterstützt.');
    return;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    correctionAudioChunks = [];
    correctionRecorder = new MediaRecorder(stream);
    correctionRecorder.ondataavailable = e => correctionAudioChunks.push(e.data);
    correctionRecorder.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      const mime = correctionRecorder.mimeType || 'audio/webm';
      correctionAudioBlob = new Blob(correctionAudioChunks, { type: mime });
      const reader = new FileReader();
      reader.onload = () => {
        correctionAudioUrl = reader.result;
        const prev = $('#rec-preview');
        if (prev) prev.innerHTML = `<audio controls src="${correctionAudioUrl}" style="width:100%;"></audio>`;
      };
      reader.readAsDataURL(correctionAudioBlob);
      btn.textContent = '🎙️ Aufnahme erneut starten';
      btn.classList.remove('btn-danger');
      btn.classList.add('btn-secondary');
      status.textContent = '✓ Aufnahme bereit';
    };
    correctionRecorder.start();
    btn.textContent = '⏹ Stopp';
    btn.classList.remove('btn-secondary');
    btn.classList.add('btn-danger');
    status.textContent = '● Nimmt auf …';
  } catch (e) {
    alert('Mikrofon-Zugriff verweigert: ' + e.message);
  }
}

function submitCorrection(projectId) {
  const text = $('#correction-text')?.value.trim() || '';
  if (!text && !correctionAudioUrl) {
    alert('Bitte eine Textnotiz schreiben oder eine Sprachnachricht aufnehmen.');
    return;
  }
  const idx = store.projects.findIndex(p => p.id === projectId);
  if (idx < 0) return;
  const session = getCurrentUser();
  const note = {
    text,
    audio: correctionAudioUrl || null,
    createdAt: new Date().toISOString(),
    createdById: session?.user?.id || null
  };
  if (!store.projects[idx].correctionNotes) store.projects[idx].correctionNotes = [];
  store.projects[idx].correctionNotes.push(note);
  store.projects[idx].status = STATUS.KORREKTUR;
  logActivity('project', store.projects[idx].id, 'correctionRequested', { title: store.projects[idx].title, text: (note.text || '').slice(0, 200) });
  saveStore();
  writeLiveICS();
  // Cutter benachrichtigen
  const p = store.projects[idx];
  if (p.cutterId) {
    notifyUser(p.cutterId, 'Korrektur angefragt', `„${p.title}" muss überarbeitet werden.`);
  }
  closeModal();
  renderPage();
}

async function deleteProject(projectId) {
  const p = store.projects.find(x => x.id === projectId);
  if (!p) return;
  const session = getCurrentUser();
  if (!canActOnProject(p, session, 'delete')) {
    appAlert('Du hast keine Berechtigung dafür.', { title: 'Nicht erlaubt' });
    return;
  }
  const ok = await appConfirm('Diese Aktion kann nicht rückgängig gemacht werden.', {
    title: 'Projekt wirklich löschen?',
    okLabel: 'Löschen',
    danger: true
  });
  if (!ok) return;
  // Snapshot für Undo
  const removed = store.projects.find(x => x.id === projectId);
  const removedIdx = store.projects.findIndex(x => x.id === projectId);
  trackDeletion('projects', projectId);
  store.projects = store.projects.filter(p => p.id !== projectId);
  saveStore();
  writeLiveICS();
  closeModal();
  renderPage();
  if (removed) {
    showUndoToast(`Projekt „${removed.title}" gelöscht`, () => {
      // Aus Pending-Deletions wieder rausnehmen
      if (store._pendingDeletions?.projects) {
        store._pendingDeletions.projects = store._pendingDeletions.projects.filter(id => id !== projectId);
      }
      store.projects.splice(Math.min(removedIdx, store.projects.length), 0, removed);
      saveStore();
      writeLiveICS();
      renderPage();
      showToast('Wiederhergestellt', `„${removed.title}"`);
    });
  }
}

/* ----- Apple-Style Bestätigungs-/Hinweis-Dialoge ----- */
function appConfirm(message, opts = {}) {
  return new Promise(resolve => {
    const id = 'cdlg_' + Math.random().toString(36).slice(2,9);
    const wrap = document.createElement('div');
    wrap.innerHTML = `
      <div class="modal-backdrop">
        <div class="modal" style="max-width: 400px;">
          <div class="modal-body" style="padding: 30px 26px 14px; text-align: center;">
            ${opts.title ? `<div style="font-size: 17px; font-weight: 700; color: var(--text-1); margin-bottom: 8px; letter-spacing: -0.2px;">${escape(opts.title)}</div>` : ''}
            <div style="font-size: 13.5px; color: var(--text-2); line-height: 1.55; white-space: pre-wrap;">${escape(message)}</div>
          </div>
          <div class="modal-footer" style="justify-content: center; gap: 10px;">
            <button type="button" class="btn btn-secondary" data-act="cancel">${escape(opts.cancelLabel || 'Abbrechen')}</button>
            <button type="button" class="btn ${opts.danger ? 'btn-danger' : 'btn-primary'}" data-act="ok">${escape(opts.okLabel || 'Bestätigen')}</button>
          </div>
        </div>
      </div>
    `;
    const backdrop = wrap.firstElementChild;
    document.body.appendChild(backdrop);
    const done = (v) => { backdrop.remove(); resolve(v); };
    backdrop.addEventListener('click', e => { if (e.target === backdrop) done(false); });
    backdrop.querySelector('[data-act="cancel"]').onclick = () => done(false);
    backdrop.querySelector('[data-act="ok"]').onclick = () => done(true);
    setTimeout(() => backdrop.querySelector('[data-act="ok"]').focus(), 80);
  });
}

function appAlert(message, opts = {}) {
  return new Promise(resolve => {
    const wrap = document.createElement('div');
    wrap.innerHTML = `
      <div class="modal-backdrop">
        <div class="modal" style="max-width: 400px;">
          <div class="modal-body" style="padding: 30px 26px 14px; text-align: center;">
            ${opts.title ? `<div style="font-size: 17px; font-weight: 700; color: var(--text-1); margin-bottom: 8px; letter-spacing: -0.2px;">${escape(opts.title)}</div>` : ''}
            <div style="font-size: 13.5px; color: var(--text-2); line-height: 1.55; white-space: pre-wrap;">${escape(message)}</div>
          </div>
          <div class="modal-footer" style="justify-content: center;">
            <button type="button" class="btn btn-primary" data-act="ok">${escape(opts.okLabel || 'OK')}</button>
          </div>
        </div>
      </div>
    `;
    const backdrop = wrap.firstElementChild;
    document.body.appendChild(backdrop);
    const done = () => { backdrop.remove(); resolve(); };
    backdrop.addEventListener('click', e => { if (e.target === backdrop) done(); });
    backdrop.querySelector('[data-act="ok"]').onclick = done;
    setTimeout(() => backdrop.querySelector('[data-act="ok"]').focus(), 80);
  });
}

function renderCustomers(session) {
  $('#page-title').textContent = 'Kunden';
  $('#page-subtitle').textContent = 'Übersicht aller Agenturkunden';

  const user = session.user;
  const canCreate = hasRole(user, ROLES.ADMIN, ROLES.MANAGER);
  $('#topbar-actions').innerHTML = canCreate
    ? `<button class="btn btn-primary" onclick="openCustomerModal()">+ Neuer Kunde</button>` : '';

  let customers = store.customers;
  if (hasRole(user, ROLES.MANAGER) && !hasRole(user, ROLES.ADMIN)) {
    customers = customers.filter(c => c.managerId === user.id);
  }

  // Filter
  const cf = JSON.parse(localStorage.getItem(_filterKey('cust_filters')) || '{}');
  const cSearch = (cf.q || '').toLowerCase();
  const cStatus = cf.status || 'all';
  if (cSearch || cStatus !== 'all') {
    customers = customers.filter(c => {
      if (cStatus !== 'all' && customerStatus(c) !== cStatus) return false;
      if (!cSearch) return true;
      const mgr = store.users.find(u => u.id === c.managerId);
      const hay = (c.name + ' ' + c.customerNumber + ' ' + (c.package || '') + ' ' + (mgr?.name || '') + ' ' + (c.industry || '')).toLowerCase();
      return hay.includes(cSearch);
    });
  }

  const custFilterBar = `
    <div class="card mb-4" style="padding:12px 14px;">
      <div style="display:flex; flex-wrap:wrap; gap:10px; align-items:center;">
        <input type="text" id="cust-search" placeholder="🔎 Suche (Name, Nummer, Manager, Paket)…"
               value="${escape(cSearch)}"
               oninput="onCustomerFilterChange()"
               style="flex:1; min-width:240px; padding:8px 12px; border-radius:8px; background:var(--bg-2); border:1px solid var(--border); color:inherit;"/>
        <select id="cust-status" onchange="onCustomerFilterChange()" style="padding:8px 12px; border-radius:8px; background:var(--bg-2); border:1px solid var(--border); color:inherit;">
          <option value="all" ${cStatus==='all'?'selected':''}>Alle Status</option>
          ${Object.entries(CUSTOMER_STATUS_LABELS).map(([k,v]) => `<option value="${k}" ${cStatus===k?'selected':''}>${escape(v)}</option>`).join('')}
        </select>
        ${(cSearch || cStatus !== 'all') ? `<button class="btn btn-ghost btn-sm" onclick="resetCustomerFilters()">Filter zurücksetzen</button>` : ''}
        <span class="text-sm text-muted">${customers.length} Treffer</span>
      </div>
    </div>
  `;

  if (customers.length === 0) {
    $('#content').innerHTML = custFilterBar + `
      <div class="card"><div class="empty-state">
        <div class="empty-state-icon">👤</div>
        ${(cSearch || cStatus !== 'all') ? 'Keine Kunden entsprechen deinem Filter.' : 'Noch keine Kunden angelegt.'}
        ${canCreate && !(cSearch || cStatus !== 'all') ? '<br/><br/><button class="btn btn-primary" onclick="openCustomerModal()">Ersten Kunden anlegen</button>' : ''}
      </div></div>`;
    return;
  }

  const isAdmin = hasRole(user, ROLES.ADMIN);
  $('#content').innerHTML = custFilterBar + `
    <div class="card">
      <table>
        <thead>
          <tr>
            ${isAdmin ? `<th style="width:30px;"><input type="checkbox" onchange="this.checked ? bulkSelectAll('customers', ${JSON.stringify(customers.map(c=>c.id))}) : clearBulk()"/></th>` : ''}
            <th>Kunde</th>
            <th>Kundennr.</th>
            <th>Status</th>
            <th>Manager</th>
            <th>Onboarding</th>
            <th>Paket</th>
            <th>Projekte</th>
          </tr>
        </thead>
        <tbody>
          ${customers.map(c => {
            const mgr = store.users.find(u => u.id === c.managerId);
            const projectCount = store.projects.filter(p => p.customerId === c.id).length;
            const checklist = c.checklist || {};
            const done = ONBOARDING_CHECKLIST.filter(i => checklist[i.key]).length;
            const total = ONBOARDING_CHECKLIST.length;
            const pct = Math.round((done / total) * 100);
            const status = customerStatus(c);
            return `
              <tr style="cursor:pointer" onclick="if(!event.target.classList.contains('bulk-checkbox'))openCustomerModal('${c.id}')">
                ${isAdmin ? `<td onclick="event.stopPropagation()"><input type="checkbox" class="bulk-checkbox" onchange="toggleBulk('customers','${c.id}',this.checked)"/></td>` : ''}

                <td><span class="badge badge-status-${status}">${CUSTOMER_STATUS_LABELS[status]}</span></td>

function switchTab(e, tabId) {
  const modal = e.target.closest('.modal');
  modal.querySelectorAll('.modal-tab').forEach(t => t.classList.remove('active'));
  modal.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  e.target.classList.add('active');
  modal.querySelector('#' + tabId).classList.add('active');
}

// Contract file upload (base64, stored in localStorage – warn if > 4MB)
let pendingContractFile = null;
function uploadContractFile(e) {
  const file = e.target.files[0];
  if (!file) return;
  if (file.size > 4 * 1024 * 1024) {
    alert('Datei ist zu groß (max. 4 MB für LocalStorage).');
    return;
  }
  const reader = new FileReader();
  reader.onload = ev => {
    pendingContractFile = { name: file.name, data: ev.target.result };
    // Visual feedback
    const labelEl = e.target.closest('.file-upload');
    if (labelEl) {
      labelEl.style.borderColor = 'var(--accent)';
      labelEl.style.background = 'var(--accent-soft)';
      labelEl.querySelector('div').textContent = '✓ ' + file.name + ' bereit zum Speichern';
    }
  };
  reader.readAsDataURL(file);
}

function downloadContractFile(customerId) {
  const c = store.customers.find(x => x.id === customerId);
  if (!c?.contractFile) return;
  const a = document.createElement('a');
  a.href = c.contractFile;

function generateNextCustomerNumber() {
  const existing = store.customers.map(c => parseInt(c.customerNumber, 10)).filter(n => !isNaN(n));
  const next = existing.length ? Math.max(...existing) + 1 : 1001;
  return String(next);
}

async function saveCustomer(e, customerId) {
  e.preventDefault();
  const session = getCurrentUser();
  if (!session || session.type !== 'staff' || !hasRole(session.user, ROLES.ADMIN, ROLES.MANAGER)) {
    appAlert('Nur Admin/Manager dürfen Kunden anlegen/ändern.', { title: 'Nicht erlaubt' });
    return;
  }
  // Manager darf nur eigene Kunden bearbeiten
  if (customerId && !hasRole(session.user, ROLES.ADMIN)) {
    const existing = store.customers.find(c => c.id === customerId);
    if (existing && existing.managerId && existing.managerId !== session.user.id) {
      appAlert('Du kannst nur deine eigenen Kunden bearbeiten.', { title: 'Nicht erlaubt' });
      return;
    }
  }
  const formData = new FormData(e.target);
  const data = Object.fromEntries(formData);

  // Check unique customer number
  const dup = store.customers.find(c => c.customerNumber === data.customerNumber && c.id !== customerId);
  if (dup) {
    alert('Diese Kundennummer ist bereits vergeben.');
    return;
  }

  // PIN-Handling: newPin nur dann übernehmen wenn nicht leer (sonst alten PIN behalten)
  const newPin = (data.newPin || '').trim();
  delete data.newPin;
  let pinHashUpdate = null;
  if (newPin) {
    pinHashUpdate = await hashPassword(newPin);
  }

  // Build onboarding checklist from form (HTML checkboxes set value="on" when checked, undefined when not)
  const form = e.target;
  const checklist = {};
  ONBOARDING_CHECKLIST.forEach(item => {
    const cb = form.querySelector(`[name="checklist_${item.key}"]`);
    checklist[item.key] = !!(cb && cb.checked);
    delete data['checklist_' + item.key];
  });

  // Handle "billing same as address" checkbox
  data.billingSameAsAddress = !!data.billingSameAsAddress;

  // Manual status override (paused only)
  const manualStatus = data.manualStatus || '';
  delete data.manualStatus;
  data.status = manualStatus === 'paused' ? 'paused' : null;

  // Add contract file if pending
  const fileAdds = {};
  if (pendingContractFile) {
    fileAdds.contractFile = pendingContractFile.data;
    fileAdds.contractFileName = pendingContractFile.name;
    pendingContractFile = null;
  }

  if (customerId) {
    const idx = store.customers.findIndex(c => c.id === customerId);
    if (idx >= 0) {
      store.customers[idx] = { ...store.customers[idx], ...data, ...fileAdds, checklist };
      if (pinHashUpdate) store.customers[idx].pinHash = pinHashUpdate;
    }
  } else {
    store.customers.push({
      id: uid('c'),
      ...data,
      ...fileAdds,
      checklist,
      ...(pinHashUpdate ? { pinHash: pinHashUpdate } : {}),
      createdAt: new Date().toISOString()
    });
  }
  saveStore();
  // Auto-refresh live ICS file if active
  writeLiveICS();
  closeModal();
  renderPage();
}

async function deleteCustomer(customerId) {
  const session = getCurrentUser();
  if (!session || session.type !== 'staff' || !hasRole(session.user, ROLES.ADMIN)) {
    appAlert('Nur Admins können Kunden löschen.', { title: 'Keine Berechtigung' });
    return;
  }
  const hasProjects = store.projects.some(p => p.customerId === customerId);
  const msg = hasProjects
    ? 'Dieser Kunde hat zugewiesene Projekte. Wirklich löschen? Die Projekte bleiben erhalten, sind aber dann ohne Kunden.'
    : 'Diese Aktion kann nicht rückgängig gemacht werden.';
  const ok = await appConfirm(msg, { title: 'Kunde löschen?', okLabel: 'Löschen', danger: true });
  if (!ok) return;
  const removed = store.customers.find(c => c.id === customerId);
  const removedIdx = store.customers.findIndex(c => c.id === customerId);
  trackDeletion('customers', customerId);
  store.customers = store.customers.filter(c => c.id !== customerId);
  saveStore();
  closeModal();
  renderPage();
  if (removed) {
    showUndoToast(`Kunde „${removed.name}" gelöscht`, () => {
      if (store._pendingDeletions?.customers) {
        store._pendingDeletions.customers = store._pendingDeletions.customers.filter(id => id !== customerId);
      }
      store.customers.splice(Math.min(removedIdx, store.customers.length), 0, removed);
      saveStore();
      renderPage();
      showToast('Wiederhergestellt', removed.name);
    });
  }
}

/* ----------- CALENDAR ----------- */
let calendarDate = new Date();
let dashboardCalDate = new Date();
let calendarView = 'week'; // 'week' | 'month'
let dashboardView = 'week'; // 'week' | 'month'

// Pro User: welche Kategorien sind im Kalender sichtbar
// Schema v2: enthält shoot-Kategorie. Älterer State wird automatisch migriert.
const DEFAULT_CAL_VISIBILITY = { shoot: true, vacation: true, videos: true, todos: true };
const CAL_VISIBILITY_VERSION = 2;
function getCalCatVisibility() {
  const session = getCurrentUser();
  if (!session || session.type !== 'staff') return { ...DEFAULT_CAL_VISIBILITY };
  // Quelle der Wahrheit: user.calendarPrefs am User-Objekt selbst (geht via Cloud-Sync mit auf andere Geräte)
  const u = session.user;
  if (u && u.calendarPrefs && u.calendarPrefs._v === CAL_VISIBILITY_VERSION) {
    return { ...DEFAULT_CAL_VISIBILITY, ...u.calendarPrefs };
  }
  // Migration: alter localStorage-Wert übernehmen falls vorhanden
  const lsKey = 'calcat_' + u.id;
  try {
    const stored = JSON.parse(localStorage.getItem(lsKey));
    if (stored && typeof stored === 'object') {
      const migrated = { ...DEFAULT_CAL_VISIBILITY, ...stored, _v: CAL_VISIBILITY_VERSION };
      const idx = store.users.findIndex(x => x.id === u.id);
      if (idx >= 0) {
        store.users[idx].calendarPrefs = migrated;
        saveStore();
      }
      return migrated;
    }
  } catch {}
  return { ...DEFAULT_CAL_VISIBILITY };
}
function setCalCatVisibility(key, on) {
  const session = getCurrentUser();
  if (!session || session.type !== 'staff') return;
  const v = { ...getCalCatVisibility(), _v: CAL_VISIBILITY_VERSION };
  v[key] = on;
  const idx = store.users.findIndex(x => x.id === session.user.id);
  if (idx >= 0) {
    store.users[idx].calendarPrefs = v;
    saveStore(); // auch Cloud-Push
  }
}
function toggleCalCat(key) {
  const v = getCalCatVisibility();
  setCalCatVisibility(key, !v[key]);
  // Beide Kalender (Dashboard + Haupt) neu rendern
  const session = getCurrentUser();
  if (currentPage === 'dashboard') renderPage();
  else if (currentPage === 'calendar') renderPage();
}

// Welche Kategorien darf der User überhaupt sehen?
function getAvailableCalCats(user) {
  if (!user) return [];
  const cats = [];
  // Drehtag: nur wer Drehtage sehen darf (Admin/Manager/Videograf/Cutter)
  if (hasRole(user, ROLES.ADMIN, ROLES.MANAGER, ROLES.VIDEOGRAF, ROLES.CUTTER)) {
    cats.push('shoot');
  }
  // Urlaub: jeder
  cats.push('vacation');
  // Videos: jeder der mit Projekten arbeitet
  if (hasRole(user, ROLES.ADMIN, ROLES.MANAGER, ROLES.VIDEOGRAF, ROLES.CUTTER)) {
    cats.push('videos');
  }
  // Aufgaben: jeder
  cats.push('todos');
  return cats;
}

// Lokales ISO-Datum (YYYY-MM-DD) basierend auf der Browser-Zeitzone,
// damit `getDate()`-Labels und `dateStr`-Vergleiche im Kalender konsistent sind.
function localDateStr(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function addDays(dateStr, n) {
  // dateStr ist YYYY-MM-DD – als lokales Datum interpretieren, nicht als UTC
  const parts = dateStr.split('-').map(Number);
  const d = new Date(parts[0], parts[1] - 1, parts[2]);
  d.setDate(d.getDate() + n);
  return localDateStr(d);
}

/* Neue Bar-API: liefert flache Liste von Multi-Day-Bars (statt Tages-Events).
   Jede Bar: {projectId|vacationId, phase, startDate, endDate, title, customer, fullTitle, time?} */
function buildCalendarBars(session) {
  const user = session.user;
  const userId = user.id;
  const isAdmin = hasRole(user, ROLES.ADMIN);
  // Cutter sehen das Posting NICHT – sie kümmern sich nur um ihre Deadline
  const showsPostings = hasRole(user, ROLES.ADMIN, ROLES.MANAGER, ROLES.VIDEOGRAF);
  const myProjects = getRelevantProjects(user).filter(p => p.status !== STATUS.ARCHIVIERT);
  const bars = [];

  // Drehtage als eigene Entitäten – EINE Bar pro Drehtag, unabhängig wie viele Projekte zugewiesen sind
  const visibleShootDays = (store.shootDays || []).filter(sd => {
    // Videograf sieht nur seine eigenen Drehtage, Cutter nur die zu deren Projekten;
    // Admin/Manager sehen alles
    if (hasRole(user, ROLES.ADMIN, ROLES.MANAGER)) return true;
    if (hasRole(user, ROLES.VIDEOGRAF) && sd.videografId === userId) return true;
    if (hasRole(user, ROLES.CUTTER)) {
      // Drehtag sichtbar wenn mind. ein zugewiesenes Projekt dem User als Cutter zugewiesen ist
      return store.projects.some(p => p.shootDayId === sd.id && p.cutterId === userId);
    }
    return false;
  });
  visibleShootDays.forEach(sd => {
    const vg = store.users.find(u => u.id === sd.videografId);
    const cust = store.customers.find(c => c.id === sd.customerId);
    const linked = store.projects.filter(p => p.shootDayId === sd.id);
    const videoCount = linked.length;
    const titleLine = videoCount > 0
      ? `Drehtag · ${videoCount} Video${videoCount === 1 ? '' : 's'}`
      : `Drehtag${cust ? ' · ' + cust.name : ''}`;
    const detail = linked.map(p => p.title).join(' · ');
    bars.push({
      shootDayId: sd.id,
      phase: 'shoot',
      startDate: sd.date,
      endDate: sd.date,
      title: titleLine,
      customer: cust?.name || '',
      fullTitle: `Drehtag${vg ? ' · ' + vg.name : ''}${cust ? ' · ' + cust.name : ''} · ${sd.startTime}–${sd.endTime}${detail ? '\n' + detail : ''}`,
      videografUserId: sd.videografId
    });
  });

  myProjects.forEach(p => {
    const c = store.customers.find(x => x.id === p.customerId);
    const customerName = c?.name || '';
    const fullTitle = p.title + (customerName ? ' · ' + customerName : '');
    const sd = p.shootDate || null;
    const pd = p.postingDate || null;
    const dl = p.deadline || null; // = Cutter-Deadline
    const base = { projectId: p.id, title: p.title, customer: customerName, fullTitle };

    // KEIN 'shoot' mehr pro Projekt – Drehtag ist nur die Drehtag-Entität oben

    // Production-Spanne ab Drehtag bis Deadline-1 (Projekt startet AM Drehtag, nicht erst danach)
    if (sd && dl && sd < dl) {
      const prodStart = sd;
      const prodEnd = addDays(dl, -1);
      if (prodEnd >= prodStart) {
        bars.push({ ...base, phase: 'production', startDate: prodStart, endDate: prodEnd });
      }
    } else if (sd && !dl) {
      // Nur Drehtag bekannt – Projekt wird zumindest am Drehtag als Bar gezeigt
      bars.push({ ...base, phase: 'production', startDate: sd, endDate: sd });
    }

    // Deadline
    if (dl && dl !== sd) {
      bars.push({ ...base, phase: 'deadline', startDate: dl, endDate: dl, time: '17:00' });
    }

    // Posting – nur für Manager/Admin/Videograf sichtbar
    if (pd && pd !== dl && showsPostings) {
      bars.push({ ...base, phase: 'posting', startDate: pd, endDate: pd, time: '18:00' });
    }
  });

  // Hierarchie-Regel: man sieht den Urlaub aller, die ein NIEDRIGERES Rollen-Level haben + eigene
  store.vacations.forEach(v => {
    const u = store.users.find(x => x.id === v.userId);
    if (!u) return;
    if (!canViewVacationOf(user, u)) return;
    bars.push({
      vacationId: v.id,
      phase: 'vacation',
      startDate: v.startDate,
      endDate: v.endDate,
      title: 'Urlaub',
      customer: u.name,
      fullTitle: 'Urlaub – ' + u.name
    });
  });

  return bars;
}

// Schichtet Bars in "Lanes" (vertikale Stapelung), sodass sich überlappende Bars nicht überschreiben.
function layoutLanes(bars, weekStart, weekEnd) {
  const inWeek = bars
    .filter(b => !(b.endDate < weekStart || b.startDate > weekEnd))
    .sort((a, b) => a.startDate.localeCompare(b.startDate) || b.endDate.localeCompare(a.endDate));
  const lanes = [];
  return inWeek.map(b => {
    let laneIdx = lanes.findIndex(l => l < b.startDate);
    if (laneIdx === -1) { lanes.push(b.endDate); laneIdx = lanes.length - 1; }
    else lanes[laneIdx] = b.endDate;
    return { ...b, lane: laneIdx };
  });
}

function buildCalendarEvents(session) {
  const user = session.user;
  const userId = user.id;
  const isAdmin = hasRole(user, ROLES.ADMIN);
  const myProjects = getRelevantProjects(user).filter(p => p.status !== STATUS.ARCHIVIERT);

  // events[dateStr] = [ {kind, projectId|vacationId, label, phase, isStart, isEnd, customerName} ]
  const events = {};
  function add(dateStr, ev) {
    if (!events[dateStr]) events[dateStr] = [];
    events[dateStr].push(ev);
  }

  myProjects.forEach(p => {
    const c = store.customers.find(x => x.id === p.customerId);
    const customerName = c?.name || '';
    const fullTitle = p.title + (customerName ? ' · ' + customerName : '');

    const sd = p.shootDate || null;
    const pd = p.postingDate || null;
    const cd = pd ? addDays(pd, -1) : null;
    const showCutter = hasRole(user, ROLES.CUTTER, ROLES.MANAGER, ROLES.ADMIN) || p.cutterId === userId;

    // Multi-day bar: from shoot to posting (inkl.)
    if (sd && pd && sd <= pd) {
      let cur = sd;
      while (cur <= pd) {
        let phase;
        if (cur === sd) phase = 'shoot';
        else if (cur === pd) phase = 'posting';
        else if (cur === cd && showCutter) phase = 'cutter';
        else if (cd && cur < cd) phase = 'production';
        else phase = 'editing';
        add(cur, {
          kind: 'bar',
          projectId: p.id,
          phase,
          isStart: cur === sd,
          isEnd: cur === pd,
          title: p.title,
          customer: customerName,
          fullTitle
        });
        cur = addDays(cur, 1);
      }
    } else if (sd) {
      add(sd, { kind: 'bar', projectId: p.id, phase: 'shoot', isStart: true, isEnd: true, title: p.title, customer: customerName, fullTitle });
    } else if (pd) {
      // Solitary posting
      if (cd && showCutter) {
        add(cd, { kind: 'bar', projectId: p.id, phase: 'cutter', isStart: true, isEnd: true, title: p.title, customer: customerName, fullTitle });
      }
      add(pd, { kind: 'bar', projectId: p.id, phase: 'posting', isStart: true, isEnd: true, title: p.title, customer: customerName, fullTitle });
    }

    if (p.deadline && p.deadline !== p.postingDate) {
      add(p.deadline, { kind: 'bar', projectId: p.id, phase: 'deadline', isStart: true, isEnd: true, title: p.title, customer: customerName, fullTitle });
    }
  });

  // Urlaube – Hierarchie-Regel: höheres Rollen-Level sieht niedrigere + eigene
  store.vacations.forEach(v => {
    const u = store.users.find(x => x.id === v.userId);
    if (!u) return;
    if (!canViewVacationOf(user, u)) return;
    let cur = v.startDate;
    while (cur <= v.endDate) {
      add(cur, {
        kind: 'bar',
        vacationId: v.id,
        phase: 'vacation',
        isStart: cur === v.startDate,
        isEnd: cur === v.endDate,
        title: 'Urlaub',
        customer: u.name,
        fullTitle: 'Urlaub – ' + u.name
      });
      cur = addDays(cur, 1);
    }
  });

  return events;
}

/* ===== MONTH VIEW – vertikal scrollbarer Wochen-Stream (iCloud-Stil) ===== */
const MONTH_WEEK_ROWS = 26; // ~6 Monate Range
const MONTH_ROW_HEIGHT = 112;

function renderMonthViewInto(elementId, session, mini = false) {
  const el = document.getElementById(elementId);
  if (!el) return;
  const anchor = mini ? dashboardCalDate : calendarDate;
  const bars = buildCalendarBars(session);

  // Range: 13 Wochen davor, 13 danach (ab Montag der Bezugswoche)
  const baseMonday = getMondayOf(anchor);
  const weeksBefore = 13;
  const totalWeeks = MONTH_WEEK_ROWS;
  const firstMonday = new Date(baseMonday);
  firstMonday.setDate(firstMonday.getDate() - weeksBefore * 7);

  const today = new Date();
  const todayStr = localDateStr(today);
  const maxLanes = mini ? 2 : 4;

  // Drehtage aus store.shootDays (nur explizit eingetragene Drehtage)
  const shootDates = new Set((store.shootDays || []).map(s => s.date));

  // Build weeks
  const weeks = [];
  for (let w = 0; w < totalWeeks; w++) {
    const cells = [];
    for (let i = 0; i < 7; i++) {
      const d = new Date(firstMonday);
      d.setDate(d.getDate() + w * 7 + i);
      const dateStr = localDateStr(d);
      cells.push({
        date: d,
        dateStr,
        num: d.getDate(),
        firstOfMonth: d.getDate() === 1,
        month: d.getMonth(),
        year: d.getFullYear(),
        isShoot: shootDates.has(dateStr)
      });
    }
    weeks.push(cells);
  }

  // Kategorie-Filter wie in der Wochenansicht
  const available = getAvailableCalCats(session.user);
  const visibility = getCalCatVisibility();
  const phaseToCat = (phase) => {
    if (phase === 'shoot') return 'shoot';
    if (phase === 'vacation') return 'vacation';
    if (phase === 'todo') return 'todos';
    return 'videos'; // production, editing, cutter, posting, deadline
  };
  const filteredBars = bars.filter(b => {
    const cat = phaseToCat(b.phase);
    return available.includes(cat) && visibility[cat];
  });

  el.innerHTML = `
    <div class="calendar-header">
      <div class="calendar-title-block">
        <div class="calendar-month" id="${elementId}-month-label">…</div>
      </div>
      <div class="calendar-nav">
        <button class="cal-nav-btn" onclick="${mini ? 'dashCalNav(-1)' : "calNav('full',-1)"}" title="Woche zurück">‹</button>
        <button class="cal-today-btn" onclick="${mini ? 'dashCalToday()' : "calToday('full')"}">Heute</button>
        <button class="cal-nav-btn" onclick="${mini ? 'dashCalNav(1)' : "calNav('full',1)"}" title="Woche vor">›</button>
      </div>
    </div>
    ${!mini ? (() => {
      const labels = {
        shoot:    { icon: '🎥', text: 'Drehtag' },
        vacation: { icon: '🏖', text: 'Urlaub' },
        videos:   { icon: '🎬', text: 'Videos' },
        todos:    { icon: '✅', text: 'Aufgaben' }
      };
      const buttons = available.map(key => `
        <button type="button" class="cal-filter-btn ${visibility[key] ? 'active' : ''}" onclick="toggleCalCat('${key}')">
          <span>${labels[key].icon}</span>
          <span>${labels[key].text}</span>
        </button>
      `).join('');
      return `<div class="cal-filter-bar"><span class="cal-filter-label">Anzeigen:</span>${buttons}</div>`;
    })() : ''}
    <div class="month-grid">
      <div class="month-weekday-header">
        ${['Mo','Di','Mi','Do','Fr','Sa','So'].map(d => `<div>${d}</div>`).join('')}
      </div>
      <div class="month-scroller" id="${elementId}-month-scroller">
        ${weeks.map(week => {
          const weekStart = week[0].dateStr;
          const weekEnd = week[6].dateStr;
          const laidOut = layoutLanes(filteredBars, weekStart, weekEnd);
          const visible = laidOut.filter(b => b.lane < maxLanes);
          const hiddenCount = laidOut.length - visible.length;
          return `
            <div class="month-week-row" data-week-start="${weekStart}">
              ${week.map((cell, idx) => `
                <div class="month-day-bg ${cell.dateStr === todayStr ? 'today' : ''} ${cell.isShoot ? 'is-shoot' : ''}" style="grid-column: ${idx+1};"></div>
              `).join('')}
              ${week.map((cell, idx) => {
                const showMonth = cell.firstOfMonth || (idx === 0 && week.findIndex(c => c.firstOfMonth) === -1 && weeks.indexOf(week) === 0);
                const monthLabel = showMonth ? cell.date.toLocaleString('de-DE', { month: 'short' }) + ' ' : '';
                return `<div class="month-day-num ${cell.dateStr === todayStr ? 'today' : ''}" style="grid-column: ${idx+1};">${escape(monthLabel)}${cell.num}</div>`;
              }).join('')}
              ${visible.map(b => {
                const startIdx = Math.max(0, week.findIndex(c => c.dateStr === b.startDate));
                let endIdx = week.findIndex(c => c.dateStr === b.endDate);
                if (endIdx === -1) endIdx = 6;
                const cutsLeft = b.startDate < weekStart;
                const cutsRight = b.endDate > weekEnd;
                const realStart = cutsLeft ? 0 : startIdx;
                const realEnd = cutsRight ? 6 : (endIdx < 0 ? 6 : endIdx);
                return renderMonthBar(b, realStart, realEnd, cutsLeft, cutsRight);
              }).join('')}
              ${hiddenCount > 0 ? `<div class="month-bar-more" style="grid-column: 1 / -1;">+ ${hiddenCount} weitere</div>` : ''}
            </div>
          `;
        }).join('')}
      </div>
    </div>
    ${!mini ? `
      <div class="cal-legend">
        <div class="cal-legend-item"><div class="cal-legend-dot" style="background:#a78bfa"></div>Drehtag</div>
        <div class="cal-legend-item"><div class="cal-legend-dot" style="background:#94a3b8"></div>Urlaub</div>
        <div class="cal-legend-item"><div class="cal-legend-dot" style="background:#fbbf24"></div>Produktion</div>
        <div class="cal-legend-item"><div class="cal-legend-dot" style="background:#ff453a"></div>Deadline</div>
        <div class="cal-legend-item"><div class="cal-legend-dot" style="background:#4aa198"></div>Posting</div>
        <div class="cal-legend-item"><div class="cal-legend-dot" style="background:#64d2ff"></div>Aufgabe</div>
      </div>
    ` : ''}
  `;

  const scroller = document.getElementById(elementId + '-month-scroller');
  if (scroller) {
    scroller._cmWeeks = weeks;
    scroller._cmElementId = elementId;
    // Initial scroll: aktuelle Woche oben
    const anchorIdx = weeksBefore;
    scroller.scrollTop = anchorIdx * MONTH_ROW_HEIGHT;
    updateMonthHeader(elementId);
    let frame = null;
    scroller.addEventListener('scroll', () => {
      if (frame) return;
      frame = requestAnimationFrame(() => { frame = null; updateMonthHeader(elementId); });
    });
  }
}

function updateMonthHeader(elementId) {
  const sc = document.getElementById(elementId + '-month-scroller');
  const label = document.getElementById(elementId + '-month-label');
  if (!sc || !label || !sc._cmWeeks) return;
  const idx = Math.max(0, Math.round(sc.scrollTop / MONTH_ROW_HEIGHT));
  const week = sc._cmWeeks[idx];
  if (!week) return;
  // Nutze Mittwoch der oberen Woche, um den dominanten Monat zu bestimmen
  const mid = week[3].date;
  label.textContent = mid.toLocaleString('de-DE', { month: 'long' }) + ' ' + mid.getFullYear();
}

function scrollMonthByWeeks(elementId, delta) {
  const sc = document.getElementById(elementId + '-month-scroller');
  if (!sc) return false;
  const newTop = sc.scrollTop + delta * MONTH_ROW_HEIGHT;
  if (newTop < 0 || newTop > sc.scrollHeight - sc.clientHeight + 10) {
    // Range neu rendern
    if (elementId === 'dashboard-calendar') {
      dashboardCalDate.setDate(dashboardCalDate.getDate() + delta * 7);
      renderMonthViewInto('dashboard-calendar', getCurrentUser(), true);
    } else {
      calendarDate.setDate(calendarDate.getDate() + delta * 7);
      renderMonthViewInto('main-calendar', getCurrentUser(), false);
    }
    return true;
  }
  sc.scrollTo({ top: newTop, behavior: 'smooth' });
  return true;
}

function scrollMonthToToday(elementId) {
  const sc = document.getElementById(elementId + '-month-scroller');
  if (!sc || !sc._cmWeeks) return false;
  const todayStr = new Date().toISOString().slice(0,10);
  const idx = sc._cmWeeks.findIndex(week => week.some(d => d.dateStr === todayStr));
  if (idx < 0) return false;
  sc.scrollTo({ top: idx * MONTH_ROW_HEIGHT, behavior: 'smooth' });
  return true;
}

function getBarPrimaryUser(b) {
  if (b.vacationId) {
    const v = store.vacations.find(x => x.id === b.vacationId);
    return store.users.find(u => u.id === v?.userId);
  }
  const p = store.projects.find(x => x.id === b.projectId);
  if (!p) return null;
  if (b.phase === 'shoot' || b.phase === 'production') return store.users.find(u => u.id === p.videografId) || null;
  return store.users.find(u => u.id === p.cutterId) || null; // cutter, editing, posting, deadline
}

function renderMonthBar(b, startIdx, endIdx, cutsLeft, cutsRight) {
  const labels = {
    shoot: 'Drehtag', cutter: 'Cutter', posting: 'Posting',
    production: 'Produktion', editing: 'Schnitt', vacation: 'Urlaub', deadline: 'Deadline'
  };
  let text;
  if (b.phase === 'vacation') text = 'Urlaub – ' + b.customer;
  else if (b.phase === 'production' || b.phase === 'editing') text = b.title;
  else text = b.title;
  const cls = `month-bar phase-${b.phase} ${cutsLeft ? 'cuts-left' : ''} ${cutsRight ? 'cuts-right' : ''}`;
  const click = b.vacationId ? `onclick="navigateTo('vacation')"` : `onclick="openProjectModal('${b.projectId}')"`;
  const time = b.time ? `<span class="month-bar-time">${b.time}</span>` : '';
  const tooltipPrefix = labels[b.phase] ? labels[b.phase] + ': ' : '';
  const title = b.fullTitle ? tooltipPrefix + b.fullTitle : text;
  const user = getBarPrimaryUser(b);
  const showAvatar = !cutsLeft && user;
  const avatar = showAvatar ? renderAvatar(user, 16, 9) : '';
  return `<div class="${cls}" style="grid-column: ${startIdx+1} / ${endIdx+2}; grid-row: ${b.lane+2};" ${click} title="${escape(title)}">${avatar}${time}<span class="month-bar-title">${escape(text)}</span></div>`;
}

/* ===== iCLOUD WEEK VIEW – Stunden-Layout, nahtlos horizontal scrollbar ===== */
const WEEK_COL_WIDTH = 210;
const WEEK_COL_WIDTH_MINI = 168;
const WEEK_RANGE_DAYS = 180;
const ICW_HOUR_START = 8;
const ICW_HOUR_END = 21;
const ICW_HOUR_HEIGHT = 48;

function renderWeekViewInto(elementId, session, mini = false) {
  return renderCategoryWeekView(elementId, session, mini);
}

function renderCategoryWeekView(elementId, session, mini = false) {
  const el = document.getElementById(elementId);
  if (!el) return;
  const allBars = buildCalendarBars(session);
  const user = session.user;
  const userId = user.id;

  // Bars in 4 Kategorien aufteilen: Drehtag (eigene Lane), Urlaub, Videos, Aufgaben
  const shootBars = allBars.filter(b => b.phase === 'shoot');
  const vacationBars = allBars.filter(b => b.phase === 'vacation');
  const videoBars = allBars.filter(b =>
    b.phase === 'production' || b.phase === 'cutter' ||
    b.phase === 'editing' || b.phase === 'posting' || b.phase === 'deadline'
  );

  // Todos mit Fälligkeitsdatum als Aufgaben-Kategorie
  const isAdmin = hasRole(user, ROLES.ADMIN);
  const todoBars = (store.todos || [])
    .filter(t => t.dueDate && (isAdmin || (t.assigneeIds || []).includes(userId)) && t.status !== 'done')
    .map(t => ({
      todoId: t.id,
      phase: 'todo',
      startDate: t.dueDate,
      endDate: t.dueDate,
      title: t.title,
      fullTitle: t.title
    }));

  const anchor = mini ? dashboardCalDate : calendarDate;
  const daysBefore = Math.floor(WEEK_RANGE_DAYS / 2);
  const totalDays = WEEK_RANGE_DAYS;
  const firstDay = new Date(anchor);
  firstDay.setHours(0, 0, 0, 0);
  firstDay.setDate(firstDay.getDate() - daysBefore);

  const today = new Date();
  const todayStr = localDateStr(today);
  const dayNames = ['Mo','Di','Mi','Do','Fr','Sa','So'];
  const monthShort = ['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];

  // Alle eingetragenen Drehtage sammeln (nur aus store.shootDays – nicht aus Projekt.shootDate)
  const shootDates = new Set((store.shootDays || []).map(s => s.date));

  const days = [];
  for (let i = 0; i < totalDays; i++) {
    const d = new Date(firstDay); d.setDate(d.getDate() + i);
    const dateStr = localDateStr(d);
    days.push({
      date: d, dateStr,
      num: d.getDate(),
      monthShort: monthShort[d.getMonth()],
      wdName: dayNames[(d.getDay() + 6) % 7],
      isToday: dateStr === todayStr,
      isWeekend: d.getDay() === 0 || d.getDay() === 6,
      isShoot: shootDates.has(dateStr)
    });
  }

  const rangeStart = days[0].dateStr;
  const rangeEnd = days[days.length - 1].dateStr;

  function layoutCat(barsArr) {
    const laneEnds = [];
    return barsArr
      .filter(b => !(b.endDate < rangeStart || b.startDate > rangeEnd))
      .sort((a, b) => a.startDate.localeCompare(b.startDate) || b.endDate.localeCompare(a.endDate))
      .map(b => {
        let laneIdx = laneEnds.findIndex(e => e < b.startDate);
        if (laneIdx === -1) { laneEnds.push(b.endDate); laneIdx = laneEnds.length - 1; }
        else laneEnds[laneIdx] = b.endDate;
        const startCol = days.findIndex(d => d.dateStr === b.startDate);
        const endCol = days.findIndex(d => d.dateStr === b.endDate);
        return {
          ...b,
          lane: laneIdx,
          startCol: startCol < 0 ? 0 : startCol,
          endCol: endCol < 0 ? days.length - 1 : endCol,
          cutsLeft: b.startDate < rangeStart,
          cutsRight: b.endDate > rangeEnd
        };
      });
  }

  // Kategorie-Filter anwenden
  const available = getAvailableCalCats(user);
  const visibility = getCalCatVisibility();
  const visible = key => available.includes(key) && visibility[key];

  const shootLayout    = visible('shoot')    ? layoutCat(shootBars)    : [];
  const vacationLayout = visible('vacation') ? layoutCat(vacationBars) : [];
  const videoLayout    = visible('videos')   ? layoutCat(videoBars)    : [];
  const todoLayout     = visible('todos')    ? layoutCat(todoBars)     : [];

  const colWidth = mini ? WEEK_COL_WIDTH_MINI : WEEK_COL_WIDTH;
  const sidebarWidth = mini ? 120 : 150;

  // Dynamische Cat-Liste: nur sichtbare Kategorien rendern – Reihenfolge: Drehtag, Urlaub, Videos, Aufgaben
  let nextRow = 2;
  const cats = [];
  if (visible('shoot')) {
    const lanes = Math.max(1, shootLayout.reduce((a,b) => Math.max(a, b.lane+1), 0));
    cats.push({ key: 'shoot', label: 'Drehtag', icon: '🎥', cls: 'cat-shoot', start: nextRow, lanes, items: shootLayout });
    nextRow += lanes;
  }
  if (visible('vacation')) {
    const lanes = Math.max(1, vacationLayout.reduce((a,b) => Math.max(a, b.lane+1), 0));
    cats.push({ key: 'vacation', label: 'Urlaub', icon: '🏖', cls: 'cat-vacation', start: nextRow, lanes, items: vacationLayout });
    nextRow += lanes;
  }
  if (visible('videos')) {
    const lanes = Math.max(1, videoLayout.reduce((a,b) => Math.max(a, b.lane+1), 0));
    cats.push({ key: 'videos', label: 'Videos', icon: '🎬', cls: 'cat-videos', start: nextRow, lanes, items: videoLayout });
    nextRow += lanes;
  }
  if (visible('todos')) {
    const lanes = Math.max(1, todoLayout.reduce((a,b) => Math.max(a, b.lane+1), 0));
    cats.push({ key: 'todos', label: 'Aufgaben', icon: '✅', cls: 'cat-todos', start: nextRow, lanes, items: todoLayout });
    nextRow += lanes;
  }

  el.innerHTML = `
    <div class="calendar-header">
      <div class="calendar-title-block">
        <div class="calendar-month" id="${elementId}-range-label">…</div>
      </div>
      <div class="calendar-nav">
        <button class="cal-nav-btn" onclick="${mini ? 'dashCalNav(-1)' : "calNav('full',-1)"}" title="Tag zurück">‹</button>
        <button class="cal-today-btn" onclick="${mini ? 'dashCalToday()' : "calToday('full')"}">Heute</button>
        <button class="cal-nav-btn" onclick="${mini ? 'dashCalNav(1)' : "calNav('full',1)"}" title="Tag vor">›</button>
      </div>
    </div>
    ${(() => {
      const labels = {
        shoot:    { icon: '🎥', text: 'Drehtag' },
        vacation: { icon: '🏖', text: 'Urlaub' },
        videos:   { icon: '🎬', text: 'Videos' },
        todos:    { icon: '✅', text: 'Aufgaben' }
      };
      const buttons = available.map(key => `
        <button type="button" class="cal-filter-btn ${visibility[key] ? 'active' : ''}" onclick="toggleCalCat('${key}')">
          <span>${labels[key].icon}</span>
          <span>${labels[key].text}</span>
        </button>
      `).join('');
      return `<div class="cal-filter-bar"><span class="cal-filter-label">Anzeigen:</span>${buttons}</div>`;
    })()}
    <div class="ical ${mini ? 'mini' : ''}">
      <div class="ical-scroll" id="${elementId}-scroller">
        <div class="ical-track" style="width: ${sidebarWidth + totalDays * colWidth}px; grid-template-columns: ${sidebarWidth}px repeat(${totalDays}, ${colWidth}px);">
          <!-- Top-left corner (sticky) -->
          <div class="ical-corner"></div>
          <!-- Day headers (Drehtag-Info steckt in der eigenen Drehtag-Lane unten) -->
          ${days.map((d, i) => `
            <div class="ical-day-head ${d.isToday ? 'today' : ''} ${d.isShoot ? 'is-shoot' : ''}" style="grid-column:${i+2}; grid-row:1;">
              <div class="ical-dname">${d.wdName} · ${d.monthShort}</div>
              <div class="ical-dnum">${d.num}</div>
            </div>
          `).join('')}

          <!-- Pro Kategorie: Label + Background-Cells + Events -->
          ${cats.map((c, catIdx) => {
            const altCat = catIdx % 2 === 1 ? 'alt' : '';
            const labelRowSpan = c.lanes > 1 ? `grid-row: ${c.start} / ${c.start + c.lanes};` : `grid-row: ${c.start};`;
            const bgCells = [];
            for (let r = 0; r < c.lanes; r++) {
              days.forEach((d, i) => {
                bgCells.push(`<div class="ical-cat-bg ${d.isToday ? 'today' : ''} ${altCat} ${d.isShoot ? 'is-shoot' : ''}" style="grid-column:${i+2}; grid-row:${c.start + r};"></div>`);
              });
            }
            const eventsHtml = c.items.map(b => {
              const row = c.start + b.lane;
              const startCol = b.startCol + 2; // +2 weil Spalte 1 = Sidebar
              const endCol = b.endCol + 3;     // +1 für Sidebar, +2 für grid-column end (exclusive)
              return renderCategoryEvent(b, row, startCol, endCol);
            }).join('');
            return `
              <div class="ical-cat-label ${c.cls}" style="${labelRowSpan}">
                <span class="ical-cat-icon">${c.icon}</span>
                <span>${c.label}</span>
              </div>
              ${bgCells.join('')}
              ${eventsHtml}
            `;
          }).join('')}
        </div>
      </div>
      ${!mini ? `
        <div class="cal-legend">
          <div class="cal-legend-item"><div class="cal-legend-dot" style="background:#a78bfa"></div>Drehtag</div>
          <div class="cal-legend-item"><div class="cal-legend-dot" style="background:#94a3b8"></div>Urlaub</div>
          <div class="cal-legend-item"><div class="cal-legend-dot" style="background:#fbbf24"></div>Produktion</div>
          <div class="cal-legend-item"><div class="cal-legend-dot" style="background:#ff453a"></div>Deadline</div>
          <div class="cal-legend-item"><div class="cal-legend-dot" style="background:#4aa198"></div>Posting</div>
          <div class="cal-legend-item"><div class="cal-legend-dot" style="background:#64d2ff"></div>Aufgabe</div>
        </div>
      ` : ''}
    </div>
  `;

  const scroller = document.getElementById(elementId + '-scroller');
  if (scroller) {
    scroller._cwDays = days;
    scroller._cwColWidth = colWidth;
    scroller._cwElementId = elementId;
    scroller._cwMini = mini;
    // Initial scroll: anchor (calendarDate) als erste Spalte links – mehrfach robust
    const setInitScroll = () => {
      scroller.scrollLeft = daysBefore * colWidth;
      updateWeekHeader(elementId);
    };
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        setInitScroll();
        // Diagnose
        if (!scroller._cwDiag) {
          scroller._cwDiag = true;
          const canScroll = scroller.scrollWidth > scroller.clientWidth + 5;
          console.log('[Kalender]', elementId,
            'scrollWidth:', scroller.scrollWidth,
            'clientWidth:', scroller.clientWidth,
            'scrollLeft:', scroller.scrollLeft,
            'kann scrollen:', canScroll);
          if (!canScroll) console.warn('[Kalender] Container kann nicht horizontal scrollen – CSS-Problem.');
        }
      });
    });
    // Auch nach 100ms nochmal absichern (manchmal hat Layout noch nicht final gerendert)
    setTimeout(setInitScroll, 120);
    enableDragScroll(scroller);
    updateWeekHeader(elementId);
    let frame = null;
    scroller.addEventListener('scroll', () => {
      if (frame) return;
      frame = requestAnimationFrame(() => { frame = null; updateWeekHeader(elementId); });
    });
  }
}

function renderICWNowLine(days, colWidth, bodyHeight, hourStart = ICW_HOUR_START, hourEnd = ICW_HOUR_END, hourHeight = ICW_HOUR_HEIGHT) {
  const now = new Date();
  const hour = now.getHours();
  const minute = now.getMinutes();
  if (hour < hourStart || hour > hourEnd) return '';
  const todayStr = now.toISOString().slice(0,10);
  const idx = days.findIndex(d => d.dateStr === todayStr);
  if (idx < 0) return '';
  const top = (hour - hourStart) * hourHeight + (minute / 60) * hourHeight;
  if (top > bodyHeight) return '';
  const timeLabel = String(hour).padStart(2,'0') + ':' + String(minute).padStart(2,'0');
  return `
    <div class="icw-now" style="top:${top}px; left:${idx * colWidth}px; width:${colWidth}px;"></div>
    <div class="icw-now-time" style="top:${top}px; left:${idx * colWidth}px;">${timeLabel}</div>
  `;
}

// LEGACY-Wochenansicht (nicht mehr genutzt)
function renderWeekViewIntoLegacy(elementId, session, mini = false) {
  const el = document.getElementById(elementId);
  if (!el) return;
  const bars = buildCalendarBars(session);

  const anchor = mini ? dashboardCalDate : calendarDate;
  const daysBefore = 120;
  const totalDays = WEEK_RANGE_DAYS;
  const firstDay = new Date(anchor);
  firstDay.setHours(0, 0, 0, 0);
  firstDay.setDate(firstDay.getDate() - daysBefore);

  const today = new Date();
  const todayStr = localDateStr(today);
  const dayNames = ['Mo','Di','Mi','Do','Fr','Sa','So'];
  const monthShort = ['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];

  const days = [];
  for (let i = 0; i < totalDays; i++) {
    const d = new Date(firstDay); d.setDate(d.getDate() + i);
    const dateStr = localDateStr(d);
    days.push({
      date: d,
      dateStr,
      num: d.getDate(),
      monthShort: monthShort[d.getMonth()],
      wdName: dayNames[(d.getDay() + 6) % 7],
      isToday: dateStr === todayStr,
      isWeekend: d.getDay() === 0 || d.getDay() === 6
    });
  }

  const rangeStart = days[0].dateStr;
  const rangeEnd = days[days.length - 1].dateStr;
  const rangeBars = bars.filter(b => !(b.endDate < rangeStart || b.startDate > rangeEnd));
  const laneEnds = [];
  const positioned = rangeBars
    .sort((a, b) => a.startDate.localeCompare(b.startDate) || b.endDate.localeCompare(a.endDate))
    .map(b => {
      let laneIdx = laneEnds.findIndex(e => e < b.startDate);
      if (laneIdx === -1) { laneEnds.push(b.endDate); laneIdx = laneEnds.length - 1; }
      else laneEnds[laneIdx] = b.endDate;
      const startCol = days.findIndex(d => d.dateStr === b.startDate);
      const endCol = days.findIndex(d => d.dateStr === b.endDate);
      const sCol = startCol < 0 ? 0 : startCol;
      const eCol = endCol < 0 ? days.length - 1 : endCol;
      const cutsLeft = b.startDate < rangeStart;
      const cutsRight = b.endDate > rangeEnd;
      return { ...b, lane: laneIdx, startCol: sCol, endCol: eCol, cutsLeft, cutsRight };
    });

  const totalLanes = Math.max(1, laneEnds.length);

        ${days.map((d, i) => `

        `).join('')}

    ${!mini ? `
      <div class="cal-legend">
        <div class="cal-legend-item"><div class="cal-legend-dot" style="background:#a78bfa"></div>Drehtag</div>

        <div class="cal-legend-item"><div class="cal-legend-dot" style="background:#2dd4bf"></div>Posting</div>
      </div>

  const scroller = document.getElementById(elementId + '-scroller');
  if (scroller) {

    scroller._cwColWidth = colWidth;
    scroller._cwElementId = elementId;
    scroller._cwMini = mini;
    enableDragScroll(scroller);
    updateWeekHeader(elementId);
    // Header live aktualisieren beim Scrollen
    let frame = null;
    scroller.addEventListener('scroll', () => {
      if (frame) return;
      frame = requestAnimationFrame(() => { frame = null; updateWeekHeader(elementId); });
    });
  }
}

function updateWeekHeader(elementId) {
  const sc = document.getElementById(elementId + '-scroller');
  const label = document.getElementById(elementId + '-range-label');
  if (!sc || !label || !sc._cwDays) return;
  const idx = Math.max(0, Math.round(sc.scrollLeft / sc._cwColWidth));
  const visibleStart = sc._cwDays[idx];
  const endIdx = Math.min(idx + 6, sc._cwDays.length - 1);
  const visibleEnd = sc._cwDays[endIdx];
  if (!visibleStart || !visibleEnd) return;
  const startD = visibleStart.date;
  const endD = visibleEnd.date;
  const monthShort = ['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
  const sameMonth = startD.getMonth() === endD.getMonth();
  const yearStr = startD.getFullYear() === endD.getFullYear() ? startD.getFullYear() : `${startD.getFullYear()}/${endD.getFullYear()}`;
  const txt = sameMonth
    ? `${startD.getDate()}. – ${endD.getDate()}. ${monthShort[startD.getMonth()]} ${yearStr}`
    : `${startD.getDate()}. ${monthShort[startD.getMonth()]} – ${endD.getDate()}. ${monthShort[endD.getMonth()]} ${yearStr}`;
  label.textContent = txt;
}

function scrollWeekByDays(elementId, deltaDays) {
  const sc = document.getElementById(elementId + '-scroller');
  if (!sc) return false;
  const colWidth = sc._cwColWidth || 168;
  const newLeft = sc.scrollLeft + deltaDays * colWidth;
  // Wenn weit außerhalb: false → re-render
  const maxScroll = sc.scrollWidth - sc.clientWidth;
  if (newLeft < -colWidth * 5 || newLeft > maxScroll + colWidth * 5) return false;
  sc.scrollTo({ left: Math.max(0, Math.min(maxScroll, newLeft)), behavior: 'smooth' });
  return true;
}

function scrollWeekToToday(elementId) {
  const sc = document.getElementById(elementId + '-scroller');
  if (!sc) return false;
  const colWidth = sc._cwColWidth || 168;
  if (!sc._cwDays) return false;
  const todayStr = new Date().toISOString().slice(0,10);
  const idx = sc._cwDays.findIndex(d => d.dateStr === todayStr);
  if (idx < 0) return false;
  const maxScroll = sc.scrollWidth - sc.clientWidth;
  sc.scrollTo({ left: Math.max(0, Math.min(maxScroll, idx * colWidth)), behavior: 'smooth' });
  return true;
}

function enableDragScroll(el) {
  if (el._dragScrollEnabled) return;
  el._dragScrollEnabled = true;
  let isDown = false, startX = 0, scrollStart = 0, hasDragged = false;
  el.addEventListener('mousedown', e => {
    if (e.button !== 0) return;
    if (e.target.closest('.week-bar, .icw-allday-event, .icw-timed, .cal-nav-btn, .cal-today-btn, button, a, input, select, textarea')) return;
    isDown = true;
    hasDragged = false;
    el.classList.add('dragging');
    startX = e.pageX;
    scrollStart = el.scrollLeft;
  });
  window.addEventListener('mouseup', () => {
    if (isDown) { isDown = false; el.classList.remove('dragging'); }
  });
  el.addEventListener('mousemove', e => {
    if (!isDown) return;
    const dx = e.pageX - startX;
    if (Math.abs(dx) > 3) hasDragged = true;
    if (hasDragged) {
      e.preventDefault();
      el.scrollLeft = scrollStart - dx;
    }
  });
  // Mausrad: NUR rein vertikales Mausrad (klassische Maus ohne Horizontal-Achse)
  // wird in horizontal umgesetzt. Trackpad-Wisch (deltaX dominiert) wird NICHT
  // angefasst – Browser scrollt nativ.
  el.addEventListener('wheel', e => {
    if (Math.abs(e.deltaX) > 0) return; // Trackpad: nicht stören
    if (e.deltaY !== 0) {
      el.scrollLeft += e.deltaY;
      e.preventDefault();
    }
  }, { passive: false });
}

function _legacyRenderCalendarInto(elementId, session, mini = false) {
  const el = document.getElementById(elementId);
  if (!el) return;
  const refDate = mini ? dashboardCalDate : calendarDate;
  const events = buildCalendarEvents(session);

  const year = refDate.getFullYear();
  const month = refDate.getMonth();
  const firstDay = new Date(year, month, 1);
  const lastDay = new Date(year, month + 1, 0);
  const startDay = (firstDay.getDay() + 6) % 7;
  const daysInMonth = lastDay.getDate();
  const prevLastDay = new Date(year, month, 0).getDate();

  const today = new Date();
  const todayStr = today.toISOString().slice(0, 10);

  const monthName = refDate.toLocaleString('de-DE', { month: 'long' });
  const yearStr = String(year);

  const cells = [];
  for (let i = startDay - 1; i >= 0; i--) cells.push({ date: prevLastDay - i, outside: true });
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    cells.push({ date: d, dateStr, isToday: dateStr === todayStr, events: events[dateStr] || [] });
  }
  let nextDay = 1;
  while (cells.length % 7 !== 0) {
    cells.push({ date: nextDay++, outside: true });
  }

  const maxEvents = mini ? 2 : 4;
  const navPrefix = mini ? 'mini' : 'full';

  el.innerHTML = `
    <div class="calendar-header">
      <div class="calendar-title-block">
        <div class="calendar-month">${escape(monthName)}</div>
        <div class="calendar-year">${escape(yearStr)}</div>
      </div>

        <button class="cal-nav-btn" onclick="calNav('${navPrefix}',-1)" title="Vorheriger Monat">‹</button>

      </div>
    </div>
    <div class="calendar-grid">
      ${['Mo','Di','Mi','Do','Fr','Sa','So'].map(d => `<div class="calendar-day-name">${d}</div>`).join('')}
      ${cells.map(cell => {
        const events = cell.events || [];
        const visible = events.slice(0, maxEvents);
        const overflow = events.length - visible.length;
        return `
          <div class="calendar-day ${cell.outside ? 'outside' : ''} ${cell.isToday ? 'today' : ''}">
            <div class="calendar-day-content">
              <div class="calendar-date">${cell.date}</div>
            </div>
            ${visible.map(e => renderCalendarBar(e)).join('')}
            ${overflow > 0 ? `<div class="cal-overflow" style="padding:0 8px;">+ ${overflow}</div>` : ''}
          </div>
        `;
      }).join('')}
    </div>
    ${!mini ? `
      <div class="cal-legend">
        <div class="cal-legend-item"><div class="cal-legend-dot" style="background:#a78bfa"></div>Drehtag</div>
        <div class="cal-legend-item"><div class="cal-legend-dot" style="background:#ff453a"></div>Deadline</div>
        <div class="cal-legend-item"><div class="cal-legend-dot" style="background:#2dd4bf"></div>Posting</div>
      </div>
    ` : ''}
  `;
}

        renderWeekViewInto('dashboard-calendar', getCurrentUser(), true);
      }
    } else {
      // Monat: ±1 Woche im Wochen-Stream
      scrollMonthByWeeks('dashboard-calendar', delta);
    }
  } else if (calendarView === 'week') {
    if (!scrollWeekByDays('main-calendar', delta)) {
      calendarDate.setDate(calendarDate.getDate() + delta);
      renderWeekViewInto('main-calendar', getCurrentUser(), false);
    }
  } else {
    scrollMonthByWeeks('main-calendar', delta);
  }
}
function calToday(prefix) {
  if (prefix === 'mini') {
    dashboardCalDate = new Date();
    if (dashboardView === 'week') {
      if (!scrollWeekToToday('dashboard-calendar')) {
        renderWeekViewInto('dashboard-calendar', getCurrentUser(), true);
      }
    } else {
      if (!scrollMonthToToday('dashboard-calendar')) {
        renderMonthViewInto('dashboard-calendar', getCurrentUser(), true);
      }
    }
  } else if (calendarView === 'week') {
    calendarDate = new Date();
    if (!scrollWeekToToday('main-calendar')) {
      renderWeekViewInto('main-calendar', getCurrentUser(), false);
    }
  } else {
    calendarDate = new Date();
    if (!scrollMonthToToday('main-calendar')) {
      renderMonthViewInto('main-calendar', getCurrentUser(), false);
    }
  }
}

function getMondayOf(date) {
  const d = new Date(date);
  const day = d.getDay() || 7; // So=0 → 7
  d.setHours(0,0,0,0);
  d.setDate(d.getDate() - (day - 1));
  return d;
}

let pendingUserAvatar = null;
let clearAvatarFlag = false;

function uploadUserAvatar(e) {
  const file = e.target.files[0];
  if (!file) return;
  if (file.size > 2 * 1024 * 1024) {
    alert('Bild ist zu groß (max. 2 MB).');
    return;
  }
  // Bild auf 256x256 verkleinern und als JPEG speichern
  const reader = new FileReader();
  reader.onload = ev => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      const size = 256;
      canvas.width = size; canvas.height = size;
      const ctx = canvas.getContext('2d');
      // Center-crop
      const minDim = Math.min(img.width, img.height);
      const sx = (img.width - minDim) / 2;
      const sy = (img.height - minDim) / 2;
      ctx.drawImage(img, sx, sy, minDim, minDim, 0, 0, size, size);
      pendingUserAvatar = canvas.toDataURL('image/jpeg', 0.85);
      clearAvatarFlag = false;
      const preview = document.getElementById('user-avatar-preview');
      if (preview) preview.innerHTML = `<div class="avatar-circle" style="width:64px;height:64px;background-image:url('${pendingUserAvatar}');"></div>`;
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

function clearUserAvatar() {
  pendingUserAvatar = null;
  clearAvatarFlag = true;
  const preview = document.getElementById('user-avatar-preview');
  if (preview) preview.innerHTML = renderAvatar({ id: 'preview', name: 'NN' }, 64, 22);
}

async function saveMyProfile(e) {
  e.preventDefault();
  const session = getCurrentUser();
  if (!session || session.type !== 'staff') { closeModal(); return; }
  const data = Object.fromEntries(new FormData(e.target));

  const idx = store.users.findIndex(u => u.id === session.user.id);
  if (idx < 0) { closeModal(); return; }
  const u = store.users[idx];

  // Passwort-Wechsel: aktuelles Passwort prüfen
  if (data.newPassword) {
    if (!data.currentPassword) {
      appAlert('Bitte aktuelles Passwort eingeben um es zu ändern.', { title: 'Passwort ändern' });
      return;
    }
    const hashedCurrent = await hashPassword(data.currentPassword);
    const storedPass = (u.password || '').trim();
    const currentOk = storedPass === hashedCurrent || storedPass === data.currentPassword || storedPass === data.currentPassword.trim();
    if (!currentOk) {
      appAlert('Das aktuelle Passwort ist nicht korrekt.', { title: 'Passwort ändern' });
      return;
    }
    u.password = await hashPassword(data.newPassword);
  }

  // Kontakt-Daten aktualisieren
  u.name = (data.name || '').trim() || u.name;
  u.email = (data.email || '').trim();
  u.phone = (data.phone || '').trim();
  u.addressStreet = (data.addressStreet || '').trim();
  u.addressZip = (data.addressZip || '').trim();
  u.addressCity = (data.addressCity || '').trim();

  // Avatar
  if (pendingUserAvatar) u.avatarImage = pendingUserAvatar;
  if (clearAvatarFlag) delete u.avatarImage;
  pendingUserAvatar = null;
  clearAvatarFlag = false;

  saveStore();
  closeModal();
  renderPage();
  showToast('Profil gespeichert', '');
}

async function saveCustomerSelfProfile(e) {

async function saveUser(e, userId) {
  e.preventDefault();
  const session = getCurrentUser();
  if (!session || session.type !== 'staff' || !hasRole(session.user, ROLES.ADMIN)) {
    appAlert('Nur Admins dürfen Mitarbeiter anlegen oder bearbeiten.', { title: 'Nicht erlaubt' });
    return;
  }
  const form = e.target;
  const data = Object.fromEntries(new FormData(form));

  // Username/Passwort defensiv trimmen, damit Leerzeichen den Login nicht blockieren
  data.name = (data.name || '').trim();
  data.username = (data.username || '').trim();
  data.email = (data.email || '').trim();
  if (data.password) {
    data.password = data.password.trim();
    // Direkt hashen damit niemals Klartext lokal liegt
    data.password = await hashPassword(data.password);
  }

  if (!data.username) {
    alert('Bitte einen Benutzernamen angeben.');
    return;
  }

  // Collect roles from checkboxes
  const roles = Object.keys(ROLE_LABELS).filter(k => form.querySelector(`#role-${k}`)?.checked);
  if (roles.length === 0) {
    alert('Bitte mindestens eine Rolle auswählen.');
    return;
  }

  // Protected accounts must keep admin role
  const existingProtected = userId ? store.users.find(u => u.id === userId)?.protected : false;
  if (existingProtected && !roles.includes(ROLES.ADMIN)) {
    alert('Dem geschützten Hauptkonto kann die Admin-Rolle nicht entzogen werden.');
    return;
  }

  // Check unique username
  const dup = store.users.find(u => u.username.toLowerCase() === data.username.toLowerCase() && u.id !== userId);
  if (dup) {
    alert('Dieser Benutzername ist bereits vergeben.');
    return;
  }

  if (userId) {
    const idx = store.users.findIndex(u => u.id === userId);
    if (idx >= 0) {
      const existing = store.users[idx];
      // Prevent removing last admin
      if (existing.roles?.includes(ROLES.ADMIN) && !roles.includes(ROLES.ADMIN)) {
        const adminCount = store.users.filter(u => userRoles(u).includes(ROLES.ADMIN)).length;
        if (adminCount <= 1) {
          alert('Mindestens ein Admin muss vorhanden bleiben.');
          return;
        }
      }
      const avatarUpdate = pendingUserAvatar ? { avatarImage: pendingUserAvatar }
                          : clearAvatarFlag ? { avatarImage: null }
                          : {};
      store.users[idx] = {
        ...existing,
        name: data.name,
        username: data.username,
        roles,
        email: data.email,
        password: data.password ? data.password : existing.password,
        ...avatarUpdate
      };
      delete store.users[idx].role; // remove legacy single role
      if (clearAvatarFlag) delete store.users[idx].avatarImage;
    }
  } else {
    store.users.push({
      id: uid('u'),
      name: data.name,
      username: data.username,
      roles,
      email: data.email,
      password: data.password,
      avatarImage: pendingUserAvatar || null
    });
  }
  pendingUserAvatar = null;
  clearAvatarFlag = false;
  saveStore();
  // Bei neu angelegten Usern: Gist sofort anlegen wenn Kalender konfiguriert
  if (!userId && calendarConfigured()) {
    const newUser = store.users[store.users.length - 1];
    ensureUserGist(newUser).then(() => writeLiveICS());
  } else {
    writeLiveICS();
  }
  closeModal();
  renderPage();
}

async function deleteUser(userId) {
  const session = getCurrentUser();
  if (!session || session.type !== 'staff' || !hasRole(session.user, ROLES.ADMIN)) {
    appAlert('Nur Admins dürfen Mitarbeiter löschen.', { title: 'Nicht erlaubt' });
    return;
  }
  const user = store.users.find(u => u.id === userId);
  if (user?.protected) {
    appAlert('Dieses Konto ist geschützt und kann nicht gelöscht werden.', { title: 'Geschütztes Konto' });
    return;
  }
  const ok = await appConfirm(`„${user?.name}" wird unwiderruflich entfernt.`, {
    title: 'Mitarbeiter löschen?', okLabel: 'Löschen', danger: true
  });
  if (!ok) return;
  if (hasRole(user, ROLES.ADMIN) && store.users.filter(u => hasRole(u, ROLES.ADMIN)).length <= 1) {
    appAlert('Mindestens ein Admin muss vorhanden bleiben.', { title: 'Aktion blockiert' });
    return;
  }
  trackDeletion('users', userId);
  store.users = store.users.filter(u => u.id !== userId);
  // Unset references
  store.customers.forEach(c => { if (c.managerId === userId) c.managerId = null; });
  store.projects.forEach(p => {
    if (p.videografId === userId) p.videografId = null;
    if (p.cutterId === userId) p.cutterId = null;
  });
  saveStore();
  closeModal();
  renderPage();
}

function exportData() {
  const blob = new Blob([JSON.stringify(store, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `agentur-backup-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function importData() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const data = JSON.parse(ev.target.result);
        if (!data.users || !data.customers || !data.projects) throw new Error('Ungültiges Format');
        if (!confirm('Aktuelle Daten werden überschrieben. Fortfahren?')) return;
        store = { ...defaultData, ...data };
        saveStore();
        renderPage();
        alert('Daten erfolgreich importiert.');
      } catch (err) {
        alert('Import fehlgeschlagen: ' + err.message);
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

async function resetData() {
  const ok1 = await appConfirm('Wirklich alle Daten löschen?', {
    title: 'Tool zurücksetzen', okLabel: 'Weiter', danger: true
  });
  if (!ok1) return;
  const ok2 = await appConfirm('Diese Aktion ist nicht umkehrbar. Alle Kunden, Projekte, Aufgaben und Urlaube werden entfernt.', {
    title: 'Bist du dir sicher?', okLabel: 'Alles löschen', danger: true
  });
  if (!ok2) return;
  localStorage.removeItem(STORE_KEY);
  store = loadStore();
  saveStore();
  logout();
}

let todoFilter = 'mine'; // 'mine' | 'created' | 'all'

function renderTodos(session) {
  const user = session.user;
  const isAdmin = hasRole(user, ROLES.ADMIN);

  $('#page-title').textContent = 'Aufgaben';
  $('#page-subtitle').textContent = 'To-Do-Liste für das gesamte Team';
  $('#topbar-actions').innerHTML = `<button class="btn btn-primary" onclick="openTodoModal()">+ Neue Aufgabe</button>`;

  // Filter
  let todos = store.todos.slice();
  if (todoFilter === 'mine') todos = todos.filter(t => (t.assigneeIds || []).includes(user.id));
  else if (todoFilter === 'created') todos = todos.filter(t => t.createdById === user.id);
  // 'all' ist nur für Admins relevant – sonst zeigen wir auch alle

  todos.sort((a, b) => {
    if (a.status !== b.status) return a.status === 'open' ? -1 : 1;
    return (b.createdAt || '').localeCompare(a.createdAt || '');
  });

  const open = todos.filter(t => t.status === 'open');
  const done = todos.filter(t => t.status === 'done');

  $('#content').innerHTML = `
    <div class="flex gap-2 mb-4">
      <div class="view-toggle">
        <button class="${todoFilter === 'mine' ? 'active' : ''}" onclick="setTodoFilter('mine')">Mir zugewiesen</button>
        <button class="${todoFilter === 'created' ? 'active' : ''}" onclick="setTodoFilter('created')">Von mir erstellt</button>
        ${isAdmin ? `<button class="${todoFilter === 'all' ? 'active' : ''}" onclick="setTodoFilter('all')">Alle</button>` : ''}
      </div>
    </div>

    ${todos.length === 0 ? `
      <div class="card"><div class="empty-state">
        <div class="empty-state-icon">✅</div>
        Keine Aufgaben in dieser Ansicht.
        <br/><br/>
        <button class="btn btn-primary" onclick="openTodoModal()">Erste Aufgabe anlegen</button>
      </div></div>
    ` : `
      <div class="card mb-4">
        <div class="card-header"><div class="card-title">Offen (${open.length})</div></div>
        ${open.length === 0
          ? '<div class="empty-state" style="padding:24px;"><div class="text-sm">Keine offenen Aufgaben.</div></div>'
          : `<div class="todo-list">${open.map(t => renderTodoItem(t, user, isAdmin)).join('')}</div>`}
      </div>
      ${done.length > 0 ? `
        <div class="card">
          <div class="card-header"><div class="card-title">Erledigt (${done.length})</div></div>
          <div class="todo-list">${done.map(t => renderTodoItem(t, user, isAdmin)).join('')}</div>
        </div>
      ` : ''}
    `}
  `;
}

function renderTodoItem(t, user, isAdmin) {
  const assigneeIds = t.assigneeIds || [];
  const assignees = assigneeIds.map(id => store.users.find(u => u.id === id)).filter(Boolean);
  const creator = store.users.find(u => u.id === t.createdById);
  const isMine = assigneeIds.includes(user.id);
  const canEdit = isMine || t.createdById === user.id || isAdmin;
  const today = new Date().toISOString().slice(0, 10);
  const isOverdue = t.dueDate && t.dueDate < today && t.status === 'open';
  const avatarStack = assignees.length === 0
    ? '<span class="todo-meta-chip">Nicht zugewiesen</span>'
    : `<div class="todo-avatars">${assignees.map(a => renderAvatar(a, 22, 10)).join('')}</div>
       <span class="todo-meta-chip">${escape(assignees.map(a => a.name.split(' ')[0]).join(', '))}${isMine ? ' · du' : ''}</span>`;
  return `
    <div class="todo-item ${t.status === 'done' ? 'done' : ''}">
      <input type="checkbox" class="todo-check" ${t.status === 'done' ? 'checked' : ''} onchange="toggleTodoStatus('${t.id}')" />
      <div class="todo-body" onclick="openTodoModal('${t.id}')" style="cursor:pointer;">
        <div class="todo-title">${escape(t.title)}</div>
        ${t.description ? `<div class="todo-desc">${escape(t.description)}</div>` : ''}
        <div class="todo-meta">
          ${avatarStack}
          ${t.dueDate ? `<span class="todo-meta-chip ${isOverdue ? 'todo-due-overdue' : ''}">📅 ${fmtDate(t.dueDate)}${isOverdue ? ' · überfällig' : ''}</span>` : ''}
          ${creator && !assigneeIds.includes(creator.id) ? `<span style="font-size:11px; color:var(--text-3);">von ${escape(creator.name)}</span>` : ''}
        </div>
      </div>
      ${canEdit ? `<div class="todo-actions"><button class="btn btn-ghost btn-sm" onclick="openTodoModal('${t.id}')">Öffnen</button></div>` : ''}
    </div>
  `;
}

function openTodoModal(todoId = null) {
  const session = getCurrentUser();
  if (!session || session.type !== 'staff') return;
  const user = session.user;
  const todo = todoId ? store.todos.find(t => t.id === todoId) : null;
  const isNew = !todo;
  const isAdmin = hasRole(user, ROLES.ADMIN);

  const html = `

        <div class="modal-header">
          <div class="modal-title">${isNew ? 'Neue Aufgabe' : 'Aufgabe bearbeiten'}</div>
          <button class="modal-close" onclick="closeModal()">×</button>

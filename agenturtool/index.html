const PROJECT_DRAFT_KEY = 'project_form_draft';

function saveProjectDraft() {
  const form = document.getElementById('project-form');
  if (!form) return;
  const data = Object.fromEntries(
    [...form.querySelectorAll('input[name],select[name],textarea[name]')]
      .filter(el => el.type !== 'file' && el.type !== 'submit')
      .map(el => [el.name, el.type === 'checkbox' ? (el.checked ? '1' : '') : el.value])
  );
  localStorage.setItem(PROJECT_DRAFT_KEY, JSON.stringify(data));
}

function restoreProjectDraft() {
  try {
    const raw = localStorage.getItem(PROJECT_DRAFT_KEY);
    if (!raw) return;
    const data = JSON.parse(raw);
    const form = document.getElementById('project-form');
    if (!form) return;
    for (const [name, val] of Object.entries(data)) {
      const el = form.querySelector(`[name="${name}"]`);
      if (!el || el.type === 'file') continue;
      if (el.type === 'checkbox') { el.checked = !!val; el.dispatchEvent(new Event('change')); }
      else { el.value = val; }
    }
    if (data.title) showToast('Entwurf wiederhergestellt', 'Dein letzter Entwurf wurde geladen.');
  } catch (_) {}
}

function clearProjectDraft() {
  localStorage.removeItem(PROJECT_DRAFT_KEY);
}

function getStatusActions(project, session) {
  if (session.type !== 'staff') return '';
  const user = session.user;
  const userId = user.id;
  const buttons = [];
  const isInternal = !!project.isInternal;
  const isAdmin = hasRole(user, ROLES.ADMIN);

  // Permission-gestützte Buttons – Buttons erscheinen nur, wenn die Aktion auch wirklich erlaubt ist
  // Videograf: Drehtag-Status setzen
  if (project.status === STATUS.GEPLANT
      && canActOnProject(project, session, 'markAsShot')) {
    const label = isInternal ? '✓ Bereit für Schnitt' : '✓ Als abgedreht markieren';
    buttons.push(`<button class="btn btn-primary btn-sm" onclick="markAsShot('${project.id}')">${label}</button>`);
  }
  // Admin/Manager/Videograf: Drehtag-Status zurücksetzen (z.B. versehentlich gesetzt)
  if (project.status === STATUS.GEDREHT && canActOnProject(project, session, 'markAsShot')) {
    buttons.push(`<button class="btn btn-ghost btn-sm" onclick="revertGedreht('${project.id}')">↩ Gedreht rückgängig</button>`);
  }
  // Cutter: Annehmen (GEDREHT oder KORREKTUR → SCHNITT)
  if ((project.status === STATUS.GEDREHT || project.status === STATUS.KORREKTUR)
      && canActOnProject(project, session, 'cutterAccept')) {
    buttons.push(`<button class="btn btn-primary btn-sm" onclick="cutterAccept('${project.id}')">→ Annehmen &amp; starten</button>`);
  }
  // Cutter: Fertig melden
  if (project.status === STATUS.SCHNITT && canActOnProject(project, session, 'cutterMarkDone')) {
    buttons.push(`<button class="btn btn-primary btn-sm" onclick="cutterMarkDone('${project.id}')">→ Fertig melden</button>`);
    buttons.push(`<button class="btn btn-secondary btn-sm" onclick="cutterRevert('${project.id}','${STATUS.GEDREHT}')">↩ Zurücklegen</button>`);
  }
  // Cutter / Admin: versehentlich fertig → zurückholen
  if (project.status === STATUS.FERTIG && (project.cutterId === userId || isAdmin)) {
    buttons.push(`<button class="btn btn-secondary btn-sm" onclick="cutterRevert('${project.id}','${STATUS.SCHNITT}')">↩ Wieder bearbeiten</button>`);
  }
  // Manager: Freigabe oder Korrektur
  if (project.status === STATUS.FERTIG && canActOnProject(project, session, 'approve')) {
    buttons.push(`<button class="btn btn-primary btn-sm" onclick="approveProject('${project.id}')">✓ Freigeben</button>`);
    buttons.push(`<button class="btn btn-secondary btn-sm" onclick="openCorrectionModal('${project.id}')">↩ Korrektur anfragen</button>`);
  }
  if (project.status === STATUS.FREIGEGEBEN && canActOnProject(project, session, 'archive')) {
    buttons.push(`<button class="btn btn-secondary btn-sm" onclick="archiveProject('${project.id}')">→ Archivieren</button>`);
  }
  // Admin: Status jederzeit direkt setzen – im Projekt-Modal jetzt durch Klick auf das
  // Status-Badge (status-badge-select). Hier daher kein separater Select-Balken mehr.
  return buttons.join(' ');
}

async function setProjectStatus(id, status) {
  if (!status) return;
  const p = store.projects.find(x => x.id === id);
  if (!p) return;
  lockProjectStatus(id, status);
  p.status = status;
  closeModal();
  renderPage();
  try {
    const res = await fetch(`${API_BASE}/projects.php?id=${encodeURIComponent(id)}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': CSRF },
      body: JSON.stringify({ status })
    });
    if (!res.ok) throw new Error(await res.text());
    unlockProjectStatus(id);
    await pullAllFromCloud();
  } catch(e) {
    unlockProjectStatus(id);
    appAlert('Status konnte nicht gespeichert werden: ' + e.message);
  }
}

// Drag-and-Drop Kalender
// ---------------------------------------------------------------------------
let _calDnd = null; // { projectId, origDate }

function calDragStart(event, projectId, origDate) {
  if (window.matchMedia('(hover: none)').matches) { event.preventDefault(); return; }
  _calDnd = { projectId, origDate };
  event.dataTransfer.effectAllowed = 'move';
  event.dataTransfer.setData('text/plain', projectId);
  event.currentTarget.classList.add('dnd-dragging');
}

function calDragEnd(event) {
  event.currentTarget.classList.remove('dnd-dragging');
  document.querySelectorAll('.dnd-over').forEach(el => el.classList.remove('dnd-over'));
}

function calDragOver(event) {
  if (!_calDnd) return;
  event.preventDefault();
  event.dataTransfer.dropEffect = 'move';
  event.currentTarget.classList.add('dnd-over');
}

function calDragLeave(event) {
  if (!event.currentTarget.contains(event.relatedTarget)) {
    event.currentTarget.classList.remove('dnd-over');
  }
}

async function calDrop(event, targetDate) {
  event.preventDefault();
  event.currentTarget.classList.remove('dnd-over');
  if (!_calDnd || !targetDate) return;
  const { projectId, origDate } = _calDnd;
  _calDnd = null;
  if (targetDate === origDate) return;

  const project = store.projects.find(p => p.id === projectId);
  if (!project) return;

  // Anderes Projekt desselben Kunden an diesem Datum → Tausch anbieten
  const conflict = store.projects.find(p =>
    p.customerId === project.customerId &&
    p.postingDate === targetDate &&
    p.id !== projectId
  );

  // 24h-Warnung: neues Posting-Datum des gezogenen Projekts ≤ bestehende Deadline + 1 Tag
  const warn24h = project.deadline && targetDate <= addDays(project.deadline, 1);
  // Beim Tausch: Konflikt-Deadline wird auf origDate-2 neu berechnet; prüfe ob das knapp ist
  const conflictNewDeadline = conflict ? addDays(origDate, -2) : null;
  const warn24hConflict = conflict && conflict.deadline && origDate <= addDays(conflictNewDeadline, 1);

  let msg = conflict
    ? `„${conflict.title}" belegt ${fmtDate(targetDate)} bereits.\nPosting-Daten tauschen?`
    : `Posting von ${fmtDate(origDate)} auf ${fmtDate(targetDate)} verschieben?`;
  if (warn24h) msg += '\n\n⚠ Weniger als 24 Stunden zwischen Cutter-Deadline und neuem Posting-Datum!';
  if (warn24hConflict) msg += `\n\n⚠ Neue Deadline für „${conflict.title}" (${fmtDate(conflictNewDeadline)}) liegt knapp vor dem Posting-Datum!`;

  if (!confirm(msg)) return;

  try {
    await patchProject(projectId, { postingDate: targetDate });
    if (conflict) {
      // Deadline des Konflikt-Projekts mit verschieben (2 Tage vor neuem Posting)
      await patchProject(conflict.id, { postingDate: origDate, deadline: conflictNewDeadline });
    }
    await pullAllFromCloud();
    renderPage();
  } catch (e) {
    appAlert('Fehler beim Verschieben: ' + e.message);
  }
}

// Kleines PUT-Patch-Utility für Projekt-Felder (kein Reload)
async function patchProject(id, fields) {
  const res = await fetch(`${API_BASE}/projects.php?id=${encodeURIComponent(id)}`, {
    method: 'PUT',
    credentials: 'same-origin',
    headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': CSRF },
    body: JSON.stringify(fields)
  });
  const j = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(j.error || 'Unbekannter Fehler');
  if (j.data) {
    const p = store.projects.find(x => x.id === id);
    if (p) Object.assign(p, j.data);
  }
}

async function cutterRevert(projectId, targetStatus) {
  const session = getCurrentUser();
  const p = store.projects.find(x => x.id === projectId);
  if (!p) return;
  if (!canActOnProject(p, session, 'cutterRevert')) {
    appAlert('Du darfst diesen Status nicht zurücksetzen.', { title: 'Nicht erlaubt' });
    return;
  }
  const actualTarget = targetStatus;
  const dialog = actualTarget === STATUS.GEDREHT
    ? { title: 'Annahme rückgängig?', body: 'Das Projekt landet wieder in deiner „Bereit zum Schnitt"-Liste.', okLabel: 'Annahme rückgängig' }
    : actualTarget === STATUS.KORREKTUR
      ? { title: 'Zurück zur Korrektur?', body: 'Das Projekt landet wieder in der Korrektur-Liste, da Korrekturnotizen vorliegen.', okLabel: 'Zurück zur Korrektur' }
      : { title: 'Wieder bearbeiten?', body: 'Das Projekt wird wieder geöffnet, damit du Änderungen vornehmen kannst.', okLabel: 'Wieder bearbeiten' };
  const ok = await appConfirm(dialog.body, { title: dialog.title, okLabel: dialog.okLabel, cancelLabel: 'Abbrechen' });
  if (!ok) return;
  const idx = store.projects.findIndex(p => p.id === projectId);
  if (idx >= 0) {
    const prevStatus = store.projects[idx].status;
    lockProjectStatus(projectId, actualTarget);
    store.projects[idx].status = actualTarget;
    logActivity('project', store.projects[idx].id, 'cutterRevert', { title: store.projects[idx].title, from: targetStatus, to: actualTarget });

    closeModal();
    renderPage();
    fetch(`${API_BASE}/projects.php?id=${encodeURIComponent(projectId)}`, {
      method: 'PUT', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': CSRF },
      body: JSON.stringify({ status: actualTarget })
    }).then(r => r.json()).then(json => {
      if (!json.ok) throw new Error(json.error || 'Fehler');
      if (json.data) store.projects[idx] = { ...store.projects[idx], ...json.data };
      unlockProjectStatus(projectId);
      renderPage();
    }).catch(err => {
      unlockProjectStatus(projectId);
      store.projects[idx].status = prevStatus;
      renderPage();
      showToast('Speichern fehlgeschlagen', err.message);
    });
  }
}

                <span style="flex:1;">${escape(sf.filename || 'Skript.pdf')}</span>
                <a class="btn btn-secondary btn-sm" href="${API_BASE}/download.php?scope=project&id=${sf.id}" target="_blank" rel="noopener">Öffnen</a>
              </div>
            </div>
          ` : ''; })()}

          ${renderNasViewerSection(project, user)}

        <div class="modal-footer">

  `;
  $('#modal-container').innerHTML = html;
  const isPriv = hasRole(user, ROLES.ADMIN, ROLES.MANAGER);

}

function renderProjectFilesSection(project, session) {
  const user = session.user;
  const isAdmin    = hasRole(user, ROLES.ADMIN, ROLES.MANAGER);
  const isVideograf = hasRole(user, ROLES.VIDEOGRAF) || isAdmin;
  const isCutter   = hasRole(user, ROLES.CUTTER) || isAdmin;
  const files = project.files || [];

  const rohmaterial = files.filter(f => f.kind === 'rohmaterial');
  const fertig      = files.filter(f => f.kind === 'fertigstellung');

  const canUploadRohmaterial = hasRole(user, ROLES.ADMIN, ROLES.MANAGER, ROLES.VIDEOGRAF);
  const canSeeRohmaterial    = canUploadRohmaterial || hasRole(user, ROLES.CUTTER);
  const canUploadFertig      = hasRole(user, ROLES.ADMIN, ROLES.MANAGER, ROLES.CUTTER);

  function fileRow(f) {
    const icon = f.mime?.startsWith('video/') ? '🎞️' : f.mime?.startsWith('image/') ? '🖼️' : '📄';
    const size = f.size ? (f.size > 1048576 ? (f.size/1048576).toFixed(1) + ' MB' : Math.round(f.size/1024) + ' KB') : '';
    const url = f.path?.startsWith('/') ? f.path : (f.path || '');
    return `
      <div class="file-uploaded">
        <span style="font-size:16px;">${icon}</span>
        <div style="flex:1;min-width:0;">
          <div style="font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escape(f.filename || f.path || '–')}</div>
          ${size ? `<div style="font-size:11px;color:var(--text-3);">${size}</div>` : ''}
        </div>
        <a class="btn btn-secondary btn-sm" href="${url}" target="_blank" rel="noopener">Öffnen</a>
      </div>
    `;
  }

  let html = '';

  if (canSeeRohmaterial) {
    html += `
      <div style="margin-top:18px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
          <div class="cutter-detail-label">Rohmaterial</div>
          ${canUploadRohmaterial ? `<button type="button" class="btn btn-secondary btn-sm" onclick="uploadProjectFile('rohmaterial','${project.id}')">+ Hochladen</button>` : ''}
        </div>
        ${rohmaterial.length ? rohmaterial.map(fileRow).join('') : '<div class="text-sm text-muted">Noch kein Rohmaterial hochgeladen.</div>'}
      </div>
    `;
  }

  if (canUploadFertig || fertig.length > 0) {
    html += `
      <div style="margin-top:18px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
          <div class="cutter-detail-label">Fertigstellung</div>
          ${canUploadFertig ? `<button type="button" class="btn btn-secondary btn-sm" onclick="uploadProjectFile('fertigstellung','${project.id}')">+ Hochladen</button>` : ''}
        </div>
        ${fertig.length ? fertig.map(fileRow).join('') : '<div class="text-sm text-muted">Noch keine Fertigstellung hochgeladen.</div>'}
      </div>
    `;
  }

  return html;
}

async function uploadProjectFile(kind, projectId) {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = kind === 'fertigstellung' || kind === 'rohmaterial'
    ? 'video/*,.mp4,.mov,.avi,.webm'
    : '*/*';
  input.style.display = 'none';
  document.body.appendChild(input);
  input.onchange = async (e) => {
    document.body.removeChild(input);
    const file = e.target.files?.[0];
    if (!file) return;
    const fd = new FormData();
    fd.append('file', file);
    showToast('Wird hochgeladen…', file.name);
    try {
      const res = await fetch(
        `${API_BASE}/upload.php?scope=project&kind=${encodeURIComponent(kind)}&id=${encodeURIComponent(projectId)}`,
        { method: 'POST', credentials: 'same-origin', headers: { 'X-CSRF-Token': CSRF }, body: fd }
      );
      const json = await res.json();
      if (!res.ok || !json.ok) throw new Error(json.error || 'Upload fehlgeschlagen');
      showToast('Hochgeladen', 'Datei erfolgreich gespeichert.');
      const project = store.projects.find(p => p.id === projectId);
      if (project) openProjectViewerModal(project);
    } catch (err) {
      showToast('Fehler', err.message);
    }
  };
  input.click();
}

async function saveProject(e, projectId) {
  e.preventDefault();
  const session = getCurrentUser();
  if (!session || session.type !== 'staff' || !hasRole(session.user, ROLES.ADMIN, ROLES.MANAGER)) {
    appAlert('Nur Admin/Manager dürfen Projekte speichern.', { title: 'Nicht erlaubt' });
    return;
  }
  // Manager nur für eigene Kunden (außer Admin)
  if (!hasRole(session.user, ROLES.ADMIN)) {
    const tmpData = Object.fromEntries(new FormData(e.target));
    if (tmpData.customerId) {
      const c = store.customers.find(x => x.id === tmpData.customerId);
      if (c && c.managerId && c.managerId !== session.user.id) {
        appAlert('Du kannst nur Projekte für deine eigenen Kunden anlegen/ändern.', { title: 'Nicht erlaubt' });
        return;
      }
    }
    if (projectId) {
      const existing = store.projects.find(p => p.id === projectId);
      if (existing) {
        const ec = store.customers.find(x => x.id === existing.customerId);
        if (ec && ec.managerId && ec.managerId !== session.user.id) {
          appAlert('Du kannst nur Projekte deiner eigenen Kunden ändern.', { title: 'Nicht erlaubt' });
          return;
        }
      }
    }
  }
  const form = e.target;
  const data = Object.fromEntries(new FormData(form));

  // Internes Projekt? – dann ist kein Kunde nötig
  data.isInternal = !!data.isInternal;

  if (!data.title) {
    alert('Bitte einen Titel angeben.');
    return;
  }
  if (!data.isInternal && !data.customerId) {
    alert('Bitte einen Kunden auswählen (oder das Projekt als „intern" markieren).');
    return;
  }

  // Drehtag-Zuweisung: Datum + Videograf vom Drehtag übernehmen
  if (data.shootDayId) {
    const sd = store.shootDays.find(s => s.id === data.shootDayId);
    if (sd) {
      data.shootDate = sd.date;
      data.videografId = sd.videografId || data.videografId;
    }
  } else {
    data.shootDayId = null;
  }

  if (data.isInternal) {
    // Bei internen Projekten gibt es keinen Kunden und kein Posting-Datum
    data.customerId = null;
    data.postingDate = null;
    data.shootDate = data.shootDate || null;
    data.shootDayId = null;
  } else {
    // Default cutter = manager of customer NUR wenn der Manager auch tatsächlich Cutter-Rolle hat
    if (!data.cutterId) {
      const customer = store.customers.find(c => c.id === data.customerId);
      if (customer?.managerId) {
        const mgr = store.users.find(u => u.id === customer.managerId);
        if (mgr && hasRole(mgr, ROLES.CUTTER)) data.cutterId = customer.managerId;
      }
    }
    // Beim Anlegen: Cutter-Deadline = Posting − 48 h (= 2 Tage)
    // Beim Bearbeiten: Deadline editierbar, fällt zurück auf Posting − 2 Tage falls leer.
    // Posting-Datum wird NICHT aus der Deadline fabriziert – es darf bewusst leer bleiben
    // (siehe Orange-Hinweis „Kein Posting-Datum festgelegt"); sonst würde der Hinweis nie greifen.
    if (!data.deadline && data.postingDate) {
      data.deadline = addDays(data.postingDate, -2);
    }
  }

  // Urlaubs-Check als WARNUNG (nicht blockierend)
  const shoot = data.shootDate || null;
  const dl = data.deadline || null;
  const warnings = [];

  if (data.videografId && shoot && isUserOnVacationOn(data.videografId, shoot)) {
    const u = store.users.find(x => x.id === data.videografId);
    warnings.push(`⚠️ ${u?.name || 'Videograf'} hat am Drehtag (${fmtDate(shoot)}) Urlaub.`);
  }
  // Cutter: Schnittzeitraum = Drehtag bis Deadline
  if (data.cutterId) {
    const rangeStart = shoot || dl;
    const rangeEnd = dl || shoot;
    if (rangeStart && rangeEnd && isUserOnVacationDuringRange(data.cutterId, rangeStart, rangeEnd)) {
      const u = store.users.find(x => x.id === data.cutterId);
      warnings.push(`⚠️ ${u?.name || 'Cutter'} hat im Schnittzeitraum (${fmtDate(rangeStart)} – ${fmtDate(rangeEnd)}) Urlaub.`);
    }
  }
  if (warnings.length > 0) {
    if (!confirm(warnings.join('\n\n') + '\n\nTrotzdem speichern?')) return;
  }

  // Skript-PDF wird erst nach dem DB-Save als Projektdatei hochgeladen (siehe unten).
  // Drehtag "lernt" den Kunden: Wenn Drehtag noch keinen Kunden hat
  // und das Projekt einen, dann auf dem Drehtag speichern – so wird er
  // bei jedem weiteren Projekt mit diesem Drehtag automatisch übernommen.
  if (data.shootDayId && data.customerId && !data.isInternal) {
    const sdIdx = store.shootDays.findIndex(s => s.id === data.shootDayId);
    if (sdIdx >= 0 && !store.shootDays[sdIdx].customerId) {
      store.shootDays[sdIdx].customerId = data.customerId;
      // Fire-and-forget: shootDay übernimmt den Kunden in der DB
      fetch(
        `${API_BASE}/shootdays.php?id=${encodeURIComponent(data.shootDayId)}`,
        {
          method: 'PUT',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': CSRF },
          body: JSON.stringify({ customerId: data.customerId })
        }
      ).catch(err => console.warn('[saveProject] shootDay customerId sync failed:', err));
    }
  }

  // Snapshot für Rollback
  let prevEntry = null;
  let insertedId = null;

  if (projectId) {
    const idx = store.projects.findIndex(p => p.id === projectId);
    if (idx >= 0) {
      prevEntry = { ...store.projects[idx] };
      store.projects[idx] = { ...store.projects[idx], ...data };
    }
  } else {
    insertedId = uid('p');
    store.projects.push({
      id: insertedId,
      title: data.title,
      customerId: data.customerId,
      videografId: data.videografId || null,
      cutterId: data.cutterId || null,
      shootDate: data.shootDate || null,
      shootDayId: data.shootDayId || null,
      deadline: data.deadline || null,
      postingDate: data.postingDate || null,
      script: data.script || '',
      status: (data.shootDate || data.shootDayId) ? STATUS.GEPLANT : STATUS.IDEE,
      createdAt: new Date().toISOString()
    });
  }

  // Vor-Dreh-Automatik: Status aus Drehtag/Drehdatum ableiten (idee↔geplant) und in den
  // DB-Payload spiegeln. Status ab 'gedreht' bleibt unangetastet.
  const _savedIdx = store.projects.findIndex(p => p.id === (projectId || insertedId));
  if (_savedIdx >= 0) {
    normalizeIdeaPhase(store.projects[_savedIdx]);
    data.status = store.projects[_savedIdx].status;
  }

  // Pending Skript-PDF sichern, BEVOR closeModal() sie auf null setzt.
  const scriptToUpload = pendingScriptFile;
  pendingScriptFile = null;

  clearProjectDraft();
  closeModal();

  if (!projectId) {
    // Zur Phase des neuen Projekts wechseln (Ideen bei Idee/Geplant, sonst Production etc.)
    const newPhase = _savedIdx >= 0 ? getProjectPhase(store.projects[_savedIdx]) : 'ideen';
    projectPhaseTab = newPhase;
    try { localStorage.setItem(_filterKey('proj_phase'), newPhase); } catch (e) {}

    // Kalender auf frühestes Datum springen
    const dates = [data.shootDate, data.deadline, data.postingDate].filter(Boolean).sort();
    if (dates.length > 0) {
      const earliest = new Date(dates[0] + 'T00:00:00');
      calendarDate = new Date(earliest.getFullYear(), earliest.getMonth(), 1);
      if (currentPage !== 'calendar') {
        showToast('Projekt angelegt', 'Im Kalender sichtbar → Kalender öffnen', () => navigateTo('calendar'));
      }
    }
  }

  renderPage();

  // Direkt in DB schreiben (nur DB-kompatible Felder, kein base64)
  const apiPayload = {
    title: data.title,
    customerId: data.customerId || null,
    videografId: data.videografId || null,
    cutterId: data.cutterId || null,
    shootDate: data.shootDate || null,
    shootDayId: data.shootDayId || null,
    deadline: data.deadline || null,
    postingDate: data.postingDate || null,
    script: data.script || '',
    isInternal: data.isInternal ? 1 : 0,
    status: data.status || undefined
  };
  // NAS-Freigabelinks nur mitschicken, wenn die Felder im Formular vorhanden waren
  // (nur Bearbeiten-Ansicht, nicht bei Neuanlage).
  if ('nasRohmaterialUrl' in data) apiPayload.nasRohmaterialUrl = data.nasRohmaterialUrl || null;
  if ('nasExportUrl' in data)      apiPayload.nasExportUrl      = data.nasExportUrl || null;
  if ('nasFreigabeUrl' in data)    apiPayload.nasFreigabeUrl    = data.nasFreigabeUrl || null;
  // Für neue Projekte: id mitschicken
  if (!projectId) apiPayload.id = insertedId;

  try {
    const url = projectId
      ? `${API_BASE}/projects.php?id=${encodeURIComponent(projectId)}`
      : `${API_BASE}/projects.php`;
    const method = projectId ? 'PUT' : 'POST';
    const res = await fetch(url, {
      method,
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': CSRF },
      body: JSON.stringify(apiPayload)
    });
    const json = await res.json();
    if (!res.ok || !json.ok) throw new Error(json.error || 'Speichern fehlgeschlagen');
    const targetId = projectId || insertedId;
    if (json.data) {
      const i = store.projects.findIndex(p => p.id === targetId);
      if (i >= 0) store.projects[i] = { ...store.projects[i], ...json.data };
    }
    // Skript-PDF jetzt persistent hochladen (Projekt existiert serverseitig)
    if (scriptToUpload) {
      await uploadScriptForProject(targetId, scriptToUpload);
    }
  } catch (err) {
    // Rollback
    if (projectId && prevEntry) {
      const i = store.projects.findIndex(p => p.id === projectId);
      if (i >= 0) store.projects[i] = prevEntry;
    } else if (insertedId) {
      store.projects = store.projects.filter(p => p.id !== insertedId);
    }
    renderPage();
    showToast('Fehler beim Speichern', err.message);
  }
}

function toggleInternalProject(cb) {
  const isInternal = cb.checked;
  const ext = document.getElementById('external-fields');
  const post = document.getElementById('posting-field');
  if (ext) ext.style.display = isInternal ? 'none' : '';
  if (post) post.style.display = isInternal ? 'none' : '';
}

function autoFillDeadline() {
  const postingInput = document.getElementById('proj-postingDate');
  const deadlineInput = document.getElementById('proj-deadline');
  if (!postingInput || !deadlineInput) return;
  if (postingInput.value && !deadlineInput.value) {
    deadlineInput.value = addDays(postingInput.value, -2);
  }
  checkCutterTimeline();
}

// Feature 4: 24h-Cutter-Validierung
function checkCutterTimeline() {
  const box = document.getElementById('timeline-warning-box');
  if (!box) return;
  const shootDate  = document.getElementById('proj-shootDate')?.value  || '';
  const deadline   = document.getElementById('proj-deadline')?.value   || '';
  const postingDate = document.getElementById('proj-postingDate')?.value || '';
  const warnings = [];
  if (shootDate && deadline) {
    // Rohmaterial muss mind. 24h vor Cutter-Deadline bereitstehen
    if (deadline <= shootDate) {
      warnings.push('Cutter-Deadline liegt am selben Tag oder vor dem Drehtag – Cutter hat keine 24 h zum Schneiden.');
    }
  }
  if (deadline && postingDate) {
    // Cutter braucht mind. 24h zwischen Deadline und Posting
    if (postingDate <= deadline) {
      warnings.push('Posting-Datum liegt am selben Tag oder vor der Cutter-Deadline – zu wenig Zeit für Freigabe.');
    }
  }
  if (warnings.length === 0) { box.innerHTML = ''; return; }
  box.innerHTML = warnings.map(w =>
    `<div class="timeline-warning">⚠ ${escape(w)}</div>`
  ).join('');
}

// Feature 3: Auto-Fill Cutter aus Kunden-Defaults beim Wechsel des Kunden
function onProjectCustomerChange(select) {
  const cid = select.value;
  const customer = cid ? store.customers.find(c => c.id === cid) : null;
  const cutterSelect = document.getElementById('proj-cutter');
  if (cutterSelect && customer?.defaultCutterId && !cutterSelect.dataset.userEdited) {
    cutterSelect.value = customer.defaultCutterId;
  }
}

function onShootDayChange(select) {
  const shootDayId = select.value;
  const manualRow = document.getElementById('manual-shootDate-row');
  const videografField = document.getElementById('videograf-field');
  const shootDateInput = document.getElementById('proj-shootDate');
  const videografSelect = document.getElementById('proj-videograf');
  const customerSelect = document.getElementById('proj-customer');
  if (shootDayId) {
    // Drehtag gewählt → Datum, Videograf UND Kunde aus Drehtag übernehmen
    const sd = store.shootDays.find(s => s.id === shootDayId);
    if (sd) {
      if (shootDateInput) shootDateInput.value = sd.date;
      if (videografSelect) videografSelect.value = sd.videografId || '';
      if (customerSelect) {
        // 1. Bevorzugt: Kunde direkt am Drehtag hinterlegt
        let inheritedCustomerId = sd.customerId || null;
        // 2. Fallback: Kunde aus bereits zugewiesenen Projekten ableiten
        if (!inheritedCustomerId) {
          const linked = store.projects.filter(p => p.shootDayId === sd.id && p.customerId);
          if (linked.length > 0) {
            // Wenn alle bisherigen Projekte denselben Kunden haben → übernehmen
            const uniqueCustomers = [...new Set(linked.map(p => p.customerId))];
            if (uniqueCustomers.length === 1) {
              inheritedCustomerId = uniqueCustomers[0];
            }
          }
        }
        if (inheritedCustomerId) {
          customerSelect.value = inheritedCustomerId;
          // Auto-Fill Cutter aus Kunden-Defaults
          const iCust = store.customers.find(c => c.id === inheritedCustomerId);
          const cutterSel = document.getElementById('proj-cutter');
          if (cutterSel && iCust?.defaultCutterId && !cutterSel.dataset.userEdited) {
            cutterSel.value = iCust.defaultCutterId;
          }
        }
      }
    }
    if (manualRow) manualRow.style.display = 'none';
    if (videografField) videografField.style.display = 'none';
  } else {
    if (manualRow) manualRow.style.display = '';
    if (videografField) videografField.style.display = '';
  }
}

// Neueste persistierte Skript-PDF eines Projekts (aus project_files, kind=script).
function scriptFileOf(project) {
  if (!project || !Array.isArray(project.files)) return null;
  const scripts = project.files.filter(f => f && f.kind === 'script');
  return scripts.length ? scripts[0] : null; // list_files liefert neueste zuerst

// NAS-Sektion im Read-Only-Viewer (Cutter/Videograf):
// Rohmaterial + Freigabe als reine Öffnen-Shortcuts; Export-Link für den zugewiesenen
// Cutter editierbar (er trägt seinen Upload-/Export-Share-Link ein und speichert ihn).
function renderNasViewerSection(project, user) {

  const shortcut = (folderLabel, hint, value) => {
    if (!value) return '';
    return `
      <div class="nas-link-row">
        <div class="nas-link-meta">
          <span class="nas-link-folder">${escape(folderLabel)}</span>
          <span class="nas-link-hint">${escape(hint)}</span>
        </div>
        <div class="nas-link-input">
          <a class="btn btn-secondary btn-sm" href="${escape(value)}" target="_blank" rel="noopener noreferrer">Öffnen</a>
        </div>
      </div>`;
  };
  const rohmaterial = shortcut('01_Rohmaterial', 'Rohmaterial (read-only)', project.nasRohmaterialUrl);
  const freigabe    = shortcut('04_Freigaben_Manager', 'Manager-Freigabe', project.nasFreigabeUrl);
  // Export: Cutter editierbar, sonst Shortcut (falls gesetzt)
  let exportBlock = '';
  if (isAssignedCutter) {
    const v = project.nasExportUrl || '';
    exportBlock = `
      <div class="nas-link-row">
        <div class="nas-link-meta">
          <span class="nas-link-folder">03_Exporte_Cutter</span>
          <span class="nas-link-hint">Dein Export-Freigabelink</span>
        </div>
        <div class="nas-link-input">
          <input type="url" id="nas-export-input" value="${escape(v)}" placeholder="https://nas… Export-Link einfügen" />
          <button type="button" class="btn btn-primary btn-sm" onclick="saveCutterNasExport('${project.id}')">Speichern</button>
        </div>
      </div>`;
  } else {
    exportBlock = shortcut('03_Exporte_Cutter', 'Cutter-Export', project.nasExportUrl);
  }
  if (!rohmaterial && !exportBlock && !freigabe) return '';
  return `
    <div style="margin-top: 14px;">
      <div class="cutter-detail-label" style="margin-bottom:6px;">NAS-Freigabelinks (Ugreen)</div>
      <div class="nas-links">${rohmaterial}${exportBlock}${freigabe}</div>
    </div>`;
}

// Cutter speichert seinen Export-Link (nur dieses Feld ist serverseitig für ihn erlaubt).
async function saveCutterNasExport(projectId) {
  const input = document.getElementById('nas-export-input');
  if (!input) return;
  const val = input.value.trim();
  const idx = store.projects.findIndex(p => p.id === projectId);
  const prev = idx >= 0 ? store.projects[idx].nasExportUrl : undefined;
  if (idx >= 0) store.projects[idx].nasExportUrl = val || null;
  try {
    const res = await fetch(`${API_BASE}/projects.php?id=${encodeURIComponent(projectId)}`, {
      method: 'PUT', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': CSRF },
      body: JSON.stringify({ nasExportUrl: val })
    });
    const json = await res.json();
    if (!res.ok || !json.ok) throw new Error(json.error || 'Speichern fehlgeschlagen');
    if (json.data && idx >= 0) store.projects[idx] = { ...store.projects[idx], ...json.data };
    showToast('Export-Link gespeichert', 'success');
  } catch (err) {
    if (idx >= 0) store.projects[idx].nasExportUrl = prev;
    showToast('Fehler beim Speichern', err.message);
  }
}

/* ---------------------------------------------------------------------------
   NAS-MEDIEN (Beta) — direkter Upload/Download über WebDAV-Streaming
   Nutzt uploadAsset/downloadAsset/listAssets aus api/upload.js.
   Ordner werden automatisch angelegt (Idee→Projekt bzw. beim ersten Upload).
   --------------------------------------------------------------------------- */
const nasMedia = { projectId: null, assets: [], uploads: [], loading: false, error: null };
let nasUploadSeq = 0;

async function loadAndRenderNasMedia(projectId) {
  const container = document.getElementById('nas-media-section');
  if (!container) return;
  const session = getCurrentUser();
  if (session.type !== 'staff') return; // nur intern, nie für Kunden

  if (nasMedia.projectId !== projectId) {
    nasMedia.projectId = projectId;
    nasMedia.assets  = [];
    nasMedia.uploads = [];
  }
  nasMedia.loading = true;
  nasMedia.error   = null;
  renderNasMedia();
  try {
    nasMedia.assets = await listAssets(projectId);
  } catch (err) {
    nasMedia.error = err.message;
  }
  nasMedia.loading = false;
  renderNasMedia();
}

function nasFmtBytes(n) {
  if (n === null || n === undefined || n === '') return '';
  n = Number(n);
  if (n >= 1073741824) return (n / 1073741824).toFixed(2) + ' GB';
  if (n >= 1048576)    return (n / 1048576).toFixed(1) + ' MB';
  return Math.max(1, Math.round(n / 1024)) + ' KB';
}

function renderNasMedia() {
  const container = document.getElementById('nas-media-section');
  if (!container) return;
  const session = getCurrentUser();
  const user    = session.user;
  const isPriv     = hasRole(user, ROLES.ADMIN, ROLES.MANAGER);
  const canUpRaw   = isPriv || hasRole(user, ROLES.VIDEOGRAF);
  const canUpFinal = isPriv || hasRole(user, ROLES.CUTTER);
  const pid        = nasMedia.projectId;

  const proj   = store.projects.find(p => p.id === pid);
  const locked = !!proj && ['freigegeben', 'archiviert'].includes(proj.status);

  const assetRow = (a, opts = {}) => {
    const uploader = store.users.find(u => u.id === a.uploadedBy);
    const meta = [
      nasFmtBytes(a.sizeBytes),
      a.createdAt ? fmtDate(String(a.createdAt).slice(0, 10)) : '',
      uploader ? 'von ' + uploader.name : '',
    ].filter(Boolean).join(' · ');
    const ct = String(a.contentType || '');
    const viewable = ct.startsWith('video/') || ct.startsWith('image/');
    const openN = Number(a.openComments || 0);
    const canNewVersion = opts.latestFinal && canUpFinal && (!locked || isPriv);
    return `
      <div class="file-uploaded" style="${opts.old ? 'opacity:0.55;' : ''}">
        <span class="nas-media-dot stored" title="Auf dem NAS gespeichert"></span>
        <div style="flex:1;min-width:0;">
          <div style="display:flex;align-items:center;gap:7px;min-width:0;">
            <div style="font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escape(a.filename)}</div>
            ${opts.old ? `<span class="nas-version-chip">ältere Version</span>` : ''}
            ${a.kind === 'final' && openN > 0 ? `<span class="nas-open-badge">${openN} offen</span>` : ''}
          </div>
          ${meta ? `<div style="font-size:11px;color:var(--text-3);">${escape(meta)}</div>` : ''}
        </div>
        ${viewable ? `<button type="button" class="btn btn-primary btn-sm" onclick="openNasPlayer('${a.id}')">▶ Ansehen</button>` : ''}
        ${canNewVersion ? `<button type="button" class="btn btn-secondary btn-sm" title="Korrigierte Version hochladen" onclick="nasMediaPickVersion('${a.id}','${pid}')">⟳ Neue Version</button>` : ''}
        <button type="button" class="btn btn-secondary btn-sm" onclick="downloadAsset('${a.id}')">⬇ Laden</button>
        ${isPriv ? `<button type="button" class="btn btn-ghost btn-sm" title="Vom NAS löschen" onclick="nasMediaDelete('${a.id}')">🗑</button>` : ''}
      </div>`;
  };

  const uploadRow = (u) => `
    <div class="file-uploaded" style="${u.error ? 'border-color:rgba(255,69,58,0.4);' : ''}">
      <span class="nas-media-dot ${u.error ? 'error' : ''}" style="${u.error ? '' : 'background:var(--accent,#0a84ff);'}"></span>
      <div style="flex:1;min-width:0;">
        <div style="font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escape(u.name)}</div>
        ${u.error
          ? `<div style="font-size:11px;color:#ff453a;">${escape(u.error)}</div>`
          : `<div class="nas-up-bar-wrap"><div class="nas-up-bar" id="nas-up-bar-${u.key}" style="width:${u.pct}%;"></div></div>`}
      </div>
      ${u.error
        ? `<button type="button" class="btn btn-ghost btn-sm" onclick="nasMediaDismissUpload('${u.key}')">Entfernen</button>`
        : `<span id="nas-up-pct-${u.key}" style="font-size:11px;color:var(--text-3);flex-shrink:0;">${u.pct} %</span>`}
    </div>`;

  const group = (kind, label, canUpload, multiple) => {
    const assets  = nasMedia.assets.filter(a => a.kind === kind);
    const uploads = nasMedia.uploads.filter(u => u.kind === kind);

    // Finale Schnitte: „ersetzt" ist ein Asset nur, wenn eine neuere Version
    // per parent_id darauf zeigt (Versionskette). Eigenständige Deliverables
    // (z. B. Imagefilm UND Teaser) gelten alle als aktuell und behalten ihren
    // „Neue Version"-Button. Nach Abnahme ist der Upload für Cutter eingefroren.
    const uploadAllowed = canUpload && (kind !== 'final' || !locked || isPriv);
    const superseded = kind === 'final'
      ? new Set(assets.map(a => a.parentId).filter(Boolean))
      : new Set();
    const rows = kind === 'final'
      ? assets.map(a => assetRow(a, { old: superseded.has(a.id), latestFinal: !superseded.has(a.id) })).join('')
      : assets.map(a => assetRow(a)).join('');

    return `
      <div style="margin-top:14px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
          <div class="cutter-detail-label">${label}</div>
          ${uploadAllowed
            ? `<button type="button" class="btn btn-secondary btn-sm" onclick="nasMediaPick('${kind}','${pid}')">+ Hochladen${multiple ? ' (mehrere)' : ''}</button>`
            : (kind === 'final' && locked ? `<span class="nas-version-chip" title="Projekt ist abgenommen">🔒 abgenommen</span>` : '')}
        </div>
        ${uploads.map(uploadRow).join('')}
        ${rows || (uploads.length ? '' : `<div class="text-sm text-muted">Noch keine Dateien.</div>`)}
      </div>`;
  };

  container.innerHTML = `
    <div style="margin-top:18px;padding-top:14px;border-top:1px solid var(--border);">
      <div style="display:flex;align-items:center;gap:8px;">
        <div class="cutter-detail-label" style="font-size:12px;">Medien (NAS)</div>
        <span class="badge-beta">Beta</span>
      </div>
      ${nasMedia.error ? `<div style="font-size:12px;color:#ff453a;margin-top:8px;">NAS nicht erreichbar: ${escape(nasMedia.error)}</div>` : ''}
      ${nasMedia.loading && !nasMedia.assets.length ? `<div class="text-sm text-muted" style="margin-top:8px;">Lade Medien…</div>` : ''}
      ${group('raw', 'Rohmaterial', canUpRaw, true)}
      ${group('final', 'Finale Schnitte', canUpFinal, false)}
    </div>`;
}

function nasMediaPick(kind, projectId, parentId = null) {
  const input = document.createElement('input');
  input.type = 'file';
  input.multiple = kind === 'raw' && !parentId;
  input.style.display = 'none';
  document.body.appendChild(input);
  input.onchange = (e) => {
    const files = Array.from(e.target.files || []);
    document.body.removeChild(input);
    if (files.length) nasMediaStartUploads(kind, projectId, files, parentId);
  };
  input.click();
}

// Korrigierte Version eines finalen Schnitts hochladen (Versionskette via parent_id)
function nasMediaPickVersion(parentAssetId, projectId) {
  nasMediaPick('final', projectId, parentAssetId);
}

async function nasMediaStartUploads(kind, projectId, files, parentId = null) {
  // Sequentiell hochladen — schont Netcup-Limits und den Tunnel
  for (const file of files) {
    const u = { key: 'u' + (++nasUploadSeq), name: file.name, kind, pct: 0, error: null };
    nasMedia.uploads.push(u);
    renderNasMedia();
    try {
      const asset = await uploadAsset(file, projectId, {
        kind,
        parentId,
        onProgress: (pct) => {
          u.pct = pct;
          const bar = document.getElementById('nas-up-bar-' + u.key);
          const lbl = document.getElementById('nas-up-pct-' + u.key);
          if (bar) bar.style.width = pct + '%';
          if (lbl) lbl.textContent = pct + ' %';
        },
      });
      nasMedia.uploads = nasMedia.uploads.filter(x => x !== u);
      nasMedia.assets.unshift(asset);
      showToast('Upload abgeschlossen', file.name);
    } catch (err) {
      u.error = err.message || 'Unbekannter Fehler';
      showToast('Upload fehlgeschlagen', file.name + ' — ' + u.error);
    }
    renderNasMedia();
  }
}

function nasMediaDismissUpload(key) {
  nasMedia.uploads = nasMedia.uploads.filter(x => x.key !== key);
  renderNasMedia();
}

/* Review-Player: eigenes Overlay ÜBER dem Projekt-Modal (das bleibt offen).
   Videos kommen aus der Netcup-Review-Kopie mit Range-Support → Spulen geht.
   Fallback ohne Kopie: Direkt-Stream vom NAS (abspielbar, ohne Seek). */
const nasPlayer = { assetId: null, comments: [], loading: false };

function openNasPlayer(assetId) {
  const a = nasMedia.assets.find(x => x.id === assetId);
  if (!a) return;
  closeNasPlayer();
  const url = `${API_BASE}/nas_media_view.php?id=${encodeURIComponent(assetId)}`;
  const isVideo = String(a.contentType || '').startsWith('video/');
  // Review-Kommentare gibt es nur für finale Schnitte (Videos)
  const withComments = isVideo && a.kind === 'final';

  const session = getCurrentUser();
  const user = session.user;
  const canComment = hasRole(user, ROLES.ADMIN, ROLES.MANAGER, ROLES.VIDEOGRAF);

  nasPlayer.assetId  = assetId;
  nasPlayer.comments = [];
  nasPlayer.loading  = withComments;

  const overlay = document.createElement('div');
  overlay.className = 'nas-player-backdrop';
  overlay.id = 'nas-player-overlay';
  overlay.addEventListener('click', (e) => { if (e.target === overlay) closeNasPlayer(); });
  overlay.innerHTML = `
    <div class="nas-player-box">
      <div class="nas-player-head">
        <div class="nas-player-title">${escape(a.filename)}</div>
        <button type="button" class="nas-player-close" onclick="closeNasPlayer()" aria-label="Schließen">×</button>
      </div>
      ${isVideo
        ? `<video id="nas-player-video" controls autoplay playsinline preload="metadata" src="${url}"></video>`
        : `<img src="${url}" alt="${escape(a.filename)}">`}
      ${withComments ? `
        <div class="nas-comments-panel" id="nas-comments-panel">
          <div class="text-sm text-muted">Lade Kommentare…</div>
        </div>
        ${canComment ? `
          <div class="nas-comment-form">
            <input type="text" id="nas-comment-input" maxlength="2000"
                   placeholder="Verbesserungsvorschlag — Zeitstempel wird automatisch gesetzt"
                   onkeydown="if(event.key==='Enter')nasCommentSubmit()">
            <button type="button" class="btn btn-primary btn-sm" onclick="nasCommentSubmit()">@ Zeit kommentieren</button>
          </div>
        ` : ''}
      ` : ''}
    </div>`;
  document.body.appendChild(overlay);
  document.addEventListener('keydown', nasPlayerEscHandler);
  if (withComments) loadNasComments(assetId);
}

/* ── Review-Kommentare im Player ─────────────────────────────────────────── */

function nasFmtTimecode(sec) {
  sec = Math.max(0, Math.floor(Number(sec) || 0));
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  const mm = String(m).padStart(2, '0'), ss = String(s).padStart(2, '0');
  return h > 0 ? `${h}:${mm}:${ss}` : `${mm}:${ss}`;
}

async function loadNasComments(assetId) {
  try {
    const res = await fetch(`${API_BASE}/nas_comments.php?asset_id=${encodeURIComponent(assetId)}`,
                            { credentials: 'same-origin' });
    const json = await res.json();
    if (!res.ok || !json.ok) throw new Error(json.error || `HTTP ${res.status}`);
    nasPlayer.comments = json.data || [];
  } catch (err) {
    nasPlayer.comments = [];
    showToast('Kommentare konnten nicht geladen werden', err.message);
  }
  nasPlayer.loading = false;
  renderNasComments();
}

function renderNasComments() {
  const panel = document.getElementById('nas-comments-panel');
  if (!panel) return;
  const session = getCurrentUser();
  const user = session.user;
  const isPriv     = hasRole(user, ROLES.ADMIN, ROLES.MANAGER);
  const canResolve = isPriv || hasRole(user, ROLES.CUTTER);

  const open     = nasPlayer.comments.filter(c => c.status === 'open');
  const resolved = nasPlayer.comments.filter(c => c.status !== 'open');

  const row = (c) => {
    const canDelete = isPriv || c.userId === user.id;
    const when = c.createdAt ? fmtDate(String(c.createdAt).slice(0, 10)) : '';
    return `
      <div class="nas-comment-row ${c.status !== 'open' ? 'resolved' : ''}">
        ${canResolve
          ? `<input type="checkbox" ${c.status !== 'open' ? 'checked' : ''} title="${c.status !== 'open' ? 'Wieder öffnen' : 'Als erledigt abhaken'}"
               onchange="nasCommentToggle('${c.id}', this.checked)" style="margin-top:3px;flex-shrink:0;">`
          : `<span class="nas-media-dot ${c.status !== 'open' ? 'stored' : 'error'}" style="margin-top:5px;"></span>`}
        ${c.timecode !== null && c.timecode !== undefined
          ? `<button type="button" class="nas-tc-chip" onclick="nasPlayerSeek(${Number(c.timecode)})">${nasFmtTimecode(c.timecode)}</button>`
          : ''}
        <div class="nas-comment-body">
          <div>${escape(c.body)}</div>
          <div class="nas-comment-meta">${escape(c.userName || '?')}${when ? ' · ' + when : ''}</div>
        </div>
        ${canDelete ? `<button type="button" class="btn btn-ghost btn-sm" style="padding:2px 7px;" title="Kommentar löschen" onclick="nasCommentDelete('${c.id}')">×</button>` : ''}
      </div>`;
  };

  panel.innerHTML = `
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
      <div class="cutter-detail-label">Review-Kommentare</div>
      ${open.length ? `<span class="nas-open-badge">${open.length} offen</span>` : `<span class="nas-version-chip">alle erledigt</span>`}
    </div>
    ${nasPlayer.comments.length
      ? open.map(row).join('') + resolved.map(row).join('')
      : `<div class="text-sm text-muted">Noch keine Kommentare. ${nasPlayer.loading ? '' : 'Klick auf „@ Zeit kommentieren" hält die aktuelle Videostelle fest.'}</div>`}
  `;
}

function nasPlayerSeek(t) {
  const v = document.getElementById('nas-player-video');
  if (!v) return;
  v.currentTime = Math.max(0, Number(t) || 0);
  v.play().catch(() => {});
}

async function nasCommentSubmit() {
  const input = document.getElementById('nas-comment-input');
  const v     = document.getElementById('nas-player-video');
  if (!input) return;
  const body = input.value.trim();
  if (!body) { input.focus(); return; }
  const timecode = v ? Math.round(v.currentTime * 100) / 100 : null;
  if (v) v.pause();

  try {
    const res = await fetch(`${API_BASE}/nas_comments.php`, {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': CSRF },
      body: JSON.stringify({ asset_id: nasPlayer.assetId, body, timecode }),
    });
    const json = await res.json();
    if (!res.ok || !json.ok) throw new Error(json.error || `HTTP ${res.status}`);
    input.value = '';
    nasPlayer.comments.push(json.data);
    nasPlayer.comments.sort((a, b) => (a.timecode ?? 1e9) - (b.timecode ?? 1e9));
    renderNasComments();
    nasSyncOpenCount();
  } catch (err) {
    showToast('Kommentar fehlgeschlagen', err.message);
  }
}

async function nasCommentToggle(commentId, resolved) {
  try {
    const res = await fetch(
      `${API_BASE}/nas_comments.php?id=${encodeURIComponent(commentId)}&action=${resolved ? 'resolve' : 'reopen'}`,
      { method: 'POST', credentials: 'same-origin', headers: { 'X-CSRF-Token': CSRF } }
    );
    const json = await res.json();
    if (!res.ok || !json.ok) throw new Error(json.error || `HTTP ${res.status}`);
    const idx = nasPlayer.comments.findIndex(c => c.id === commentId);
    if (idx >= 0) nasPlayer.comments[idx] = json.data;
    renderNasComments();
    nasSyncOpenCount();
  } catch (err) {
    showToast('Aktion fehlgeschlagen', err.message);
    renderNasComments();
  }
}

async function nasCommentDelete(commentId) {
  const ok = await appConfirm('Diesen Kommentar löschen?', { title: 'Kommentar löschen?', okLabel: 'Löschen', danger: true });
  if (!ok) return;
  try {
    const res = await fetch(`${API_BASE}/nas_comments.php?id=${encodeURIComponent(commentId)}`, {
      method: 'DELETE', credentials: 'same-origin', headers: { 'X-CSRF-Token': CSRF },
    });
    const json = await res.json();
    if (!res.ok || !json.ok) throw new Error(json.error || `HTTP ${res.status}`);
    nasPlayer.comments = nasPlayer.comments.filter(c => c.id !== commentId);
    renderNasComments();
    nasSyncOpenCount();
  } catch (err) {
    showToast('Löschen fehlgeschlagen', err.message);
  }
}

// Offene-Kommentare-Badge in der Medien-Sektion aktuell halten
function nasSyncOpenCount() {
  const a = nasMedia.assets.find(x => x.id === nasPlayer.assetId);
  if (!a) return;
  a.openComments = nasPlayer.comments.filter(c => c.status === 'open').length;
  renderNasMedia();
}

function nasPlayerEscHandler(e) {
  if (e.key === 'Escape') closeNasPlayer();
}

function closeNasPlayer() {
  const el = document.getElementById('nas-player-overlay');
  if (el) {
    const v = el.querySelector('video');
    if (v) { v.pause(); v.removeAttribute('src'); v.load(); }
    el.remove();
  }
  document.removeEventListener('keydown', nasPlayerEscHandler);
}

async function nasMediaDelete(assetId) {
  const a = nasMedia.assets.find(x => x.id === assetId);
  const ok = await appConfirm(
    `„${a ? a.filename : 'Datei'}" wird endgültig vom NAS gelöscht.`,
    { title: 'Datei löschen?', okLabel: 'Löschen', danger: true }
  );
  if (!ok) return;
  try {
    const res = await fetch(`${API_BASE}/nas_assets.php?id=${encodeURIComponent(assetId)}`, {
      method: 'DELETE',
      credentials: 'same-origin',
      headers: { 'X-CSRF-Token': CSRF },
    });
    const json = await res.json();
    if (!res.ok || !json.ok) throw new Error(json.error || `HTTP ${res.status}`);
    nasMedia.assets = nasMedia.assets.filter(x => x.id !== assetId);
    renderNasMedia();
    showToast('Datei gelöscht', a ? a.filename : '');
  } catch (err) {
    showToast('Löschen fehlgeschlagen', err.message);
  }
}

let pendingScriptFile = null;
function uploadScriptFile(e, projectId) {
  const file = e.target.files[0];
  if (!file) return;
  if (file.type !== 'application/pdf') {
    showToast('Nur PDF erlaubt', 'Bitte eine PDF-Datei auswählen.');
    e.target.value = '';
    return;
  }
  if (file.size > 50 * 1024 * 1024) {
    showToast('Datei zu groß', 'Maximal 50 MB erlaubt.');
    e.target.value = '';
    return;
  }
  // Beim Speichern hochladen (für neue UND bestehende Projekte – so gehen
  // gleichzeitige Änderungen an anderen Feldern nicht verloren).
  pendingScriptFile = file;
  const labelEl = e.target.closest('.file-upload');
  if (labelEl) {
    labelEl.style.borderColor = 'var(--accent)';
    labelEl.style.background = 'var(--accent-soft)';
    const d = labelEl.querySelector('div');
    if (d) d.textContent = '✓ ' + file.name + ' bereit zum Speichern';
  }
}

// Lädt die ausgewählte Skript-PDF zum Projekt hoch (persistiert in project_files)
// und räumt ältere Skript-Dateien auf. Wird aus saveProject nach dem DB-Save aufgerufen.
async function uploadScriptForProject(projectId, file) {
  try {
    const fd = new FormData();
    fd.append('file', file);
    const res = await fetch(
      `${API_BASE}/upload.php?scope=project&kind=script&id=${encodeURIComponent(projectId)}`,
      { method: 'POST', credentials: 'same-origin', headers: { 'X-CSRF-Token': CSRF }, body: fd }
    );
    const json = await res.json();
    if (!res.ok || !json.ok) throw new Error(json.error || 'Skript-Upload fehlgeschlagen');
    const p = store.projects.find(x => x.id === projectId);
    if (p) {
      const old = Array.isArray(p.files) ? p.files : [];
      const oldScripts = old.filter(f => f && f.kind === 'script');
      const nonScripts = old.filter(f => !f || f.kind !== 'script');
      p.files = [{
        id: json.data.id, kind: 'script', filename: json.data.filename,
        mime: json.data.mime, size: json.data.size, path: json.data.path
      }, ...nonScripts];
      // Vorherige Skript-PDFs serverseitig entfernen (best effort)
      oldScripts.forEach(f => deleteProjectFileRequest(f.id).catch(() => {}));
    }
    renderPage();
  } catch (err) {
    showToast('Skript konnte nicht gespeichert werden', err.message);
  }
}

function deleteProjectFileRequest(fileId) {
  return fetch(
    `${API_BASE}/upload.php?scope=project&id=${encodeURIComponent(fileId)}`,
    { method: 'DELETE', credentials: 'same-origin', headers: { 'X-CSRF-Token': CSRF } }
  ).then(r => r.json());
}

async function removeScriptFile(projectId, fileId) {
  const ok = await appConfirm('Die hochgeladene Skript-PDF wird entfernt.', {
    title: 'Skript entfernen?', okLabel: 'Entfernen', danger: true
  });
  if (!ok) return;
  try {
    const json = await deleteProjectFileRequest(fileId);
    if (!json.ok) throw new Error(json.error || 'Löschen fehlgeschlagen');
    const p = store.projects.find(x => x.id === projectId);
    if (p && Array.isArray(p.files)) p.files = p.files.filter(f => String(f.id) !== String(fileId));
    showToast('Skript entfernt', '');
    openProjectModal(projectId);
  } catch (err) {
    showToast('Fehler beim Entfernen', err.message);
  }
}

async function updateStatus(projectId, newStatus) {
  const idx = store.projects.findIndex(p => p.id === projectId);
  if (idx < 0) return;
  const prevStatus = store.projects[idx].status;
  lockProjectStatus(projectId, newStatus);
  store.projects[idx].status = newStatus;

  closeModal();
  renderPage();
  try {
    const res = await fetch(
      `${API_BASE}/projects.php?id=${encodeURIComponent(projectId)}`,
      {
        method: 'PUT',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': CSRF },
        body: JSON.stringify({ status: newStatus })
      }
    );
    const json = await res.json();
    if (!res.ok || !json.ok) throw new Error(json.error || 'Speichern fehlgeschlagen');
    if (json.data) {
      const i = store.projects.findIndex(p => p.id === projectId);
      if (i >= 0) store.projects[i] = { ...store.projects[i], ...json.data };
    }
    unlockProjectStatus(projectId);
    renderPage();
  } catch (err) {
    unlockProjectStatus(projectId);
    store.projects[idx].status = prevStatus;
    renderPage();
    showToast('Fehler beim Speichern', err.message);
  }
}

async function approveProject(projectId) {
  const idx = store.projects.findIndex(p => p.id === projectId);
  if (idx < 0) return;
  const session = getCurrentUser();
  if (!canActOnProject(store.projects[idx], session, 'approve')) {
    appAlert('Du hast keine Berechtigung dafür.', { title: 'Nicht erlaubt' });
    return;
  }
  const p = store.projects[idx];
  const prevStatus = p.status;
  const prevApprovedAt = p.approvedAt;
  lockProjectStatus(projectId, STATUS.FREIGEGEBEN);
  p.status = STATUS.FREIGEGEBEN;
  p.approvedAt = new Date().toISOString();
  logActivity('project', p.id, 'approve', { title: p.title });

  // Cutter benachrichtigen
  if (p.cutterId) {
    notifyUser(p.cutterId, 'Video freigegeben ✓', `„${p.title}" wurde freigegeben.`);
  }
  closeModal();
  renderPage();
  try {
    const res = await fetch(
      `${API_BASE}/projects.php?id=${encodeURIComponent(projectId)}`,
      {
        method: 'PUT',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': CSRF },
        body: JSON.stringify({ status: 'freigegeben' })
      }
    );
    const json = await res.json();
    if (!res.ok || !json.ok) throw new Error(json.error || 'Speichern fehlgeschlagen');
    if (json.data) {
      const i = store.projects.findIndex(x => x.id === projectId);
      if (i >= 0) store.projects[i] = { ...store.projects[i], ...json.data };
    }
    unlockProjectStatus(projectId);
    renderPage();
  } catch (err) {
    unlockProjectStatus(projectId);
    p.status = prevStatus;
    p.approvedAt = prevApprovedAt;
    renderPage();
    showToast('Fehler beim Speichern', err.message);
  }
}

function notifyUser(userId, title, body) {
  try {
    if ('Notification' in window && Notification.permission === 'granted') {
      new Notification(title, { body, tag: 'project-' + Date.now() });
    }
  } catch {}
  // Falls die Person aktuell selbst eingeloggt ist, In-App-Toast
  const session = getCurrentUser();
  if (session?.type === 'staff' && session.user.id === userId) {
    showToast(title, body);
  }
}

async function loadAndRenderProjectComments(projectId, canDelete, containerId = 'proj-comments-box') {

  const ok = await appConfirm('Kommentar wirklich löschen?', { title: 'Löschen', okLabel: 'Löschen', danger: true });

  try {
    const res = await fetch(`${API_BASE}/project_comments.php?id=${encodeURIComponent(commentId)}`, {

        </div>

    </div>
  `;

}

async function toggleCorrectionRecording() {
  const btn = $('#rec-btn');
  const status = $('#rec-status');
  if (correctionRecorder && correctionRecorder.state === 'recording') {
    correctionRecorder.stop();
    return;
  }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    alert('Audio-Aufnahme wird in diesem Browser nicht unterstützt.');
    return;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    correctionAudioChunks = [];
    correctionRecorder = new MediaRecorder(stream);
    correctionRecorder.ondataavailable = e => correctionAudioChunks.push(e.data);
    correctionRecorder.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      const mime = correctionRecorder.mimeType || 'audio/webm';
      correctionAudioBlob = new Blob(correctionAudioChunks, { type: mime });
      const reader = new FileReader();
      reader.onload = () => {
        correctionAudioUrl = reader.result;
        const prev = $('#rec-preview');
        if (prev) prev.innerHTML = `<audio controls src="${correctionAudioUrl}" style="width:100%;"></audio>`;
      };
      reader.readAsDataURL(correctionAudioBlob);
      btn.textContent = '🎙️ Aufnahme erneut starten';
      btn.classList.remove('btn-danger');
      btn.classList.add('btn-secondary');
      status.textContent = '✓ Aufnahme bereit';
    };
    correctionRecorder.start();
    btn.textContent = '⏹ Stopp';
    btn.classList.remove('btn-secondary');
    btn.classList.add('btn-danger');
    status.textContent = '● Nimmt auf …';
  } catch (e) {
    alert('Mikrofon-Zugriff verweigert: ' + e.message);
  }
}

async function submitCorrection(projectId) {
  const text = $('#correction-text')?.value.trim() || '';
  if (!text && !correctionAudioBlob) {
    alert('Bitte eine Textnotiz schreiben oder eine Sprachnachricht aufnehmen.');
    return;
  }
  const idx = store.projects.findIndex(p => p.id === projectId);
  if (idx < 0) return;

  // 1. Kommentar in DB speichern
  let commentId = null;
  try {
    const res = await fetch(`${API_BASE}/project_comments.php?projectId=${encodeURIComponent(projectId)}`, {
      method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': CSRF },
      body: JSON.stringify({ text })
    });
    const json = await res.json();
    if (!res.ok || !json.ok) throw new Error(json.error || 'Fehler beim Speichern');
    commentId = json.data?.id;
  } catch (e) {
    showToast('Fehler', e.message);
    return;
  }

  // 2. Sprachaufnahme hochladen (falls vorhanden)
  if (correctionAudioBlob && commentId) {
    try {
      const ext = correctionAudioBlob.type.includes('ogg') ? 'ogg' : 'webm';
      const fd = new FormData();
      fd.append('file', correctionAudioBlob, `voice.${ext}`);
      await fetch(`${API_BASE}/upload.php?scope=voice_project&id=${encodeURIComponent(commentId)}`, {
        method: 'POST', credentials: 'same-origin',
        headers: { 'X-CSRF-Token': CSRF }, body: fd
      });
    } catch (_) {}
  }

  // 3. Status auf Korrektur setzen
  const prevStatus = store.projects[idx].status;
  lockProjectStatus(projectId, STATUS.KORREKTUR);
  store.projects[idx].status = STATUS.KORREKTUR;
  logActivity('project', store.projects[idx].id, 'correctionRequested', { title: store.projects[idx].title, text: (text || '').slice(0, 200) });

  const p = store.projects[idx];
  if (p.cutterId) notifyUser(p.cutterId, 'Korrektur angefragt', `„${p.title}" muss überarbeitet werden.`);

  closeModal();
  renderPage();

  fetch(`${API_BASE}/projects.php?id=${encodeURIComponent(projectId)}`, {
    method: 'PUT', credentials: 'same-origin',
    headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': CSRF },
    body: JSON.stringify({ status: STATUS.KORREKTUR })
  }).then(r => r.json()).then(json => {
    if (!json.ok) throw new Error(json.error || 'Fehler');
    if (json.data) store.projects[idx] = { ...store.projects[idx], ...json.data };
    unlockProjectStatus(projectId);
    renderPage();
  }).catch(err => {
    unlockProjectStatus(projectId);
    store.projects[idx].status = prevStatus;
    renderPage();
    showToast('Speichern fehlgeschlagen', err.message);
  });
}

async function deleteProject(projectId) {
  const p = store.projects.find(x => x.id === projectId);
  if (!p) return;
  const session = getCurrentUser();
  if (!canActOnProject(p, session, 'delete')) {
    appAlert('Du hast keine Berechtigung dafür.', { title: 'Nicht erlaubt' });
    return;
  }
  const ok = await appConfirm('Diese Aktion kann nicht rückgängig gemacht werden.', {
    title: 'Projekt wirklich löschen?',
    okLabel: 'Löschen',
    danger: true
  });
  if (!ok) return;
  // Snapshot für Rollback
  const removed = store.projects.find(x => x.id === projectId);
  trackDeletion('projects', projectId);
  store.projects = store.projects.filter(p => p.id !== projectId);

  closeModal();
  renderPage();
  // Direkt in DB löschen
  try {
    const res = await fetch(
      `${API_BASE}/projects.php?id=${encodeURIComponent(projectId)}`,
      { method: 'DELETE', credentials: 'same-origin', headers: { 'X-CSRF-Token': CSRF } }
    );
    const json = await res.json();
    if (!res.ok || !json.ok) throw new Error(json.error || 'Löschen fehlgeschlagen');
  } catch (err) {
    // Rollback
    if (removed) store.projects.push(removed);
    await pullAllFromCloud().then(() => renderPage());
    showToast('Fehler beim Speichern', err.message);
  }
}

// Auto-Resize für Textareas mit Klasse "autogrow": wächst mit dem Inhalt, kein interner
// Scrollbalken. Moderne Browser erledigen das via CSS field-sizing:content; für ältere
// Safari/Chrome greift dieser JS-Fallback (Höhe = scrollHeight).
const SUPPORTS_FIELD_SIZING = !!(window.CSS && CSS.supports && CSS.supports('field-sizing', 'content'));
function autoGrowTextarea(el) {
  if (!el || SUPPORTS_FIELD_SIZING) return;
  el.style.height = 'auto';
  el.style.height = el.scrollHeight + 'px';
}
function initAutogrowTextareas() {
  if (SUPPORTS_FIELD_SIZING) return;
  document.querySelectorAll('#modal-container textarea.autogrow').forEach(autoGrowTextarea);
}
document.addEventListener('input', e => {
  if (e.target && e.target.matches && e.target.matches('textarea.autogrow')) autoGrowTextarea(e.target);
});

function closeModal() {
  $('#modal-container').innerHTML = '';
  // Pending File-Uploads zurücksetzen damit sie nicht im nächsten Modal versehentlich landen
  pendingScriptFile = null;
  pendingContractFile = null;
  pendingUserAvatar = null;
  clearAvatarFlag = false;
}

/* ----- Apple-Style Bestätigungs-/Hinweis-Dialoge ----- */
function appConfirm(message, opts = {}) {
  return new Promise(resolve => {
    const id = 'cdlg_' + Math.random().toString(36).slice(2,9);
    const wrap = document.createElement('div');
    wrap.innerHTML = `
      <div class="modal-backdrop">
        <div class="modal" style="max-width: 400px;">
          <div class="modal-body" style="padding: 30px 26px 14px; text-align: center;">
            ${opts.title ? `<div style="font-size: 17px; font-weight: 700; color: var(--text-1); margin-bottom: 8px; letter-spacing: -0.2px;">${escape(opts.title)}</div>` : ''}
            <div style="font-size: 13.5px; color: var(--text-2); line-height: 1.55; white-space: pre-wrap;">${escape(message)}</div>
          </div>
          <div class="modal-footer" style="justify-content: center; gap: 10px;">
            <button type="button" class="btn btn-secondary" data-act="cancel">${escape(opts.cancelLabel || 'Abbrechen')}</button>
            <button type="button" class="btn ${opts.danger ? 'btn-danger' : 'btn-primary'}" data-act="ok">${escape(opts.okLabel || 'Bestätigen')}</button>
          </div>
        </div>
      </div>
    `;
    const backdrop = wrap.firstElementChild;
    document.body.appendChild(backdrop);
    const done = (v) => { backdrop.remove(); resolve(v); };
    backdrop.addEventListener('click', e => { if (e.target === backdrop) done(false); });
    backdrop.querySelector('[data-act="cancel"]').onclick = () => done(false);
    backdrop.querySelector('[data-act="ok"]').onclick = () => done(true);
    setTimeout(() => backdrop.querySelector('[data-act="ok"]').focus(), 80);
  });
}

function appAlert(message, opts = {}) {
  return new Promise(resolve => {
    const wrap = document.createElement('div');
    wrap.innerHTML = `
      <div class="modal-backdrop">
        <div class="modal" style="max-width: 400px;">
          <div class="modal-body" style="padding: 30px 26px 14px; text-align: center;">
            ${opts.title ? `<div style="font-size: 17px; font-weight: 700; color: var(--text-1); margin-bottom: 8px; letter-spacing: -0.2px;">${escape(opts.title)}</div>` : ''}
            <div style="font-size: 13.5px; color: var(--text-2); line-height: 1.55; white-space: pre-wrap;">${escape(message)}</div>
          </div>
          <div class="modal-footer" style="justify-content: center;">
            <button type="button" class="btn btn-primary" data-act="ok">${escape(opts.okLabel || 'OK')}</button>
          </div>
        </div>
      </div>
    `;
    const backdrop = wrap.firstElementChild;
    document.body.appendChild(backdrop);
    const done = () => { backdrop.remove(); resolve(); };
    backdrop.addEventListener('click', e => { if (e.target === backdrop) done(); });
    backdrop.querySelector('[data-act="ok"]').onclick = done;
    setTimeout(() => backdrop.querySelector('[data-act="ok"]').focus(), 80);
  });
}

function renderCustomers(session) {
  $('#page-title').textContent = 'Kunden';
  $('#page-subtitle').textContent = 'Übersicht aller Agenturkunden';

  const user = session.user;
  const canCreate = hasRole(user, ROLES.ADMIN, ROLES.MANAGER);
  $('#topbar-actions').innerHTML = canCreate
    ? `<button class="btn btn-primary" onclick="openCustomerModal()">+ Neuer Kunde</button>` : '';

  let customers = store.customers;
  if (hasRole(user, ROLES.MANAGER) && !hasRole(user, ROLES.ADMIN)) {
    customers = customers.filter(c => c.managerId === user.id);
  }

  // Filter
  const cf = JSON.parse(localStorage.getItem(_filterKey('cust_filters')) || '{}');
  const cSearch = (cf.q || '').toLowerCase();
  const cStatus = cf.status || 'all';
  if (cSearch || cStatus !== 'all') {
    customers = customers.filter(c => {
      if (cStatus !== 'all' && customerStatus(c) !== cStatus) return false;
      if (!cSearch) return true;
      const mgr = store.users.find(u => u.id === c.managerId);
      const hay = (c.name + ' ' + c.customerNumber + ' ' + (c.package || '') + ' ' + (mgr?.name || '') + ' ' + (c.industry || '')).toLowerCase();
      return hay.includes(cSearch);

                    <div class="progress-bar" style="flex:1; max-width:90px; margin-top:0;">
                      <div class="progress-fill" style="width:${pct}%;"></div>
                    </div>
                    <span class="text-sm" style="color:${pct === 100 ? 'var(--accent)' : 'var(--text-2)'}; font-weight:600;">${done}/${total}</span>
                  </div>
                </td>
                <td data-label="Paket">${escape(c.package || '–')}</td>
                <td data-label="Projekte">${projectCount}</td>
              </tr>
            `;
          }).join('')}
        </tbody>
      </table>
    </div>
  `;
}

function switchTab(e, tabId) {
  const modal = e.target.closest('.modal');
  modal.querySelectorAll('.modal-tab').forEach(t => t.classList.remove('active'));
  modal.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  e.target.classList.add('active');
  modal.querySelector('#' + tabId).classList.add('active');
}

async function uploadCustomerFile(input, customerId, kind) {
  const file = input.files[0];
  if (!file) return;
  const label = input.closest('label');
  if (label) label.style.opacity = '0.5';
  try {
    const formData = new FormData();
    formData.append('file', file);
    const res = await fetch(
      `${API_BASE}/upload.php?scope=customer&kind=${encodeURIComponent(kind)}&id=${encodeURIComponent(customerId)}`,
      { method: 'POST', credentials: 'same-origin', headers: { 'X-CSRF-Token': CSRF }, body: formData }
    );
    const json = await res.json();
    if (!json.ok && !json.success) throw new Error(json.error || 'Upload fehlgeschlagen');
    const f = json.data;
    if (!store.customerFiles) store.customerFiles = [];
    store.customerFiles.unshift({
      id: f.id, customerId, kind,
      filename: f.filename, mime: f.mime, size: f.size,
      uploadedAt: new Date().toISOString(),
    });
    showToast(file.name + ' hochgeladen', '');
    openCustomerModal(customerId);
  } catch (e) {
    showToast('Fehler', e.message);
  } finally {
    input.value = '';
    if (label) label.style.opacity = '1';
  }
}

async function deleteCustomerFile(fileId, customerId) {
  const ok = await appConfirm('Datei unwiderruflich löschen?', { title: 'Datei löschen', okLabel: 'Löschen', danger: true });
  if (!ok) return;
  try {
    const res = await fetch(
      `${API_BASE}/customer_files.php?id=${fileId}`,
      { method: 'DELETE', credentials: 'same-origin', headers: { 'X-CSRF-Token': CSRF } }
    );
    const json = await res.json();
    if (!json.ok && !json.success) throw new Error(json.error || 'Löschen fehlgeschlagen');
    store.customerFiles = (store.customerFiles || []).filter(f => f.id !== fileId);
    showToast('Datei gelöscht', '');
    openCustomerModal(customerId);
  } catch (e) {
    showToast('Fehler', e.message);
  }
}

function generateNextCustomerNumber() {
  const existing = store.customers.map(c => parseInt(c.customerNumber, 10)).filter(n => !isNaN(n));
  const next = existing.length ? Math.max(...existing) + 1 : 1001;
  return String(next);
}

async function saveCustomer(e, customerId) {
  e.preventDefault();
  const session = getCurrentUser();
  if (!session || session.type !== 'staff' || !hasRole(session.user, ROLES.ADMIN, ROLES.MANAGER)) {
    appAlert('Nur Admin/Manager dürfen Kunden anlegen/ändern.', { title: 'Nicht erlaubt' });
    return;
  }
  // Manager darf nur eigene Kunden bearbeiten
  if (customerId && !hasRole(session.user, ROLES.ADMIN)) {
    const existing = store.customers.find(c => c.id === customerId);
    if (existing && existing.managerId && existing.managerId !== session.user.id) {
      appAlert('Du kannst nur deine eigenen Kunden bearbeiten.', { title: 'Nicht erlaubt' });
      return;
    }
  }
  const formData = new FormData(e.target);
  const data = Object.fromEntries(formData);

  // Check unique customer number
  const dup = store.customers.find(c => c.customerNumber === data.customerNumber && c.id !== customerId);
  if (dup) {
    alert('Diese Kundennummer ist bereits vergeben.');
    return;
  }

  // PIN-Handling: newPin nur dann übernehmen wenn nicht leer (sonst alten PIN behalten)
  const newPin = (data.newPin || '').trim();
  delete data.newPin;
  let pinHashUpdate = null;
  if (newPin) {
    pinHashUpdate = await hashPassword(newPin);
  }

  // Build onboarding checklist from form (HTML checkboxes set value="on" when checked, undefined when not)
  const form = e.target;
  const checklist = {};
  ONBOARDING_CHECKLIST.forEach(item => {
    const cb = form.querySelector(`[name="checklist_${item.key}"]`);
    checklist[item.key] = !!(cb && cb.checked);
    delete data['checklist_' + item.key];
  });

  // Handle "billing same as address" checkbox
  data.billingSameAsAddress = !!data.billingSameAsAddress;

  // Posting-Wochentage aus Checkboxen sammeln (wd_0 … wd_6)
  const selectedWeekdays = [];
  for (let _i = 0; _i <= 6; _i++) {
    if (e.target.querySelector(`[name="wd_${_i}"]`)?.checked) selectedWeekdays.push(_i);
    delete data['wd_' + _i];
  }
  data.postingWeekdays = selectedWeekdays.join(',') || null;
  // autoPostingRhythm ist eine Checkbox → "on" oder undefined
  data.autoPostingRhythm = !!data.autoPostingRhythm;

  // Manual status override (paused only)
  const manualStatus = data.manualStatus || '';
  delete data.manualStatus;
  data.status = manualStatus === 'paused' ? 'paused' : null;

  // Snapshot für Rollback
  let prevEntry = null;
  let insertedId = null;

  if (customerId) {
    const idx = store.customers.findIndex(c => c.id === customerId);
    if (idx >= 0) {
      prevEntry = { ...store.customers[idx] };
      store.customers[idx] = { ...store.customers[idx], ...data, checklist };
      if (pinHashUpdate) store.customers[idx].pinHash = pinHashUpdate;
    }
  } else {
    insertedId = uid('c');
    store.customers.push({
      id: insertedId,
      ...data,
      checklist,
      ...(pinHashUpdate ? { pinHash: pinHashUpdate } : {}),
      createdAt: new Date().toISOString()
    });
  }
  // Auto-refresh live ICS file if active

  closeModal();
  renderPage();

  // Direkt in DB schreiben
  const apiPayload = {
    name: data.name,
    customerNumber: data.customerNumber,
    managerId: data.managerId || null,
    email: data.email || null,
    phone: data.phone || null,
    contactName: data.contactName || null,
    socialInstagram: data.socialInstagram || null,
    socialTiktok: data.socialTiktok || null,
    notes: data.notes || null,
    addressStreet: data.addressStreet || null,
    addressZip: data.addressZip || null,
    addressCity: data.addressCity || null,
    billingSameAsAddress: data.billingSameAsAddress ? 1 : 0,
    billingStreet: data.billingStreet || null,
    billingZip: data.billingZip || null,
    billingCity: data.billingCity || null,
    vatId: data.vatId || null,
    billingEmail: data.billingEmail || null,
    contractStart: data.contractStart || null,
    package: data.package || null,
    monthlyRate: data.monthlyRate || null,
    videosPerMonth: data.videosPerMonth || null,
    defaultCutterId: data.defaultCutterId || null,
    postingWeekdays: data.postingWeekdays || null,
    videosPerWeek: parseInt(data.videosPerWeek) || 2,
    autoPostingRhythm: data.autoPostingRhythm ? 1 : 0,
    status: data.status || null,
    checklist,
    ...(pinHashUpdate ? { pinHash: pinHashUpdate } : {})
  };
  if (!customerId) apiPayload.id = insertedId;

  try {
    const url = customerId
      ? `${API_BASE}/customers.php?id=${encodeURIComponent(customerId)}`
      : `${API_BASE}/customers.php`;
    const method = customerId ? 'PUT' : 'POST';
    const res = await fetch(url, {
      method,
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': CSRF },
      body: JSON.stringify(apiPayload)
    });
    const json = await res.json();
    if (!res.ok || !json.ok) throw new Error(json.error || 'Speichern fehlgeschlagen');
    if (json.data) {
      const targetId = customerId || insertedId;
      const i = store.customers.findIndex(c => c.id === targetId);
      if (i >= 0) store.customers[i] = { ...store.customers[i], ...json.data };
    }
  } catch (err) {
    // Rollback
    if (customerId && prevEntry) {
      const i = store.customers.findIndex(c => c.id === customerId);
      if (i >= 0) store.customers[i] = prevEntry;
    } else if (insertedId) {
      store.customers = store.customers.filter(c => c.id !== insertedId);
    }
    renderPage();
    showToast('Fehler beim Speichern', err.message);
  }
}

async function deleteCustomer(customerId) {
  const session = getCurrentUser();
  if (!session || session.type !== 'staff' || !hasRole(session.user, ROLES.ADMIN)) {
    appAlert('Nur Admins können Kunden löschen.', { title: 'Keine Berechtigung' });
    return;
  }
  const hasProjects = store.projects.some(p => p.customerId === customerId);
  const msg = hasProjects
    ? 'Dieser Kunde hat zugewiesene Projekte. Wirklich löschen? Die Projekte bleiben erhalten, sind aber dann ohne Kunden.'
    : 'Diese Aktion kann nicht rückgängig gemacht werden.';
  const ok = await appConfirm(msg, { title: 'Kunde löschen?', okLabel: 'Löschen', danger: true });
  if (!ok) return;
  const removed = store.customers.find(c => c.id === customerId);
  trackDeletion('customers', customerId);
  store.customers = store.customers.filter(c => c.id !== customerId);
  closeModal();
  renderPage();
  // Direkt in DB löschen
  try {
    const res = await fetch(
      `${API_BASE}/customers.php?id=${encodeURIComponent(customerId)}`,
      { method: 'DELETE', credentials: 'same-origin', headers: { 'X-CSRF-Token': CSRF } }
    );
    const json = await res.json();
    if (!res.ok || !json.ok) throw new Error(json.error || 'Löschen fehlgeschlagen');
  } catch (err) {
    // Rollback
    if (removed) store.customers.push(removed);
    await pullAllFromCloud().then(() => renderPage());
    showToast('Fehler beim Speichern', err.message);
  }
}

let calendarDate = new Date();

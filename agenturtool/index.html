<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes" />
<meta name="theme-color" content="#0a0c10" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Dodidis Media" />
<title>Dodidis Media – Management</title>
<style>
  /* =========================================
     DESIGN TOKENS – Modern Dark Theme
     ========================================= */
  :root {
    /* Dark theme with bright green accent */
    --bg-0: #0a0b0f;
    --bg-1: #0d0f14;
    --bg-2: #141720;
    --bg-3: #1b1e2a;
    --bg-hover: #20243a;
    --border: rgba(255, 255, 255, 0.07);
    --border-strong: rgba(255, 255, 255, 0.13);
    --text-1: #f0f2f5;
    --text-2: #9aa0b2;
    --text-3: #5e6577;
    --accent: #00C896;
    --accent-hover: #00d9a8;
    --accent-soft: rgba(0, 200, 150, 0.12);
    --accent-glow: rgba(0, 200, 150, 0.28);
    --success: #30d158;
    --warning: #ff9f0a;
    --danger: #ff453a;
    --info: #64d2ff;
    --apple-blue: #0a84ff;
    --apple-red: #ff453a;
    --radius: 14px;
    --radius-sm: 8px;
    --radius-xs: 5px;
    --shadow: 0 20px 60px -20px rgba(0, 0, 0, 0.7);
    --shadow-sm: 0 4px 16px -4px rgba(0, 0, 0, 0.4);
    --blur: saturate(180%) blur(20px);
    --transition: all 0.18s cubic-bezier(0.4, 0, 0.2, 1);
    /* Safe-Area-Insets fuer Notch-Geraete (iPhone X+) */
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-left: env(safe-area-inset-left, 0px);
    --safe-right: env(safe-area-inset-right, 0px);
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }
  button, a, .nav-item, .row-clickable, .modal-tab, .checkbox-row,
  .cutter-card, .deadline-item, .stat, .todo-item, .shoot-item,
  .view-toggle button, .login-tab { touch-action: manipulation; }

  html, body {
    height: 100%;
    background: var(--bg-0);
    color: var(--text-1);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", "Inter", system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    letter-spacing: -0.01em;
    overflow-x: hidden;
    overscroll-behavior: none;
  }

  /* =========================================
     LAYOUT
     ========================================= */
  .app {
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  .sidebar {
    width: 240px;
    background: #0a0c10;
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 20px 12px 20px;
    flex-shrink: 0;
  }

  .sidebar-header {
    padding: 4px 12px 28px;
  }

  .sidebar-header {
    padding: 8px 12px 24px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .logo {
    width: 34px;
    height: 34px;
    background: linear-gradient(135deg, #00C896, #007a5c);
    border-radius: 9px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 4px 14px -2px var(--accent-glow);
  }
  .logo img {
    width: 22px;
    height: 22px;
    filter: brightness(0) invert(1);
    object-fit: contain;
  }

  .logo-text {
    font-weight: 600;
    font-size: 15px;
    letter-spacing: -0.2px;
  }

  .nav {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .nav-section-title {
    padding: 14px 12px 6px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--text-3);
    font-weight: 600;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 9px 12px;
    border-radius: 9px;
    color: var(--text-2);
    cursor: pointer;
    transition: var(--transition);
    font-size: 13.5px;
    font-weight: 500;
    border: none;
    background: transparent;
    width: 100%;
    text-align: left;
  }

  .nav-item:hover {
    background: var(--bg-2);
    color: var(--text-1);
  }

  .nav-item.active {
    background: rgba(0, 200, 150, 0.12);
    color: var(--accent);
    font-weight: 600;
    box-shadow: inset 3px 0 0 var(--accent);
  }
  .nav-item .icon {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
    opacity: 0.7;
    transition: opacity 0.15s;
  }
  .nav-item.active .icon,
  .nav-item:hover .icon { opacity: 1; }

  .nav-badge {
    margin-left: auto;
    background: var(--accent);
    color: #002a1e;
    font-size: 10.5px;
    font-weight: 700;
    padding: 1px 7px;
    border-radius: 999px;
    min-width: 18px;
    text-align: center;
  }

  /* Todos */
  .todo-list { padding: 6px 0; }
  .todo-item {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    transition: var(--transition);
  }
  .todo-item:last-child { border-bottom: none; }
  .todo-item:hover { background: var(--bg-2); }
  .todo-item.done { opacity: 0.6; }
  .todo-item.done .todo-title { text-decoration: line-through; color: var(--text-3); }
  .todo-check {
    appearance: none;
    -webkit-appearance: none;
    width: 22px;
    height: 22px;
    border: 1.5px solid var(--border-strong);
    border-radius: 6px;
    background: var(--bg-3);
    cursor: pointer;
    position: relative;
    flex-shrink: 0;
    margin-top: 1px;
    transition: var(--transition);
  }
  .todo-check:checked {
    background: var(--accent);
    border-color: var(--accent);
  }
  .todo-check:checked::after {
    content: "";
    position: absolute;
    left: 6px;
    top: 2px;
    width: 6px;
    height: 11px;
    border: solid #042f2e;
    border-width: 0 2.5px 2.5px 0;
    transform: rotate(45deg);
  }
  .todo-body { flex: 1; min-width: 0; }
  .todo-title {
    font-size: 14px;
    font-weight: 500;
    color: var(--text-1);
    margin-bottom: 4px;
  }
  .todo-desc {
    font-size: 12.5px;
    color: var(--text-2);
    line-height: 1.4;
    margin-bottom: 6px;
  }
  .todo-meta {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
    font-size: 11.5px;
    color: var(--text-3);
  }
  .todo-meta-chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 8px;
    background: var(--bg-3);
    border-radius: 99px;
    border: 1px solid var(--border);
  }
  .todo-due-overdue {
    color: var(--apple-red);
    font-weight: 600;
  }
  .todo-actions {
    opacity: 0;
    transition: var(--transition);
    flex-shrink: 0;
  }
  .todo-item:hover .todo-actions { opacity: 1; }

  .todo-avatars {
    display: inline-flex;
    align-items: center;
  }
  .todo-avatars .avatar-circle:not(:first-child) { margin-left: -6px; }

  /* Toast Notification */
  .toast {
    position: fixed;
    top: 24px;
    right: 24px;
    background: var(--bg-2);
    border: 1px solid var(--accent);
    border-left-width: 4px;
    border-radius: 12px;
    padding: 14px 18px;
    max-width: 360px;
    box-shadow: 0 10px 40px -10px rgba(0,0,0,0.6);
    z-index: 9999;
    animation: toast-in 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .toast-title { font-size: 13.5px; font-weight: 600; color: var(--text-1); margin-bottom: 4px; }
  .toast-body { font-size: 12.5px; color: var(--text-2); line-height: 1.4; }

  /* Cutter-Modal-Detailansicht (read-only Cockpit) */
  .cutter-detail-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin: 16px 0;
  }
  @media (max-width: 520px) {
    .cutter-detail-grid { grid-template-columns: 1fr; }
  }
  .cutter-detail-row {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
  }
  .cutter-detail-label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-3);
    margin-bottom: 4px;
  }
  .cutter-detail-value {
    font-size: 13.5px;
    color: var(--text-1);
    font-weight: 500;
  }
  .cutter-detail-text {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 13px;
    line-height: 1.55;
    color: var(--text-2);
    white-space: pre-wrap;
    max-height: 200px;
    overflow-y: auto;
  }
  .cutter-status-bar {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
    margin-bottom: 16px;
  }
  .cutter-status-bar .status-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .cutter-status-bar .status-row:last-child { margin-bottom: 0; }
  .cutter-status-bar .status-label {
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-3);
  }
  .cutter-action-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .cutter-action-row .btn { padding: 10px 18px; font-size: 13.5px; }

  /* Cutter-Projektansicht – aufgeräumte Cards */
  .cutter-section { margin-bottom: 28px; }
  .cutter-section-title {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    font-weight: 700;
    color: var(--text-1);
    text-transform: uppercase;
    letter-spacing: 0.4px;
    margin-bottom: 12px;
    padding-left: 2px;
  }
  .cutter-section-icon {
    width: 24px;
    height: 24px;
    border-radius: 7px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
  }
  .cutter-card {
    background: var(--bg-1);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 20px;
    margin-bottom: 10px;
    display: flex;
    gap: 16px;
    align-items: center;
    cursor: pointer;
    transition: var(--transition);
    position: relative;
    overflow: hidden;
  }
  .cutter-card::before {
    content: '';
    position: absolute;
    top: 0; bottom: 0; left: 0;
    width: 4px;
    border-radius: 0;
  }
  .cutter-card:hover {
    border-color: var(--border-strong);
    transform: translateY(-1px);
    box-shadow: 0 6px 24px -6px rgba(0,0,0,0.5);
  }
  .cutter-card.correction::before { background: #ff453a; }
  .cutter-card.correction { background: linear-gradient(90deg, rgba(255,69,58,0.05) 0%, var(--bg-1) 40%); }
  .cutter-card.ready::before { background: #2dd4bf; }
  .cutter-card.ready { background: linear-gradient(90deg, rgba(45,212,191,0.05) 0%, var(--bg-1) 40%); }
  .cutter-card.progress::before { background: #fbbf24; }
  .cutter-card.progress { background: linear-gradient(90deg, rgba(251,191,36,0.05) 0%, var(--bg-1) 40%); }
  .cutter-card.wait::before { background: #64d2ff; }
  .cutter-card.wait { background: linear-gradient(90deg, rgba(100,210,255,0.04) 0%, var(--bg-1) 40%); opacity: 0.9; }
  .cutter-card.done::before { background: #6b7280; }
  .cutter-card.done { opacity: 0.65; }

  .cutter-card-main { flex: 1; min-width: 0; }
  .cutter-card-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--text-1);
    margin-bottom: 6px;
  }
  .cutter-card-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    font-size: 12.5px;
    color: var(--text-2);
  }
  .cutter-card-meta span { display: inline-flex; align-items: center; gap: 4px; }
  .cutter-card-overdue { color: var(--apple-red); font-weight: 600; }
  .cutter-card-correction { color: #ff453a; font-weight: 600; }
  .cutter-card-action { flex-shrink: 0; }

  /* Shoot-Day Checklist (Videograf) */
  .shoot-day-card {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 14px;
    overflow: hidden;
  }
  .shoot-day-header {
    padding: 12px 18px;
    background: rgba(167,139,250,0.08);
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    font-weight: 600;
    color: var(--text-1);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .shoot-day-header .date { color: var(--text-1); }
  .shoot-day-header .count { font-size: 12px; color: var(--text-3); font-weight: 500; }

  .shoot-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    transition: var(--transition);
  }
  .shoot-item:last-child { border-bottom: none; }
  .shoot-item:hover { background: var(--bg-3); }
  .shoot-item.shot {
    background: rgba(45,212,191,0.04);
  }
  .shoot-item.shot .shoot-item-title { color: var(--text-2); text-decoration: line-through; }

  .shoot-item-body { flex: 1; min-width: 0; }
  .shoot-item-title { font-size: 14px; font-weight: 600; color: var(--text-1); }
  .shoot-item-meta { font-size: 12px; color: var(--text-3); margin-top: 3px; }

  /* Cutter Queue */
  .cut-queue-section { margin-bottom: 14px; }
  .cut-queue-section-title {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-3);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin: 0 0 8px;
    padding: 0 4px;
  }
  .cut-queue-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 18px;
    background: var(--bg-1);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 8px;
    transition: var(--transition);
    cursor: pointer;
  }
  .cut-queue-item:hover { border-color: var(--border-strong); transform: translateY(-1px); }
  .cut-queue-item.waiting {
    opacity: 0.5;
    cursor: not-allowed;
    background: var(--bg-0);
  }
  .cut-queue-item.waiting:hover { transform: none; }
  .cut-queue-item-title { font-size: 13.5px; font-weight: 600; }
  .cut-queue-item-meta { font-size: 12px; color: var(--text-3); margin-top: 2px; }
  @keyframes toast-in {
    from { opacity: 0; transform: translateX(20px); }
    to { opacity: 1; transform: translateX(0); }
  }

  .user-card {
    margin-top: auto;
    padding: 11px 12px;
    background: rgba(255,255,255,0.03);
    border-radius: 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    border: 1px solid var(--border);
    cursor: pointer;
    transition: var(--transition);
  }
  .user-card:hover {
    background: rgba(255,255,255,0.06);
    border-color: var(--border-strong);
  }

  .avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: linear-gradient(135deg, #00C896, #007a5c);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 600;
    font-size: 12px;
    color: white;
    flex-shrink: 0;
    background-size: cover;
    background-position: center;
    overflow: hidden;
  }

  /* Universeller Avatar-Renderer (Größen über inline-style) */
  .avatar-circle {
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    color: white;
    flex-shrink: 0;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    box-shadow: 0 0 0 1.5px rgba(255,255,255,0.15);
    text-transform: uppercase;
    letter-spacing: -0.3px;
  }

  .user-info {
    flex: 1;
    min-width: 0;
  }

  .user-name {
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .user-role {
    font-size: 11px;
    color: var(--text-3);
    text-transform: capitalize;
  }

  .logout-btn {
    background: transparent;
    border: none;
    color: var(--text-3);
    cursor: pointer;
    padding: 4px;
    border-radius: 4px;
    transition: var(--transition);
  }

  .logout-btn:hover {
    background: var(--bg-3);
    color: var(--danger);
  }

  .main {
    flex: 1 1 0;
    min-width: 0;
    overflow-y: auto;
    background: var(--bg-0);
  }

  .topbar {
    padding: 16px 32px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 16px;
    background: rgba(10,11,16,0.88);
    backdrop-filter: var(--blur);
    -webkit-backdrop-filter: var(--blur);
    position: sticky;
    top: 0;
    z-index: 10;
    min-width: 0;
    max-width: 100%;
    overflow: hidden;
  }

  .page-title {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.4px;
  }

  .page-subtitle {
    font-size: 12.5px;
    color: var(--text-3);
    margin-top: 2px;
  }

  .content {
    padding: 28px 32px 60px;
    min-width: 0;
    max-width: 100%;
    overflow-x: hidden;
  }

  /* =========================================
     BUTTONS
     ========================================= */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 16px;
    border-radius: 980px;
    font-size: 13px;
    font-weight: 500;
    border: 1px solid transparent;
    cursor: pointer;
    transition: var(--transition);
    font-family: inherit;
    letter-spacing: -0.01em;
  }

  .btn-primary {
    background: var(--accent);
    color: #002a1e;
    font-weight: 700;
    letter-spacing: -0.1px;
    box-shadow: 0 2px 12px -4px rgba(0,200,150,0.35);
  }

  .btn-primary:hover {
    background: var(--accent-hover);
    transform: translateY(-1px);
    box-shadow: 0 6px 24px -4px rgba(0,200,150,0.5);
  }

  .btn-secondary {
    background: rgba(255,255,255,0.06);
    color: var(--text-1);
    border-color: var(--border);
    backdrop-filter: var(--blur);
  }

  .btn-secondary:hover { background: rgba(255,255,255,0.1); border-color: var(--border-strong); }

  .btn-ghost {
    background: transparent;
    color: var(--text-2);
  }

  .btn-ghost:hover { background: var(--bg-2); color: var(--text-1); }

  .btn-danger {
    background: transparent;
    color: var(--danger);
    border-color: rgba(239, 68, 68, 0.3);
  }

  .btn-danger:hover { background: rgba(239, 68, 68, 0.1); }

  .btn-sm { padding: 5px 10px; font-size: 12px; }

  /* =========================================
     CARDS / TABLES
     ========================================= */
  .card {
    background: var(--bg-1);
    border: 1px solid var(--border);
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 2px 12px -4px rgba(0,0,0,0.4);
  }
  .card + .card { margin-top: 14px; }

  .stat {
    background: var(--bg-1);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 22px 24px;
    transition: var(--transition);
    position: relative;
    overflow: hidden;
  }
  .stat::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: var(--accent);
    opacity: 0.6;
    border-radius: 18px 18px 0 0;
  }
  .stat:hover {
    border-color: rgba(0,200,150,0.25);
    transform: translateY(-2px);
    box-shadow: 0 8px 32px -8px rgba(0,200,150,0.15), var(--shadow-sm);
  }
  .stat-icon {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    background: var(--accent-soft);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 14px;
    color: var(--accent);
  }
  .stat-icon svg { width: 18px; height: 18px; }

  .card-header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(255,255,255,0.015);
  }

  .card-title {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: -0.1px;
    color: var(--text-1);
  }

  .card-body { padding: 20px; }

  table {
    width: 100%;
    border-collapse: collapse;
  }

  th {
    text-align: left;
    padding: 11px 22px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-3);
    background: rgba(255,255,255,0.02);
    border-bottom: 1px solid var(--border);
  }

  td {
    padding: 15px 22px;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }

  tbody tr {
    transition: background 0.12s;
  }
  tr:last-child td { border-bottom: none; }
  tbody tr:hover td { background: rgba(255,255,255,0.03); cursor: pointer; }
  tbody tr:hover td:first-child { color: var(--accent); }

  /* Zeilen-Titel mit optionalem Lösch-Icon (z. B. Ideen direkt löschen) */
  .row-title { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .row-trash {
    background: transparent; border: none; cursor: pointer; color: var(--text-3);
    font-size: 14px; line-height: 1; padding: 4px 6px; border-radius: 6px; flex: none;
    opacity: 0.5; transition: var(--transition);
  }
  .row-trash:hover { opacity: 1; color: var(--danger, #ff5a5f); background: rgba(255,90,95,0.12); }

  /* NAS-Freigabelinks im Projekt-Detail */
  .nas-links { display: flex; flex-direction: column; gap: 12px; }
  .nas-link-row { display: flex; flex-direction: column; gap: 5px; }
  .nas-link-meta { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .nas-link-folder {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px;
    font-weight: 700; color: var(--accent); background: var(--accent-soft);
    padding: 1px 7px; border-radius: 5px;
  }
  .nas-link-hint { font-size: 11.5px; color: var(--text-3); }
  .nas-link-input { display: flex; gap: 8px; align-items: center; }
  .nas-link-input input {
    flex: 1; min-width: 0; padding: 8px 12px; border-radius: 8px;
    background: var(--bg-2); border: 1px solid var(--border); color: inherit; font-size: 13px;
  }
  .nas-link-input input[readonly] { opacity: 0.8; cursor: default; }

  /* =========================================
     STAT GRID
     ========================================= */
  .stat-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 14px;
    margin-bottom: 24px;
  }

  .stat-label {
    font-size: 11.5px;
    color: var(--text-3);
    text-transform: uppercase;
    letter-spacing: 0.7px;
    font-weight: 600;
  }

  .stat-value {
    font-size: 38px;
    font-weight: 800;
    margin-top: 4px;
    letter-spacing: -2px;
    line-height: 1;
    color: var(--text-1);
  }

  .stat-sub {
    font-size: 11.5px;
    color: var(--text-3);
    margin-top: 6px;
    display: flex;
    align-items: center;
    gap: 5px;
  }

  /* =========================================
     STATUS BADGES
     ========================================= */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 10px;
    border-radius: 99px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    border: 1px solid;
  }

  .badge::before {
    content: "";
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: currentColor;
    flex-shrink: 0;
  }

  .badge-skript { color: #94a3b8; background: rgba(148,163,184,0.1); border-color: rgba(148,163,184,0.2); }
  .badge-geplant { color: #64d2ff; background: rgba(100,210,255,0.1); border-color: rgba(100,210,255,0.2); }
  .badge-gedreht { color: #a78bfa; background: rgba(167,139,250,0.1); border-color: rgba(167,139,250,0.2); }
  .badge-schnitt { color: #fbbf24; background: rgba(251,191,36,0.1); border-color: rgba(251,191,36,0.2); }
  .badge-fertig { color: #30d158; background: rgba(48,209,88,0.1); border-color: rgba(48,209,88,0.2); }
  .badge-korrektur { color: #ff453a; background: rgba(255,69,58,0.12); border-color: rgba(255,69,58,0.3); }
  .badge-freigegeben { color: #2dd4bf; background: rgba(45,212,191,0.12); border-color: rgba(45,212,191,0.25); }
  .badge-archiviert { color: #6b7280; background: rgba(107,114,128,0.1); border-color: rgba(107,114,128,0.2); }
  .badge-ueberfaellig { color: #ff453a; background: rgba(255,69,58,0.12); border-color: rgba(255,69,58,0.3); }

  /* Hinweis: aktives Projekt ohne Posting-Datum (dezent orange). */
  .badge-no-posting { color: #fbbf24; background: rgba(245,158,11,0.14); border-color: rgba(245,158,11,0.35); white-space: nowrap; }
  tr.row-no-posting td { background: rgba(245,158,11,0.06); }
  tr.row-no-posting td:first-child { box-shadow: inset 3px 0 0 rgba(245,158,11,0.55); }
  .card.card-no-posting { border-color: rgba(245,158,11,0.35); background: rgba(245,158,11,0.05); }

  /* Nicht gedreht: Drehtag vorbei, Status noch „geplant" → rot hervorheben. */
  .badge-nicht-gedreht { color: #ff453a; background: rgba(255,69,58,0.13); border-color: rgba(255,69,58,0.32); white-space: nowrap; }
  tr.row-nicht-gedreht td { background: rgba(255,69,58,0.06); }
  tr.row-nicht-gedreht td:first-child { box-shadow: inset 3px 0 0 rgba(255,69,58,0.6); }
  .nicht-gedreht-warn { color: #ff453a; font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 5px; margin-top: 5px; }
  .shootday-header-warn { color: #ff453a; font-size: 11px; font-weight: 700; background: rgba(255,69,58,0.1); border: 1px solid rgba(255,69,58,0.28); border-radius: 5px; padding: 2px 8px; }

  /* Auto-Resize-Textarea: wächst mit dem Inhalt, kein interner Scrollbalken. */
  textarea.autogrow { resize: none; overflow: hidden; field-sizing: content; }

  /* Wochentag-Picker (Kunden-Voreinstellungen) */
  .weekday-picker { display:flex; gap:6px; flex-wrap:wrap; }
  .weekday-chip { display:inline-flex; align-items:center; justify-content:center; min-width:36px; padding:5px 9px; border-radius:8px; border:1px solid var(--border); cursor:pointer; font-size:13px; font-weight:600; color:var(--text-2); user-select:none; transition:var(--transition); }
  .weekday-chip:hover { border-color:var(--accent); color:var(--text-1); }
  .weekday-chip.wd-active { background:rgba(20,184,166,0.15); color:var(--accent); border-color:var(--accent); }

  /* Validierungs-Warnung im Projekt-Formular */
  .timeline-warning { display:flex; align-items:flex-start; gap:7px; background:rgba(245,158,11,0.1); border:1px solid rgba(245,158,11,0.3); border-radius:8px; padding:8px 12px; font-size:12.5px; color:#fbbf24; margin-top:8px; }

  /* Serien-Planer Vorschau-Tabelle */
  .series-preview-table { width:100%; border-collapse:collapse; font-size:13px; margin-top:10px; }
  .series-preview-table th { text-align:left; padding:6px 8px; border-bottom:1px solid var(--border); color:var(--text-3); font-weight:600; font-size:11.5px; letter-spacing:0.3px; }
  .series-preview-table td { padding:5px 6px; border-bottom:1px solid rgba(255,255,255,0.04); vertical-align:middle; }
  .series-preview-table input[type=text], .series-preview-table input[type=date] { width:100%; background:var(--bg-3); border:1px solid var(--border); border-radius:6px; color:var(--text-1); padding:4px 7px; font-size:12.5px; font-family:inherit; }
  .series-preview-table input[type=text]:focus, .series-preview-table input[type=date]:focus { outline:none; border-color:var(--accent); }
  .series-preview-row-num { color:var(--text-3); font-weight:700; font-size:12px; min-width:22px; text-align:center; }
  .series-no-config { background:rgba(245,158,11,0.08); border:1px solid rgba(245,158,11,0.25); border-radius:8px; padding:10px 14px; color:#fbbf24; font-size:13px; }
  .series-continuation-info { background:rgba(20,184,166,0.07); border:1px solid rgba(20,184,166,0.2); border-radius:8px; padding:8px 12px; color:var(--accent); font-size:12.5px; margin-bottom:8px; display:flex; align-items:center; gap:6px; }

  /* Drag-and-Drop Kalender */
  .ical-event[draggable="true"] { cursor:grab; }
  .ical-event[draggable="true"]:active { cursor:grabbing; }
  .ical-event.dnd-dragging { opacity:0.4; }
  .ical-cat-bg.dnd-over, .month-day-bg.dnd-over { background:rgba(20,184,166,0.12) !important; outline:2px dashed rgba(20,184,166,0.5); outline-offset:-2px; z-index:2; }
  .month-bar[draggable="true"] { cursor:grab; }
  .month-bar.dnd-dragging { opacity:0.4; }

  /* Form section dividers */
  .form-section { font-size:11px; font-weight:700; letter-spacing:0.6px; text-transform:uppercase; color:var(--text-3); margin:18px 0 10px; padding-bottom:6px; border-bottom:1px solid var(--border); }
  .form-hint-auto { font-size:11.5px; color:var(--accent); opacity:0.8; margin-top:3px; display:flex; align-items:center; gap:4px; }

  .badge-role-admin { color: #ff453a; background: rgba(255,69,58,0.1); border-color: rgba(255,69,58,0.2); }
  .badge-role-manager { color: #2dd4bf; background: rgba(45,212,191,0.12); border-color: rgba(45,212,191,0.25); }
  .badge-role-videograf { color: #a78bfa; background: rgba(167,139,250,0.1); border-color: rgba(167,139,250,0.2); }
  .badge-role-cutter { color: #fbbf24; background: rgba(251,191,36,0.1); border-color: rgba(251,191,36,0.2); }
  .badge-role-mitarbeiter { color: #64d2ff; background: rgba(100,210,255,0.1); border-color: rgba(100,210,255,0.2); }
  .badge-role-contract_uploader { color: #30d158; background: rgba(48,209,88,0.1); border-color: rgba(48,209,88,0.2); }

  /* NAS-Medien (Beta) */
  .badge-beta { display:inline-block; font-size:10px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; color:#ff9f0a; background:rgba(255,159,10,0.12); border:1px solid rgba(255,159,10,0.3); border-radius:5px; padding:2px 7px; vertical-align:middle; }
  .nas-up-bar-wrap { height:6px; background:rgba(255,255,255,0.08); border-radius:3px; overflow:hidden; margin-top:6px; }
  .nas-up-bar { height:100%; width:0%; background:var(--accent, #0a84ff); border-radius:3px; transition:width .2s ease; }
  .nas-media-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .nas-media-dot.stored { background:#30d158; }
  .nas-media-dot.error  { background:#ff453a; }

  /* Review-Player Overlay (liegt ÜBER dem Projekt-Modal, eigener Container) */
  .nas-player-backdrop {
    position:fixed; inset:0; z-index:2000;
    background:rgba(0,0,0,0.85); backdrop-filter:blur(6px);
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .nas-player-box { width:100%; max-width:960px; }
  .nas-player-head {
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:10px; gap:12px;
  }
  .nas-player-title {
    font-size:14px; font-weight:600; color:#fff;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .nas-player-close {
    background:rgba(255,255,255,0.1); border:none; color:#fff;
    width:32px; height:32px; border-radius:50%; font-size:18px;
    cursor:pointer; flex-shrink:0; line-height:1;
  }
  .nas-player-close:hover { background:rgba(255,255,255,0.2); }
  .nas-player-box video, .nas-player-box img {
    width:100%; max-height:58vh; border-radius:12px;
    background:#000; display:block; object-fit:contain;
  }

  /* Review-Kommentare im Player */
  .nas-open-badge {
    display:inline-block; font-size:10.5px; font-weight:700;
    color:#ff9f0a; background:rgba(255,159,10,0.14);
    border:1px solid rgba(255,159,10,0.3); border-radius:5px;
    padding:1px 6px; flex-shrink:0;
  }
  .nas-version-chip {
    display:inline-block; font-size:10px; font-weight:600;
    color:var(--text-3); background:rgba(255,255,255,0.06);
    border-radius:4px; padding:1px 6px; flex-shrink:0;
  }
  .nas-comments-panel {
    margin-top:12px; background:var(--bg-1, #16161a);
    border:1px solid var(--border, #2a2a2e); border-radius:12px;
    padding:14px; max-height:30vh; overflow-y:auto;
  }
  .nas-comment-row {
    display:flex; align-items:flex-start; gap:9px;
    padding:8px 0; border-bottom:1px solid rgba(255,255,255,0.05);
    font-size:13px;
  }
  .nas-comment-row:last-child { border-bottom:none; }
  .nas-comment-row.resolved { opacity:0.5; }
  .nas-comment-row.resolved .nas-comment-body { text-decoration:line-through; }
  .nas-tc-chip {
    background:rgba(10,132,255,0.15); color:#64b5ff;
    font-family:monospace; font-size:11.5px; font-weight:700;
    border:none; border-radius:5px; padding:2px 7px;
    cursor:pointer; flex-shrink:0; margin-top:1px;
  }
  .nas-tc-chip:hover { background:rgba(10,132,255,0.3); }
  .nas-comment-body { flex:1; min-width:0; word-break:break-word; }
  .nas-comment-meta { font-size:10.5px; color:var(--text-3); margin-top:2px; }
  .nas-comment-form { display:flex; gap:8px; margin-top:10px; }
  .nas-comment-form input[type=text] {
    flex:1; background:var(--bg-2, #1e1e22); color:inherit;
    border:1px solid var(--border, #2a2a2e); border-radius:8px;
    padding:9px 12px; font-size:13px;
  }

  .badge-status-onboarding { color: #ff9f0a; background: rgba(255,159,10,0.12); border-color: rgba(255,159,10,0.25); }
  .badge-status-active { color: #30d158; background: rgba(48,209,88,0.12); border-color: rgba(48,209,88,0.25); }
  .badge-status-paused { color: #6b7280; background: rgba(107,114,128,0.12); border-color: rgba(107,114,128,0.25); }

  /* Apple-style checkbox (square with checkmark) */
  .checkbox-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 14px;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    margin-bottom: 8px;
    cursor: pointer;
    transition: var(--transition);
  }
  .checkbox-row:hover { border-color: var(--border-strong); }
  .checkbox-row input[type=checkbox] {
    appearance: none;
    -webkit-appearance: none;
    width: 22px;
    height: 22px;
    border: 1.5px solid var(--border-strong);
    border-radius: 6px;
    background: var(--bg-3);
    cursor: pointer;
    position: relative;
    margin: 0;
    padding: 0;
    flex-shrink: 0;
    transition: var(--transition);
  }
  .checkbox-row input[type=checkbox]:checked {
    background: var(--accent);
    border-color: var(--accent);
  }
  .checkbox-row input[type=checkbox]:checked::after {
    content: "";
    position: absolute;
    left: 6px;
    top: 2px;
    width: 6px;
    height: 11px;
    border: solid #042f2e;
    border-width: 0 2.5px 2.5px 0;
    transform: rotate(45deg);
  }
  .checkbox-row.done { background: rgba(45,212,191,0.05); border-color: rgba(45,212,191,0.25); }
  .checkbox-content { flex: 1; }
  .checkbox-title {
    font-size: 13.5px;
    font-weight: 500;
    color: var(--text-1);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .checkbox-desc {
    font-size: 12px;
    color: var(--text-3);
    margin-top: 2px;
  }

  /* Apple-style toggle switch */
  .toggle {
    position: relative;
    display: inline-block;
    width: 44px;
    height: 26px;
    flex-shrink: 0;
  }
  .toggle input {
    opacity: 0;
    width: 0;
    height: 0;
    position: absolute;
  }
  .toggle-slider {
    position: absolute;
    inset: 0;
    background: var(--bg-3);
    border-radius: 999px;
    cursor: pointer;
    transition: var(--transition);
    border: 1px solid var(--border);
  }
  .toggle-slider::before {
    content: "";
    position: absolute;
    height: 22px;
    width: 22px;
    left: 1px;
    top: 1px;
    background: white;
    border-radius: 50%;
    transition: var(--transition);
    box-shadow: 0 2px 6px rgba(0,0,0,0.3);
  }
  .toggle input:checked + .toggle-slider {
    background: var(--accent);
    border-color: var(--accent);
  }
  .toggle input:checked + .toggle-slider::before {
    transform: translateX(18px);
  }
  .toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 14px;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    margin-bottom: 8px;
    cursor: pointer;
    transition: var(--transition);
  }
  .toggle-row:hover { border-color: var(--border-strong); }
  .toggle-row-content {
    flex: 1;
  }
  .toggle-row-title {
    font-size: 13.5px;
    font-weight: 500;
    color: var(--text-1);
  }
  .toggle-row-desc {
    font-size: 12px;
    color: var(--text-3);
    margin-top: 2px;
  }

  /* Kalender-Abo: Kategorie-Auswahl als saubere Chips (statt nativer Checkboxen) */
  .cal-cat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .cal-cat-chip {
    position: relative; display: flex; align-items: center; gap: 9px;
    padding: 9px 11px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--bg-1); color: var(--text-2); font-size: 13px; font-weight: 500;
    cursor: pointer; user-select: none; transition: var(--transition);
  }
  .cal-cat-chip:hover { border-color: var(--border-strong); }
  .cal-cat-chip input { position: absolute; opacity: 0; width: 0; height: 0; }
  /* Sichtbarer Tastatur-Fokus: das native Outline liegt auf der unsichtbaren Checkbox,
     daher den Fokus auf Chip + Box anzeigen, wenn das enthaltene Input fokussiert ist. */
  .cal-cat-chip:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .cal-cat-chip:focus-within .cal-cat-box { border-color: var(--accent); }
  .cal-cat-box {
    flex: none; width: 18px; height: 18px; border-radius: 5px;
    border: 1.5px solid var(--border-strong); background: var(--bg-3);
    display: flex; align-items: center; justify-content: center;
    color: transparent; font-size: 12px; font-weight: 800; line-height: 1; transition: var(--transition);
  }
  .cal-cat-chip input:checked ~ .cal-cat-box { background: var(--accent); border-color: var(--accent); color: #04221a; }
  .cal-cat-chip:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); color: var(--text-1); }

  /* =========================================
     FORMS
     ========================================= */
  .form-group {
    margin-bottom: 16px;
  }

  .form-label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-2);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }

  .form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }

  input, select, textarea {
    width: 100%;
    padding: 10px 13px;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 9px;
    color: var(--text-1);
    font-size: 13.5px;
    font-family: inherit;
    transition: var(--transition);
  }

  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 4px var(--accent-soft);
    background: var(--bg-3);
  }

  input::placeholder, textarea::placeholder { color: var(--text-3); }

  textarea {
    resize: vertical;
    min-height: 100px;
  }

  select {
    appearance: none;
    background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%237a8398' stroke-width='2'%3E%3Cpolyline points='6 9 12 15 18 9'/%3E%3C/svg%3E");
    background-repeat: no-repeat;
    background-position: right 10px center;
    padding-right: 32px;
  }

  /* =========================================
     MODAL
     ========================================= */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(4px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
  }

  .modal {
    background: var(--bg-1);
    border: 1px solid var(--border);
    border-radius: 18px;
    width: 100%;
    max-width: 560px;
    max-height: 90vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: var(--shadow);
    animation: modal-in 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .modal > form {
    display: flex;
    flex-direction: column;
    flex: 1;
    min-height: 0;
    overflow: hidden;
  }

  @keyframes modal-in {
    from { opacity: 0; transform: scale(0.96) translateY(8px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }

  .modal-header {
    padding: 18px 22px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
  }

  .modal-title {
    font-size: 16px;
    font-weight: 600;
  }

  .modal-close {
    background: transparent;
    border: none;
    color: var(--text-3);
    cursor: pointer;
    padding: 4px;
    border-radius: 4px;
    font-size: 20px;
    line-height: 1;
  }

  .modal-close:hover { background: var(--bg-3); color: var(--text-1); }

  .modal-body {
    padding: 22px;
    overflow-y: auto;
    /* Nur vertikal scrollen: ohne explizites overflow-x rechnet der Browser bei
       gesetztem overflow-y intern „auto" → zu breite Inhalte ließen das Modal auf
       dem Handy horizontal wegwischen und wirkten „schwimmend". Fix: hart sperren. */
    overflow-x: hidden;
    flex: 1;
    min-height: 0;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
  }

  .modal-footer {
    padding: 16px 22px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    flex-shrink: 0;
  }

  /* =========================================
     LOGIN PAGE
     ========================================= */
  .login-screen {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 30% 20%, rgba(0,200,150,0.10), transparent 50%),
                radial-gradient(circle at 70% 80%, rgba(0,200,150,0.06), transparent 50%),
                var(--bg-0);
    padding: 20px;
  }

  .login-box {
    width: 100%;
    max-width: 420px;
    background: var(--bg-1);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 36px 32px;
    box-shadow: var(--shadow);
  }

  .login-logo {
    width: 76px;
    height: 76px;
    background: linear-gradient(135deg, #00C896, #007a5c);
    border-radius: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 18px;
    box-shadow: 0 12px 36px -8px var(--accent-glow);
  }
  .login-logo img {
    width: 52px;
    height: 52px;
    filter: brightness(0) invert(1);
    object-fit: contain;
  }

  .login-title {
    font-size: 22px;
    font-weight: 700;
    text-align: center;
    letter-spacing: -0.4px;
  }

  .login-sub {
    text-align: center;
    color: var(--text-3);
    margin-top: 6px;
    margin-bottom: 28px;
    font-size: 13.5px;
  }

  .login-tabs {
    display: flex;
    background: var(--bg-2);
    border-radius: var(--radius-sm);
    padding: 4px;
    margin-bottom: 22px;
  }

  .login-tab {
    flex: 1;
    padding: 8px;
    text-align: center;
    border-radius: 5px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    color: var(--text-2);
    transition: var(--transition);
    border: none;
    background: transparent;
  }

  .login-tab.active {
    background: var(--bg-3);
    color: var(--text-1);
  }

  .login-hint {
    margin-top: 18px;
    padding: 12px;
    background: var(--bg-2);
    border-radius: var(--radius-sm);
    font-size: 12px;
    color: var(--text-3);
    border: 1px dashed var(--border);
  }

  .login-error {
    background: rgba(239,68,68,0.1);
    border: 1px solid rgba(239,68,68,0.3);
    color: #fca5a5;
    padding: 10px 12px;
    border-radius: var(--radius-sm);
    font-size: 12.5px;
    margin-bottom: 14px;
  }

  /* =========================================
     CALENDAR – iCloud / Apple Calendar style
     ========================================= */
  .calendar {
    background: #111113;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px;
    padding: 0;
    overflow: hidden;
    box-shadow: 0 8px 40px rgba(0,0,0,0.55), 0 1px 0 rgba(255,255,255,0.04) inset;
  }

  /* ─── Calendar shared header ─────────────────────────────────── */
  .calendar-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    background: rgba(28,28,30,0.95);
    border-bottom: 1px solid rgba(255,255,255,0.07);
    position: sticky;
    top: 0;
    z-index: 10;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }

  .calendar-title-block { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .cal-inline-toggle { display: flex; background: rgba(255,255,255,0.06); border-radius: 8px; padding: 2px; gap: 2px; }
  .cal-inline-toggle button { background: none; border: none; border-radius: 6px; padding: 3px 10px; font-size: 11px; font-weight: 600; color: rgba(255,255,255,0.45); cursor: pointer; transition: var(--transition); font-family: inherit; }
  .cal-inline-toggle button.active { background: rgba(255,255,255,0.12); color: var(--text-1); }

  .calendar-month {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.4px;
    color: var(--text-1);
  }

  .calendar-year {
    font-size: 20px;
    font-weight: 300;
    color: var(--text-3);
    letter-spacing: -0.4px;
  }

  .calendar-nav { display: flex; gap: 2px; align-items: center; }

  .cal-nav-btn {
    width: 34px;
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 10px;
    color: var(--text-2);
    cursor: pointer;
    transition: var(--transition);
    font-size: 16px;
    font-weight: 400;
  }
  .cal-nav-btn:hover { background: rgba(255,255,255,0.12); color: var(--text-1); border-color: rgba(255,255,255,0.14); }

  .cal-today-btn {
    padding: 6px 14px;
    border-radius: 10px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    color: var(--accent);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: var(--transition);
    margin: 0 4px;
    letter-spacing: 0.1px;
  }
  .cal-today-btn:hover { background: var(--accent-soft); border-color: var(--accent); }

  .calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 0;
  }

  .calendar-day-name {
    text-align: right;
    font-size: 11px;
    font-weight: 600;
    color: var(--text-3);
    text-transform: uppercase;
    padding: 10px 10px;
    letter-spacing: 0.4px;
    background: var(--bg-1);
    border-bottom: 1px solid var(--border);
  }
  .calendar-day-name:not(:last-child) { border-right: 1px solid var(--border); }

  .calendar-day {
    min-height: 100px;
    background: var(--bg-1);
    padding: 6px 0;
    font-size: 12px;
    overflow: hidden;
    position: relative;
    transition: var(--transition);
    border-bottom: 1px solid var(--border);
  }
  .calendar-day:not(:nth-child(7n)) { border-right: 1px solid var(--border); }
  .calendar-day-content { padding: 0 8px; }

  .calendar-day:hover { background: var(--bg-2); }

  .calendar-day.outside {
    background: var(--bg-0);
  }

  .calendar-day.outside .calendar-date { color: var(--text-3); opacity: 0.5; }

  .calendar-date {
    font-weight: 500;
    font-size: 13px;
    text-align: right;
    color: var(--text-1);
    height: 22px;
    line-height: 22px;
    margin-bottom: 2px;
  }

  .calendar-day.today .calendar-date {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 22px;
    line-height: 22px;
    background: var(--apple-red);
    color: white;
    border-radius: 50%;
    font-weight: 600;
    float: right;
    text-align: center;
  }

  .calendar-event {
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 11px;
    margin: 2px 8px 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    cursor: pointer;
    transition: var(--transition);
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .calendar-event::before {
    content: "";
    width: 7px;
    height: 7px;
    border-radius: 50%;
    flex-shrink: 0;
    background: currentColor;
  }

  .calendar-event:hover {
    background: rgba(255,255,255,0.06);
  }

  .calendar-event.posting { color: #2dd4bf; }
  .calendar-event.shoot { color: #a78bfa; }
  .calendar-event.cutter { color: #fbbf24; }
  .calendar-event.deadline { color: #ff453a; }
  .calendar-event.vacation { color: #94a3b8; background: rgba(148,163,184,0.12); }

  /* Mehrtägige Projekt-Bars: keine Margins, damit sie sich über Tage hinweg verbinden */
  .cal-bar {
    height: 14px;
    font-size: 10.5px;
    line-height: 14px;
    font-weight: 600;
    color: white;
    overflow: hidden;
    white-space: nowrap;
    cursor: pointer;
    padding: 0;
    margin: 2px 0 0;
    border-radius: 0;
    text-overflow: ellipsis;
    transition: opacity 0.15s ease;
  }
  .cal-bar:hover { opacity: 0.85; }
  .cal-bar.is-start { border-top-left-radius: 999px; border-bottom-left-radius: 999px; padding-left: 8px; }
  .cal-bar.is-end { border-top-right-radius: 999px; border-bottom-right-radius: 999px; padding-right: 6px; }
  .cal-bar.is-start.is-end { padding: 0 8px; }

  .cal-bar.phase-shoot { background: linear-gradient(90deg, #a78bfa, #8b5cf6); }
  .cal-bar.phase-production { background: linear-gradient(90deg, #a78bfa66, #fbbf2466); color: var(--text-2); }
  .cal-bar.phase-cutter { background: linear-gradient(90deg, #fbbf24, #f59e0b); }
  .cal-bar.phase-editing { background: linear-gradient(90deg, #fbbf2466, #2dd4bf66); color: var(--text-2); }
  .cal-bar.phase-posting { background: linear-gradient(90deg, #14b8a6, #2dd4bf); }
  .cal-bar.phase-vacation { background: linear-gradient(90deg, #94a3b8, #64748b); }
  .cal-bar.phase-deadline { background: linear-gradient(90deg, #ef4444, #ff453a); }

  /* Bar Label nur an Anfang/Ende oder mittlerem Tag eines Mehrtagesblocks */
  .cal-bar-label {
    padding-left: 4px;
  }
  .cal-bar.is-start .cal-bar-label { padding-left: 0; }

  .cal-overflow {
    font-size: 10.5px;
    color: var(--text-3);
    padding: 2px 6px;
    margin-top: 1px;
    font-weight: 500;
  }

  /* =========================================
     MONTH VIEW – Redesign
     ========================================= */
  .month-grid {
    display: flex;
    flex-direction: column;
    background: #111113;
  }
  .month-weekday-header {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    border-bottom: 1px solid rgba(255,255,255,0.07);
    background: rgba(28,28,30,0.7);
    position: sticky;
    top: 0;
    z-index: 9;
  }
  .month-weekday-header > div {
    padding: 9px 10px;
    text-align: center;
    font-size: 11px;
    font-weight: 600;
    color: var(--text-3);
    text-transform: uppercase;
    letter-spacing: 0.6px;
    border-right: 1px solid rgba(255,255,255,0.05);
  }
  .month-weekday-header > div:nth-child(6),
  .month-weekday-header > div:nth-child(7) { color: rgba(255,107,107,0.7); }
  .month-weekday-header > div:last-child { border-right: none; }

  .month-week-row {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    grid-template-rows: 32px;
    grid-auto-rows: 24px;
    grid-row-gap: 2px;
    border-bottom: 1px solid rgba(255,255,255,0.055);
    min-height: 120px;
    padding-bottom: 8px;
    position: relative;
  }
  .month-week-row:last-child { border-bottom: none; }

  .month-day-bg {
    grid-row: 1 / -1;
    border-right: 1px solid rgba(255,255,255,0.05);
    transition: background 0.15s;
    cursor: default;
  }
  .month-day-bg:nth-child(6n+6),
  .month-day-bg:nth-child(7n) { background: rgba(255,255,255,0.012); }
  .month-day-bg:nth-child(7n) { border-right: none; }
  .month-day-bg.today { background: rgba(255,69,58,0.06) !important; border-right-color: rgba(255,69,58,0.15); }
  .month-day-bg.is-shoot { background: rgba(167,139,250,0.06) !important; }

  .month-day-num {
    grid-row: 1;
    padding: 6px 8px 2px;
    font-size: 13px;
    font-weight: 400;
    color: var(--text-2);
    text-align: center;
    pointer-events: none;
    align-self: start;
    justify-self: center;
    line-height: 20px;
  }
  .month-day-num.outside { color: var(--text-3); opacity: 0.38; }
  .month-day-num.today {
    color: white;
    background: var(--apple-red);
    border-radius: 50%;
    width: 26px;
    height: 26px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    margin: 3px auto 0;
    font-weight: 700;
    font-size: 13px;
    line-height: 1;
  }

  .month-scroller {
    height: 680px;
    min-height: 0;
    overflow-y: scroll;
    overflow-x: hidden;
    scroll-behavior: smooth;
    overscroll-behavior-y: contain;
  }
  .month-scroller::-webkit-scrollbar { width: 4px; }
  .month-scroller::-webkit-scrollbar-track { background: transparent; }
  .month-scroller::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 4px; }
  @media (max-width: 640px) {
    .month-scroller { height: 440px; }
  }

  /* Month event bars */
  .month-bar {
    height: 22px;
    line-height: 22px;
    font-size: 11px;
    font-weight: 600;
    border-radius: 5px;
    padding: 0 7px 0 6px;
    display: flex;
    align-items: center;
    gap: 5px;
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    margin: 1px 2px;
    z-index: 1;
    transition: filter 0.15s, transform 0.1s;
    position: relative;
  }
  .month-bar::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: currentColor;
    opacity: 0.7;
    border-radius: 5px 0 0 5px;
  }
  .month-bar:hover { filter: brightness(1.2); transform: translateY(-1px); z-index: 5; }
  .month-bar.cuts-left {
    border-top-left-radius: 0; border-bottom-left-radius: 0;
    margin-left: 0; padding-left: 7px;
  }
  .month-bar.cuts-left::before { display: none; }
  .month-bar.cuts-right { border-top-right-radius: 0; border-bottom-right-radius: 0; margin-right: 0; }
  .month-bar .avatar-circle { box-shadow: 0 0 0 1.5px rgba(0,0,0,0.3); }
  .month-bar-title { flex: 1; overflow: hidden; text-overflow: ellipsis; }
  .month-bar-time { font-size: 10px; opacity: 0.7; font-weight: 500; flex-shrink: 0; }

  /* Phase colours – rich gradients matching ical-event */
  .month-bar.phase-shoot      { background: linear-gradient(90deg,rgba(167,139,250,0.32),rgba(139,92,246,0.22)); color: #ddd6fe; }
  .month-bar.phase-production { background: linear-gradient(90deg,rgba(251,191,36,0.22),rgba(245,158,11,0.14)); color: #fcd34d; }
  /* Rechter Abschluss = Deadline → roter Cap (nicht bei cuts-right, da Linie dort abgeschnitten) */
  .month-bar.phase-production:not(.cuts-right) { border-right: 2px solid rgba(239,68,68,0.65); }
  .month-bar.phase-cutter     { background: linear-gradient(90deg,rgba(251,191,36,0.28),rgba(245,158,11,0.18)); color: #fde68a; }
  .month-bar.phase-editing    { background: linear-gradient(90deg,rgba(52,211,153,0.22),rgba(16,185,129,0.14)); color: #6ee7b7; }
  /* Posting-Segment startet direkt nach Deadline → kein linkes Padding, wirkt als Fortsetzung */
  .month-bar.phase-posting:not(.cuts-left) { border-left: 2px solid rgba(20,184,166,0.55); }
  .month-bar.phase-posting    { background: linear-gradient(90deg,rgba(20,184,166,0.32),rgba(45,212,191,0.22)); color: #5eead4; }
  .month-bar.phase-vacation   { background: linear-gradient(90deg,rgba(148,163,184,0.28),rgba(100,116,139,0.18)); color: #cbd5e1; }
  .month-bar.phase-deadline   { background: linear-gradient(90deg,rgba(239,68,68,0.30),rgba(220,38,38,0.20)); color: #fca5a5; }
  .month-bar.phase-todo       { background: linear-gradient(90deg,rgba(100,210,255,0.22),rgba(56,189,248,0.14)); color: #7dd3fc; }

  .month-bar-more {
    font-size: 10px;
    padding: 0 8px;
    color: var(--text-3);
    font-weight: 600;
    align-self: end;
    cursor: pointer;
    margin-bottom: 3px;
  }

  /* =========================================
     KATEGORIE-WOCHENANSICHT (Swim-Lanes)
     ========================================= */
  .ical {
    background: #111113;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 8px 40px rgba(0,0,0,0.6), 0 1px 0 rgba(255,255,255,0.04) inset;
    border: 1px solid rgba(255,255,255,0.07);
    width: 100%;
    max-width: 100%;
  }
  .ical-scroll {
    overflow-x: scroll;
    overflow-y: auto;
    cursor: grab;
    /* Keine Höhenbegrenzung: der Kalender wächst/schrumpft mit der Zeilenzahl statt
       vertikal zu scrollen (Inhalt passt komplett → kein vertikaler Scrollbalken).
       Horizontales Scrollen der Tagesspalten bleibt erhalten. */
    max-height: none;
    /* „proximity" statt „mandatory": Mandatory-Snap kämpft auf dem Desktop gegen
       Maus-/Trackpad-Scrollen und das Drag-/Wheel-Handling (Ruckeln/Hängen).
       Proximity rastet sanft an Tagesspalten ein, blockiert aber freies Scrollen
       nicht. Touch (Mobil) blieb ohnehin ohne Snap. */
    scroll-snap-type: x proximity;
    overscroll-behavior-x: contain;
    /* KEIN -webkit-overflow-scrolling: touch: dieser Legacy-Momentum-Modus erzeugt auf
       iOS Safari einen eigenen Compositing-Layer, in dem der Sticky-Tages-Header und die
       transformierten Event-Labels falsch gestapelt werden (Text schob sich ÜBER den
       Header statt dahinter). iOS ≥13 scrollt ohnehin mit Momentum. Ohne die Property
       greift normale Mal-Reihenfolge → Header (z-index:20, opak) verdeckt Balken (z-index:2). */
    /* Scroll-Container für den Compositor markieren → weniger Repaint beim
       horizontalen Scrollen in datendichten Wochen. */
    --ical-sidebar: 48px;
  }
  @media (max-width: 640px) {
    .ical-scroll { scroll-snap-type: none; max-height: none; cursor: default; }
  }
  .ical-scroll.dragging { cursor: grabbing; scroll-snap-type: none; scroll-behavior: auto; }
  .ical-scroll::-webkit-scrollbar { height: 10px; width: 10px; background: #1c1c1e; }
  .ical-scroll::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,0.18);
    border-radius: 5px;
    border: 2px solid #1c1c1e;
  }
  .ical-track {
    display: grid;
    /* Header-Zeile darf bei Bedarf wachsen, damit der Tages-Header nicht in
       die erste Balken-Zeile überläuft (sonst „überlappende" Balken). */
    grid-template-rows: minmax(64px, auto);
    grid-auto-rows: 36px;
    grid-row-gap: 3px;
    padding-bottom: 20px;
    isolation: isolate;
  }

  .ical-corner {
    grid-row: 1;
    grid-column: 1;
    background: #111113;
    position: sticky;
    top: 0;
    left: 0;
    z-index: 30;
    border-right: 1px solid rgba(255,255,255,0.07);
    border-bottom: 1px solid rgba(255,255,255,0.07);
  }
  .ical-day-head {
    grid-row: 1;
    padding: 12px 10px 10px;
    border-right: 1px solid rgba(255,255,255,0.05);
    border-bottom: 1px solid rgba(255,255,255,0.07);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    scroll-snap-align: start;
    background: #111113;
    position: sticky;
    top: 0;
    z-index: 20;
    min-height: 64px;
    text-align: center;
  }
  .ical-day-head .ical-dname {
    font-size: 10px;
    font-weight: 600;
    color: rgba(255,255,255,0.35);
    text-transform: uppercase;
    letter-spacing: 0.6px;
  }
  .ical-day-head .ical-dnum {
    font-size: 18px;
    font-weight: 300;
    letter-spacing: -0.5px;
    color: rgba(255,255,255,0.65);
    line-height: 1;
  }
  .ical-day-head.today .ical-dname { color: rgba(255,255,255,0.75); font-weight: 700; }
  .ical-day-head.today .ical-dnum {
    color: white;
    background: var(--apple-red);
    border-radius: 50%;
    width: 30px;
    height: 30px;
    /* nicht im Flex-Spaltenlayout schrumpfen -> bleibt ein runder Kreis */
    flex: 0 0 30px;
    min-width: 30px;
    max-width: 30px;
    min-height: 30px;
    max-height: 30px;
    aspect-ratio: 1 / 1;
    box-sizing: border-box;
    padding: 0;
    line-height: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    font-weight: 700;
  }
  .ical-day-head.is-shoot {
    /* Solider #111113-Sockel UNTER dem Verlauf: sonst ist der Drehtag-Header semi-
       transparent und beim Scrollen scheinen die Balken durch (sah wie Overlap nur in
       der heutigen/Drehtag-Spalte aus, während alle opaken Spalten korrekt verdeckten). */
    background: linear-gradient(180deg, rgba(167,139,250,0.14), rgba(167,139,250,0.04)), #111113;
    border-bottom: 2px solid rgba(167,139,250,0.6);
  }
  .ical-day-head.is-shoot .ical-dname { color: rgba(196,181,253,0.8); }
  .ical-day-head.is-shoot .ical-dnum { color: #c4b5fd; }
  .ical-day-head.today.is-shoot .ical-dnum { color: white; }
  .ical-shoot-badge {
    position: absolute;

  /* Kürzel-Chip direkt im Event-Balken: kleiner Kreis mit gefülltem Hintergrund */

  /* Kunden-Kürzel-Icon: kompaktes Text-Kürzel statt Emoji */

  .ical-cat-bg {
    position: relative;

  .ical-cat-bg.alt { background: rgba(255,255,255,0.008); }
  .ical-cat-bg.is-shoot { background: rgba(167,139,250,0.03); }

  .ical-event {
    height: 28px;
    line-height: 28px;
    font-size: 12px;
    font-weight: 500;
    border-radius: 6px;
    padding: 0 8px 0 11px;
    display: flex;
    align-items: center;
    gap: 5px;
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    margin: 2px 3px;
    transition: var(--transition);
    position: relative;
    z-index: 2;
    min-width: 0;
  }
  /* Inner-Hülle: Kürzel (Avatar) + Text wandern beim Horizontal-Scroll als EINE Einheit.
     Transform sitzt hier (nicht am Label allein), sonst klebt das Kürzel in Safari links. */
  .ical-event-inner {
    display: flex;
    align-items: center;
    gap: 5px;
    flex: 1 1 auto;
    min-width: 0;
    /* Label-Pinning per position/left statt transform: erzeugt KEINEN Composite-Layer.
       Ein transform-Layer wird auf iOS Safari beim Scrollen über den Sticky-Header gemalt
       (egal welcher z-index). Mit position:relative + left (ohne z-index) bleibt das Label
       im normalen Mal-Fluss → der opake Header (z-index 20) verdeckt es zuverlässig. */
    position: relative;
    left: var(--label-offset, 0px);
    max-width: var(--label-max-width, 100%);
  }
  /* Text inside bars: JS keeps the inner unit visible while scrolling horizontally. */
  .ical-event-label {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    min-width: 0;
  }
  .ical-event::before {
    content: "";
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: currentColor;
    opacity: 0.85;
    border-radius: 5px 0 0 5px;
  }
  .ical-event:hover { filter: brightness(1.15); z-index: 10; }
  .ical-event.cuts-left { border-top-left-radius: 0; border-bottom-left-radius: 0; padding-left: 8px; margin-left: 0; }
  .ical-event.cuts-left::before { display: none; }
  .ical-event.cuts-right { border-top-right-radius: 0; border-bottom-right-radius: 0; margin-right: 0; }

  .ical-event.phase-shoot    { background: linear-gradient(90deg,rgba(167,139,250,0.32),rgba(139,92,246,0.22)); color: #ddd6fe; border: 1px solid rgba(167,139,250,0.25); }
  .ical-event.phase-production { background: linear-gradient(90deg,rgba(251,191,36,0.22),rgba(245,158,11,0.14)); color: #fcd34d; border: 1px solid rgba(251,191,36,0.18); }
  .ical-event.phase-production:not(.cuts-right) { border-right: 2px solid rgba(239,68,68,0.65); }
  .ical-event.phase-editing  { background: linear-gradient(90deg,rgba(52,211,153,0.22),rgba(16,185,129,0.14)); color: #6ee7b7; border: 1px solid rgba(52,211,153,0.18); }
  .ical-event.phase-cutter   { background: linear-gradient(90deg,rgba(251,191,36,0.28),rgba(245,158,11,0.18)); color: #fde68a; border: 1px solid rgba(251,191,36,0.22); }
  .ical-event.phase-posting:not(.cuts-left) { border-left: 2px solid rgba(20,184,166,0.55); }
  .ical-event.phase-posting  { background: linear-gradient(90deg,rgba(20,184,166,0.32),rgba(45,212,191,0.22)); color: #5eead4; border: 1px solid rgba(20,184,166,0.28); }
  .ical-event.phase-vacation { background: linear-gradient(90deg,rgba(148,163,184,0.30),rgba(100,116,139,0.22)); color: #e2e8f0; border: 1px solid rgba(148,163,184,0.28); }
  .ical-event.phase-deadline { background: linear-gradient(90deg,rgba(239,68,68,0.30),rgba(220,38,38,0.20)); color: #fca5a5; border: 1px solid rgba(239,68,68,0.25); }
  .ical-event.phase-todo     { background: linear-gradient(90deg,rgba(100,210,255,0.22),rgba(56,189,248,0.14)); color: #7dd3fc; border: 1px solid rgba(100,210,255,0.18); }
  .ical-event.phase-meeting  { background: linear-gradient(90deg,rgba(99,102,241,0.30),rgba(79,70,229,0.20)); color: #c7d2fe; border: 1px solid rgba(99,102,241,0.25); }
  .month-bar.phase-meeting   { background: linear-gradient(90deg,rgba(99,102,241,0.30),rgba(79,70,229,0.20)); color: #c7d2fe; border: 1px solid rgba(99,102,241,0.22); }
  .ical-event.nicht-gedreht  { background: linear-gradient(90deg,rgba(255,69,58,0.32),rgba(220,38,38,0.22))!important; color: #fca5a5!important; border-color: rgba(255,69,58,0.4)!important; }
  .month-bar.nicht-gedreht   { background: linear-gradient(90deg,rgba(255,69,58,0.35),rgba(220,38,38,0.22))!important; color: #fca5a5!important; }

  /* Mobile: ultra-compact calendar */
  @media (max-width: 640px) {
    /* Grid rows kleiner */
    .ical-track { grid-template-rows: minmax(44px, auto); grid-auto-rows: minmax(24px, auto); grid-row-gap: 2px; padding-bottom: 12px; }
    /* Scrollbar verstecken */
    .ical-scroll::-webkit-scrollbar { height: 0; }
    .ical-scroll { max-height: none; }
    /* Kategorie-Labels: nur Icon – bereits in Base-CSS, hier nur compact override */
    .ical-cat-label .ical-cat-icon { width: 22px; height: 22px; font-size: 12px; }
    /* Tag-Header kompakter */
    .ical-day-head { padding: 5px 2px 4px; min-height: 44px; gap: 1px; }
    .ical-day-head .ical-dname { font-size: 9px; letter-spacing: 0.3px; }
    .ical-day-head .ical-dnum { font-size: 13px; font-weight: 500; }
    .ical-day-head.today .ical-dnum { width: 22px; min-width: 22px; max-width: 22px; height: 22px; min-height: 22px; max-height: 22px; flex-basis: 22px; font-size: 11px; font-weight: 700; }
    /* Events: kompakt */
    .ical-event {
      height: 20px; line-height: 20px;
      font-size: 9.5px; margin: 1px 1px;
      border-radius: 4px; padding: 0 5px;
    }
    .ical-event::before { width: 3px; }
    /* Filter-Bar: horizontal scrollbar statt wrap */
    .cal-filter-bar {
      flex-wrap: nowrap;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      padding: 7px 12px;
      gap: 6px;
      scrollbar-width: none;
    }
    .cal-filter-bar::-webkit-scrollbar { display: none; }
    .cal-filter-btn { flex-shrink: 0; padding: 4px 10px; font-size: 11px; }
    .cal-filter-label { display: none; }
    /* Kalender-Header etwas kompakter */
    .calendar-header { padding: 10px 12px; }
    .calendar-month { font-size: 17px; }
  }

  .ical-empty-cell {

  /* Kategorie-Filter-Buttons */
  .cal-filter-bar {
    display: flex;
    gap: 6px;
    padding: 10px 16px;
    flex-wrap: nowrap;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;

  .cal-filter-label {

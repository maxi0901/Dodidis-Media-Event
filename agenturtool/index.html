<script>
/* ===========================================================================
   AGENTUR MANAGEMENT TOOL
   ===========================================================================
   Datenhaltung: MySQL-Backend (api.php) als Quelle der Wahrheit
   + LocalStorage-Cache für schnellen UI-Start.
   Alle Operationen gehen über saveStore() / loadStore().
   =========================================================================== */

/* ----------- BACKEND CLIENT (REST + Sessions) ----------- */
const APP_BASE = (document.querySelector('meta[name=app-base]')?.content || './').replace(/\/+$/, '/') ;
const API_BASE = APP_BASE + 'api';
const SESSION_META = (() => {
  try { return JSON.parse(document.querySelector('meta[name=x-session]')?.content || 'null'); }
  catch { return null; }
})();
let CSRF = document.querySelector('meta[name=csrf]')?.content || (SESSION_META && SESSION_META.csrf) || '';

async function apiCall(method, path, body) {
  const opts = { method, credentials: 'same-origin', headers: { 'X-CSRF-Token': CSRF } };
  if (body !== undefined) {
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(body);
  }
  let res;
  try {
    res = await fetch(API_BASE + path, opts);
  } catch (e) {
    console.error('[api] network', e);
    throw new Error('Netzwerkfehler');
  }
  if (res.status === 401) {
    location.href = APP_BASE + 'login.php';
    throw new Error('401');
  }
  let j;
  try { j = await res.json(); } catch { j = { success: false, error: 'HTTP ' + res.status }; }
  if (!res.ok || !j.success) {
    throw new Error(j.error || ('HTTP ' + res.status));
  }
  return j.data;
}
const apiGet  = (p)    => apiCall('GET',    p);
const apiPost = (p, b) => apiCall('POST',   p, b ?? {});
const apiPut  = (p, b) => apiCall('PUT',    p, b ?? {});
const apiDel  = (p)    => apiCall('DELETE', p);

// Legacy-Konstante – einige bestehende Stellen referenzieren API_URL noch im Console-Log
const API_URL = API_BASE;

// Bootstrap: optional kompletter Daten-Import aus URL-Hash (LocalStorage-Migration)
(function bootstrapFromHash() {
  try {
    const h = (location.hash || '').replace(/^#/, '');
    if (!h) return;
    const params = new URLSearchParams(h);
    const importJson = params.get('__store');
    if (importJson) {
      try {
        const parsed = JSON.parse(importJson);
        if (parsed && typeof parsed === 'object') {
          localStorage.setItem('agentur_mgmt_v1', importJson);
          console.log('[migration] LocalStorage-Stand aus URL-Hash importiert.');
        }
      } catch (e) { console.error('[migration] Hash-Import fehlgeschlagen:', e); }
      history.replaceState(null, '', location.pathname + location.search);
    }
  } catch {}
})();

// Truthy marker: Cloud-Backend ist verfügbar (eigene PHP-API auf gleichem Host).
const supa = true;

// Hash a password to SHA-256 hex (so we never store plaintext in the cloud)
async function hashPassword(plain) {
  if (!plain) return '';
  // Bereits gehashte Passwörter beginnen mit 'sha256$' – nicht doppelt hashen
  if (plain.startsWith('sha256$')) return plain;
  const buf = new TextEncoder().encode(plain);
  const digest = await crypto.subtle.digest('SHA-256', buf);
  const hex = Array.from(new Uint8Array(digest)).map(b => b.toString(16).padStart(2, '0')).join('');
  return 'sha256$' + hex;
}

/* ----------- STORE ----------- */
const STORE_KEY = 'agentur_mgmt_v1';

const ROLES = {
  ADMIN: 'admin',
  MANAGER: 'manager',
  VIDEOGRAF: 'videograf',
  CUTTER: 'cutter',
  MITARBEITER: 'mitarbeiter'
};

// Rollen-Hierarchie: höherer Wert = mehr Rechte
// Admin > Manager > Videograf > Cutter = Mitarbeiter (gleiche Ebene)
const ROLE_LEVEL = {
  admin: 4,
  manager: 3,
  videograf: 2,
  cutter: 1,
  mitarbeiter: 1
};

// Höchstes Rollen-Level eines Users (oder 0 falls keine bekannte Rolle)
function getRoleLevel(user) {
  if (!user) return 0;
  const roles = user.roles || (user.role ? [user.role] : []);
  return roles.reduce((max, r) => Math.max(max, ROLE_LEVEL[r] || 0), 0);
}

// Darf "viewer" den Urlaub von "target" sehen?
// Regel: Jeder Mitarbeiter sieht alle Urlaube (volle Transparenz).
function canViewVacationOf(viewer, target) {
  return !!(viewer && target);
}

// Darf "viewer" den Urlaub bearbeiten/löschen?
// Regel: Admin oder der Urlaubs-Inhaber selbst
function canEditVacationOf(viewer, target) {
  if (!viewer || !target) return false;
  if (viewer.id === target.id) return true;
  return hasRole(viewer, ROLES.ADMIN);
}

const STATUS = {
  SKRIPT: 'skript',
  GEPLANT: 'geplant',
  GEDREHT: 'gedreht',
  SCHNITT: 'schnitt',
  FERTIG: 'fertig',
  KORREKTUR: 'korrektur',
  FREIGEGEBEN: 'freigegeben',
  ARCHIVIERT: 'archiviert'
};

const STATUS_LABELS = {
  skript: 'Skript',
  geplant: 'Geplant',
  gedreht: 'Gedreht',
  schnitt: 'Im Schnitt',
  fertig: 'Fertig – wartet auf Abnahme',
  korrektur: 'Korrektur',
  freigegeben: 'Freigegeben',
  archiviert: 'Archiviert'
};

const ROLE_LABELS = {
  admin: 'Admin',
  manager: 'Manager',
  videograf: 'Videograf',
  cutter: 'Cutter',
  mitarbeiter: 'Mitarbeiter'
};

const CUSTOMER_STATUS = {
  ONBOARDING: 'onboarding',
  ACTIVE: 'active',
  PAUSED: 'paused'
};

const CUSTOMER_STATUS_LABELS = {
  onboarding: 'Onboarding',
  active: 'Aktiv',
  paused: 'Pausiert'
};

const defaultData = {
  users: [
    {
      id: 'u_raphael',
      username: 'raphael',
      password: 'DMRaphael#1',
      name: 'Raphael Dodidis',
      roles: [ROLES.ADMIN],
      email: 'radodi2121@gmail.com'
    }
  ],
  customers: [],
  projects: [],
  vacations: [],
  todos: [],
  shootDays: [],
  // Zentrale Kalender-Konfiguration: nur Admin setzt einmalig den Token,
  // Gists für ALLE Mitarbeiter laufen über diesen Account
  calendarConfig: {
    token: null,        // GitHub Personal Access Token (gist scope)
    githubUser: null,   // GitHub Username
    agencyGistId: null, // Gist mit allen Agentur-Projekten (Admin)
    enabledAt: null
  },
  session: null
};

function loadStore() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return { ...defaultData };
    const parsed = JSON.parse(raw);
    const merged = { ...defaultData, ...parsed };
    // Migration: single role → roles array
    merged.users.forEach(u => {
      if (!u.roles) u.roles = u.role ? [u.role] : [];
      delete u.role;
    });
    // Falls keine Mitarbeiter existieren, lege den Default-Admin an
    if (!merged.users || merged.users.length === 0) {
      merged.users = JSON.parse(JSON.stringify(defaultData.users));
    }
    // Migration: Urlaubs-Array sicherstellen
    if (!Array.isArray(merged.vacations)) merged.vacations = [];
    // Migration: Todos-Array sicherstellen
    if (!Array.isArray(merged.todos)) merged.todos = [];
    // Migration: Single-Assignee → Array
    merged.todos.forEach(t => {
      if (!t.assigneeIds) t.assigneeIds = t.assigneeId ? [t.assigneeId] : [];
      delete t.assigneeId;
      // dueDate ist optional und bleibt erhalten
    });
    // Migration: Drehtag-Array sicherstellen
    if (!Array.isArray(merged.shootDays)) merged.shootDays = [];
    // Migration: calendarConfig sicherstellen
    if (!merged.calendarConfig) merged.calendarConfig = { token: null, githubUser: null, agencyGistId: null, enabledAt: null };
    // Migration: Token aus altem per-user-localStorage übernehmen
    try {
      if (!merged.calendarConfig.token) {
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (k && k.startsWith('agentur_calsync_v1_')) {
            const v = JSON.parse(localStorage.getItem(k));
            if (v?.token && v?.username) {
              merged.calendarConfig.token = v.token;
              merged.calendarConfig.githubUser = v.username;
              merged.calendarConfig.enabledAt = v.lastSyncedAt || new Date().toISOString();
              if (v.scope === 'agency' && v.gistId) merged.calendarConfig.agencyGistId = v.gistId;
              break;
            }
          }
        }
      }
    } catch {}
    return merged;
  } catch {
    return { ...defaultData };
  }
}

/* ----------- ROLE & STATUS HELPERS ----------- */
function userRoles(user) {
  if (!user) return [];
  return user.roles || (user.role ? [user.role] : []);
}

function hasRole(user, ...roles) {
  const r = userRoles(user);
  return roles.some(role => r.includes(role));
}

function primaryRoleLabel(user) {
  const roles = userRoles(user);
  if (roles.length === 0) return '–';
  if (roles.length === 1) return ROLE_LABELS[roles[0]];
  return roles.map(r => ROLE_LABELS[r]).join(' · ');
}

function customerStatus(customer) {
  if (!customer) return CUSTOMER_STATUS.ONBOARDING;
  if (customer.status === CUSTOMER_STATUS.PAUSED) return CUSTOMER_STATUS.PAUSED;
  const checklist = customer.checklist || {};
  const done = ONBOARDING_CHECKLIST.filter(i => checklist[i.key]).length;
  return done === ONBOARDING_CHECKLIST.length ? CUSTOMER_STATUS.ACTIVE : CUSTOMER_STATUS.ONBOARDING;
}

/* ----------- VACATION HELPERS ----------- */
function getUserVacations(userId) {
  return store.vacations.filter(v => v.userId === userId);
}

function isUserOnVacationOn(userId, dateStr) {
  if (!userId || !dateStr) return false;
  return store.vacations.some(v =>
    v.userId === userId && dateStr >= v.startDate && dateStr <= v.endDate
  );
}

function isUserOnVacationDuringRange(userId, startDate, endDate) {
  if (!userId) return false;
  if (!startDate && !endDate) return false;
  const s = startDate || endDate;
  const e = endDate || startDate;
  return store.vacations.some(v =>
    v.userId === userId && !(v.endDate < s || v.startDate > e)
  );
}

// Klammer-Zusatz für den Videograf-Dropdown – nur Drehtag relevant.
function vacationSuffixForVideograf(userId, shootDate) {
  if (!userId) return '';
  if (shootDate) {
    if (isUserOnVacationOn(userId, shootDate)) return ' (am Drehtag im Urlaub)';
    return '';
  }
  const today = new Date().toISOString().slice(0, 10);
  if (isUserOnVacationOn(userId, today)) return ' (Urlaub)';
  return '';
}

// Klammer-Zusatz für den Cutter-Dropdown – relevant ist der Schnittzeitraum (Drehtag bis Deadline).
function vacationSuffixForCutter(userId, shootDate, deadline) {
  if (!userId) return '';
  const rangeStart = shootDate || deadline;
  const rangeEnd = deadline || shootDate;
  if (rangeStart && rangeEnd) {
    if (isUserOnVacationDuringRange(userId, rangeStart, rangeEnd)) {
      return ' (ist im Schnittzeitraum im Urlaub)';
    }
    return '';
  }
  const today = new Date().toISOString().slice(0, 10);
  if (isUserOnVacationOn(userId, today)) return ' (Urlaub)';
  return '';
}

function getRelevantProjects(user, source = null) {
  const all = source || store.projects;
  if (hasRole(user, ROLES.ADMIN)) return all;
  const result = new Map();
  if (hasRole(user, ROLES.MANAGER)) {
    const myCustomerIds = new Set(store.customers.filter(c => c.managerId === user.id).map(c => c.id));
    all.filter(p => myCustomerIds.has(p.customerId)).forEach(p => result.set(p.id, p));
  }
  if (hasRole(user, ROLES.VIDEOGRAF)) {
    all.filter(p => p.videografId === user.id).forEach(p => result.set(p.id, p));
  }
  if (hasRole(user, ROLES.CUTTER)) {
    // Cutter sieht NUR abgedrehte (oder weitere) Projekte – nicht offene/geplante.
    all
      .filter(p => p.cutterId === user.id && cutterCanSeeStatus(p.status))
      .forEach(p => result.set(p.id, p));
  }
  return Array.from(result.values());
}

/* Zählt Projekte, die aktuell auf eine Aktion dieser Person warten */
function countActionableProjects(user) {
  if (!user) return 0;
  const ids = new Set();
  const userId = user.id;
  store.projects.forEach(p => {
    if (p.status === STATUS.ARCHIVIERT || p.status === STATUS.FREIGEGEBEN) return;
    // Videograf: noch nicht abgedreht
    if (hasRole(user, ROLES.VIDEOGRAF) && p.videografId === userId
        && (p.status === STATUS.SKRIPT || p.status === STATUS.GEPLANT)) {
      ids.add(p.id);
      return;
    }
    // Cutter: abgedreht / im Schnitt / Korrektur
    if (hasRole(user, ROLES.CUTTER) && p.cutterId === userId
        && (p.status === STATUS.GEDREHT || p.status === STATUS.SCHNITT || p.status === STATUS.KORREKTUR)) {
      ids.add(p.id);
      return;
    }
    // Manager/Admin: fertige Projekte zur Freigabe
    if (p.status === STATUS.FERTIG) {
      if (hasRole(user, ROLES.ADMIN)) { ids.add(p.id); return; }
      if (hasRole(user, ROLES.MANAGER)) {
        const c = store.customers.find(x => x.id === p.customerId);
        if (c?.managerId === userId) ids.add(p.id);
      }
    }
  });
  return ids.size;
}

let cloudReady = false;
let cloudPullInFlight = false;

let lastDashboardChange = 0;

// Deletion-Tracking: explizite Tombstones, damit Race-Conditions zwischen
// gleichzeitig laufenden Clients keine versehentlichen "wegen List-Diff gelöschten"
// Einträge produzieren.
function trackDeletion(collectionLocalKey, id) {
  if (!store._pendingDeletions) store._pendingDeletions = {};
  if (!store._pendingDeletions[collectionLocalKey]) store._pendingDeletions[collectionLocalKey] = [];
  if (!store._pendingDeletions[collectionLocalKey].includes(id)) {
    store._pendingDeletions[collectionLocalKey].push(id);
  }
}

// Bulk-Push: Document-Form an api.php?action=push mit Session-Cookie + CSRF-Header.
// Das Mapping auf normalisierte Spalten passiert serverseitig in api.php.
async function pushAllToCloud() {
  // Passwort-Hashes sicherstellen (Frontend hasht clientseitig, das Backend prüft 1:1).
  const usersOut = await Promise.all((store.users || []).map(async u => ({
    ...u,
    password: u.password ? await hashPassword(u.password) : ''
  })));
  store.users = usersOut;

  const upserts = {};
  upserts.users = usersOut.map(u => ({ id: u.id, data: u }));
  CLOUD_COLLECTIONS.slice(1).forEach(c => {
    upserts[c.table] = (store[c.local] || []).map(r => ({ id: r.id, data: r }));
  });
  upserts.app_config = [
    { key: 'calendarConfig', value: store.calendarConfig || {} },
    { key: 'activity',       value: { entries: (store.activity || []).slice(0, 500) } }
  ];

  const pending = store._pendingDeletions || {};
  const deletions = {};
  for (const c of CLOUD_COLLECTIONS) {
    const ids = pending[c.local] || [];
    if (ids.length > 0) deletions[c.table] = ids;
  }

  let res, json;
  try {
    res = await fetch(API_BASE.replace(/\/api$/, '') + '/api.php?action=push', {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': CSRF },
      body: JSON.stringify({ upserts, deletions })
    });
    if (res.status === 401) { location.href = APP_BASE + 'login.php'; return; }
    json = await res.json();
  } catch (e) {
    console.error('[cloud push] network/parse error', e);
    return;
  }
  if (!res.ok || !(json.ok || json.success)) {
    console.error('[cloud push]', (json && (json.error || json.message)) || ('HTTP ' + res.status));
    return;
  }
  for (const c of CLOUD_COLLECTIONS) {
    if (deletions[c.table]) pending[c.local] = [];
  }
  store._pendingDeletions = pending;
  try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch {}
}

// Vollständiger Pull aus api.php?action=pull (liefert Document-Form).
async function pullAllFromCloud() {
  if (cloudPullInFlight) return false;
  cloudPullInFlight = true;
  try {
    const res = await fetch(API_BASE.replace(/\/api$/, '') + '/api.php?action=pull', {
      credentials: 'same-origin',
      cache: 'no-store'
    });
    if (res.status === 401) { location.href = APP_BASE + 'login.php'; return false; }
    if (!res.ok) {
      console.error('[cloud pull] HTTP', res.status);
      return null; // Server-Fehler – kein Bootstrap versuchen
    }
    const json = await res.json();
    if (!(json.ok || json.success)) {
      console.error('[cloud pull]', json.error || 'unknown error');
      return null; // API-Fehler – kein Bootstrap versuchen
    }
    const data = json.data || {};
    let totalRows = 0;
    CLOUD_COLLECTIONS.forEach(c => { totalRows += (data[c.table] || []).length; });
    totalRows += (data.app_config || []).length;
    if (totalRows === 0) return false; // DB leer → Bootstrap erwünscht

    CLOUD_COLLECTIONS.forEach(c => {
      if (Array.isArray(data[c.table])) store[c.local] = data[c.table];
    });
    if (Array.isArray(data.app_config)) {
      const cfg = data.app_config.find(r => r.key === 'calendarConfig');
      if (cfg) store.calendarConfig = cfg.value;
      const act = data.app_config.find(r => r.key === 'activity');
      if (act && act.value && Array.isArray(act.value.entries)) store.activity = act.value.entries;
    }
    try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch {}
    return true;
  } catch (e) {
    console.error('[cloud pull]', e);
    return false;
  } finally {
    cloudPullInFlight = false;
  }
}

async function initCloudSync() {
  const hadCloudData = await pullAllFromCloud();
  cloudReady = true;
  if (hadCloudData === false) {
    // DB war leer (kein Server-Fehler) → aktuellen LocalStorage-Stand initial hochladen
    console.log('[cloud] Bootstrap – LocalStorage → MySQL');
    await pushAllToCloud();
  }
  subscribeCloudChannel();
  try {
    const sess = (typeof getCurrentUser === 'function') ? getCurrentUser() : null;
    if (sess && typeof renderPage === 'function') {
      renderPage();
    }
  } catch (e) { console.error('[cloud rerender]', e); }
}

// Light-Polling: kleines Aggregat über /api/dashboard.php; bei last_change-Diff voller Pull.
function subscribeCloudChannel() {
  setInterval(async () => {
    if (cloudPullInFlight) return;
    if (cloudPushTimer) {
      clearTimeout(cloudPushTimer);
      cloudPushTimer = null;
      try { await pushAllToCloud(); } catch (e) { console.error('[cloud push before pull]', e); }
    }
    try {
      const headers = { 'X-CSRF-Token': CSRF };
      if (lastDashboardEtag) headers['If-None-Match'] = lastDashboardEtag;
      const res = await fetch(API_BASE + '/dashboard.php', { credentials: 'same-origin', headers });
      if (res.status === 304) return;
      if (res.status === 401) { location.href = APP_BASE + 'login.php'; return; }
      const etag = res.headers.get('ETag');
      if (etag) lastDashboardEtag = etag;
      const j = await res.json().catch(() => null);
      if (!j || !j.success) return;
      const change = j.data && j.data.last_change ? j.data.last_change : 0;
      if (change && change !== lastDashboardChange) {
        const before = JSON.stringify(store);
        await pullAllFromCloud();
        lastDashboardChange = change;
        if (JSON.stringify(store) !== before) {
          try { renderPage?.(); } catch {}
        }
      }
    } catch (e) {
      // Stille Fehler – Polling ist best effort.
    }
  }, 12000); // 12s Light-Polling
}

// Cloud-Sync starten sobald DOM bereit
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', () => initCloudSync());
} else {
  initCloudSync();
}

const uid = (prefix = 'id') => prefix + '_' + Math.random().toString(36).slice(2, 9);
const $ = sel => document.querySelector(sel);
const $$ = sel => document.querySelectorAll(sel);
const escape = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate = d => {
  if (!d) return '–';
  const date = new Date(d);
  return date.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' });
};
const fmtDateTime = d => {
  if (!d) return '–';
  const date = new Date(d);
  return date.toLocaleString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
};
const initials = name => (name || '?').split(' ').map(s => s[0]).join('').slice(0, 2).toUpperCase();

function userAvatarColor(user) {
  if (!user) return '#777';
  if (user.avatarColor) return user.avatarColor;
  // Hash der ID → konsistente HSL-Farbe
  const id = user.id || '';
  let h = 0;
  for (let i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) | 0;
  const hue = Math.abs(h) % 360;
  return `hsl(${hue}, 62%, 55%)`;
}

function renderAvatar(user, size = 24, fontSize = null) {
  const fs = fontSize || Math.max(9, Math.round(size * 0.42));
  if (!user) {
    return `<div class="avatar-circle" style="width:${size}px;height:${size}px;background:#555;font-size:${fs}px;">?</div>`;
  }
  if (user.avatarImage) {
    return `<div class="avatar-circle" style="width:${size}px;height:${size}px;background-image:url('${user.avatarImage}');"></div>`;
  }
  const bg = userAvatarColor(user);
  const init = initials(user.name);
  return `<div class="avatar-circle" style="width:${size}px;height:${size}px;background:${bg};font-size:${fs}px;">${escape(init)}</div>`;
}

function slugify(str) {
  return String(str || '')
    .toLowerCase()
    .replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss')
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/^-+|-+$/g, '');
}

function generateFolderName(customer, project) {
  if (!customer) return '';
  const customerName = (customer.name || '').trim();
  // Drehdatum bevorzugt, sonst Posting-Datum als Fallback
  const dateStr = project?.shootDate || project?.postingDate;
  if (!dateStr) return customerName;
  const d = new Date(dateStr);
  const dd = String(d.getDate()).padStart(2, '0');
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const yyyy = d.getFullYear();
  return `${customerName} - ${dd}.${mm}.${yyyy}`;
}

// PHP-Session ist die Quelle der Wahrheit. SESSION_META kommt vom Backend (index.php).
function getCurrentUser() {
  if (!SESSION_META) return null;
  if (SESSION_META.type === 'staff' && SESSION_META.uid) {
    const user = (store.users || []).find(u => u.id === SESSION_META.uid)
              || { id: SESSION_META.uid, name: SESSION_META.name, roles: SESSION_META.roles || [] };
    return { type: 'staff', user };
  }
  if (SESSION_META.type === 'customer' && SESSION_META.cid) {
    const customer = (store.customers || []).find(c => c.id === SESSION_META.cid)
                  || { id: SESSION_META.cid, name: SESSION_META.name };
    return { type: 'customer', customer };
  }
  return null;
}

    'customer-overview': renderCustomerOverview
  };

  // Default page for customers
  if (session.type === 'customer' && currentPage !== 'customer-overview') {
    currentPage = 'customer-overview';
  }
  // Permission check: only admins see admin
  if (currentPage === 'admin' && (session.type !== 'staff' || !hasRole(session.user, ROLES.ADMIN))) {
    currentPage = 'dashboard';
  }

  const render = pages[currentPage] || renderDashboard;
  render(session);
}

/* Videograf-Drehtag-Checkliste fürs Dashboard */
function renderVideografShootChecklist(user) {
  if (!hasRole(user, ROLES.VIDEOGRAF)) return '';
  const today = new Date().toISOString().slice(0,10);
  const horizon = addDays(today, 14); // nächste 2 Wochen
  const projects = store.projects.filter(p =>
    p.videografId === user.id &&
    p.shootDate &&
    p.shootDate >= today &&
    p.shootDate <= horizon &&
    p.status !== STATUS.ARCHIVIERT &&
    p.status !== STATUS.FREIGEGEBEN
  ).sort((a,b) => a.shootDate.localeCompare(b.shootDate));
  if (projects.length === 0) return '';
  // Gruppiere nach Drehtag
  const byDate = {};
  projects.forEach(p => { (byDate[p.shootDate] = byDate[p.shootDate] || []).push(p); });
  return `
    <div class="card">
      <div class="card-header"><div class="card-title">Deine Drehtage</div></div>
      <div style="padding: 14px 16px;">
        ${Object.entries(byDate).map(([date, list]) => {
          const allShot = list.every(p => p.status === STATUS.GEDREHT || p.status === STATUS.SCHNITT || p.status === STATUS.FERTIG || p.status === STATUS.KORREKTUR);
          const dateLabel = new Date(date).toLocaleDateString('de-DE', { weekday: 'long', day: '2-digit', month: 'long' });
          return `
            <div class="shoot-day-card">
              <div class="shoot-day-header">
                <span class="date">${escape(dateLabel)}</span>
                <span class="count">${list.filter(p => p.status === STATUS.GEDREHT || p.status === STATUS.SCHNITT || p.status === STATUS.FERTIG || p.status === STATUS.KORREKTUR).length} / ${list.length} abgedreht</span>
              </div>
              ${list.map(p => {
                const c = store.customers.find(x => x.id === p.customerId);
                const shot = p.status === STATUS.GEDREHT || p.status === STATUS.SCHNITT || p.status === STATUS.FERTIG || p.status === STATUS.KORREKTUR;
                return `
                  <div class="shoot-item ${shot ? 'shot' : ''}">
                    <div class="shoot-item-body" onclick="openProjectModal('${p.id}')" style="cursor:pointer;">
                      <div class="shoot-item-title">${escape(p.title)}</div>
                      <div class="shoot-item-meta">${escape(c?.name || (p.isInternal ? 'Intern' : '–'))}</div>
                    </div>
                    ${shot
                      ? '<span class="badge badge-fertig">✓ abgedreht</span>'
                      : `<button class="btn btn-primary btn-sm" onclick="markAsShot('${p.id}')">Als abgedreht markieren</button>`
                    }
                  </div>
                `;
              }).join('')}
            </div>
          `;
        }).join('')}
      </div>
    </div>
  `;
}

// Zentrale Permission-Checks (clientseitig – ersetzen keine echte RLS, aber blocken Bedienfehler & casual misuse)
function canActOnProject(project, session, action) {
  if (!session || session.type !== 'staff') return false;
  const user = session.user;
  const userId = user.id;
  const isAdmin = hasRole(user, ROLES.ADMIN);
  const isManager = hasRole(user, ROLES.MANAGER);
  if (isAdmin) return true;
  // Manager nur für eigene Kunden-Projekte (und alle internen)
  if (isManager) {
    const isMine = project.isInternal
      ? true
      : (() => {
          const c = store.customers.find(x => x.id === project.customerId);
          return !c || !c.managerId || c.managerId === userId;
        })();
    if (isMine && ['approve','correction','archive','delete','markAsShot','cutterAccept','cutterMarkDone','cutterRevert'].includes(action)) {
      return true;
    }
  }
  // Videograf darf "abgedreht markieren" auf seinen eigenen Drehs
  if (action === 'markAsShot' && project.videografId === userId) return true;
  // Cutter darf annehmen / fertig / revert auf seinen Projekten
  if ((action === 'cutterAccept' || action === 'cutterMarkDone' || action === 'cutterRevert')
      && project.cutterId === userId) return true;
  return false;
}

function markAsShot(projectId) {
  const p = store.projects.find(x => x.id === projectId);
  if (!p) { appAlert('Projekt nicht gefunden.', { title: 'Fehler' }); return; }
  const session = getCurrentUser();
  if (!canActOnProject(p, session, 'markAsShot')) {
    appAlert('Du hast keine Berechtigung, dieses Projekt zu ändern.', { title: 'Nicht erlaubt' });
    return;
  }
  // Direkt Status setzen – kein Confirm-Dialog, der irgendwo hängen kann
  p.status = STATUS.GEDREHT;
  p.shotAt = new Date().toISOString();
  logActivity('project', p.id, 'markAsShot', { title: p.title });
  saveStore();
  console.log('[markAsShot] Status gesetzt auf:', p.status, 'für Projekt:', p.title);
  // Cutter informieren
  if (p.cutterId) {
    try {
      if ('Notification' in window && Notification.permission === 'granted') {
        new Notification('Video bereit zum Schnitt', { body: p.title });
      }
    } catch {}
    const cutter = store.users.find(u => u.id === p.cutterId);
    if (cutter) notifyUser(p.cutterId, 'Video bereit zum Schnitt', `„${p.title}" wurde abgedreht.`);
  }
  closeModal();
  renderPage();
  // Hintergrund-Sync ohne UI-Block
  setTimeout(() => { try { writeLiveICS(); } catch(e){ console.warn(e); } }, 50);
  showToast('Als abgedreht markiert', `„${p.title}" ist jetzt bereit für den Schnitt`);
}

/* Cutter-Queue fürs Dashboard */
function renderCutterQueue(user) {
  if (!hasRole(user, ROLES.CUTTER)) return '';
  // Nur ab abgedreht sichtbar – nicht abgedrehte Projekte tauchen erst gar nicht auf
  const projects = store.projects.filter(p =>
    p.cutterId === user.id &&
    cutterCanSeeStatus(p.status) &&
    p.status !== STATUS.ARCHIVIERT &&
    p.status !== STATUS.FREIGEGEBEN
  );
  if (projects.length === 0) return '';
  const ready = projects.filter(p => p.status === STATUS.GEDREHT);
  const inProgress = projects.filter(p => p.status === STATUS.SCHNITT);
  const correction = projects.filter(p => p.status === STATUS.KORREKTUR);
  const pendingApproval = projects.filter(p => p.status === STATUS.FERTIG);
  return `
    <div class="card">
      <div class="card-header"><div class="card-title">Deine Schnitt-Queue</div></div>
      <div style="padding: 14px 16px;">
        ${correction.length > 0 ? `
          <div class="cut-queue-section">
            <div class="cut-queue-section-title">⚠️ Korrektur angefragt</div>
            ${correction.map(p => renderCutQueueItem(p, 'correction')).join('')}
          </div>` : ''}
        ${ready.length > 0 ? `
          <div class="cut-queue-section">
            <div class="cut-queue-section-title">✅ Bereit zum Schnitt</div>
            ${ready.map(p => renderCutQueueItem(p, 'ready')).join('')}
          </div>` : ''}
        ${inProgress.length > 0 ? `
          <div class="cut-queue-section">
            <div class="cut-queue-section-title">✂️ In Bearbeitung</div>
            ${inProgress.map(p => renderCutQueueItem(p, 'progress')).join('')}
          </div>` : ''}
        ${pendingApproval.length > 0 ? `
          <div class="cut-queue-section">
            <div class="cut-queue-section-title">⏳ Wartet auf Abnahme</div>
            ${pendingApproval.map(p => renderCutQueueItem(p, 'wait-approval')).join('')}
          </div>` : ''}
      </div>
    </div>
  `;
}

function renderCutQueueItem(p, kind) {
  const c = store.customers.find(x => x.id === p.customerId);
  const subtitle = (c?.name || (p.isInternal ? 'Intern' : '–'));
  // Cutter sehen kein Posting, nur Deadline
  const dl = p.deadline || (p.postingDate ? addDays(p.postingDate, -1) : null);
  const meta = dl ? '· Deadline ' + fmtDate(dl) : '';
  let actionHtml = '';
  if (kind === 'ready' || kind === 'correction') {
    actionHtml = `<button class="btn btn-primary btn-sm" onclick="event.stopPropagation(); cutterAccept('${p.id}')">Annehmen &amp; starten</button>`;
  } else if (kind === 'progress') {
    actionHtml = `<button class="btn btn-primary btn-sm" onclick="event.stopPropagation(); cutterMarkDone('${p.id}')">Fertig melden</button>`;
  }
  return `
    <div class="cut-queue-item" onclick="openProjectModal('${p.id}')">
      <div style="flex:1;">
        <div class="cut-queue-item-title">${escape(p.title)}</div>
        <div class="cut-queue-item-meta">${escape(subtitle)} ${escape(meta)}</div>
      </div>
      ${actionHtml}
    </div>
  `;
}

function cutterAccept(projectId) {
  const idx = store.projects.findIndex(p => p.id === projectId);
  if (idx < 0) return;
  const session = getCurrentUser();
  if (!canActOnProject(store.projects[idx], session, 'cutterAccept')) {
    appAlert('Du hast keine Berechtigung dafür.', { title: 'Nicht erlaubt' });
    return;
  }
  store.projects[idx].status = STATUS.SCHNITT;
  logActivity('project', store.projects[idx].id, 'cutterAccept', { title: store.projects[idx].title });
  saveStore();
  writeLiveICS();
  closeModal();
  renderPage();
}
function cutterMarkDone(projectId) {
  const idx = store.projects.findIndex(p => p.id === projectId);
  if (idx < 0) return;
  const session = getCurrentUser();
  if (!canActOnProject(store.projects[idx], session, 'cutterMarkDone')) {
    appAlert('Du hast keine Berechtigung dafür.', { title: 'Nicht erlaubt' });
    return;
  }
  store.projects[idx].status = STATUS.FERTIG;
  logActivity('project', store.projects[idx].id, 'cutterMarkDone', { title: store.projects[idx].title });
  saveStore();
  writeLiveICS();
  const p = store.projects[idx];
  const c = store.customers.find(x => x.id === p.customerId);
  if (c?.managerId) {
    notifyUser(c.managerId, 'Video wartet auf Freigabe', p.title);
  }
  closeModal();
  renderPage();
}

/* ----------- BULK SELECTION ----------- */
let bulkSelection = { type: null, ids: new Set() };

function toggleBulk(type, id, checked) {
  if (bulkSelection.type !== type) {
    bulkSelection = { type, ids: new Set() };
  }
  if (checked) bulkSelection.ids.add(id);
  else bulkSelection.ids.delete(id);
  renderBulkBar();
}
function clearBulk() {
  bulkSelection = { type: null, ids: new Set() };
  document.querySelectorAll('.bulk-checkbox').forEach(cb => { cb.checked = false; });
  renderBulkBar();
}
function bulkSelectAll(type, ids) {
  bulkSelection = { type, ids: new Set(ids) };
  document.querySelectorAll('.bulk-checkbox').forEach(cb => { cb.checked = true; });
  renderBulkBar();
}
function renderBulkBar() {
  let bar = document.getElementById('bulk-bar');
  if (bulkSelection.ids.size === 0) { if (bar) bar.remove(); return; }
  if (!bar) {
    bar = document.createElement('div');
    bar.id = 'bulk-bar';
    bar.style.cssText = 'position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:rgba(30,30,32,0.95); border:1px solid var(--border); border-radius:12px; padding:10px 14px; display:flex; gap:10px; align-items:center; box-shadow:0 8px 24px rgba(0,0,0,0.4); z-index:200; backdrop-filter:blur(20px);';
    document.body.appendChild(bar);
  }
  const t = bulkSelection.type;
  bar.innerHTML = `
    <span style="font-size:13px; font-weight:500;">${bulkSelection.ids.size} ausgewählt</span>
    ${t === 'customers' ? `
      <button class="btn btn-secondary btn-sm" onclick="bulkPauseCustomers()">Pausieren</button>
      <button class="btn btn-secondary btn-sm" onclick="bulkActivateCustomers()">Aktivieren</button>
    ` : ''}
    ${t === 'projects' ? `
      <button class="btn btn-secondary btn-sm" onclick="bulkArchiveProjects()">Archivieren</button>
    ` : ''}
    <button class="btn btn-danger btn-sm" onclick="bulkDelete()">Löschen</button>
    <button class="btn btn-ghost btn-sm" onclick="clearBulk()">Abbrechen</button>
  `;
}
function _bulkRequireAdmin() {
  const session = getCurrentUser();
  if (!session || session.type !== 'staff' || !hasRole(session.user, ROLES.ADMIN)) {
    appAlert('Nur Admins dürfen Bulk-Aktionen ausführen.', { title: 'Nicht erlaubt' });
    return false;
  }
  return true;
}
async function bulkPauseCustomers() {
  if (!_bulkRequireAdmin()) return;
  const ids = [...bulkSelection.ids];
  ids.forEach(id => { const idx = store.customers.findIndex(c => c.id === id); if (idx >= 0) store.customers[idx].status = 'paused'; });
  saveStore(); clearBulk(); renderPage(); showToast(`${ids.length} Kunden pausiert`, '');
}
async function bulkActivateCustomers() {
  if (!_bulkRequireAdmin()) return;
  const ids = [...bulkSelection.ids];
  ids.forEach(id => { const idx = store.customers.findIndex(c => c.id === id); if (idx >= 0) store.customers[idx].status = null; });
  saveStore(); clearBulk(); renderPage(); showToast(`${ids.length} Kunden aktiv`, '');
}
async function bulkArchiveProjects() {
  if (!_bulkRequireAdmin()) return;
  const ids = [...bulkSelection.ids];
  ids.forEach(id => { const idx = store.projects.findIndex(p => p.id === id); if (idx >= 0) store.projects[idx].status = STATUS.ARCHIVIERT; });
  saveStore(); writeLiveICS(); clearBulk(); renderPage(); showToast(`${ids.length} Projekte archiviert`, '');
}
async function bulkDelete() {
  if (!_bulkRequireAdmin()) return;
  const ids = [...bulkSelection.ids];
  const type = bulkSelection.type;
  const ok = await appConfirm(`Wirklich ${ids.length} Einträge löschen? Die Aktion kann nicht rückgängig gemacht werden.`, { title: 'Bulk-Löschung?', okLabel: 'Alle löschen', danger: true });
  if (!ok) return;
  ids.forEach(id => trackDeletion(type, id));
  if (type === 'projects') store.projects = store.projects.filter(p => !ids.includes(p.id));
  if (type === 'customers') store.customers = store.customers.filter(c => !ids.includes(c.id));
  saveStore(); clearBulk(); renderPage();
}

/* ----------- PROJECTS ----------- */
function renderProjects(session) {
  $('#page-title').textContent = 'Projekte';
  $('#page-subtitle').textContent = 'Alle laufenden Videoprojekte';

  const user = session.user;

  // Reine Cutter (ohne Admin/Manager/Videograf) bekommen die aufgeräumte Card-Sicht
  const isCutterOnly = hasRole(user, ROLES.CUTTER) && !hasRole(user, ROLES.ADMIN, ROLES.MANAGER, ROLES.VIDEOGRAF);
  if (isCutterOnly) {
    return renderCutterProjects(session);
  }

  let projects = getRelevantProjects(user).filter(p => p.status !== STATUS.ARCHIVIERT);
  const canCreate = hasRole(user, ROLES.ADMIN, ROLES.MANAGER);

  // Such- und Filterzustand pro Page (persistiert im LocalStorage)
  const projectFilters = JSON.parse(localStorage.getItem(_filterKey('proj_filters')) || '{}');
  const searchTerm = (projectFilters.q || '').toLowerCase();
  const statusFilter = projectFilters.status || 'all';

  if (searchTerm || statusFilter !== 'all') {
    projects = projects.filter(p => {
      if (statusFilter !== 'all' && p.status !== statusFilter) return false;
      if (!searchTerm) return true;
      const c = store.customers.find(x => x.id === p.customerId);
      const vg = store.users.find(u => u.id === p.videografId);
      const ct = store.users.find(u => u.id === p.cutterId);
      const hay = (p.title + ' ' + (c?.name || '') + ' ' + (vg?.name || '') + ' ' + (ct?.name || '') + ' ' + (p.script || '')).toLowerCase();
      return hay.includes(searchTerm);
    });
  }

  $('#topbar-actions').innerHTML = canCreate
    ? `<div class="flex gap-2">
         <button class="btn btn-secondary" onclick="openShootDayModal()">+ Drehtag</button>
         <button class="btn btn-primary" onclick="openProjectModal()">+ Neues Projekt</button>
       </div>` : '';

  const filterBar = `
    <div class="card mb-4" style="padding:12px 14px;">
      <div style="display:flex; flex-wrap:wrap; gap:10px; align-items:center;">
        <input type="text" id="proj-search" placeholder="🔎 Suche (Titel, Kunde, Videograf, Cutter, Skript)…"
               value="${escape(searchTerm)}"
               oninput="onProjectFilterChange()"
               style="flex:1; min-width:240px; padding:8px 12px; border-radius:8px; background:var(--bg-2); border:1px solid var(--border); color:inherit;"/>
        <select id="proj-status" onchange="onProjectFilterChange()" style="padding:8px 12px; border-radius:8px; background:var(--bg-2); border:1px solid var(--border); color:inherit;">
          <option value="all" ${statusFilter==='all'?'selected':''}>Alle Status</option>
          ${Object.entries(STATUS_LABELS).map(([k,v]) => k !== STATUS.ARCHIVIERT ? `<option value="${k}" ${statusFilter===k?'selected':''}>${escape(v)}</option>` : '').join('')}
        </select>
        ${(searchTerm || statusFilter !== 'all') ? `<button class="btn btn-ghost btn-sm" onclick="resetProjectFilters()">Filter zurücksetzen</button>` : ''}
        <span class="text-sm text-muted">${projects.length} Treffer</span>
      </div>
    </div>
  `;

  if (projects.length === 0) {
    $('#content').innerHTML = filterBar + `
      <div class="card">
        <div class="empty-state">
          <div class="empty-state-icon">🎬</div>
          ${(searchTerm || statusFilter !== 'all') ? 'Keine Projekte entsprechen deinem Filter.' : 'Noch keine Projekte vorhanden.'}
          ${canCreate && !(searchTerm || statusFilter !== 'all') ? '<br/><br/><button class="btn btn-primary" onclick="openProjectModal()">Erstes Projekt anlegen</button>' : ''}
        </div>
      </div>
    `;
    return;
  }

  // Projekte gruppieren nach shootDayId
  const byShootDay = {};
  const noShootDay = [];
  projects.forEach(p => {
    if (p.shootDayId) {
      (byShootDay[p.shootDayId] = byShootDay[p.shootDayId] || []).push(p);
    } else {
      noShootDay.push(p);
    }
  });

  const shootDayGroups = Object.keys(byShootDay)
    .map(id => {
      const sd = store.shootDays.find(s => s.id === id);
      return sd ? { shootDay: sd, projects: byShootDay[id] } : null;
    })
    .filter(Boolean)
    .sort((a, b) => a.shootDay.date.localeCompare(b.shootDay.date));

  function renderProjectRow(p) {
    const c = store.customers.find(x => x.id === p.customerId);
    const vg = store.users.find(u => u.id === p.videografId);
    const ct = store.users.find(u => u.id === p.cutterId);
    const customerCell = p.isInternal
      ? '<span class="badge" style="background:rgba(100,210,255,0.12); color:#64d2ff; border:1px solid rgba(100,210,255,0.25);">Intern</span>'
      : escape(c?.name || '–');
    return `
      <tr style="cursor:pointer" onclick="openProjectModal('${p.id}')">
        <td><strong>${escape(p.title)}</strong></td>
        <td>${customerCell}</td>
        <td><span class="badge badge-${p.status}">${STATUS_LABELS[p.status]}</span></td>
        <td>${escape(vg?.name || '–')}</td>
        <td>${escape(ct?.name || '–')}</td>
        <td>${fmtDate(p.deadline)}</td>
        <td>${p.isInternal ? '–' : (fmtDate(p.postingDate) + ' 18:00')}</td>
      </tr>
    `;
  }

  function renderTable(rows) {
    return `
      <table>
        <thead>
          <tr>
            <th>Projekt</th>
            <th>Kunde</th>
            <th>Status</th>
            <th>Videograf</th>
            <th>Cutter</th>
            <th>Deadline</th>
            <th>Posting</th>
          </tr>
        </thead>
        <tbody>${rows.map(renderProjectRow).join('')}</tbody>
      </table>
    `;
  }

  $('#content').innerHTML = filterBar + `
    ${shootDayGroups.map(g => {
      const sd = g.shootDay;
      const vg = store.users.find(u => u.id === sd.videografId);
      const cust = store.customers.find(c => c.id === sd.customerId);
      const headerText = `${fmtDate(sd.date)} · ${sd.startTime}–${sd.endTime}${vg ? ' · ' + vg.name : ''}${cust ? ' · ' + cust.name : ''}`;
      return `
        <div class="card mb-4">
          <div class="card-header" style="cursor:pointer;" onclick="openShootDayModal('${sd.id}')">
            <div class="card-title" style="display:flex; align-items:center; gap:10px;">
              <span style="background:rgba(167,139,250,0.2); color:#c4b5fd; padding:3px 10px; border-radius:6px; font-size:11px; font-weight:700; letter-spacing:0.4px;">🎥 DREHTAG</span>
              <span>${escape(headerText)}</span>
              <span style="margin-left:auto; font-size:12px; color:var(--text-3); font-weight:500;">${g.projects.length} Video${g.projects.length === 1 ? '' : 's'}</span>
            </div>
          </div>
          ${renderTable(g.projects)}
        </div>
      `;
    }).join('')}

    ${noShootDay.length > 0 ? `
      <div class="card">
        ${shootDayGroups.length > 0 ? `
          <div class="card-header">
            <div class="card-title">Ohne Drehtag-Zuweisung · ${noShootDay.length}</div>
          </div>
        ` : ''}
        ${renderTable(noShootDay)}
      </div>
    ` : ''}
  `;
}

/* Aufgeräumte Cutter-Projektsicht – nur abgedrehte Projekte, gruppiert nach Status */
function renderCutterProjects(session) {
  const user = session.user;
  $('#page-title').textContent = 'Deine Projekte';
  $('#page-subtitle').textContent = 'Alle Videos, die für dich bereit sind';
  $('#topbar-actions').innerHTML = '';

  const projects = store.projects.filter(p => p.cutterId === user.id && cutterCanSeeStatus(p.status));
  const correction = projects.filter(p => p.status === STATUS.KORREKTUR).sort((a,b) => (a.postingDate || '').localeCompare(b.postingDate || ''));
  const ready = projects.filter(p => p.status === STATUS.GEDREHT).sort((a,b) => (a.postingDate || '').localeCompare(b.postingDate || ''));
  const inProgress = projects.filter(p => p.status === STATUS.SCHNITT).sort((a,b) => (a.postingDate || '').localeCompare(b.postingDate || ''));
  const pendingApproval = projects.filter(p => p.status === STATUS.FERTIG).sort((a,b) => (a.postingDate || '').localeCompare(b.postingDate || ''));
  const done = projects.filter(p => p.status === STATUS.FREIGEGEBEN || p.status === STATUS.ARCHIVIERT).sort((a,b) => (b.approvedAt || '').localeCompare(a.approvedAt || ''));

  if (projects.length === 0) {
    $('#content').innerHTML = `
      <div class="card"><div class="empty-state">
        <div class="empty-state-icon">🎬</div>
        Aktuell sind keine Videos für dich bereit.<br/>
        <span class="text-sm">Sobald der Videograf ein Video als abgedreht markiert, taucht es hier auf.</span>
      </div></div>
    `;
    return;
  }

  function renderCard(p, kind) {
    const c = store.customers.find(x => x.id === p.customerId);
    const customerLabel = c?.name || (p.isInternal ? 'Intern' : '–');
    const vg = store.users.find(u => u.id === p.videografId);
    const deadline = p.deadline || (p.postingDate ? addDays(p.postingDate, -1) : null);
    const todayStr = new Date().toISOString().slice(0,10);
    const daysLeft = deadline ? Math.ceil((new Date(deadline + 'T17:00:00') - new Date()) / (1000*3600*24)) : null;
    const overdue = deadline && deadline < todayStr;
    let action = '';
    if (kind === 'ready' || kind === 'correction') {
      action = `<button class="btn btn-primary" onclick="event.stopPropagation(); cutterAccept('${p.id}')">Annehmen &amp; starten</button>`;
    } else if (kind === 'progress') {
      action = `<button class="btn btn-primary" onclick="event.stopPropagation(); cutterMarkDone('${p.id}')">Fertig melden</button>`;
    }
    const correctionCount = (p.correctionNotes || []).length;
    return `
      <div class="cutter-card ${kind}" onclick="openProjectModal('${p.id}')">
        <div class="cutter-card-main">
          <div class="cutter-card-title">${escape(p.title)}</div>
          <div class="cutter-card-meta">
            <span>📁 ${escape(customerLabel)}</span>
            ${vg ? `<span style="display:inline-flex; align-items:center; gap:5px;">${renderAvatar(vg, 18, 9)} ${escape(vg.name)}</span>` : ''}
            ${deadline ? `<span class="${overdue ? 'cutter-card-overdue' : ''}">⏰ Deadline: ${fmtDate(deadline)} 17:00 ${daysLeft !== null && daysLeft >= 0 ? '· in ' + daysLeft + ' Tagen' : (overdue ? '· überfällig' : '')}</span>` : ''}
            ${correctionCount > 0 ? `<span class="cutter-card-correction">⚠️ ${correctionCount} Korrektur-Notiz${correctionCount > 1 ? 'en' : ''}</span>` : ''}
            ${p.scriptFile ? `<span>📄 Skript-PDF</span>` : ''}
          </div>
        </div>
        ${action ? `<div class="cutter-card-action">${action}</div>` : ''}
      </div>
    `;
  }

  $('#content').innerHTML = `
    ${correction.length > 0 ? `
      <div class="cutter-section">
        <div class="cutter-section-title"><span class="cutter-section-icon" style="background:#fecaca; color:#7f1d1d;">⚠️</span> Korrektur angefragt · ${correction.length}</div>
        ${correction.map(p => renderCard(p, 'correction')).join('')}
      </div>` : ''}
    ${ready.length > 0 ? `
      <div class="cutter-section">
        <div class="cutter-section-title"><span class="cutter-section-icon" style="background:#bbf7d0; color:#14532d;">✅</span> Bereit zum Schnitt · ${ready.length}</div>
        ${ready.map(p => renderCard(p, 'ready')).join('')}
      </div>` : ''}
    ${inProgress.length > 0 ? `
      <div class="cutter-section">
        <div class="cutter-section-title"><span class="cutter-section-icon" style="background:#fde68a; color:#78350f;">✂️</span> In Bearbeitung · ${inProgress.length}</div>
        ${inProgress.map(p => renderCard(p, 'progress')).join('')}
      </div>` : ''}
    ${pendingApproval.length > 0 ? `
      <div class="cutter-section">
        <div class="cutter-section-title"><span class="cutter-section-icon" style="background:#dbeafe; color:#1e3a8a;">⏳</span> Wartet auf Freigabe · ${pendingApproval.length}</div>
        ${pendingApproval.map(p => renderCard(p, 'wait')).join('')}
      </div>` : ''}
    ${done.length > 0 ? `
      <div class="cutter-section">
        <div class="cutter-section-title"><span class="cutter-section-icon" style="background:#99f6e4; color:#064e3b;">✓</span> Erledigt · ${done.length}</div>
        ${done.slice(0, 10).map(p => renderCard(p, 'done')).join('')}
      </div>` : ''}
  `;
}

/* ----------- AUSWERTUNGEN ----------- */
function renderReports(session) {
  const user = session.user;
  if (!hasRole(user, ROLES.ADMIN, ROLES.MANAGER)) {
    $('#content').innerHTML = '<div class="card"><div class="empty-state">Nur für Admin/Manager.</div></div>';
    $('#topbar-actions').innerHTML = '';
    return;
  }
  // Manager (Nicht-Admin) sieht nur eigene Kunden
  const isAdminUser = hasRole(user, ROLES.ADMIN);
  const filterCustomers = (cs) => isAdminUser ? cs : cs.filter(c => !c.managerId || c.managerId === user.id);
  $('#page-title').textContent = 'Auswertungen';
  $('#page-subtitle').textContent = 'Zahlen, Auslastung und KPIs';
  $('#topbar-actions').innerHTML = '';

  // 1. Umsatz pro Kunde (vertraglich monatlich)
  const customersByRevenue = filterCustomers(store.customers)
    .filter(c => customerStatus(c) !== 'paused')
    .map(c => ({
      name: c.name,
      monthly: parseFloat(c.monthlyRate) || 0,
      videosPerMonth: parseInt(c.videosPerMonth) || 0,
      status: customerStatus(c)
    }))
    .sort((a, b) => b.monthly - a.monthly);
  const totalMonthly = customersByRevenue.reduce((s, c) => s + c.monthly, 0);
  const totalVideos = customersByRevenue.reduce((s, c) => s + c.videosPerMonth, 0);

  // 2. Soll/Ist: tatsächlich produzierte Videos in den letzten 30 Tagen
  const now = Date.now();
  const monthAgo = now - 30 * 24 * 60 * 60 * 1000;
  const recentProjects = store.projects.filter(p => {
    if (!p.approvedAt) return false;
    return new Date(p.approvedAt).getTime() >= monthAgo;
  });
  const actualPerCustomer = {};
  recentProjects.forEach(p => {
    actualPerCustomer[p.customerId] = (actualPerCustomer[p.customerId] || 0) + 1;
  });

  // 3. Auslastung pro Videograf (Drehtage im aktuellen Monat)
  const monthStart = new Date(); monthStart.setDate(1); monthStart.setHours(0,0,0,0);
  const monthStartStr = localDateStr(monthStart);
  const monthEnd = new Date(monthStart); monthEnd.setMonth(monthEnd.getMonth() + 1);
  const monthEndStr = localDateStr(monthEnd);
  const videografs = store.users.filter(u => hasRole(u, ROLES.VIDEOGRAF));
  const videografStats = videografs.map(vg => {
    const days = (store.shootDays || []).filter(s => s.videografId === vg.id && s.date >= monthStartStr && s.date < monthEndStr);
    return { name: vg.name, count: days.length };
  }).sort((a, b) => b.count - a.count);

  // 4. Auslastung Cutter: laufende Projekte (status = GEDREHT, SCHNITT, KORREKTUR)
  const cutters = store.users.filter(u => hasRole(u, ROLES.CUTTER));
  const cutterStats = cutters.map(ct => {
    const queue = store.projects.filter(p => p.cutterId === ct.id && [STATUS.GEDREHT, STATUS.SCHNITT, STATUS.KORREKTUR].includes(p.status));
    return { name: ct.name, count: queue.length };
  }).sort((a, b) => b.count - a.count);

  // 5. Time-to-Approval (Durchschnitt Tage shotAt → approvedAt)
  const approvedProjects = store.projects.filter(p => p.shotAt && p.approvedAt);
  const avgDays = approvedProjects.length > 0
    ? Math.round(approvedProjects.reduce((s, p) => s + ((new Date(p.approvedAt) - new Date(p.shotAt)) / (1000*60*60*24)), 0) / approvedProjects.length * 10) / 10
    : null;

  // 6. Aktive Projekte nach Status
  const statusCounts = {};
  store.projects.filter(p => p.status !== STATUS.ARCHIVIERT && p.status !== STATUS.FREIGEGEBEN).forEach(p => {
    statusCounts[p.status] = (statusCounts[p.status] || 0) + 1;
  });

  const kpiCard = (label, value, sub = '') => `
    <div class="card" style="padding:18px;">
      <div class="text-sm text-muted" style="margin-bottom:6px;">${escape(label)}</div>
      <div style="font-size:28px; font-weight:600;">${escape(value)}</div>
      ${sub ? `<div class="text-sm text-muted" style="margin-top:4px;">${escape(sub)}</div>` : ''}
    </div>
  `;

  $('#content').innerHTML = `
    <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:14px; margin-bottom:22px;">
      ${kpiCard('Wiederkehrender Monatsumsatz', totalMonthly.toLocaleString('de-DE', { minimumFractionDigits: 2 }) + ' €', `${customersByRevenue.length} aktive Kunden`)}
      ${kpiCard('Soll-Videos / Monat', totalVideos.toString(), 'laut Verträgen')}
      ${kpiCard('Tatsächliche Videos (30 T)', recentProjects.length.toString(), `${totalVideos > 0 ? Math.round(recentProjects.length / totalVideos * 100) : 0}% vom Soll`)}
      ${kpiCard('Ø Time-to-Approval', avgDays !== null ? avgDays + ' Tage' : '–', `${approvedProjects.length} freigegebene Projekte`)}
    </div>

    <div style="display:grid; grid-template-columns:1fr 1fr; gap:14px;">
      <div class="card">
        <div class="card-header"><div class="card-title">Umsatz pro Kunde</div></div>
        <div class="table-scroll">
        <table class="keep-table">
          <thead><tr><th>Kunde</th><th style="text-align:right;">Monatlich</th><th style="text-align:right;">Soll</th><th style="text-align:right;">30 T</th></tr></thead>
          <tbody>
            ${customersByRevenue.length === 0 ? '<tr><td colspan="4" class="text-muted" style="padding:14px;">Noch keine Kunden mit Monatsraten.</td></tr>' :
              customersByRevenue.map(c => {
                const cust = store.customers.find(x => x.name === c.name);
                const actual = cust ? (actualPerCustomer[cust.id] || 0) : 0;
                const ratio = c.videosPerMonth > 0 ? Math.round(actual / c.videosPerMonth * 100) : 0;
                return `
                  <tr>
                    <td>${escape(c.name)}</td>
                    <td style="text-align:right; font-variant-numeric:tabular-nums;">${c.monthly.toLocaleString('de-DE', { minimumFractionDigits: 2 })} €</td>
                    <td style="text-align:right;">${c.videosPerMonth || '–'}</td>
                    <td style="text-align:right; color:${ratio >= 100 ? 'var(--accent)' : ratio >= 70 ? '#fbbf24' : 'var(--danger)'};">${actual}${c.videosPerMonth > 0 ? ` (${ratio}%)` : ''}</td>
                  </tr>
                `;
              }).join('')}
          </tbody>
        </table>
        </div>
      </div>

      <div class="card">
        <div class="card-header"><div class="card-title">Auslastung diesen Monat</div></div>
        <div style="padding:14px;">
          <div class="section-title" style="margin-bottom:10px;">Videograf – Drehtage</div>
          ${videografStats.length === 0 ? '<div class="text-sm text-muted">Keine Videografen.</div>' :
            videografStats.map(vg => `
              <div style="display:flex; align-items:center; gap:10px; margin-bottom:8px;">
                <div style="width:120px; font-size:13px;">${escape(vg.name)}</div>
                <div style="flex:1; background:var(--bg-2); border-radius:6px; height:20px; position:relative;">
                  <div style="position:absolute; left:0; top:0; bottom:0; width:${Math.min(100, vg.count * 5)}%; background:linear-gradient(90deg, var(--accent), var(--accent-2, var(--accent))); border-radius:6px;"></div>
                </div>
                <div style="width:50px; text-align:right; font-weight:600;">${vg.count}</div>
              </div>
            `).join('')}
          <div class="section-title" style="margin-top:20px; margin-bottom:10px;">Cutter – offene Videos</div>
          ${cutterStats.length === 0 ? '<div class="text-sm text-muted">Keine Cutter.</div>' :
            cutterStats.map(ct => `
              <div style="display:flex; align-items:center; gap:10px; margin-bottom:8px;">
                <div style="width:120px; font-size:13px;">${escape(ct.name)}</div>
                <div style="flex:1; background:var(--bg-2); border-radius:6px; height:20px; position:relative;">
                  <div style="position:absolute; left:0; top:0; bottom:0; width:${Math.min(100, ct.count * 8)}%; background:${ct.count > 10 ? 'var(--danger)' : ct.count > 5 ? '#fbbf24' : '#30d158'}; border-radius:6px;"></div>
                </div>
                <div style="width:50px; text-align:right; font-weight:600;">${ct.count}</div>
              </div>
            `).join('')}
        </div>
      </div>

      <div class="card" style="grid-column:1 / -1;">
        <div class="card-header"><div class="card-title">Pipeline – aktive Projekte nach Status</div></div>
        <div style="padding:14px; display:flex; flex-wrap:wrap; gap:14px;">
          ${[STATUS.SKRIPT, STATUS.GEPLANT, STATUS.GEDREHT, STATUS.SCHNITT, STATUS.KORREKTUR, STATUS.FERTIG].map(s => `
            <div style="flex:1; min-width:120px; background:var(--bg-2); padding:14px; border-radius:10px;">
              <div class="text-sm text-muted">${escape(STATUS_LABELS[s])}</div>
              <div style="font-size:24px; font-weight:600; margin-top:4px;">${statusCounts[s] || 0}</div>
            </div>
          `).join('')}
        </div>
      </div>
    </div>
  `;
}

/* ----------- DREHTAGE VERWALTUNG ----------- */
function renderShootDays(session) {
  const user = session.user;
  if (!hasRole(user, ROLES.ADMIN, ROLES.MANAGER)) {
    $('#content').innerHTML = '<div class="card"><div class="empty-state">Kein Zugriff.</div></div>';
    $('#topbar-actions').innerHTML = '';
    return;
  }

  $('#topbar-actions').innerHTML = `
    <button class="btn btn-primary" onclick="openShootDayModal()">+ Neuer Drehtag</button>
  `;

  const todayStr = new Date().toISOString().slice(0, 10);
  const all = (store.shootDays || []).slice().sort((a, b) => a.date.localeCompare(b.date));
  const upcoming = all.filter(s => s.date >= todayStr);
  const past = all.filter(s => s.date < todayStr).reverse();

  if (all.length === 0) {
    $('#content').innerHTML = `
      <div class="card">
        <div class="empty-state">
          <div class="empty-state-icon">🎥</div>
          Noch keine Drehtage angelegt.<br/><br/>
          <button class="btn btn-primary" onclick="openShootDayModal()">Ersten Drehtag anlegen</button>
        </div>
      </div>
    `;
    return;
  }

  function renderRow(sd) {
    const vg = store.users.find(u => u.id === sd.videografId);
    const cust = store.customers.find(c => c.id === sd.customerId);
    const linked = store.projects.filter(p => p.shootDayId === sd.id);
    const videoCount = linked.length;
    return `
      <tr style="cursor:pointer;" onclick="openShootDayModal('${sd.id}')">
        <td><strong>${fmtDate(sd.date)}</strong></td>
        <td>${sd.startTime || '–'} – ${sd.endTime || '–'}</td>
        <td>${escape(vg?.name || '–')}</td>
        <td>${escape(cust?.name || '–')}</td>
        <td>${videoCount} Video${videoCount === 1 ? '' : 's'}</td>
        <td style="text-align:right;">
          <button type="button" class="btn btn-ghost btn-sm" onclick="event.stopPropagation(); openShootDayModal('${sd.id}')">Bearbeiten</button>
          <button type="button" class="btn btn-ghost btn-sm" onclick="event.stopPropagation(); deleteShootDay('${sd.id}')" style="color:var(--danger);">Löschen</button>
        </td>
      </tr>
    `;
  }

  function renderTable(rows, emptyLabel) {
    if (rows.length === 0) return `<div class="text-sm text-muted" style="padding:14px;">${emptyLabel}</div>`;
    return `
      <div class="table-scroll">
      <table class="keep-table">
        <thead>
          <tr>
            <th>Datum</th>
            <th>Zeit</th>
            <th>Videograf</th>
            <th>Kunde</th>
            <th>Projekte</th>
            <th style="text-align:right;">Aktionen</th>
          </tr>
        </thead>

      ${renderTable(upcoming, 'Keine bevorstehenden Drehtage.')}

    <div class="card">
      <div class="card-header">
        <div class="card-title" style="display:flex; align-items:center; gap:10px;">

}

function saveShootDay(e, shootDayId) {
  e.preventDefault();
  const fd = new FormData(e.target);
  const data = {
    date: fd.get('date'),
    videografId: fd.get('videografId') || null,
    startTime: fd.get('startTime') || '09:00',
    endTime: fd.get('endTime') || '17:00',
    customerId: fd.get('customerId') || null,
    note: (fd.get('note') || '').trim()
  };
  if (!data.date) {
    appAlert('Bitte ein Datum wählen.', { title: 'Datum fehlt' });
    return;
  }
  if (!data.videografId) {
    appAlert('Bitte einen Videografen auswählen.', { title: 'Videograf fehlt' });
    return;
  }

  if (shootDayId) {
    const idx = store.shootDays.findIndex(s => s.id === shootDayId);
    if (idx >= 0) store.shootDays[idx] = { ...store.shootDays[idx], ...data };
  } else {
    store.shootDays.push({ id: uid('sd'), ...data, createdAt: new Date().toISOString() });
  }
  saveStore();
  writeLiveICS();
  closeModal();
  renderPage();
  showToast('Drehtag gespeichert', fmtDate(data.date) + ' · ' + data.startTime + '–' + data.endTime);
}

async function deleteShootDay(shootDayId) {
  const session = getCurrentUser();
  if (!session || session.type !== 'staff' || !hasRole(session.user, ROLES.ADMIN, ROLES.MANAGER)) {
    appAlert('Nur Admin/Manager dürfen Drehtage löschen.', { title: 'Nicht erlaubt' });
    return;
  }
  const linkedCount = store.projects.filter(p => p.shootDayId === shootDayId).length;
  const msg = linkedCount > 0
    ? `${linkedCount} Projekt${linkedCount === 1 ? ' ist' : 'e sind'} diesem Drehtag zugewiesen. Die Projekte bleiben erhalten, sind dann aber ohne Drehtag.`
    : 'Der Drehtag wird gelöscht.';
  const ok = await appConfirm(msg, { title: 'Drehtag löschen?', okLabel: 'Löschen', danger: true });
  if (!ok) return;
  // Verlinkung in Projekten entfernen
  store.projects.forEach(p => { if (p.shootDayId === shootDayId) { delete p.shootDayId; } });
  trackDeletion('shootDays', shootDayId);
  store.shootDays = store.shootDays.filter(s => s.id !== shootDayId);
  saveStore();
  closeModal();
  renderPage();
}

function getStatusActions(project, session) {
  if (session.type !== 'staff') return '';
  const user = session.user;
  const userId = user.id;
  const buttons = [];
  const isInternal = !!project.isInternal;
  const isAdmin = hasRole(user, ROLES.ADMIN);

  // Permission-gestützte Buttons – Buttons erscheinen nur, wenn die Aktion auch wirklich erlaubt ist
  // Videograf: Drehtag-Status setzen
  if ((project.status === STATUS.SKRIPT || project.status === STATUS.GEPLANT)
      && canActOnProject(project, session, 'markAsShot')) {
    const label = isInternal ? '✓ Bereit für Schnitt' : '✓ Als abgedreht markieren';
    buttons.push(`<button class="btn btn-primary btn-sm" onclick="markAsShot('${project.id}')">${label}</button>`);
  }
  // Cutter: Annehmen (GEDREHT oder KORREKTUR → SCHNITT)
  if ((project.status === STATUS.GEDREHT || project.status === STATUS.KORREKTUR)
      && canActOnProject(project, session, 'cutterAccept')) {
    buttons.push(`<button class="btn btn-primary btn-sm" onclick="cutterAccept('${project.id}')">→ Annehmen &amp; starten</button>`);
  }
  // Cutter: Fertig melden
  if (project.status === STATUS.SCHNITT && canActOnProject(project, session, 'cutterMarkDone')) {
    buttons.push(`<button class="btn btn-primary btn-sm" onclick="cutterMarkDone('${project.id}')">→ Fertig melden</button>`);
    buttons.push(`<button class="btn btn-secondary btn-sm" onclick="cutterRevert('${project.id}','${STATUS.GEDREHT}')">↩ Zurücklegen</button>`);
  }
  // Cutter / Admin: versehentlich fertig → zurückholen
  if (project.status === STATUS.FERTIG && (project.cutterId === userId || isAdmin)) {
    buttons.push(`<button class="btn btn-secondary btn-sm" onclick="cutterRevert('${project.id}','${STATUS.SCHNITT}')">↩ Wieder bearbeiten</button>`);
  }
  // Manager: Freigabe oder Korrektur
  if (project.status === STATUS.FERTIG && canActOnProject(project, session, 'approve')) {
    buttons.push(`<button class="btn btn-primary btn-sm" onclick="approveProject('${project.id}')">✓ Freigeben</button>`);
    buttons.push(`<button class="btn btn-secondary btn-sm" onclick="openCorrectionModal('${project.id}')">↩ Korrektur anfragen</button>`);
  }
  if (project.status === STATUS.FREIGEGEBEN && canActOnProject(project, session, 'archive')) {
    buttons.push(`<button class="btn btn-secondary btn-sm" onclick="archiveProject('${project.id}')">→ Archivieren</button>`);
  }
  return buttons.join(' ');
}

async function cutterRevert(projectId, targetStatus) {
  const session = getCurrentUser();
  const p = store.projects.find(x => x.id === projectId);
  if (!p) return;
  if (!canActOnProject(p, session, 'cutterRevert')) {
    appAlert('Du darfst diesen Status nicht zurücksetzen.', { title: 'Nicht erlaubt' });
    return;
  }
  // Wenn das Projekt offene Korrektur-Notizen hat und gerade aus dem KORREKTUR-Zyklus kommt,
  // soll der Revert zurück nach KORREKTUR springen, nicht nach GEDREHT
  let actualTarget = targetStatus;
  if (targetStatus === STATUS.GEDREHT && (p.correctionNotes || []).length > 0) {
    actualTarget = STATUS.KORREKTUR;
  }
  const dialog = actualTarget === STATUS.GEDREHT
    ? { title: 'Annahme rückgängig?', body: 'Das Projekt landet wieder in deiner „Bereit zum Schnitt"-Liste.', okLabel: 'Annahme rückgängig' }
    : actualTarget === STATUS.KORREKTUR
      ? { title: 'Zurück zur Korrektur?', body: 'Das Projekt landet wieder in der Korrektur-Liste, da Korrekturnotizen vorliegen.', okLabel: 'Zurück zur Korrektur' }
      : { title: 'Wieder bearbeiten?', body: 'Das Projekt wird wieder geöffnet, damit du Änderungen vornehmen kannst.', okLabel: 'Wieder bearbeiten' };
  const ok = await appConfirm(dialog.body, { title: dialog.title, okLabel: dialog.okLabel, cancelLabel: 'Abbrechen' });
  if (!ok) return;
  const idx = store.projects.findIndex(p => p.id === projectId);
  if (idx >= 0) {
    store.projects[idx].status = actualTarget;
    logActivity('project', store.projects[idx].id, 'cutterRevert', { title: store.projects[idx].title, from: targetStatus, to: actualTarget });
    saveStore();
    writeLiveICS();
    closeModal();
    renderPage();
  }
}

function saveProject(e, projectId) {
  e.preventDefault();
  const session = getCurrentUser();
  if (!session || session.type !== 'staff' || !hasRole(session.user, ROLES.ADMIN, ROLES.MANAGER)) {
    appAlert('Nur Admin/Manager dürfen Projekte speichern.', { title: 'Nicht erlaubt' });
    return;
  }
  // Manager nur für eigene Kunden (außer Admin)
  if (!hasRole(session.user, ROLES.ADMIN)) {
    const tmpData = Object.fromEntries(new FormData(e.target));
    if (tmpData.customerId) {
      const c = store.customers.find(x => x.id === tmpData.customerId);
      if (c && c.managerId && c.managerId !== session.user.id) {
        appAlert('Du kannst nur Projekte für deine eigenen Kunden anlegen/ändern.', { title: 'Nicht erlaubt' });
        return;
      }
    }
    if (projectId) {
      const existing = store.projects.find(p => p.id === projectId);
      if (existing) {
        const ec = store.customers.find(x => x.id === existing.customerId);
        if (ec && ec.managerId && ec.managerId !== session.user.id) {
          appAlert('Du kannst nur Projekte deiner eigenen Kunden ändern.', { title: 'Nicht erlaubt' });
          return;
        }
      }
    }
  }
  const form = e.target;
  const data = Object.fromEntries(new FormData(form));

  // Internes Projekt? – dann ist kein Kunde nötig
  data.isInternal = !!data.isInternal;

  if (!data.title) {
    alert('Bitte einen Titel angeben.');
    return;
  }
  if (!data.isInternal && !data.customerId) {
    alert('Bitte einen Kunden auswählen (oder das Projekt als „intern" markieren).');
    return;
  }

  // Drehtag-Zuweisung: Datum + Videograf vom Drehtag übernehmen
  if (data.shootDayId) {
    const sd = store.shootDays.find(s => s.id === data.shootDayId);
    if (sd) {
      data.shootDate = sd.date;
      data.videografId = sd.videografId || data.videografId;
    }
  } else {
    data.shootDayId = null;
  }

  if (data.isInternal) {
    // Bei internen Projekten gibt es keinen Kunden und kein Posting-Datum
    data.customerId = null;
    data.postingDate = null;
    data.shootDate = data.shootDate || null;
    data.shootDayId = null;
  } else {
    // Default cutter = manager of customer NUR wenn der Manager auch tatsächlich Cutter-Rolle hat
    if (!data.cutterId) {
      const customer = store.customers.find(c => c.id === data.customerId);
      if (customer?.managerId) {
        const mgr = store.users.find(u => u.id === customer.managerId);
        if (mgr && hasRole(mgr, ROLES.CUTTER)) data.cutterId = customer.managerId;
      }
    }
    // Beim Anlegen: Cutter-Deadline = Posting − 48 h (= 2 Tage)
    // Beim Bearbeiten: Deadline editierbar, fällt zurück auf Posting − 2 Tage falls leer
    if (!projectId) {
      // Neu angelegt → Deadline IMMER überschreiben
      if (data.postingDate) {
        data.deadline = addDays(data.postingDate, -2);
      }
    } else {
      // Bearbeiten: Fallback wenn Posting da, Deadline leer
      if (!data.deadline && data.postingDate) {
        data.deadline = addDays(data.postingDate, -2);
      }
      // Fallback wenn Deadline da, Posting leer (Posting = Deadline + 2 Tage)
      if (!data.postingDate && data.deadline) {
        data.postingDate = addDays(data.deadline, 2);
      }
    }
  }

  // Urlaubs-Check als WARNUNG (nicht blockierend)
  const shoot = data.shootDate || null;
  const dl = data.deadline || null;
  const warnings = [];

  if (data.videografId && shoot && isUserOnVacationOn(data.videografId, shoot)) {
    const u = store.users.find(x => x.id === data.videografId);
    warnings.push(`⚠️ ${u?.name || 'Videograf'} hat am Drehtag (${fmtDate(shoot)}) Urlaub.`);
  }
  // Cutter: Schnittzeitraum = Drehtag bis Deadline
  if (data.cutterId) {
    const rangeStart = shoot || dl;
    const rangeEnd = dl || shoot;
    if (rangeStart && rangeEnd && isUserOnVacationDuringRange(data.cutterId, rangeStart, rangeEnd)) {
      const u = store.users.find(x => x.id === data.cutterId);
      warnings.push(`⚠️ ${u?.name || 'Cutter'} hat im Schnittzeitraum (${fmtDate(rangeStart)} – ${fmtDate(rangeEnd)}) Urlaub.`);
    }
  }
  if (warnings.length > 0) {
    if (!confirm(warnings.join('\n\n') + '\n\nTrotzdem speichern?')) return;
  }

  // Skript-PDF anhängen (falls neue Datei hochgeladen)
  const fileAdds = {};
  if (pendingScriptFile) {
    fileAdds.scriptFile = pendingScriptFile.data;
    fileAdds.scriptFileName = pendingScriptFile.name;
    pendingScriptFile = null;
  }

  // Drehtag "lernt" den Kunden: Wenn Drehtag noch keinen Kunden hat
  // und das Projekt einen, dann auf dem Drehtag speichern – so wird er
  // bei jedem weiteren Projekt mit diesem Drehtag automatisch übernommen.
  if (data.shootDayId && data.customerId && !data.isInternal) {
    const sdIdx = store.shootDays.findIndex(s => s.id === data.shootDayId);
    if (sdIdx >= 0 && !store.shootDays[sdIdx].customerId) {
      store.shootDays[sdIdx].customerId = data.customerId;
    }
  }

  if (projectId) {
    const idx = store.projects.findIndex(p => p.id === projectId);
    if (idx >= 0) {
      store.projects[idx] = { ...store.projects[idx], ...data, ...fileAdds };
    }
  } else {
    store.projects.push({
      id: uid('p'),
      title: data.title,
      customerId: data.customerId,
      videografId: data.videografId || null,
      cutterId: data.cutterId || null,
      shootDate: data.shootDate || null,
      shootDayId: data.shootDayId || null,
      deadline: data.deadline || null,
      postingDate: data.postingDate || null,
      script: data.script || '',
      status: STATUS.SKRIPT,
      createdAt: new Date().toISOString(),
      ...fileAdds
    });
  }
  saveStore();
  writeLiveICS();
  closeModal();
  renderPage();
}

function toggleInternalProject(cb) {

function onShootDayChange(select) {
  const shootDayId = select.value;
  const manualRow = document.getElementById('manual-shootDate-row');
  const videografField = document.getElementById('videograf-field');
  const shootDateInput = document.getElementById('proj-shootDate');
  const videografSelect = document.getElementById('proj-videograf');
  const customerSelect = document.getElementById('proj-customer');
  if (shootDayId) {
    // Drehtag gewählt → Datum, Videograf UND Kunde aus Drehtag übernehmen
    const sd = store.shootDays.find(s => s.id === shootDayId);
    if (sd) {
      if (shootDateInput) shootDateInput.value = sd.date;
      if (videografSelect) videografSelect.value = sd.videografId || '';
      if (customerSelect) {
        // 1. Bevorzugt: Kunde direkt am Drehtag hinterlegt
        let inheritedCustomerId = sd.customerId || null;
        // 2. Fallback: Kunde aus bereits zugewiesenen Projekten ableiten
        if (!inheritedCustomerId) {
          const linked = store.projects.filter(p => p.shootDayId === sd.id && p.customerId);
          if (linked.length > 0) {
            // Wenn alle bisherigen Projekte denselben Kunden haben → übernehmen
            const uniqueCustomers = [...new Set(linked.map(p => p.customerId))];
            if (uniqueCustomers.length === 1) {
              inheritedCustomerId = uniqueCustomers[0];
            }
          }
        }
        if (inheritedCustomerId) {
          customerSelect.value = inheritedCustomerId;
        }
      }
    }
    if (manualRow) manualRow.style.display = 'none';
    if (videografField) videografField.style.display = 'none';
  } else {
    if (manualRow) manualRow.style.display = '';
    if (videografField) videografField.style.display = '';
  }
}

let pendingScriptFile = null;
function uploadScriptFile(e) {
  const file = e.target.files[0];
  if (!file) return;
  if (file.size > 4 * 1024 * 1024) {
    alert('Datei ist zu groß (max. 4 MB für LocalStorage).');
    return;
  }
  const reader = new FileReader();
  reader.onload = ev => {
    pendingScriptFile = { name: file.name, data: ev.target.result };
    const labelEl = e.target.closest('.file-upload');
    if (labelEl) {
      labelEl.style.borderColor = 'var(--accent)';
      labelEl.style.background = 'var(--accent-soft)';
      labelEl.querySelector('div').textContent = '✓ ' + file.name + ' bereit zum Speichern';
    }
  };
  reader.readAsDataURL(file);
}
function downloadScriptFile(projectId) {
  const p = store.projects.find(x => x.id === projectId);
  if (!p?.scriptFile) return;
  const a = document.createElement('a');
  a.href = p.scriptFile;
  a.download = p.scriptFileName || 'Skript.pdf';
  a.click();
}
async function removeScriptFile(projectId) {
  const ok = await appConfirm('Die hochgeladene Skript-PDF wird entfernt.', {
    title: 'Skript entfernen?', okLabel: 'Entfernen', danger: true
  });
  if (!ok) return;
  const idx = store.projects.findIndex(p => p.id === projectId);
  if (idx >= 0) {
    delete store.projects[idx].scriptFile;
    delete store.projects[idx].scriptFileName;
    saveStore();
    writeLiveICS();
    openProjectModal(projectId);
  }
}

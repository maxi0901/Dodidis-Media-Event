}

async function saveTodo(e, todoId) {
  e.preventDefault();
  const session = getCurrentUser();
  if (!session || session.type !== 'staff') return;
  const form = e.target;
  const title = form.title.value.trim();
  const description = form.description.value;
  if (!title) { alert('Bitte einen Titel angeben.'); return; }

  const assigneeIds = getAssignableUsersFor(session.user)
    .map(u => u.id)
    .filter(id => form.querySelector(`#todo-assignee-${id}`)?.checked);

  // Fälligkeitsdatum nur übernehmen wenn Checkbox aktiv
  const hasDue = form.querySelector('#todo-has-due')?.checked;
  const dueDate = hasDue ? (form.querySelector('#todo-due-date')?.value || null) : null;

  const prevAssignees = todoId ? (store.todos.find(t => t.id === todoId)?.assigneeIds || []) : [];

  // Snapshot für Rollback
  let prevEntry = null;
  let insertedId = null;

  if (todoId) {
    const idx = store.todos.findIndex(t => t.id === todoId);
    if (idx >= 0) {
      prevEntry = { ...store.todos[idx] };
      store.todos[idx] = {
        ...store.todos[idx],
        title,
        description,
        assigneeIds,
        dueDate
      };
    }
  } else {
    insertedId = uid('t');
    store.todos.push({
      id: insertedId,
      title,
      description,
      assigneeIds,
      dueDate,
      createdById: session.user.id,
      createdAt: new Date().toISOString(),
      status: 'open',
      seenBy: [session.user.id]
    });
  }

  // Benachrichtigung an alle NEUEN Assignees (außer Creator selbst)
  assigneeIds.forEach(uid => {
    if (uid !== session.user.id && !prevAssignees.includes(uid)) {
      notifyAssignee(uid, title);
    }
  });

  closeModal();
  renderNav();
  renderPage();

  // Direkt in DB schreiben
  const apiPayload = { title, description, assigneeIds, dueDate };
  if (!todoId) {
    apiPayload.status = 'open';
    apiPayload.id = insertedId;
  }

  try {
    const url = todoId
      ? `${API_BASE}/todos.php?id=${encodeURIComponent(todoId)}`
      : `${API_BASE}/todos.php`;
    const method = todoId ? 'PUT' : 'POST';
    const res = await fetch(url, {
      method,
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': CSRF },
      body: JSON.stringify(apiPayload)
    });
    const json = await res.json();
    if (!res.ok || !json.ok) throw new Error(json.error || 'Speichern fehlgeschlagen');
    if (json.data) {
      const targetId = todoId || insertedId;
      const i = store.todos.findIndex(t => t.id === targetId);
      if (i >= 0) store.todos[i] = { ...store.todos[i], ...json.data };
    }
  } catch (err) {
    // Rollback
    if (todoId && prevEntry) {
      const i = store.todos.findIndex(t => t.id === todoId);
      if (i >= 0) store.todos[i] = prevEntry;
    } else if (insertedId) {
      store.todos = store.todos.filter(t => t.id !== insertedId);
    }
    renderNav();
    renderPage();
    showToast('Fehler beim Speichern', err.message);
  }
}

async function toggleTodoStatus(todoId) {
  const session = getCurrentUser();
  if (!session || session.type !== 'staff') return;
  const idx = store.todos.findIndex(t => t.id === todoId);
  if (idx < 0) return;
  const t = store.todos[idx];
  // Nur Admin, Aufgaben-Ersteller oder ein zugewiesener User darf den Status setzen
  const userId = session.user.id;
  const isAdmin = hasRole(session.user, ROLES.ADMIN);
  const isAssignee = (t.assigneeIds || []).includes(userId);
  const isCreator = t.createdById === userId;
  if (!isAdmin && !isAssignee && !isCreator) {
    appAlert('Du darfst diese Aufgabe nicht ändern.', { title: 'Nicht erlaubt' });
    return;
  }
  const newStatus = t.status === 'open' ? 'done' : 'open';
  // Optimistisch lokal updaten
  const prevStatus = t.status;
  const prevDoneAt = t.doneAt;
  t.status = newStatus;
  t.doneAt = newStatus === 'done' ? new Date().toISOString() : null;
  renderNav();
  renderPage();
  // Direkt an DB schreiben (kein Warten auf Bulk-Push)
  try {
    const res = await fetch(
      `${API_BASE}/todos.php?id=${encodeURIComponent(todoId)}`,
      {
        method: 'PUT',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': CSRF },
        body: JSON.stringify({ status: newStatus })
      }
    );
    const json = await res.json();
    if (!res.ok || !(json.ok || json.success)) throw new Error(json.error || 'Speichern fehlgeschlagen');
    // Server-Response übernehmen (updatedAt etc.)
    if (json.data) {
      const updated = json.data;
      store.todos[idx] = { ...store.todos[idx], ...updated };
    }
  } catch (e) {
    // Rollback bei Fehler
    store.todos[idx].status = prevStatus;
    store.todos[idx].doneAt = prevDoneAt;
    renderNav();
    renderPage();
    showToast('Speichern fehlgeschlagen', e.message);
  }
}

async function deleteTodo(todoId) {
  const session = getCurrentUser();
  if (!session || session.type !== 'staff') return;
  const t = store.todos.find(x => x.id === todoId);
  if (!t) return;
  const userId = session.user.id;
  const isAdmin = hasRole(session.user, ROLES.ADMIN);
  if (!isAdmin && t.createdById !== userId) {
    appAlert('Aufgaben dürfen nur vom Ersteller oder Admin gelöscht werden.', { title: 'Nicht erlaubt' });
    return;
  }
  const ok = await appConfirm('Diese Aufgabe wird unwiderruflich entfernt.', {
    title: 'Aufgabe löschen?', okLabel: 'Löschen', danger: true
  });
  if (!ok) return;
  const removedTodo = store.todos.find(x => x.id === todoId);
  trackDeletion('todos', todoId);
  store.todos = store.todos.filter(t => t.id !== todoId);
  closeModal();
  renderNav();
  renderPage();
  // Direkt in DB löschen
  try {
    const res = await fetch(
      `${API_BASE}/todos.php?id=${encodeURIComponent(todoId)}`,
      { method: 'DELETE', credentials: 'same-origin', headers: { 'X-CSRF-Token': CSRF } }
    );
    const json = await res.json();
    if (!res.ok || !json.ok) throw new Error(json.error || 'Löschen fehlgeschlagen');
  } catch (err) {
    // Rollback
    if (removedTodo) store.todos.push(removedTodo);
    await pullAllFromCloud().then(() => renderPage());
    showToast('Fehler beim Speichern', err.message);
  }
}

/* Benachrichtigungen */
function showToast(title, body, onclick = null) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `<div class="toast-title">${escape(title)}</div><div class="toast-body">${escape(body)}</div>`;
  if (onclick) {
    el.style.cursor = 'pointer';
    el.addEventListener('click', () => { onclick(); el.remove(); });
  }
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 6000);
}

// Toast mit Undo-Button. undoFn wird beim Klick auf "Rückgängig" ausgeführt.
function showUndoToast(title, undoFn, holdMs = 6000) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.style.display = 'flex';
  el.style.alignItems = 'center';
  el.style.gap = '14px';
  el.innerHTML = `
    <div style="flex:1;">
      <div class="toast-title">${escape(title)}</div>
      <div class="toast-body">Klick „Rückgängig" um die Aktion umzukehren.</div>
    </div>
    <button type="button" class="btn btn-secondary btn-sm" style="white-space:nowrap;">↩ Rückgängig</button>
  `;
  const btn = el.querySelector('button');
  let consumed = false;
  btn.addEventListener('click', () => {
    if (consumed) return;
    consumed = true;
    try { undoFn(); } catch (e) { console.error('[undo]', e); }
    el.remove();
  });
  document.body.appendChild(el);
  setTimeout(() => { if (!consumed) el.remove(); }, holdMs);
}

function notifyAssignee(userId, taskTitle) {
  // In-App-Toast: nur wenn der zugewiesene User aktuell selbst eingeloggt ist
  // Sonst Browser-Notification an alle Geräte dieses Users (falls erlaubt) – auf diesem Device aber nur möglich
  // wenn der User später diese Seite öffnet. Wir setzen ein Flag, das beim nächsten Login angezeigt wird.
  // Außerdem versuchen wir eine Browser-Notification.
  try {
    if ('Notification' in window && Notification.permission === 'granted') {
      const assignee = store.users.find(u => u.id === userId);
      new Notification('Neue Aufgabe für ' + (assignee?.name || ''), {
        body: taskTitle,
        icon: '',
        tag: 'todo-' + Date.now()
      });
    }
  } catch (e) { /* silent */ }
}

function checkPendingNotifications(session) {
  if (!session || session.type !== 'staff') return;
  const user = session.user;
  const myOpenTodos = store.todos.filter(t =>
    (t.assigneeIds || []).includes(user.id) &&
    t.status === 'open' &&
    !(t.seenBy || []).includes(user.id)
  );
  if (myOpenTodos.length === 0) return;
  // Markiere als gesehen, damit sie nicht erneut auftauchen
  myOpenTodos.forEach(t => {
    if (!t.seenBy) t.seenBy = [];
    t.seenBy.push(user.id);
  });
  saveStore();
  const titles = myOpenTodos.map(t => '• ' + t.title).join('\n');
  showToast(
    myOpenTodos.length === 1 ? 'Neue Aufgabe für dich' : `${myOpenTodos.length} neue Aufgaben für dich`,
    myOpenTodos.length === 1 ? myOpenTodos[0].title : titles,
    () => navigateTo('todos')
  );
}

async function requestNotificationPermission() {
  if (!('Notification' in window)) return;
  if (Notification.permission === 'default') {
    try { await Notification.requestPermission(); } catch {}
  }
}

  // Edit-Check: Wer bearbeiten will muss berechtigt sein

    const target = store.users.find(u => u.id === vacation.userId);

    ? store.users.map(u => `<option value="${u.id}" ${targetUserId === u.id ? 'selected' : ''}>${escape(u.name)}</option>`).join('')
    : `<option value="${user.id}" selected>${escape(user.name)}</option>`;

                ? `<select name="userId">${userOptions}</select>`
                : `<input type="text" value="${escape(user.name)}" disabled style="color:var(--text-2);" />

              </div>
              <div class="form-group" id="vac-end-group" style="${singleChecked ? 'display:none;' : ''}">
                <label class="form-label">Bis*</label>
                <input type="date" name="endDate" id="vac-end" ${singleChecked ? '' : 'required'} value="${vacation?.endDate || ''}" />
              </div>
            </div>
            <div class="form-group">
              <label class="form-label">Notiz (optional)</label>
              <input type="text" name="note" value="${escape(vacation?.note || '')}" placeholder="z.B. Sommerurlaub Italien" />

// „Nur 1 Tag"-Schalter: blendet das Bis-Feld aus und setzt Ende = Start.

async function saveVacation(e, vacationId) {
  e.preventDefault();
  const data = Object.fromEntries(new FormData(e.target));
  const session = getCurrentUser();
  if (!session || session.type !== 'staff') return;
  // „Nur 1 Tag": Ende = Start erzwingen
  if (data.singleDay) data.endDate = data.startDate;
  // Non-admins können nur für sich selbst
  if (!hasRole(session.user, ROLES.ADMIN)) data.userId = session.user.id;

  // Beim Bearbeiten zusätzlich Berechtigung prüfen
  if (vacationId) {
    const existing = store.vacations.find(v => v.id === vacationId);
    if (existing) {
      const target = store.users.find(u => u.id === existing.userId);
      if (!canEditVacationOf(session.user, target)) {
        appAlert('Du darfst diesen Urlaub nicht ändern.', { title: 'Nicht erlaubt' });
        return;
      }
    }
  }

  if (data.endDate < data.startDate) {
    alert('Das Enddatum darf nicht vor dem Startdatum liegen.');
    return;
  }

  // Snapshot für Rollback
  let prevEntry = null;
  let insertedId = null;

  if (vacationId) {
    const idx = store.vacations.findIndex(v => v.id === vacationId);
    if (idx >= 0) {
      prevEntry = { ...store.vacations[idx] };
      store.vacations[idx] = { ...store.vacations[idx], ...data };
    }
  } else {
    insertedId = uid('v');
    store.vacations.push({ id: insertedId, ...data });
  }

  closeModal();
  renderPage();

  // Direkt in DB schreiben
  const apiPayload = {
    userId: data.userId,
    startDate: data.startDate,
    endDate: data.endDate,
    note: data.note || null
  };
  if (!vacationId) apiPayload.id = insertedId;

  try {
    const url = vacationId
      ? `${API_BASE}/vacations.php?id=${encodeURIComponent(vacationId)}`
      : `${API_BASE}/vacations.php`;
    const method = vacationId ? 'PUT' : 'POST';
    const res = await fetch(url, {
      method,
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': CSRF },
      body: JSON.stringify(apiPayload)
    });
    const json = await res.json();
    if (!res.ok || !json.ok) throw new Error(json.error || 'Speichern fehlgeschlagen');
    if (json.data) {
      const targetId = vacationId || insertedId;
      const i = store.vacations.findIndex(v => v.id === targetId);
      if (i >= 0) store.vacations[i] = { ...store.vacations[i], ...json.data };
    }
  } catch (err) {
    // Rollback
    if (vacationId && prevEntry) {
      const i = store.vacations.findIndex(v => v.id === vacationId);
      if (i >= 0) store.vacations[i] = prevEntry;
    } else if (insertedId) {
      store.vacations = store.vacations.filter(v => v.id !== insertedId);
    }
    renderPage();
    showToast('Fehler beim Speichern', err.message);
  }
}

  const removedVacation = store.vacations.find(x => x.id === vacationId);
  trackDeletion('vacations', vacationId);
  store.vacations = store.vacations.filter(v => v.id !== vacationId);

  closeModal();
  renderPage();
  // Direkt in DB löschen
  try {
    const res = await fetch(
      `${API_BASE}/vacations.php?id=${encodeURIComponent(vacationId)}`,
      { method: 'DELETE', credentials: 'same-origin', headers: { 'X-CSRF-Token': CSRF } }
    );
    const json = await res.json();
    if (!res.ok || !json.ok) throw new Error(json.error || 'Löschen fehlgeschlagen');
  } catch (err) {
    // Rollback
    if (removedVacation) store.vacations.push(removedVacation);
    await pullAllFromCloud().then(() => renderPage());
    showToast('Fehler beim Speichern', err.message);
  }
}

function renderMeetings(session) {
  const user = session.user;
  const canEdit = hasRole(user, ROLES.ADMIN, ROLES.MANAGER);
  const isAdmin = hasRole(user, ROLES.ADMIN);
  const userId = user.id;

  // Meetings sichtbar für: Admin/Manager = alle; andere = nur wo attendee
  const visibleMeetings = (store.meetings || []).filter(m => {
    if (canEdit) return true;
    return (m.attendeeIds || []).includes(userId);
  }).slice().sort((a, b) => a.date.localeCompare(b.date) || (a.startTime || '').localeCompare(b.startTime || ''));

  $('#page-title').textContent = 'Meetings';
  $('#page-subtitle').textContent = canEdit ? 'Alle anstehenden Meetings' : 'Deine anstehenden Meetings';
  $('#topbar-actions').innerHTML = canEdit
    ? `<button class="btn btn-primary" onclick="openMeetingModal()">+ Neues Meeting</button>`
    : '';

  const today = new Date().toISOString().slice(0, 10);
  const upcoming = visibleMeetings.filter(m => m.date >= today);
  const past = visibleMeetings.filter(m => m.date < today);

  function meetingRow(m) {
    const cust = store.customers.find(c => c.id === m.customerId);
    const attendeeNames = (m.attendeeIds || [])
      .map(id => store.users.find(u => u.id === id)?.name)
      .filter(Boolean);
    const timeStr = m.startTime
      ? m.startTime.slice(0, 5) + (m.endTime ? '–' + m.endTime.slice(0, 5) : '')
      : '';
    const topicsStr = (m.topics || []).length
      ? (m.topics || []).slice(0, 2).join(' · ') + ((m.topics || []).length > 2 ? ' …' : '')
      : '';
    return `
      <tr style="cursor:pointer;" onclick="openMeetingModal('${m.id}')">
        <td><span style="font-weight:500;">${escape(m.title)}</span></td>
        <td>${fmtDate(m.date)}${timeStr ? '<br><span class="text-sm text-muted">' + escape(timeStr) + '</span>' : ''}</td>
        <td>${cust ? escape(cust.name) : '–'}</td>
        <td>${escape(m.location || '–')}</td>
        <td class="text-sm text-muted">${attendeeNames.length ? escape(attendeeNames.join(', ')) : '–'}</td>
        <td class="text-sm text-muted">${topicsStr ? escape(topicsStr) : '–'}</td>
        <td>
          ${canEdit ? `<button type="button" class="btn btn-ghost btn-sm" onclick="event.stopPropagation(); openMeetingModal('${m.id}')">Bearbeiten</button>` : ''}
        </td>
      </tr>`;

      <div class="empty-state-icon">📅</div>
      <div class="empty-state-title">Keine Meetings geplant</div>
      ${canEdit ? `<button class="btn btn-primary" onclick="openMeetingModal()">Erstes Meeting anlegen</button>` : ''}
    </div>`;

  $('#content').innerHTML = `
    <div class="page-content">
      ${upcoming.length === 0 && past.length === 0 ? emptyState : `
        ${upcoming.length > 0 ? `
          <div class="section-title" style="margin-bottom:8px;">Anstehend</div>
          <div class="table-wrap" style="margin-bottom:24px;">
            <table class="data-table">
              <thead><tr>
                <th>Titel</th><th>Datum</th><th>Kunde</th><th>Ort</th>
                <th>Teilnehmer</th><th>Themen</th><th></th>
              </tr></thead>
              <tbody>${upcoming.map(meetingRow).join('')}</tbody>
            </table>
          </div>` : ''}
        ${past.length > 0 ? `
          <details style="margin-top:8px;">
            <summary style="font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-3);cursor:pointer;margin-bottom:8px;">
              Vergangene Meetings (${past.length})

            <div class="table-wrap" style="opacity:0.65;">
              <table class="data-table">
                <thead><tr>
                  <th>Titel</th><th>Datum</th><th>Kunde</th><th>Ort</th>
                  <th>Teilnehmer</th><th>Themen</th><th></th>
                </tr></thead>
                <tbody>${past.map(meetingRow).join('')}</tbody>

      `}
    </div>`;
}

async function saveMeeting(e, meetingId) {
  e.preventDefault();
  const form = e.target;
  const fd = new FormData(form);
  const topics = Array.from(document.querySelectorAll('.meeting-topic-input'))
    .map(el => el.value.trim()).filter(Boolean);
  const attendeeIds = Array.from(form.querySelectorAll('input[name="attendeeIds"]:checked')).map(el => el.value);

  const payload = {
    title:       fd.get('title')?.trim(),
    date:        fd.get('date'),
    startTime:   fd.get('startTime') || '09:00',
    endTime:     fd.get('endTime') || null,
    location:    fd.get('location')?.trim() || null,
    link:        fd.get('link')?.trim() || null,
    customerId:  fd.get('customerId') || null,
    attendeeIds,
    topics
  };

  const isNew = !meetingId;
  const insertedId = isNew ? ('mt_' + Math.random().toString(36).slice(2, 10)) : null;
  let prevEntry = null;

  if (isNew) {
    store.meetings = store.meetings || [];
    store.meetings.push({ id: insertedId, ...payload, createdBy: getCurrentUser()?.user?.id, createdAt: new Date().toISOString() });
  } else {
    const idx = store.meetings.findIndex(m => m.id === meetingId);
    if (idx >= 0) { prevEntry = { ...store.meetings[idx] }; store.meetings[idx] = { ...store.meetings[idx], ...payload }; }
  }

  closeModal();
  renderPage();

  try {
    const url = meetingId ? `${API_BASE}/meetings.php?id=${encodeURIComponent(meetingId)}` : `${API_BASE}/meetings.php`;
    const method = meetingId ? 'PUT' : 'POST';
    if (isNew) payload.id = insertedId;
    const res = await fetch(url, {
      method, credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': CSRF },
      body: JSON.stringify(payload)
    });
    const json = await res.json();
    if (!res.ok || !json.ok) throw new Error(json.error || 'Speichern fehlgeschlagen');
    if (json.data) {
      const targetId = meetingId || insertedId;
      const i = store.meetings.findIndex(m => m.id === targetId);
      if (i >= 0) store.meetings[i] = { ...store.meetings[i], ...json.data };
    }
  } catch (err) {
    if (isNew && insertedId) store.meetings = store.meetings.filter(m => m.id !== insertedId);
    else if (prevEntry) { const i = store.meetings.findIndex(m => m.id === meetingId); if (i >= 0) store.meetings[i] = prevEntry; }
    renderPage();
    showToast('Fehler beim Speichern', err.message);
  }
}

async function deleteMeeting(meetingId) {
  const ok = await appConfirm('Meeting wirklich löschen?', { title: 'Meeting löschen', okLabel: 'Löschen', danger: true });
  if (!ok) return;
  const removed = store.meetings.find(m => m.id === meetingId);
  store.meetings = store.meetings.filter(m => m.id !== meetingId);
  closeModal();
  renderPage();
  try {
    const res = await fetch(`${API_BASE}/meetings.php?id=${encodeURIComponent(meetingId)}`, {
      method: 'DELETE', credentials: 'same-origin', headers: { 'X-CSRF-Token': CSRF }
    });
    const json = await res.json();
    if (!res.ok || !json.ok) throw new Error(json.error || 'Löschen fehlgeschlagen');
  } catch (err) {
    if (removed) store.meetings.push(removed);
    renderPage();
    showToast('Fehler beim Löschen', err.message);
  }
}

/* ----------- ICS EXPORT / KALENDER-ABO ----------- */
function pad(n) { return String(n).padStart(2, '0'); }

function icsDate(dateStr, time = null) {
  // Returns YYYYMMDDTHHMMSS in local time (floating)
  if (!dateStr) return '';
  const d = new Date(dateStr);
  if (time) {
    d.setHours(time.h || 0, time.m || 0, 0, 0);
  }
  return `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
}

function icsAllDay(dateStr) {
  const d = new Date(dateStr);
  return `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}`;
}

function icsEscape(str) {
  return String(str || '').replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\n/g, '\\n');
}

function generateICS(forUser = null) {
  // Determine which projects this calendar covers.
  // - forUser = null → full agency calendar (admin only)
  // - forUser = a user → personal filtered calendar
  let projects;
  let calName = 'Dodidis Media – Alle Projekte';
  let calDesc = 'Drehtage, Deadlines und Postings aller Projekte';
  const isAgencyView = !forUser;
  // Reine Cutter sollen NIE das Posting-Datum sehen – nur Drehtag + Deadline
  const isCutterOnly = forUser && hasRole(forUser, ROLES.CUTTER) && !hasRole(forUser, ROLES.ADMIN, ROLES.MANAGER, ROLES.VIDEOGRAF);
  if (forUser) {
    projects = getRelevantProjects(forUser);
    calName = `Dodidis Media – ${forUser.name}`;
    calDesc = `Persönlicher Kalender (basierend auf Rollen: ${primaryRoleLabel(forUser)})`;
  } else {
    projects = store.projects;
  }

  const lines = [
    'BEGIN:VCALENDAR',
    'VERSION:2.0',
    'PRODID:-//Dodidis Media//Management Tool//DE',
    'CALSCALE:GREGORIAN',
    'METHOD:PUBLISH',
    `X-WR-CALNAME:${calName}`,
    'X-WR-TIMEZONE:Europe/Berlin',
    `X-WR-CALDESC:${calDesc}`,
    'REFRESH-INTERVAL;VALUE=DURATION:PT15M',
    'X-PUBLISHED-TTL:PT15M'
  ];

  const stamp = `${new Date().toISOString().replace(/[-:]/g, '').split('.')[0]}Z`;

  projects.forEach(p => {
    if (p.status === STATUS.ARCHIVIERT) return;
    const c = store.customers.find(x => x.id === p.customerId);
    const vg = store.users.find(u => u.id === p.videografId);
    const ct = store.users.find(u => u.id === p.cutterId);
    const customerLabel = c ? `${c.name} (${c.customerNumber})` : '–';
    const desc = [
      `Kunde: ${customerLabel}`,
      `Videograf: ${vg?.name || '–'}`,
      `Cutter: ${ct?.name || '–'}`,
      `Status: ${statusLabel(p.status)}`,
      p.script ? `Skript: ${p.script}` : null
    ].filter(Boolean).join('\\n');

    // Drehtag (all day)
    if (p.shootDate) {
      lines.push('BEGIN:VEVENT');
      lines.push(`UID:project-${p.id}-shoot@dodidis.media`);
      lines.push(`DTSTAMP:${stamp}`);
      lines.push(`DTSTART;VALUE=DATE:${icsAllDay(p.shootDate)}`);
      const end = new Date(p.shootDate);
      end.setDate(end.getDate() + 1);
      lines.push(`DTEND;VALUE=DATE:${icsAllDay(end.toISOString().slice(0,10))}`);
      lines.push(`SUMMARY:🎥 Drehtag – ${icsEscape(p.title)}`);
      lines.push(`DESCRIPTION:${icsEscape(desc)}`);
      lines.push(`CATEGORIES:Drehtag,${icsEscape(customerLabel)}`);
      // Skript-PDF nicht mehr als Binary-Anhang (vermeidet 30MB+ Kalender und Daten-Leak via Gist-Raw-URL)
      // Der Link auf das Tool-Modal steht in der DESCRIPTION
      lines.push('END:VEVENT');
    }

    // Deadline (24h vor Posting, 18:00)
    if (p.postingDate) {
      const cutterDeadline = new Date(p.postingDate);
      cutterDeadline.setDate(cutterDeadline.getDate() - 1);
      cutterDeadline.setHours(18, 0, 0, 0);
      const start = icsDate(cutterDeadline.toISOString());
      const endDate = new Date(cutterDeadline);
      endDate.setMinutes(endDate.getMinutes() + 30);
      const end = icsDate(endDate.toISOString());
      lines.push('BEGIN:VEVENT');
      lines.push(`UID:project-${p.id}-cutter@dodidis.media`);
      lines.push(`DTSTAMP:${stamp}`);
      lines.push(`DTSTART:${start}`);
      lines.push(`DTEND:${end}`);
      lines.push(`SUMMARY:⏰ Deadline – ${icsEscape(p.title)}`);
      lines.push(`DESCRIPTION:${icsEscape('Video muss fertig sein.\\n' + desc)}`);
      lines.push(`CATEGORIES:Deadline,${icsEscape(customerLabel)}`);
      lines.push('END:VEVENT');

      // Posting (18:00) – nur für nicht-Cutter
      if (!isCutterOnly) {
        const postingDate = new Date(p.postingDate);
        postingDate.setHours(18, 0, 0, 0);
        const pStart = icsDate(postingDate.toISOString());
        const pEnd = new Date(postingDate);
        pEnd.setMinutes(pEnd.getMinutes() + 30);
        lines.push('BEGIN:VEVENT');
        lines.push(`UID:project-${p.id}-posting@dodidis.media`);
        lines.push(`DTSTAMP:${stamp}`);
        lines.push(`DTSTART:${pStart}`);
        lines.push(`DTEND:${icsDate(pEnd.toISOString())}`);
        lines.push(`SUMMARY:📤 Posting – ${icsEscape(p.title)}`);
        lines.push(`DESCRIPTION:${icsEscape(desc)}`);
        lines.push(`CATEGORIES:Posting,${icsEscape(customerLabel)}`);
        lines.push('END:VEVENT');
      }
    }

    // Deadline (falls abweichend von Posting)
    if (p.deadline && p.deadline !== p.postingDate) {
      lines.push('BEGIN:VEVENT');
      lines.push(`UID:project-${p.id}-deadline@dodidis.media`);
      lines.push(`DTSTAMP:${stamp}`);
      lines.push(`DTSTART;VALUE=DATE:${icsAllDay(p.deadline)}`);
      const end = new Date(p.deadline);
      end.setDate(end.getDate() + 1);
      lines.push(`DTEND;VALUE=DATE:${icsAllDay(end.toISOString().slice(0,10))}`);
      lines.push(`SUMMARY:⏰ Deadline – ${icsEscape(p.title)}`);
      lines.push(`DESCRIPTION:${icsEscape(desc)}`);
      lines.push(`CATEGORIES:Deadline,${icsEscape(customerLabel)}`);
      lines.push('END:VEVENT');
    }
  });

  // Urlaube als ganztägige Events
  // - Agentur-Kalender: alle Urlaube mit Namen
  // - Personal: Hierarchie – eigene Urlaube + alle mit niedrigerem Rollen-Level
  const vacations = isAgencyView
    ? store.vacations
    : store.vacations.filter(v => {
        const u = store.users.find(x => x.id === v.userId);
        return u && canViewVacationOf(forUser, u);
      });
  vacations.forEach(v => {
    const u = store.users.find(x => x.id === v.userId);
    if (!u) return;
    const endNext = new Date(v.endDate);
    endNext.setDate(endNext.getDate() + 1);
    lines.push('BEGIN:VEVENT');
    lines.push(`UID:vacation-${v.id}@dodidis.media`);
    lines.push(`DTSTAMP:${stamp}`);
    lines.push(`DTSTART;VALUE=DATE:${icsAllDay(v.startDate)}`);
    lines.push(`DTEND;VALUE=DATE:${icsAllDay(endNext.toISOString().slice(0,10))}`);
    lines.push(`SUMMARY:🏖️ Urlaub – ${icsEscape(u.name)}`);
    if (v.note) lines.push(`DESCRIPTION:${icsEscape(v.note)}`);
    lines.push(`CATEGORIES:Urlaub`);
    lines.push('END:VEVENT');
  });

  lines.push('END:VCALENDAR');
  return lines.join('\r\n');
}



function copyToClipboard(text, msg = 'In Zwischenablage kopiert') {
  navigator.clipboard.writeText(text).then(() => {
    const el = document.createElement('div');
    el.textContent = msg;
    el.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--bg-3);color:var(--text-1);padding:10px 18px;border-radius:12px;border:1px solid var(--border);box-shadow:var(--shadow);font-size:13px;z-index:9999;';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1800);
  });
}

function renderProjectFilesSection(project, session) {
  const user = session.user;
  const isAdmin      = hasRole(user, ROLES.ADMIN, ROLES.MANAGER);
  const canUploadRaw = isAdmin || hasRole(user, ROLES.VIDEOGRAF);
  const isCutter     = hasRole(user, ROLES.CUTTER) || isAdmin;
  const files = project.files || [];

  const rohmaterial = files.filter(f => f.kind === 'rohmaterial');
  const fertig = files.filter(f => f.kind === 'fertigstellung');
  const other = files.filter(f => !['rohmaterial','fertigstellung'].includes(f.kind));

  function fileRow(f) {
    const icon = f.mime?.startsWith('video/') ? '🎞️' : '📄';
    const size = f.size ? (f.size > 1048576 ? (f.size/1048576).toFixed(1) + ' MB' : Math.round(f.size/1024) + ' KB') : '';
    return `
      <div class="file-uploaded">
        <span style="font-size:16px;">${icon}</span>
        <div style="flex:1;min-width:0;">
          <div style="font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escape(f.filename)}</div>
          ${size ? `<div style="font-size:11px;color:var(--text-3);">${size}</div>` : ''}
        </div>
        <a class="btn btn-secondary btn-sm" href="${API_BASE}/download.php?scope=project&id=${f.id}" target="_blank">Öffnen</a>
      </div>
    `;
  }

  let html = '';

  if (canUploadRaw) {
    html += `
      <div style="margin-top:18px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
          <div class="cutter-detail-label">Rohmaterial (Upload)</div>
          <button type="button" class="btn btn-secondary btn-sm" onclick="uploadProjectFile('rohmaterial','${project.id}')">+ Rohmaterial hochladen</button>
        </div>
        ${rohmaterial.length ? rohmaterial.map(fileRow).join('') : '<div class="text-sm text-muted">Noch kein Rohmaterial hochgeladen.</div>'}
      </div>
    `;
  }

  if (hasRole(user, ROLES.CUTTER)) {
    html += `
      <div style="margin-top:18px;">
        <div class="cutter-detail-label" style="margin-bottom:8px;">Rohmaterial (Download)</div>
        ${rohmaterial.length ? rohmaterial.map(fileRow).join('') : '<div class="text-sm text-muted">Noch kein Rohmaterial verfügbar.</div>'}
      </div>
    `;
  }

  if (isCutter) {
    html += `
      <div style="margin-top:18px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
          <div class="cutter-detail-label">Fertigstellung</div>
          <button type="button" class="btn btn-secondary btn-sm" onclick="uploadProjectFile('fertigstellung','${project.id}')">
            + Fertigstellung hochladen
          </button>
        </div>
        ${fertig.length ? fertig.map(fileRow).join('') : '<div class="text-sm text-muted">Noch keine Fertigstellung hochgeladen.</div>'}
      </div>
    `;
  }

  if (isAdmin && other.length > 0) {
    html += `
      <div style="margin-top:18px;">
        <div class="cutter-detail-label" style="margin-bottom:8px;">Weitere Dateien</div>
        ${other.map(fileRow).join('')}
      </div>
    `;
  }

  return html;
}

async function uploadProjectFile(kind, projectId) {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'video/*,.mp4,.mov,.avi,.webm';
  input.style.display = 'none';
  document.body.appendChild(input);
  input.onchange = async (e) => {
    document.body.removeChild(input);
    const file = e.target.files?.[0];
    if (!file) return;
    const fd = new FormData();
    fd.append('file', file);
    showToast('Wird hochgeladen…', 'Bitte warten.');
    try {
      const res = await fetch(`${API_BASE}/upload.php?scope=project&kind=${encodeURIComponent(kind)}&id=${encodeURIComponent(projectId)}`, {
        method: 'POST', credentials: 'same-origin',
        headers: { 'X-CSRF-Token': CSRF },
        body: fd
      });
      const json = await res.json();
      if (!res.ok || !json.ok) throw new Error(json.error || 'Upload fehlgeschlagen');
      showToast('Hochgeladen', 'Datei erfolgreich gespeichert.');
      fetchNotifications();
      const project = store.projects.find(p => p.id === projectId);
      if (project) openProjectViewerModal(project);
    } catch (err) {
      showToast('Fehler', err.message);
    }
  };
  input.click();
}

/* ----------- VOICE RECORDING ----------- */

let _mediaRecorder = null;
let _audioChunks = [];
let _activeVoiceContractId = null;

async function startVoiceRecording(contractId) {
  _activeVoiceContractId = contractId;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    _mediaRecorder = new MediaRecorder(stream);
    _audioChunks = [];
    _mediaRecorder.ondataavailable = e => { if (e.data.size > 0) _audioChunks.push(e.data); };
    _mediaRecorder.start();
    $('#voice-btn-start')?.classList.add('hide');
    $('#voice-btn-stop')?.classList.remove('hide');
    const s = $('#voice-status');
    if (s) s.textContent = '⏺ Aufnahme läuft…';
  } catch {
    showToast('Kein Mikrofon-Zugriff', 'Bitte Mikrofon im Browser freigeben.');
  }
}

async function stopVoiceRecording() {
  if (!_mediaRecorder) return;
  _mediaRecorder.stop();
  _mediaRecorder.stream?.getTracks().forEach(t => t.stop());
  $('#voice-btn-start')?.classList.remove('hide');
  $('#voice-btn-stop')?.classList.add('hide');
  const s = $('#voice-status');
  if (s) s.textContent = '⏳ Wird gespeichert…';

  await new Promise(resolve => { _mediaRecorder.onstop = resolve; });
  const blob = new Blob(_audioChunks, { type: 'audio/webm' });
  _mediaRecorder = null;

  const contractId = _activeVoiceContractId;
  const commentText = $('#contract-comment-text')?.value?.trim() || '';

  try {
    // 1. Create comment (with optional text)
    const r1 = await fetch(`${API_BASE}/contract_comments.php?contractId=${encodeURIComponent(contractId)}`, {
      method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': CSRF },
      body: JSON.stringify({ text: commentText })
    });
    const j1 = await r1.json();
    if (!r1.ok || !j1.ok) throw new Error(j1.error || 'Fehler beim Anlegen');

    // 2. Upload audio
    const fd = new FormData();
    fd.append('file', blob, 'voice.webm');
    const r2 = await fetch(`${API_BASE}/upload.php?scope=voice&id=${encodeURIComponent(j1.data.id)}`, {
      method: 'POST', credentials: 'same-origin',
      headers: { 'X-CSRF-Token': CSRF },
      body: fd
    });
    const j2 = await r2.json();
    if (!r2.ok || !j2.ok) throw new Error(j2.error || 'Fehler beim Hochladen');

    showToast('Sprachnachricht gespeichert', '');
    openContractModal(contractId);
  } catch (err) {
    showToast('Fehler', err.message);
    if (s) s.textContent = '✗ Fehler';
  }
}

/* Auto-Archivierung: freigegebene Projekte > 7 Tage werden automatisch archiviert */
function runAutoArchive() {
  const now = Date.now();
  const SEVEN_DAYS = 7 * 24 * 60 * 60 * 1000;
  let changed = false;
  store.projects.forEach(p => {
    if (p.status === STATUS.FREIGEGEBEN && p.approvedAt) {
      const ts = new Date(p.approvedAt).getTime();
      if (now - ts >= SEVEN_DAYS) {
        p.status = STATUS.ARCHIVIERT;
        p.archivedAt = new Date().toISOString();
        changed = true;
      }
    }
  });
  if (changed) saveStore();
}

// Kalender-Subscription wird vom Admin im Admin-Bereich konfiguriert (nicht mehr hardcoded).
// Der zuvor seedRaphaelCalendarSubscription()-Block enthielt einen Klartext-GitHub-Token,
// der bei öffentlichem Hosting auslesbar war – jetzt entfernt.

// PHP-Session ist über SESSION_META verfügbar – die App direkt starten.
// (Wenn keine Session vorhanden ist, hat index.php bereits auf login.php weitergeleitet
//  und dieser Code wird gar nicht ausgeführt.)
if (SESSION_META) {
  initApp();
} else if (store.session) {
  // Fallback für direkten Aufruf der HTML-Datei (sollte über index.php nicht passieren)
  initApp();
}

// Keyboard: ESC closes modal, ← / → navigiert Kalenderwoche/-monat
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
  // Nur navigieren, wenn Kalender-Page aktiv ist und kein Input fokussiert
  if (currentPage !== 'calendar') return;
  const tag = document.activeElement?.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
  if (e.key === 'ArrowLeft') calNav('full', -1);
  if (e.key === 'ArrowRight') calNav('full', 1);
  if (e.key === 't' || e.key === 'T') calToday('full');
});

// Hält Event-Beschriftungen in der Wochenansicht sichtbar, ohne die Render-Funktion
// selbst zu verändern. Dadurch bleibt der Patch klein und merge-freundlich.
/* ===== Kalender-Scroll-Diagnose – schreibt AUSSCHLIESSLICH in die Server-Logdatei
   (private_uploads/cal-debug.log). KEINE Anzeige im UI, KEINE Konsolenausgabe.
   Dauerhaft aktiv; abschaltbar mit calDebug(false), wieder einschalten mit calDebug(true).
   Geloggt wird je aktiver Sekunde: Scroll-Events, Frames, Ruckel-Frames (>32ms),
   schlimmste Frame-Zeit, Label-Update (Aufrufe/Ø Balken/max. Dauer), scroll-snap-Modus,
   Drag-Status und Balkenanzahl; zusätzlich Long-Tasks (>50ms). */
let _calDbg = null;
// Diagnose ist DAUERAKTIV (schreibt in private_uploads/cal-debug.log), außer sie
// wurde explizit mit calDebug(false) abgeschaltet (localStorage 'calDebug' === '0').
function _calDebugOn() { try { return localStorage.getItem('calDebug') !== '0'; } catch (e) { return true; } }
function _calDebugActiveScroller() {
  return Array.from(document.querySelectorAll('.ical-scroll')).find(s => s.offsetParent !== null) || null;
}
// Einzige Ausgabe: Zeile an die Server-Logdatei anhängen (private_uploads/cal-debug.log).
function _calDebugPost(line) {
  try {
    fetch(API_BASE + '/cal_debug_log.php', {
      method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'text/plain' },
      body: line, keepalive: true
    }).catch(function () {});
  } catch (e) {}
}
function _calDebugInit() {
  if (!_calDebugOn() || (_calDbg && _calDbg.raf)) return;
  _calDbg = { scrollCount: 0, frames: 0, longFrames: 0, worstFrame: 0,
              updCount: 0, updEvents: 0, updMax: 0, lastFrameTs: performance.now(),
              raf: null, report: null, po: null };
  _calDebugPost('=== Session Start === ' + (window.innerWidth + 'x' + window.innerHeight) + ' UA: ' + navigator.userAgent);
  try {
    if (window.PerformanceObserver) {
      _calDbg.po = new PerformanceObserver(list => {
        if (!_calDebugOn()) return;
        for (const e of list.getEntries()) if (e.duration > 50) {
          _calDebugPost('LongTask ' + e.duration.toFixed(1) + 'ms (blockiert Main-Thread)');
        }
      });
      try { _calDbg.po.observe({ entryTypes: ['longtask'] }); } catch (e) {}
    }
  } catch (e) {}
  const tick = () => {
    if (!_calDebugOn()) { _calDbg.raf = null; return; }
    const now = performance.now(), dt = now - _calDbg.lastFrameTs;
    _calDbg.lastFrameTs = now; _calDbg.frames++;
    if (dt > _calDbg.worstFrame) _calDbg.worstFrame = dt;
    if (dt > 32) _calDbg.longFrames++;
    _calDbg.raf = requestAnimationFrame(tick);
  };
  _calDbg.lastFrameTs = performance.now();
  _calDbg.raf = requestAnimationFrame(tick);
  _calDbg.report = setInterval(() => {
    if (!_calDebugOn()) { clearInterval(_calDbg.report); _calDbg.report = null; return; }
    // Nur bei tatsächlicher Kalender-Aktivität loggen …
    if (_calDbg.scrollCount > 0 || _calDbg.updCount > 0) {
      const sc = _calDebugActiveScroller();
      const snap = sc ? getComputedStyle(sc).scrollSnapType : '?';
      const nEv = sc ? sc.querySelectorAll('.ical-event').length : 0;
      const dragging = sc ? sc.classList.contains('dragging') : false;
      const line = 'scrollEvts=' + _calDbg.scrollCount
        + ' frames=' + _calDbg.frames
        + ' ruckelFrames(>32ms)=' + _calDbg.longFrames
        + ' worstFrame=' + _calDbg.worstFrame.toFixed(1) + 'ms'
        + ' | labelUpdate: calls=' + _calDbg.updCount
        + ' avgBalken=' + (_calDbg.updEvents / Math.max(1, _calDbg.updCount)).toFixed(0)
        + ' maxDauer=' + _calDbg.updMax.toFixed(2) + 'ms'
        + ' | snap=' + snap + ' dragging=' + dragging + ' balkenImDOM=' + nEv;
      _calDebugPost(line);
    }
    // … aber die Fenster-Zähler IMMER zurücksetzen, damit jeder Report nur die
    // letzte aktive Sekunde widerspiegelt (sonst summieren sich Idle-Frames auf).
    _calDbg.scrollCount = _calDbg.frames = _calDbg.longFrames = 0;
    _calDbg.worstFrame = _calDbg.updCount = _calDbg.updEvents = _calDbg.updMax = 0;
  }, 1000);
}
window.calDebug = function (on) {
  if (on === undefined) return _calDebugOn();
  try { localStorage.setItem('calDebug', on ? '1' : '0'); } catch (e) {}
  if (on) {
    _calDebugInit();
  } else if (_calDbg) {
    if (_calDbg.raf) cancelAnimationFrame(_calDbg.raf);
    if (_calDbg.report) clearInterval(_calDbg.report);
    try { if (_calDbg.po) _calDbg.po.disconnect(); } catch (e) {}
    _calDbg = null;
  }
  return on;
};
setTimeout(() => { if (_calDebugOn()) _calDebugInit(); }, 0);

(function initCalendarStickyLabels() {
  function update(scroller) {
    const _dbgT0 = (_calDbg && _calDebugOn()) ? performance.now() : -1;
    if (!scroller || !scroller.querySelector) return;
    const track = scroller.querySelector('.ical-track');
    if (!track) return;
    const styles = getComputedStyle(track);
    // Number.isFinite statt `|| 48`, sonst würde der explizite Wert 0 (volle Ansicht
    // ohne Sidebar) als „fehlend" behandelt und ein Phantom-Offset von 48px bleiben.
    const rawSidebar = Number.parseFloat(styles.getPropertyValue('--ical-sidebar'));
    const sidebarWidth = Number.isFinite(rawSidebar) ? rawSidebar : 48;
    const rawGutter = Number.parseFloat(styles.getPropertyValue('--ical-label-gutter'));
    const labelGutter = Number.isFinite(rawGutter) ? rawGutter : 18;

    // Viewport-relative Messung (getBoundingClientRect) statt offsetLeft:
    // offsetLeft hängt vom offsetParent ab und liefert je nach Layout (Desktop
    // vs. Mobil) unterschiedliche Bezugspunkte – dadurch blieb der Text auf dem
    // PC stehen. Über die Bounding-Rects rechnen wir immer im selben Koordinaten-
    // system und unabhängig vom Scroll-Mechanismus.
    const scRect = scroller.getBoundingClientRect();
    const stickyLeft   = scRect.left + sidebarWidth + labelGutter; // linke Haltelinie
    const visibleRight = scRect.right - 8;

    // WICHTIG (Desktop-Scroll-Performance): Lese- und Schreibphase strikt trennen.
    // Vorher wurde pro Balken gelesen (getBoundingClientRect) UND sofort geschrieben
    // (--label-max-width ändert die Label-Breite). Jeder Schreibvorgang macht das
    // Layout „dirty", sodass das nächste getBoundingClientRect einen erzwungenen
    // Reflow auslöst → O(n) Layout-Berechnungen pro Frame, die in datendichten Wochen
    // das Maus-/Wheel-Scrollen blockieren. Jetzt: erst ALLE Geometrien lesen, dann
    // ALLE Styles schreiben → konstant statt n Reflows pro Frame.
    const events = scroller.querySelectorAll('.ical-event');
    const writes = [];
    for (let i = 0; i < events.length; i++) {
      const eventEl = events[i];
      // Bewegte Einheit = Kürzel (Avatar) + Text zusammen, damit in Safari nichts kleben bleibt.
      const label = eventEl.querySelector('.ical-event-inner');
      if (!label) continue;
      const evRect = eventEl.getBoundingClientRect();        // Balken (unverschoben; Versatz liegt am Inner)
      // Off-Screen-Balken überspringen: spart auf iOS pro Scroll-Frame massiv
      // getBoundingClientRect-/Style-Writes (Safari ruckelte sonst bei 180-Tage-Wochen).
      if (evRect.right < scRect.left || evRect.left > scRect.right) continue;
      // Der Versatz wird über `left` (position:relative) angewendet. Die natürliche Label-
      // Position = aktuelle Inner-Position minus dem zuletzt gesetzten left-Wert. Über
      // getBoundingClientRect (fraktional, präzise) statt offsetLeft (gerundet → Drift/Jitter
      // beim Links-/Rechts-Scrollen) und mit Rückrechnung des angewendeten Versatzes, sonst
      // entstünde eine Rückkopplung (Offset → 0, Text rutscht links raus).
      const appliedLeft = parseFloat(label.style.getPropertyValue('--label-offset')) || 0;
      const naturalLeft = label.getBoundingClientRect().left - appliedLeft; // natürliche Position (Balkenanfang)
      const innerRight = evRect.right - 2;                   // rechtes Balkenende

      // Anschlag direkt am rechten Balkenende (nicht abzüglich Textbreite – sonst
      // würde das Pinning bei langen, abgeschnittenen Titeln auf schmalen Balken
      // ausfallen). Der Text klebt an der Haltelinie, solange der Balken sie
      // überdeckt; sobald das rechte Balkenende die Haltelinie passiert, schrumpft
      // der sichtbare Text und verschwindet zusammen mit dem Balken.
      const targetLeft = Math.max(naturalLeft, Math.min(stickyLeft, innerRight));
      const offset = Math.max(0, targetLeft - naturalLeft);
      const maxWidth = Math.max(0, Math.min(innerRight, visibleRight) - targetLeft);
      writes.push(label, offset.toFixed(2), maxWidth.toFixed(2));
    }
    // Schreibphase – keine Layout-Lesezugriffe mehr dazwischen.
    for (let i = 0; i < writes.length; i += 3) {
      const label = writes[i];
      label.style.setProperty('--label-offset', writes[i + 1] + 'px');
      label.style.setProperty('--label-max-width', writes[i + 2] + 'px');
    }
    if (_dbgT0 >= 0 && _calDbg) {
      const d = performance.now() - _dbgT0;
      _calDbg.updCount++; _calDbg.updEvents += events.length;
      if (d > _calDbg.updMax) _calDbg.updMax = d;
    }
  }

  function bind(scroller) {
    if (!scroller || scroller._dmStickyLabelBound) return;
    scroller._dmStickyLabelBound = true;
    let frame = null;
    const schedule = () => {
      if (_calDbg && _calDebugOn()) _calDbg.scrollCount++;
      if (frame) return;
      frame = requestAnimationFrame(() => {
        frame = null;
        update(scroller);
      });
    };
    scroller.addEventListener('scroll', schedule, { passive: true });
    schedule();
    setTimeout(schedule, 120);
  }

  function bindAll() {
    document.querySelectorAll('.ical-scroll').forEach(bind);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', bindAll, { once: true });
  } else {
    bindAll();
  }

  new MutationObserver(bindAll).observe(document.documentElement, { childList: true, subtree: true });
  window.addEventListener('resize', () => {
    document.querySelectorAll('.ical-scroll').forEach(update);
  }, { passive: true });
})();

</script>

  const open = sb.classList.toggle('open');
  bd.classList.toggle('show', open);
}

/* ----------- SWIPE GESTURE: SIDEBAR ----------- */
(function initSidebarSwipe() {
  const EDGE_ZONE = 40;   // px from left edge to start open-swipe
  const MIN_DIST  = 50;   // min horizontal distance to count as swipe
  const MAX_VERT  = 80;   // max vertical drift before gesture is cancelled
  const MIN_VEL   = 0.3;  // px/ms threshold (optional speed gate)

  let startX = 0, startY = 0, startTime = 0, tracking = false;

  document.addEventListener('touchstart', (e) => {
    // Only engage on mobile (sidebar in slide-out mode)
    if (window.innerWidth > 900) return;
    const touch = e.touches[0];
    const sb = document.querySelector('.sidebar');
    const isOpen = sb && sb.classList.contains('open');
    // Open: touch anywhere; Close: only if inside sidebar or from the left
    if (!isOpen && touch.clientX > EDGE_ZONE) return;
    startX    = touch.clientX;
    startY    = touch.clientY;
    startTime = e.timeStamp;
    tracking  = true;
  }, { passive: true });

  document.addEventListener('touchmove', (e) => {
    if (!tracking) return;
    const touch = e.touches[0];
    const dx = touch.clientX - startX;
    const dy = touch.clientY - startY;
    // Cancel if vertical movement dominates early (user is scrolling)
    if (Math.abs(dy) > MAX_VERT && Math.abs(dx) < MIN_DIST) {
      tracking = false;
    }
  }, { passive: true });

  document.addEventListener('touchend', (e) => {
    if (!tracking) return;
    tracking = false;
    const touch = e.changedTouches[0];
    const dx       = touch.clientX - startX;
    const dy       = touch.clientY - startY;
    const dt       = e.timeStamp - startTime;
    const vel      = Math.abs(dx) / dt;
    const sb       = document.querySelector('.sidebar');
    const bd       = document.getElementById('sidebar-backdrop');
    if (!sb || !bd) return;

    // Reject if mostly vertical
    if (Math.abs(dy) > Math.abs(dx) * 1.5) return;

    const isOpen = sb.classList.contains('open');
    if (!isOpen && dx >= MIN_DIST && vel >= MIN_VEL) {
      // Swipe right → open
      sb.classList.add('open');
      bd.classList.add('show');
    } else if (isOpen && dx <= -MIN_DIST && vel >= MIN_VEL) {
      // Swipe left → close
      sb.classList.remove('open');
      bd.classList.remove('show');
    }
  }, { passive: true });
})();

function renderPage() {
  const session = getCurrentUser();
  if (!session) return logout();

  renderBottomNav();

  // Update user card
  const name = session.type === 'staff' ? session.user.name : session.customer.name;
  const role = session.type === 'staff' ? primaryRoleLabel(session.user) : 'Kunde';
  const avatarEl = $('#user-avatar');
  if (session.type === 'staff' && session.user.avatarImage) {
    avatarEl.textContent = '';
    avatarEl.style.backgroundImage = `url('${session.user.avatarImage}')`;
    avatarEl.style.background = `url('${session.user.avatarImage}') center/cover no-repeat`;
  } else {
    avatarEl.textContent = initials(name);
    if (session.type === 'staff') {
      avatarEl.style.background = userAvatarColor(session.user);
      avatarEl.style.color = 'white';
    }
  }
  $('#user-name').textContent = name;
  $('#user-role').textContent = role;

  const pages = {
    dashboard: renderDashboard,
    projects: renderProjects,
    shootdays: renderShootDays,
    reports: renderReports,
    calendar: renderCalendar,
    customers: renderCustomers,
    vacation: renderVacation,
    todos: renderTodos,
    meetings: renderMeetings,
    archive: renderArchive,
    contracts: renderContracts,
    'social-content': renderSocialContent,
    admin: renderAdmin,
    'customer-overview': renderCustomerOverview
  };

  // Default page for customers
  if (session.type === 'customer' && currentPage !== 'customer-overview') {
    currentPage = 'customer-overview';
  }
  // Permission check: only admins see admin
  if (currentPage === 'admin' && (session.type !== 'staff' || !hasRole(session.user, ROLES.ADMIN))) {
    currentPage = 'dashboard';
  }
  if (currentPage === 'contracts' && (session.type !== 'staff' || !hasRole(session.user, ROLES.ADMIN, ROLES.MANAGER, ROLES.CONTRACT_UPLOADER))) {
    currentPage = 'dashboard';
  }
  if (currentPage === 'social-content' && (session.type !== 'staff' || !hasRole(session.user, ROLES.ADMIN, ROLES.MANAGER))) {
    currentPage = 'dashboard';
  }

  const render = pages[currentPage] || renderDashboard;
  render(session);
}

function previewContractFile(e, labelId) {
  const file = e.target.files[0];
  if (!file) return;

  if (parent) {
    parent.style.borderColor = 'var(--accent)';
    parent.style.background = 'var(--accent-soft)';
  }
  if (labelEl) labelEl.textContent = '✓ ' + file.name;
}

async function submitNewContract(e) {
  e.preventDefault();
  const form = e.target;
  const btn = document.getElementById('contract-submit-btn');
  btn.disabled = true;
  btn.textContent = 'Wird angelegt…';

  try {
    const title = form.title.value.trim();
    const customerId = form.customerId?.value || null;
    const contract = await apiPost('/contracts.php', { title, customerId });

    const fileInput = document.getElementById('new-contract-file');
    if (fileInput?.files[0]) {
      await uploadContractPdf(contract.id, fileInput.files[0]);
    }

    contractsCache = null;
    closeModal();
    showToast('Vertrag angelegt', 'success');
    renderContracts(getCurrentUser());
  } catch (err) {
    showToast('Fehler beim Anlegen: ' + err.message, 'error');
    btn.disabled = false;
    btn.textContent = 'Anlegen';
  }
}

async function uploadContractPdf(contractId, file) {
  const fd = new FormData();
  fd.append('file', file);
  const res = await fetch(API_BASE + '/upload.php?scope=contract&id=' + contractId, {
    method: 'POST',
    credentials: 'same-origin',
    headers: { 'X-CSRF-Token': CSRF },
    body: fd
  });
  const j = await res.json().catch(() => ({ success: false, error: 'HTTP ' + res.status }));
  if (!res.ok || !j.success) throw new Error(j.error || 'Upload fehlgeschlagen');
  return j.data;
}

/* ===========================================================================
   DIGITALE VERTRAGSUNTERSCHRIFT
   - Signatur-Pad (Canvas), pdf-lib (lazy) für finale PDF mit beiden Signaturen,
     Agentur-Vorsignatur (presign), Kunden-Unterschrift (customer-sign),
     Staff-Direktupload bereits unterschriebener Verträge (upload-signed).
   =========================================================================== */

function contractStatusBadge(status) {
  switch (status) {
    case 'confirmed':          return '<span class="badge badge-freigegeben">Bestätigt</span>';
    case 'awaiting_signature': return '<span class="badge badge-schnitt">Wartet auf Unterschrift</span>';
    case 'signed':             return '<span class="badge badge-fertig">Unterschrieben</span>';
    default:                   return '<span class="badge badge-skript">Entwurf</span>';
  }
}

function isPdfContract(contract) {
  return !!contract.path && (contract.mime === 'application/pdf' || /\.pdf$/i.test(contract.filename || ''));
}

const SIGN_CONSENT_TEXT = 'Mit dem Unterschreiben bestätige ich rechtsverbindlich, dass ich den vorliegenden Vertrag gelesen habe und ihm zustimme. Mir ist bekannt, dass es sich um eine einfache elektronische Signatur handelt.';

// pdf-lib bei Bedarf nachladen (UMD-Bundle, stellt window.PDFLib bereit)
let _pdfLibPromise = null;
function loadPdfLib() {
  if (window.PDFLib) return Promise.resolve(window.PDFLib);
  if (_pdfLibPromise) return _pdfLibPromise;
  _pdfLibPromise = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = APP_BASE + 'assets/pdf-lib.min.js';
    s.onload = () => window.PDFLib ? resolve(window.PDFLib) : reject(new Error('pdf-lib nicht verfügbar'));
    s.onerror = () => reject(new Error('pdf-lib konnte nicht geladen werden'));
    document.head.appendChild(s);
  });
  return _pdfLibPromise;
}

/**
 * Signatur-Pad-Modal. options: { title, subtitle, requireName, defaultName, consent (bool),
 * confirmLabel }. Resolved-Wert: { signature(dataURL PNG), name, consent } oder null (Abbruch).
 */
function openSignaturePadModal(options = {}) {
  const {
    title = 'Unterschrift', subtitle = '', requireName = true,
    defaultName = '', consent = false, confirmLabel = 'Bestätigen'
  } = options;
  return new Promise((resolve) => {
    const html = `<div class="modal-overlay" id="sigpad-overlay">
      <div class="modal" style="max-width:480px;">
        <div class="modal-header">
          <div class="modal-title">${escape(title)}</div>
          <button class="btn btn-ghost" id="sigpad-x">×</button>
        </div>
        <div class="modal-body">
          ${subtitle ? `<p class="text-sm text-muted" style="margin-bottom:12px;">${escape(subtitle)}</p>` : ''}
          ${requireName ? `<div class="form-group">
            <label class="form-label">Name *</label>
            <input type="text" id="sigpad-name" maxlength="255" value="${escape(defaultName)}" placeholder="Vor- und Nachname" />
          </div>` : ''}
          <div class="form-group">
            <label class="form-label">Unterschrift *</label>
            <div style="border:1px dashed var(--border-strong);border-radius:10px;background:#fff;touch-action:none;overflow:hidden;">
              <canvas id="sigpad-canvas" style="display:block;width:100%;height:180px;cursor:crosshair;"></canvas>
            </div>
            <div style="display:flex;justify-content:flex-end;margin-top:6px;">
              <button type="button" class="btn btn-ghost btn-sm" id="sigpad-clear">Löschen</button>
            </div>
          </div>
          ${consent ? `<label style="display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--text-2);cursor:pointer;">
            <input type="checkbox" id="sigpad-consent" style="margin-top:3px;flex-shrink:0;" />
            <span>${escape(SIGN_CONSENT_TEXT)}</span>
          </label>` : ''}
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-ghost" id="sigpad-cancel">Abbrechen</button>
          <button type="button" class="btn btn-primary" id="sigpad-confirm">${escape(confirmLabel)}</button>
        </div>
      </div>
    </div>`;
    $('#modal-container').innerHTML = html;

    const canvas = document.getElementById('sigpad-canvas');
    const ctx = canvas.getContext('2d');
    let drawing = false, hasInk = false, last = null;

    function resize() {
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      const prev = hasInk ? canvas.toDataURL() : null;
      canvas.width = Math.max(1, Math.round(rect.width * dpr));
      canvas.height = Math.max(1, Math.round(rect.height * dpr));
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.lineWidth = 2.2; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.strokeStyle = '#111';
      if (prev) {
        const img = new Image();
        img.onload = () => ctx.drawImage(img, 0, 0, rect.width, rect.height);
        img.src = prev;
      }
    }
    setTimeout(resize, 0);
    const onResize = () => resize();
    window.addEventListener('resize', onResize);

    function pos(e) {
      const rect = canvas.getBoundingClientRect();
      const p = (e.touches && e.touches[0]) ? e.touches[0] : e;
      return { x: p.clientX - rect.left, y: p.clientY - rect.top };
    }
    function start(e) { e.preventDefault(); drawing = true; last = pos(e); }
    function move(e) {
      if (!drawing) return;
      e.preventDefault();
      const p = pos(e);
      ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke();
      last = p; hasInk = true;
    }
    function end() { drawing = false; }

    canvas.addEventListener('pointerdown', start);
    canvas.addEventListener('pointermove', move);
    window.addEventListener('pointerup', end);

    function cleanup() {
      window.removeEventListener('resize', onResize);
      window.removeEventListener('pointerup', end);
    }
    function close(val) { cleanup(); closeModal(); resolve(val); }

    document.getElementById('sigpad-clear').onclick = () => {
      ctx.clearRect(0, 0, canvas.width, canvas.height); hasInk = false;
    };
    document.getElementById('sigpad-x').onclick = () => close(null);
    document.getElementById('sigpad-cancel').onclick = () => close(null);
    document.getElementById('sigpad-overlay').onclick = (ev) => { if (ev.target.id === 'sigpad-overlay') close(null); };
    document.getElementById('sigpad-confirm').onclick = () => {
      const name = requireName ? (document.getElementById('sigpad-name').value || '').trim() : '';
      if (requireName && !name) { showToast('Bitte Namen eingeben.', 'warn'); return; }
      if (!hasInk) { showToast('Bitte zuerst unterschreiben.', 'warn'); return; }
      if (consent && !document.getElementById('sigpad-consent').checked) {
        showToast('Bitte die Einwilligung bestätigen.', 'warn'); return;
      }
      close({ signature: canvas.toDataURL('image/png'), name, consent: true });
    };
  });
}

/**
 * Hängt an das Original-PDF eine Unterschriften-Seite an (beide Signaturen + Audit).
 * Gibt ein Uint8Array (fertige PDF) zurück.
 */
async function buildSignedPdf(originalBytes, data) {
  const PDFLib = await loadPdfLib();
  const { PDFDocument, StandardFonts, rgb } = PDFLib;
  const pdf = await PDFDocument.load(originalBytes);
  const font = await pdf.embedFont(StandardFonts.Helvetica);
  const fontBold = await pdf.embedFont(StandardFonts.HelveticaBold);

  const page = pdf.addPage([595.28, 841.89]); // A4
  const { width, height } = page.getSize();
  const margin = 56;
  let y = height - margin;
  const text = (s, x, yy, size, f, color) => page.drawText(String(s == null ? '' : s), { x, y: yy, size, font: f || font, color: color || rgb(0.1,0.1,0.1) });

  text('Unterschriften', margin, y, 20, fontBold); y -= 14;
  page.drawLine({ start: { x: margin, y }, end: { x: width - margin, y }, thickness: 1, color: rgb(0.8,0.8,0.8) }); y -= 26;
  text('Vertrag: ' + (data.title || ''), margin, y, 12, fontBold); y -= 30;

  async function drawSig(label, pngDataUrl, name, dateStr, extra) {
    text(label, margin, y, 11, fontBold, rgb(0.35,0.35,0.35)); y -= 8;
    if (pngDataUrl) {
      try {
        const png = await pdf.embedPng(pngDataUrl);
        const maxW = 200, maxH = 70;
        const scale = Math.min(maxW / png.width, maxH / png.height, 1);
        const w = png.width * scale, h = png.height * scale;
        y -= h;
        page.drawImage(png, { x: margin, y, width: w, height: h });
      } catch (e) { y -= 10; }
    }
    y -= 16;
    page.drawLine({ start: { x: margin, y }, end: { x: margin + 220, y }, thickness: 0.8, color: rgb(0.6,0.6,0.6) }); y -= 14;
    text(name || '', margin, y, 11, font); y -= 14;
    text('Datum: ' + (dateStr || ''), margin, y, 10, font, rgb(0.4,0.4,0.4)); y -= 12;
    if (extra) { text(extra, margin, y, 9, font, rgb(0.5,0.5,0.5)); y -= 12; }
    y -= 18;
  }

  await drawSig('Agentur (Dodidis Media)', data.agencySigPng, data.agencyName, data.agencyDate);
  await drawSig('Kunde', data.customerSigPng, data.customerName, data.customerDate,
                data.ip ? ('IP-Adresse: ' + data.ip) : '');

  // Einwilligungstext + Audit
  y -= 6;
  page.drawLine({ start: { x: margin, y }, end: { x: width - margin, y }, thickness: 0.6, color: rgb(0.85,0.85,0.85) }); y -= 18;
  const wrap = (str, max) => {
    const words = String(str).split(' '); const lines = []; let cur = '';
    for (const w of words) { if ((cur + ' ' + w).trim().length > max) { lines.push(cur.trim()); cur = w; } else cur += ' ' + w; }
    if (cur.trim()) lines.push(cur.trim()); return lines;
  };
  wrap(SIGN_CONSENT_TEXT, 95).forEach(line => { text(line, margin, y, 8.5, font, rgb(0.45,0.45,0.45)); y -= 12; });
  y -= 6;
  if (data.originalHash) { text('Dokument-Prüfsumme (SHA-256, Original): ' + data.originalHash, margin, y, 7.5, font, rgb(0.55,0.55,0.55)); y -= 11; }

  return await pdf.save();
}

async function uploadSignedContract(contractId, btn) {

/* ----------- KUNDE: Vertrag unterschreiben ----------- */
async function customerSignContract(contractId) {
  let contract;
  try { contract = await apiGet('/contracts.php?id=' + encodeURIComponent(contractId)); }
  catch (e) { showToast('Fehler beim Laden: ' + e.message, 'error'); return; }
  if (contract.status !== 'awaiting_signature') { showToast('Dieser Vertrag steht nicht (mehr) zur Unterschrift bereit.', 'warn'); return; }

  const res = await openSignaturePadModal({
    title: 'Vertrag unterschreiben',
    subtitle: 'Bitte unterschreiben Sie im Feld unten und bestätigen Sie die Einwilligung.',
    requireName: true,
    defaultName: getCurrentUser()?.customer?.name || '',
    consent: true,
    confirmLabel: 'Rechtsverbindlich unterschreiben'
  });
  if (!res) return;

  showToast('Dokument wird erstellt…', 'info');
  try {
    // Original-PDF laden (download.php liefert es im awaiting_signature-Status für den eigenen Kunden)
    const dlRes = await fetch(API_BASE + '/download.php?scope=contract&id=' + encodeURIComponent(contractId), { credentials: 'same-origin' });
    if (!dlRes.ok) throw new Error('Original-PDF konnte nicht geladen werden.');
    const originalBytes = new Uint8Array(await dlRes.arrayBuffer());

    const nowStr = new Date().toLocaleString('de-DE');
    const agencyDate = contract.agencySignedAt ? new Date(contract.agencySignedAt.replace(' ', 'T')).toLocaleString('de-DE') : '';
    const signedBytes = await buildSignedPdf(originalBytes, {
      title: contract.title,
      agencyName: contract.agencySignerName || 'Dodidis Media',
      agencyDate,
      agencySigPng: (contract.agencySignature && contract.agencySignature.indexOf('data:image/') === 0) ? contract.agencySignature : null,
      customerName: res.name,
      customerDate: nowStr,
      customerSigPng: res.signature,
      ip: null,                  // IP wird serverseitig erfasst
      originalHash: null
    });

    const base = (contract.filename || (contract.title || 'vertrag')).replace(/\.pdf$/i, '').replace(/[^a-zA-Z0-9._\-]+/g, '_').slice(0, 80) || 'vertrag';
    const fd = new FormData();
    fd.append('file', new Blob([signedBytes], { type: 'application/pdf' }), base + '_unterschrieben.pdf');
    fd.append('customerSignerName', res.name);
    fd.append('consent', '1');
    fd.append('customerSignature', res.signature);

    const up = await fetch(API_BASE + '/contracts.php?action=customer-sign&id=' + encodeURIComponent(contractId), {
      method: 'POST', credentials: 'same-origin', headers: { 'X-CSRF-Token': CSRF }, body: fd
    });
    const j = await up.json().catch(() => ({ success: false, error: 'HTTP ' + up.status }));
    if (!up.ok || !j.success) throw new Error(j.error || 'Unterschrift fehlgeschlagen');

    closeModal();
    showToast('Vertrag erfolgreich unterschrieben!', 'success');
    renderCustomerOverview(getCurrentUser());
  } catch (e) {
    showToast('Fehler: ' + e.message, 'error');
  }
}

/* ===========================================================================
   SOCIAL CONTENT – Freigabe von n8n-erzeugten Instagram-Storys
   Ablauf: n8n legt Entwürfe an (content_create.php) → hier prüfen & freigeben
   (mit geplanter Zeit) → n8n holt freigegebene fällige Storys (content_pending.php).
   =========================================================================== */

function socialStatusBadge(status) {
  switch (status) {
    case 'approved':  return '<span class="badge badge-geplant">Freigegeben</span>';
    case 'published': return '<span class="badge badge-fertig">Veröffentlicht</span>';
    case 'error':     return '<span class="badge badge-korrektur">Fehler</span>';
    case 'rejected':  return '<span class="badge badge-archiviert">Abgelehnt</span>';
    default:          return '<span class="badge badge-skript">Entwurf</span>';
  }
}

function socialMediaPreview(url) {
  if (!url) return '<div class="text-muted text-sm">Kein Medium</div>';
  const safe = escape(url);
  if (/\.(mp4|mov|webm)(\?|$)/i.test(url)) {
    return `<video src="${safe}" controls preload="metadata" style="width:100%;max-height:320px;border-radius:10px;background:#000;"></video>`;
  }
  if (/\.(jpe?g|png|webp|gif)(\?|$)/i.test(url)) {
    return `<img src="${safe}" alt="Vorschau" loading="lazy" style="width:100%;max-height:320px;object-fit:contain;border-radius:10px;background:#000;" onerror="this.style.display='none';this.nextElementSibling.style.display='block';" />
            <a href="${safe}" target="_blank" class="text-sm" style="display:none;">Medium öffnen ↗</a>`;
  }
  return `<a href="${safe}" target="_blank" class="btn btn-ghost btn-sm">Medium öffnen ↗</a>`;
}

// datetime-local-Default: morgen 09:00 (lokale Zeit), Format YYYY-MM-DDTHH:MM
function defaultScheduleValue() {
  const d = new Date();
  d.setDate(d.getDate() + 1);
  d.setHours(9, 0, 0, 0);
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

        <tbody>${done.map(compactRow).join('')}</tbody></table>

  `;

// MySQL-DATETIME ("YYYY-MM-DD HH:MM:SS") → datetime-local-Wert ("YYYY-MM-DDTHH:MM")
function toLocalInput(mysqlDt) {
  if (!mysqlDt) return defaultScheduleValue();
  const s = String(mysqlDt).replace(' ', 'T');
  return s.slice(0, 16);

/* Videograf-Drehtag-Checkliste fürs Dashboard */
function renderVideografShootChecklist(user) {
  if (!hasRole(user, ROLES.VIDEOGRAF)) return '';
  const today = new Date().toISOString().slice(0,10);
  const horizon = addDays(today, 14); // nächste 2 Wochen
  const projects = store.projects.filter(p =>
    p.videografId === user.id &&
    p.shootDate &&
    p.shootDate >= today &&
    p.shootDate <= horizon &&
    p.status !== STATUS.ARCHIVIERT &&
    p.status !== STATUS.FREIGEGEBEN
  ).sort((a,b) => a.shootDate.localeCompare(b.shootDate));
  if (projects.length === 0) return '';
  // Gruppiere nach Drehtag
  const byDate = {};
  projects.forEach(p => { (byDate[p.shootDate] = byDate[p.shootDate] || []).push(p); });
  return `
    <div class="card">
      <div class="card-header"><div class="card-title">Deine Drehtage</div></div>
      <div style="padding: 14px 16px;">
        ${Object.entries(byDate).map(([date, list]) => {
          const allShot = list.every(p => p.status === STATUS.GEDREHT || p.status === STATUS.SCHNITT || p.status === STATUS.FERTIG || p.status === STATUS.KORREKTUR);
          const dateLabel = new Date(date).toLocaleDateString('de-DE', { weekday: 'long', day: '2-digit', month: 'long' });
          return `
            <div class="shoot-day-card">
              <div class="shoot-day-header">
                <span class="date">${escape(dateLabel)}</span>

              </div>
              ${list.map(p => {
                const c = store.customers.find(x => x.id === p.customerId);
                const shot = p.status === STATUS.GEDREHT || p.status === STATUS.SCHNITT || p.status === STATUS.FERTIG || p.status === STATUS.KORREKTUR;
                return `
                  <div class="shoot-item ${shot ? 'shot' : ''}">

                      <div class="shoot-item-title">${escape(p.title)}</div>

// Zentrale Permission-Checks (clientseitig – ersetzen keine echte RLS, aber blocken Bedienfehler & casual misuse)
function canActOnProject(project, session, action) {
  if (!session || session.type !== 'staff') return false;
  const user = session.user;
  const userId = user.id;
  const isAdmin = hasRole(user, ROLES.ADMIN);
  const isManager = hasRole(user, ROLES.MANAGER);
  if (isAdmin) return true;
  // Manager nur für eigene Kunden-Projekte (und alle internen)
  if (isManager) {
    const isMine = project.isInternal
      ? true
      : (() => {
          const c = store.customers.find(x => x.id === project.customerId);
          return !c || !c.managerId || c.managerId === userId;
        })();
    if (isMine && ['approve','correction','archive','delete','markAsShot','cutterAccept','cutterMarkDone','cutterRevert'].includes(action)) {
      return true;
    }
  }
  // Videograf darf "abgedreht markieren" auf seinen eigenen Drehs
  if (action === 'markAsShot' && project.videografId === userId) return true;
  // Cutter darf annehmen / fertig / revert auf seinen Projekten
  if ((action === 'cutterAccept' || action === 'cutterMarkDone' || action === 'cutterRevert')
      && project.cutterId === userId) return true;
  return false;
}

async function markAsShot(projectId) {
  const p = store.projects.find(x => x.id === projectId);
  if (!p) { appAlert('Projekt nicht gefunden.', { title: 'Fehler' }); return; }
  const session = getCurrentUser();
  if (!canActOnProject(p, session, 'markAsShot')) {
    appAlert('Du hast keine Berechtigung, dieses Projekt zu ändern.', { title: 'Nicht erlaubt' });
    return;
  }
  // Snapshot für Rollback
  const prevStatus = p.status;
  const prevShotAt = p.shotAt;
  // Optimistisch lokal updaten + Lock gegen Pull-Race
  lockProjectStatus(p.id, STATUS.GEDREHT);
  p.status = STATUS.GEDREHT;
  p.shotAt = new Date().toISOString();
  logActivity('project', p.id, 'markAsShot', { title: p.title });
  // Cutter informieren
  if (p.cutterId) {
    try {
      if ('Notification' in window && Notification.permission === 'granted') {
        new Notification('Video bereit zum Schnitt', { body: p.title });
      }
    } catch {}
    const cutter = store.users.find(u => u.id === p.cutterId);
    if (cutter) notifyUser(p.cutterId, 'Video bereit zum Schnitt', `„${p.title}" wurde abgedreht.`);
  }
  closeModal();
  renderPage();
  showToast('Als abgedreht markiert', `„${p.title}" ist jetzt bereit für den Schnitt`);
  // Direkt in DB schreiben
  try {
    const res = await fetch(
      `${API_BASE}/projects.php?id=${encodeURIComponent(projectId)}`,
      {
        method: 'PUT',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': CSRF },
        body: JSON.stringify({ status: 'gedreht' })
      }
    );
    const json = await res.json();
    if (!res.ok || !json.ok) throw new Error(json.error || 'Speichern fehlgeschlagen');
    if (json.data) {
      const idx = store.projects.findIndex(x => x.id === projectId);
      if (idx >= 0) store.projects[idx] = { ...store.projects[idx], ...json.data };
    }
    unlockProjectStatus(projectId);
    renderPage();
  } catch (err) {
    unlockProjectStatus(projectId);
    // Rollback
    p.status = prevStatus;
    p.shotAt = prevShotAt;
    renderPage();
    showToast('Fehler beim Speichern', err.message);
  }
}

async function revertGedreht(projectId) {
  const p = store.projects.find(x => x.id === projectId);
  if (!p || p.status !== STATUS.GEDREHT) return;
  const session = getCurrentUser();
  if (!canActOnProject(p, session, 'markAsShot')) {
    appAlert('Keine Berechtigung.', { title: 'Nicht erlaubt' });
    return;
  }
  const ok = await appConfirm('Das Projekt wird zurück auf "Geplant" gesetzt.', {
    title: 'Gedreht rückgängig machen?', okLabel: 'Zurücksetzen'
  });
  if (!ok) return;
  const prevStatus = p.status;
  lockProjectStatus(projectId, STATUS.GEPLANT);
  p.status = STATUS.GEPLANT;
  closeModal();
  renderPage();
  try {
    const res = await fetch(`${API_BASE}/projects.php?id=${encodeURIComponent(projectId)}`, {
      method: 'PUT', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': CSRF },
      body: JSON.stringify({ status: STATUS.GEPLANT })
    });
    const json = await res.json();
    if (!res.ok || !json.ok) throw new Error(json.error || 'Fehler');
    const idx = store.projects.findIndex(x => x.id === projectId);
    if (idx >= 0 && json.data) store.projects[idx] = { ...store.projects[idx], ...json.data };
    unlockProjectStatus(projectId);
    renderPage();
  } catch (err) {
    unlockProjectStatus(projectId);
    p.status = prevStatus;
    renderPage();
    showToast('Fehler beim Speichern', err.message);

}

/* Cutter-Queue fürs Dashboard */
function renderCutterQueue(user) {
  if (!hasRole(user, ROLES.CUTTER)) return '';
  // Nur ab abgedreht sichtbar – nicht abgedrehte Projekte tauchen erst gar nicht auf
  const projects = store.projects.filter(p =>
    p.cutterId === user.id &&
    cutterCanSeeStatus(p.status) &&
    p.status !== STATUS.ARCHIVIERT &&
    p.status !== STATUS.FREIGEGEBEN
  );
  if (projects.length === 0) return '';
  const ready = projects.filter(p => p.status === STATUS.GEDREHT);
  const inProgress = projects.filter(p => p.status === STATUS.SCHNITT);
  const correction = projects.filter(p => p.status === STATUS.KORREKTUR);
  const pendingApproval = projects.filter(p => p.status === STATUS.FERTIG);
  return `
    <div class="card">

        ${inProgress.length > 0 ? `
          <div class="cut-queue-section">
            <div class="cut-queue-section-title">✂️ In Bearbeitung</div>

        ${pendingApproval.length > 0 ? `
          <div class="cut-queue-section">

function renderCutQueueItem(p, kind) {
  const c = store.customers.find(x => x.id === p.customerId);
  const subtitle = (c?.name || (p.isInternal ? 'Intern' : '–'));
  // Cutter sehen kein Posting, nur Deadline

        <div class="cut-queue-item-meta">${escape(subtitle)} ${escape(meta)}</div>

      ${actionHtml}

}

/* ----------- BULK SELECTION ----------- */
let bulkSelection = { type: null, ids: new Set() };

function toggleBulk(type, id, checked) {
  if (bulkSelection.type !== type) {
    bulkSelection = { type, ids: new Set() };
  }
  if (checked) bulkSelection.ids.add(id);
  else bulkSelection.ids.delete(id);
  renderBulkBar();
}
function clearBulk() {
  bulkSelection = { type: null, ids: new Set() };
  document.querySelectorAll('.bulk-checkbox').forEach(cb => { cb.checked = false; });
  renderBulkBar();
}
function bulkSelectAll(type, ids) {
  bulkSelection = { type, ids: new Set(ids) };
  document.querySelectorAll('.bulk-checkbox').forEach(cb => { cb.checked = true; });
  renderBulkBar();
}
function renderBulkBar() {
  let bar = document.getElementById('bulk-bar');
  if (bulkSelection.ids.size === 0) { if (bar) bar.remove(); return; }
  if (!bar) {
    bar = document.createElement('div');
    bar.id = 'bulk-bar';
    bar.style.cssText = 'position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:rgba(30,30,32,0.95); border:1px solid var(--border); border-radius:12px; padding:10px 14px; display:flex; gap:10px; align-items:center; box-shadow:0 8px 24px rgba(0,0,0,0.4); z-index:200; backdrop-filter:blur(20px);';
    document.body.appendChild(bar);
  }
  const t = bulkSelection.type;
  bar.innerHTML = `
    <span style="font-size:13px; font-weight:500;">${bulkSelection.ids.size} ausgewählt</span>
    ${t === 'customers' ? `
      <button class="btn btn-secondary btn-sm" onclick="bulkPauseCustomers()">Pausieren</button>
      <button class="btn btn-secondary btn-sm" onclick="bulkActivateCustomers()">Aktivieren</button>
    ` : ''}
    ${t === 'projects' ? `
      <button class="btn btn-secondary btn-sm" onclick="bulkArchiveProjects()">Archivieren</button>
    ` : ''}
    <button class="btn btn-danger btn-sm" onclick="bulkDelete()">Löschen</button>
    <button class="btn btn-ghost btn-sm" onclick="clearBulk()">Abbrechen</button>
  `;
}
function _bulkRequireAdmin() {
  const session = getCurrentUser();
  if (!session || session.type !== 'staff' || !hasRole(session.user, ROLES.ADMIN)) {
    appAlert('Nur Admins dürfen Bulk-Aktionen ausführen.', { title: 'Nicht erlaubt' });
    return false;
  }
  return true;
}
async function bulkPauseCustomers() {
  if (!_bulkRequireAdmin()) return;
  const ids = [...bulkSelection.ids];
  ids.forEach(id => { const idx = store.customers.findIndex(c => c.id === id); if (idx >= 0) store.customers[idx].status = 'paused'; });
  saveStore(); clearBulk(); renderPage(); showToast(`${ids.length} Kunden pausiert`, '');
}
async function bulkActivateCustomers() {
  if (!_bulkRequireAdmin()) return;
  const ids = [...bulkSelection.ids];
  ids.forEach(id => { const idx = store.customers.findIndex(c => c.id === id); if (idx >= 0) store.customers[idx].status = null; });
  saveStore(); clearBulk(); renderPage(); showToast(`${ids.length} Kunden aktiv`, '');
}
async function bulkArchiveProjects() {
  if (!_bulkRequireAdmin()) return;
  const ids = [...bulkSelection.ids];
  ids.forEach(id => { const idx = store.projects.findIndex(p => p.id === id); if (idx >= 0) store.projects[idx].status = STATUS.ARCHIVIERT; });
  saveStore(); clearBulk(); renderPage(); showToast(`${ids.length} Projekte archiviert`, '');
}
async function bulkDelete() {
  if (!_bulkRequireAdmin()) return;
  const ids = [...bulkSelection.ids];
  const type = bulkSelection.type;
  const ok = await appConfirm(`Wirklich ${ids.length} Einträge löschen? Die Aktion kann nicht rückgängig gemacht werden.`, { title: 'Bulk-Löschung?', okLabel: 'Alle löschen', danger: true });
  if (!ok) return;
  ids.forEach(id => trackDeletion(type, id));
  if (type === 'projects') store.projects = store.projects.filter(p => !ids.includes(p.id));
  if (type === 'customers') store.customers = store.customers.filter(c => !ids.includes(c.id));
  saveStore(); clearBulk(); renderPage();
}

/* ----------- PROJECT/CUSTOMER FILTERS (pro User in LocalStorage) ----------- */
function _filterKey(prefix) {
  const sess = getCurrentUser();
  const id = sess?.user?.id || sess?.customer?.id || 'anon';
  return prefix + '_' + id;
}
let _projFilterDebounce = null;
function onProjectFilterChange() {
  if (_projFilterDebounce) clearTimeout(_projFilterDebounce);
  _projFilterDebounce = setTimeout(() => {
    const f = {
      q: document.getElementById('proj-search')?.value || '',
      status: document.getElementById('proj-status')?.value || 'all'
    };
    localStorage.setItem(_filterKey('proj_filters'), JSON.stringify(f));
    renderPage();
    setTimeout(() => {
      const el = document.getElementById('proj-search');
      if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
    }, 0);
  }, 220);
}
function resetProjectFilters() {
  localStorage.removeItem(_filterKey('proj_filters'));
  renderPage();
}

let _custFilterDebounce = null;
function onCustomerFilterChange() {
  if (_custFilterDebounce) clearTimeout(_custFilterDebounce);
  _custFilterDebounce = setTimeout(() => {
    const f = {
      q: document.getElementById('cust-search')?.value || '',
      status: document.getElementById('cust-status')?.value || 'all'
    };
    localStorage.setItem(_filterKey('cust_filters'), JSON.stringify(f));
    renderPage();
    setTimeout(() => {
      const el = document.getElementById('cust-search');
      if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
    }, 0);
  }, 220);
}
function resetCustomerFilters() {
  localStorage.removeItem(_filterKey('cust_filters'));
  renderPage();
}

/* ----------- PROJECTS ----------- */
function renderProjects(session) {
  $('#page-title').textContent = 'Projekte';
  $('#page-subtitle').textContent = 'Alle laufenden Videoprojekte';

  const user = session.user;

  // Reine Cutter (ohne Admin/Manager/Videograf) bekommen die aufgeräumte Card-Sicht
  const isCutterOnly = hasRole(user, ROLES.CUTTER) && !hasRole(user, ROLES.ADMIN, ROLES.MANAGER, ROLES.VIDEOGRAF);
  if (isCutterOnly) {
    return renderCutterProjects(session);
  }

  let projects = getRelevantProjects(user).filter(p => p.status !== STATUS.ARCHIVIERT);
  const canCreate = hasRole(user, ROLES.ADMIN, ROLES.MANAGER);
  // Brainstorming-Ideen (kundenlos) nur für Admins – Manager sehen sonst nur Projekte
  // ihrer eigenen Kunden und würden ihre eigene Idee nicht wiederfinden.
  const canQuickIdea = hasRole(user, ROLES.ADMIN);

  // Phasen-Headbar nur für Admin/Manager. Andere (z. B. Videograf) sehen die Seite wie bisher.
  const showPhases = canCreate;
  const phaseCounts = { ideen: 0, production: 0, post: 0 };
  let kundenCount = 0;
  if (showPhases) {
    const stored = localStorage.getItem(_filterKey('proj_phase'));
    if (stored && (stored === 'kunden' || PROJECT_PHASES[stored])) projectPhaseTab = stored;
    projects.forEach(p => { const ph = getProjectPhase(p); if (phaseCounts[ph] != null) phaseCounts[ph]++; });
    kundenCount = projects.length;
  }

  // Such- und Filterzustand pro Page (persistiert im LocalStorage)
  const projectFilters = JSON.parse(localStorage.getItem(_filterKey('proj_filters')) || '{}');
  const searchTerm = (projectFilters.q || '').toLowerCase();
  const statusFilter = projectFilters.status || 'all';

  if (searchTerm || statusFilter !== 'all') {
    projects = projects.filter(p => {
      if (statusFilter !== 'all' && p.status !== statusFilter) return false;
      if (!searchTerm) return true;
      const c = store.customers.find(x => x.id === p.customerId);
      const vg = store.users.find(u => u.id === p.videografId);
      const ct = store.users.find(u => u.id === p.cutterId);
      const hay = (p.title + ' ' + (c?.name || '') + ' ' + (vg?.name || '') + ' ' + (ct?.name || '') + ' ' + (p.script || '')).toLowerCase();
      return hay.includes(searchTerm);
    });
  }

  // Phasen-Filter: nur Projekte des aktiven Reiters anzeigen (Admin/Manager).
  // Der „Kunden"-Reiter zeigt alle Projekte (nach Kunde gruppiert), filtert also nicht nach Phase.
  if (showPhases && projectPhaseTab !== 'kunden') {
    projects = projects.filter(p => getProjectPhase(p) === projectPhaseTab);
  }

  const hotbar = showPhases ? `
    <div class="phase-hotbar">
      ${Object.entries(PROJECT_PHASES).map(([k, v]) => `
        <button type="button" class="phase-tab ${projectPhaseTab === k ? 'active' : ''}" onclick="setProjectPhase('${k}')">
          <span>${v}</span><span class="phase-count">${phaseCounts[k]}</span>
        </button>`).join('')}
      <button type="button" class="phase-tab ${projectPhaseTab === 'kunden' ? 'active' : ''}" onclick="setProjectPhase('kunden')">
        <span>Kunden</span><span class="phase-count">${kundenCount}</span>
      </button>
    </div>
    <select class="phase-select-mobile" onchange="setProjectPhase(this.value)" aria-label="Phase wählen">
      ${Object.entries(PROJECT_PHASES).map(([k, v]) => `
        <option value="${k}" ${projectPhaseTab === k ? 'selected' : ''}>${v} (${phaseCounts[k]})</option>`).join('')}
      <option value="kunden" ${projectPhaseTab === 'kunden' ? 'selected' : ''}>Kunden (${kundenCount})</option>
    </select>` : '';

  $('#topbar-actions').innerHTML = canCreate
    ? `<div class="flex gap-2" style="flex-wrap:wrap;">
         <button class="btn btn-secondary" onclick="openShootDayModal()">+ Drehtag</button>
         <button class="btn btn-secondary" onclick="openSeriesPlannerModal()">Serie planen</button>
         <button class="btn ${canQuickIdea ? 'btn-secondary' : 'btn-primary'}" onclick="openProjectModal()">+ Neues Projekt</button>
         ${canQuickIdea ? `<button class="btn btn-primary" onclick="openQuickIdeaModal()">+ Neue Idee</button>` : ''}
       </div>` : '';

  const filterBar = `
    <div class="card mb-4" style="padding:12px 14px;">
      <div style="display:flex; flex-wrap:wrap; gap:10px; align-items:center;">
        <input type="text" id="proj-search" placeholder="🔎 Suche (Titel, Kunde, Videograf, Cutter, Skript)…"
               value="${escape(searchTerm)}"
               oninput="onProjectFilterChange()"
               style="flex:1; min-width:240px; padding:8px 12px; border-radius:8px; background:var(--bg-2); border:1px solid var(--border); color:inherit;"/>
        <select id="proj-status" onchange="onProjectFilterChange()" style="padding:8px 12px; border-radius:8px; background:var(--bg-2); border:1px solid var(--border); color:inherit;">
          <option value="all" ${statusFilter==='all'?'selected':''}>Alle Status</option>
          ${Object.entries(STATUS_LABELS).map(([k,v]) => k !== STATUS.ARCHIVIERT ? `<option value="${k}" ${statusFilter===k?'selected':''}>${escape(v)}</option>` : '').join('')}
        </select>
        ${(searchTerm || statusFilter !== 'all') ? `<button class="btn btn-ghost btn-sm" onclick="resetProjectFilters()">Filter zurücksetzen</button>` : ''}
        <span class="text-sm text-muted">${projects.length} Treffer</span>
      </div>
    </div>
  `;

  if (projects.length === 0) {
    const filtered = (searchTerm || statusFilter !== 'all');
    let emptyMsg, cta = '';
    if (filtered) {
      emptyMsg = 'Keine Projekte entsprechen deinem Filter.';
    } else if (showPhases && projectPhaseTab === 'ideen') {
      emptyMsg = 'Noch keine Ideen festgehalten.';
      cta = canQuickIdea
        ? '<br/><br/><button class="btn btn-primary" onclick="openQuickIdeaModal()">Erste Idee festhalten</button>'
        : '';
    } else if (showPhases && projectPhaseTab === 'kunden') {
      emptyMsg = 'Noch keine Projekte vorhanden.';
    } else if (showPhases) {
      emptyMsg = `Keine Projekte in der Phase „${PROJECT_PHASES[projectPhaseTab]}".`;
    } else {
      emptyMsg = 'Noch keine Projekte vorhanden.';
      cta = canCreate ? '<br/><br/><button class="btn btn-primary" onclick="openProjectModal()">Erstes Projekt anlegen</button>' : '';
    }
    $('#content').innerHTML = hotbar + filterBar + `
      <div class="card">
        <div class="empty-state">
          <div class="empty-state-icon">🎬</div>
          ${emptyMsg}${cta}
        </div>
      </div>
    `;
    return;
  }

  // „Kunden"-Reiter: Projekte nach Kunde gruppiert anzeigen (alphabetisch sortiert).
  if (showPhases && projectPhaseTab === 'kunden') {
    const byCustomer = new Map();
    projects.forEach(p => {
      let key, label, sortKey;
      if (p.isInternal) { key = '__intern__'; label = 'Intern'; sortKey = '￿1'; }
      else if (p.customerId) {
        const c = store.customers.find(x => x.id === p.customerId);
        key = p.customerId; label = c?.name || 'Unbekannter Kunde'; sortKey = label.toLowerCase();
      } else { key = '__none__'; label = 'Ohne Kunde'; sortKey = '￿2'; }
      if (!byCustomer.has(key)) byCustomer.set(key, { label, sortKey, projects: [] });
      byCustomer.get(key).projects.push(p);
    });
    const groups = Array.from(byCustomer.values()).sort((a, b) => a.sortKey.localeCompare(b.sortKey, 'de'));
    $('#content').innerHTML = hotbar + filterBar + groups.map(g => `
      <div class="card mb-4">
        <div class="card-header">
          <div class="card-title" style="display:flex; align-items:center; gap:10px;">
            <span style="background:var(--accent-soft); color:var(--accent); padding:3px 10px; border-radius:6px; font-size:11px; font-weight:700; letter-spacing:0.4px;">👤 KUNDE</span>
            <span>${escape(g.label)}</span>
            <span style="margin-left:auto; font-size:12px; color:var(--text-3); font-weight:500;">${g.projects.length} Video${g.projects.length === 1 ? '' : 's'}</span>
          </div>
        </div>
        ${renderTable(g.projects)}
      </div>
    `).join('');
    return;
  }

  // Projekte gruppieren nach shootDayId
  const byShootDay = {};
  const noShootDay = [];
  projects.forEach(p => {
    if (p.shootDayId) {
      (byShootDay[p.shootDayId] = byShootDay[p.shootDayId] || []).push(p);
    } else {
      noShootDay.push(p);
    }
  });
  // Ideen/Projekte ohne Drehtag (z. B. der Ideen-Reiter) haben kein Drehdatum zum Sortieren →
  // alphabetisch nach Kundenname (ohne Kunde ans Ende), Titel als Zweitkriterium.
  const _custName = p => (store.customers.find(c => c.id === p.customerId)?.name || '￿').toLowerCase();
  noShootDay.sort((a, b) => _custName(a).localeCompare(_custName(b), 'de') || (a.title || '').localeCompare(b.title || '', 'de'));

  const shootDayGroups = Object.keys(byShootDay)
    .map(id => {
      const sd = store.shootDays.find(s => s.id === id);
      return sd ? { shootDay: sd, projects: byShootDay[id] } : null;
    })
    .filter(Boolean)
    .sort((a, b) => a.shootDay.date.localeCompare(b.shootDay.date));

  function renderProjectRow(p) {
    const c = store.customers.find(x => x.id === p.customerId);
    const vg = store.users.find(u => u.id === p.videografId);
    const ct = store.users.find(u => u.id === p.cutterId);
    const customerCell = p.isInternal
      ? '<span class="badge" style="background:rgba(100,210,255,0.12); color:#64d2ff; border:1px solid rgba(100,210,255,0.25);">Intern</span>'
      : escape(c?.name || '–');
    // Deadline rot hinterlegen, wenn überschritten (und das Projekt noch nicht freigegeben ist).
    // Lokales Datum verwenden (nicht UTC via toISOString), sonst kippt der Vergleich
    // je nach Zeitzone um Mitternacht falsch.
    const todayStr = localDateStr(new Date());
    const deadlineOverdue = p.deadline && p.deadline < todayStr && p.status !== STATUS.FREIGEGEBEN;
    const deadlineCell = p.deadline
      ? (deadlineOverdue
          ? `<span class="badge badge-ueberfaellig">${fmtDate(p.deadline)}</span>`
          : fmtDate(p.deadline))
      : '–';
    // Ideen direkt aus der Liste löschbar (kein Umwandeln nötig) – nur für Admins.
    const ideaTrash = (canQuickIdea && isProjectIdea(p))
      ? `<button type="button" class="row-trash" title="Idee löschen" aria-label="Idee löschen" onclick="event.stopPropagation(); deleteProject('${p.id}')">🗑</button>`
      : '';
    const noPosting = needsPostingDate(p);
    const noPostingBadge = noPosting
      ? `<span class="badge badge-no-posting">Kein Posting-Datum festgelegt</span>`
      : '';
    const nichtGedreht = isNichtGedreht(p);
    const nichtGedrehtBadge = nichtGedreht
      ? `<span class="badge badge-nicht-gedreht">Nicht gedreht</span>`
      : '';
    const rowCls = nichtGedreht ? 'row-nicht-gedreht' : (noPosting ? 'row-no-posting' : '');
    return `
      <tr class="${rowCls}" style="cursor:pointer" onclick="openProjectModal('${p.id}')">
        <td><div class="row-title"><strong>${escape(p.title)}</strong>${ideaTrash}${nichtGedrehtBadge}${noPostingBadge}</div></td>
        <td>${customerCell}</td>
        <td><span class="badge badge-${statusCls(p.status)}">${statusLabel(p.status)}</span></td>
        <td>${escape(vg?.name || '–')}</td>
        <td>${escape(ct?.name || '–')}</td>
        <td>${deadlineCell}</td>
        <td>${p.isInternal ? '–' : (fmtDate(p.postingDate) + ' 18:00')}</td>
      </tr>
    `;
  }

  function renderTable(rows) {
    return `
      <table>
        <thead>
          <tr>
            <th>Projekt</th>
            <th>Kunde</th>
            <th>Status</th>
            <th>Videograf</th>
            <th>Cutter</th>
            <th>Deadline</th>
            <th>Posting</th>
          </tr>
        </thead>
        <tbody>${rows.map(renderProjectRow).join('')}</tbody>
      </table>
    `;
  }

  $('#content').innerHTML = hotbar + filterBar + `
    ${shootDayGroups.map(g => {
      const sd = g.shootDay;
      const vg = store.users.find(u => u.id === sd.videografId);
      const cust = store.customers.find(c => c.id === sd.customerId);
      const headerText = `${fmtDate(sd.date)} · ${sd.startTime}–${sd.endTime}${vg ? ' · ' + vg.name : ''}${cust ? ' · ' + cust.name : ''}`;
      const hasNichtGedreht = g.projects.some(p => isNichtGedreht(p));
      return `
        <div class="card mb-4" style="${hasNichtGedreht ? 'border-color:rgba(255,69,58,0.35);' : ''}">
          <div class="card-header" style="cursor:pointer;" onclick="openShootDayModal('${sd.id}')">
            <div class="card-title" style="display:flex; align-items:center; gap:10px;">
              <span style="background:rgba(167,139,250,0.2); color:#c4b5fd; padding:3px 10px; border-radius:6px; font-size:11px; font-weight:700; letter-spacing:0.4px;">🎥 DREHTAG</span>
              <span>${escape(headerText)}</span>
              ${hasNichtGedreht ? `<span class="shootday-header-warn">⚠ Bitte neu planen</span>` : ''}
              <span style="margin-left:auto; font-size:12px; color:var(--text-3); font-weight:500;">${g.projects.length} Video${g.projects.length === 1 ? '' : 's'}</span>
            </div>
          </div>
          ${renderTable(g.projects)}
        </div>
      `;
    }).join('')}

    ${noShootDay.length > 0 ? `
      <div class="card">
        ${shootDayGroups.length > 0 ? `
          <div class="card-header">
            <div class="card-title">Ohne Drehtag-Zuweisung · ${noShootDay.length}</div>
          </div>
        ` : ''}
        ${renderTable(noShootDay)}
      </div>
    ` : ''}
  `;
}

/* Brainstorming „Neue Idee" (Phase Planung) – nur Admin/Manager.

function openQuickIdeaModal(ideaId = null) {

  if (!session || session.type !== 'staff' || !hasRole(session.user, ROLES.ADMIN)) {
    appAlert('Nur Admins dürfen Ideen anlegen.', { title: 'Nicht erlaubt' });
    return;
  }
  pendingScriptFile = null;
  const idea = ideaId ? store.projects.find(p => p.id === ideaId) : null;
  const isEdit = !!idea;
  const sf = idea ? scriptFileOf(idea) : null;

  const scriptPdfBlock = isEdit ? `
    <div class="form-group">
      <label class="form-label">Skript-PDF (optional)</label>
      ${sf ? `
        <div style="display:flex; align-items:center; gap:10px; padding:8px 12px; background:var(--bg-2); border:1px solid var(--border); border-radius:8px; margin-bottom:8px;">
          <span style="flex:1; font-size:13px;">📄 <a href="${API_BASE}/download.php?scope=project&id=${sf.id}" target="_blank" rel="noopener">${escape(sf.filename)}</a></span>
          <button type="button" class="btn btn-ghost btn-sm" onclick="removeScriptFile('${idea.id}', '${sf.id}')">Entfernen</button>
        </div>` : ''}

        <div style="font-size:13px;font-weight:500;">${sf ? 'Skript-PDF ersetzen' : 'Skript-PDF hochladen'}</div>
      </label>
    </div>` : '';

  const convertBtn = isEdit ? `
    <button type="button" class="btn btn-secondary" onclick="convertIdeaToProject('${idea.id}')">In Projekt umwandeln</button>` : '';
  const deleteBtn = isEdit ? `
    <button type="button" class="btn btn-danger" onclick="deleteProject('${idea.id}')">Löschen</button>` : '';

  const html = `<div class="modal-backdrop" onclick="if(event.target===this)closeModal()">
    <div class="modal" style="max-width:520px;">
      <div class="modal-header">
        <div class="modal-title">${isEdit ? 'Idee bearbeiten' : 'Neue Idee'}</div>
        <button class="modal-close" onclick="closeModal()">×</button>
      </div>
      <form onsubmit="submitQuickIdea(event, '${idea?.id || ''}')">
        <div class="modal-body">
          <p class="text-sm text-muted" style="margin-bottom:14px;">
            ${isEdit
              ? 'Skript hier weiter ausarbeiten. „In Projekt umwandeln", sobald Kunde/Drehdatum dazukommen.'
              : 'Schneller Brainstorming-Eintrag – es genügt ein Titel. Skript kannst du jetzt oder später ergänzen.'}
          </p>
          <div class="form-group">
            <label class="form-label">Videotitel *</label>
            <input type="text" name="title" required maxlength="190" ${isEdit ? '' : 'autofocus'} placeholder="Worum geht's?" value="${isEdit ? escape(idea.title || '') : ''}" />
          </div>
          <div class="form-group">
            <label class="form-label">Skript / Notizen (optional)</label>
            <textarea name="script" class="autogrow" rows="6" placeholder="Hook, Ablauf, Ideen…">${isEdit ? escape(idea.script || '') : ''}</textarea>
          </div>
          ${scriptPdfBlock}
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-ghost" onclick="closeModal()">Abbrechen</button>
          ${deleteBtn}
          ${convertBtn}
          <button type="submit" class="btn btn-primary" id="quick-idea-btn">${isEdit ? 'Speichern' : 'Idee speichern'}</button>
        </div>
      </form>
    </div>
  </div>`;
  $('#modal-container').innerHTML = html;
  initAutogrowTextareas();
}

async function submitQuickIdea(e, ideaId = '') {
  e.preventDefault();
  const session = getCurrentUser();
  if (!session || session.type !== 'staff' || !hasRole(session.user, ROLES.ADMIN)) {
    appAlert('Nur Admins dürfen Ideen anlegen.', { title: 'Nicht erlaubt' });
    return;
  }
  const form = e.target;
  const title = form.title.value.trim();
  const script = form.script.value.trim();
  if (!title) { showToast('Bitte einen Titel angeben.', 'warn'); return; }

  const btn = document.getElementById('quick-idea-btn');
  const btnLabel = btn.textContent;
  btn.disabled = true; btn.textContent = 'Wird gespeichert…';

  // Pending Skript-PDF sichern, bevor closeModal() sie zurücksetzt.
  const scriptToUpload = pendingScriptFile;
  pendingScriptFile = null;

  // ── Bestehende Idee bearbeiten ───────────────────────────────────────────
  if (ideaId) {
    const idx = store.projects.findIndex(p => p.id === ideaId);
    if (idx < 0) { showToast('Idee nicht gefunden', 'error'); return; }
    const prev = { ...store.projects[idx] };
    store.projects[idx] = { ...store.projects[idx], title, script: script || null };
    closeModal();
    renderProjects(getCurrentUser());
    try {
      const res = await fetch(`${API_BASE}/projects.php?id=${encodeURIComponent(ideaId)}`, {
        method: 'PUT', credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': CSRF },
        body: JSON.stringify({ title, script: script || '' })
      });
      const json = await res.json();
      if (!res.ok || !json.ok) throw new Error(json.error || 'Speichern fehlgeschlagen');
      if (json.data) {
        const i = store.projects.findIndex(p => p.id === ideaId);
        if (i >= 0) store.projects[i] = { ...store.projects[i], ...json.data };
      }
      if (scriptToUpload) await uploadScriptForProject(ideaId, scriptToUpload);
      showToast('Idee gespeichert', 'success');
    } catch (err) {
      const i = store.projects.findIndex(p => p.id === ideaId);
      if (i >= 0) store.projects[i] = prev;
      renderProjects(getCurrentUser());
      showToast('Fehler beim Speichern: ' + err.message, 'error');
    }
    return;
  }

  // ── Neue Idee anlegen ────────────────────────────────────────────────────
  const newId = uid('p');
  const optimistic = {
    id: newId, title, script: script || null, status: STATUS.IDEE,
    customerId: null, videografId: null, cutterId: null,
    shootDate: null, shootDayId: null, deadline: null, postingDate: null,
    isInternal: 0, createdAt: new Date().toISOString()
  };
  try {
    const res = await fetch(`${API_BASE}/projects.php`, {
      method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': CSRF },
      body: JSON.stringify({ id: newId, title, script: script || '', status: STATUS.IDEE, isInternal: 0 })
    });
    const json = await res.json();
    if (!res.ok || !json.ok) throw new Error(json.error || 'Speichern fehlgeschlagen');
    store.projects.unshift(json.data ? { ...optimistic, ...json.data } : optimistic);
    projectPhaseTab = 'ideen';
    try { localStorage.setItem(_filterKey('proj_phase'), 'ideen'); } catch (e) {}
    closeModal();
    showToast('Idee gespeichert', 'success');
    renderProjects(getCurrentUser());
    if (scriptToUpload) await uploadScriptForProject(newId, scriptToUpload);
  } catch (err) {
    showToast('Fehler beim Speichern: ' + err.message, 'error');
    btn.disabled = false; btn.textContent = btnLabel;
  }
}

/**
 * Erzeugt n Posting-Daten für einen Kunden.
 * Startet nach dem letzten bereits belegten Posting-Datum des Kunden (nahtlose
 * Fortsetzung), frühestens aber 3 Tage nach dem Drehtag.
 * @returns Array of { postingDate, deadline, cutterId }
 */
function generatePostingDates(customerId, shootDate, count) {
  const customer = store.customers.find(c => c.id === customerId);
  if (!customer || !shootDate) return [];

  const weekdays = (customer.postingWeekdays || '')
    .split(',').filter(Boolean).map(Number);
  if (weekdays.length === 0) return [];

  // Bereits belegte Posting-Tage dieses Kunden
  const usedDates = new Set(
    store.projects
      .filter(p => p.customerId === customerId && p.postingDate)
      .map(p => p.postingDate)
  );

  // Nahtlose Fortsetzung: ab dem Tag nach dem letzten belegten Posting-Datum starten
  const sortedExisting = [...usedDates].sort();
  const lastPostingDate = sortedExisting.length ? sortedExisting[sortedExisting.length - 1] : null;

  // Frühester möglicher Start: 3 Tage nach Drehtag
  const minStart = new Date(shootDate + 'T00:00:00');
  minStart.setDate(minStart.getDate() + 3);

  let startDate = minStart;
  if (lastPostingDate && lastPostingDate >= localDateStr(minStart)) {
    // Letztes belegtes Datum liegt hinter dem Mindest-Start → ab dem nächsten Tag
    const afterLast = new Date(lastPostingDate + 'T00:00:00');
    afterLast.setDate(afterLast.getDate() + 1);
    startDate = afterLast;
  }

  const results = [];
  let cur = new Date(startDate);
  const limit = 365;
  for (let iter = 0; results.length < count && iter < limit; iter++) {
    const dow = cur.getDay(); // 0=So … 6=Sa
    const dateStr = localDateStr(cur);
    if (weekdays.includes(dow) && !usedDates.has(dateStr)) {
      const deadline = addDays(dateStr, -2);
      results.push({ postingDate: dateStr, deadline, cutterId: customer.defaultCutterId || '' });
      usedDates.add(dateStr); // keine Doppelbelegung innerhalb der Serie
    }
    cur.setDate(cur.getDate() + 1);
  }
  return results;
}

function updateSeriesPreview() {
  const cid     = document.getElementById('sp-customer')?.value;
  const shoot   = document.getElementById('sp-shootDate')?.value;
  const count   = parseInt(document.getElementById('sp-count')?.value) || 0;
  const box     = document.getElementById('series-preview-container');
  const btn     = document.getElementById('sp-submit-btn');
  if (!box) return;
  if (!cid || !shoot || count < 1) { box.innerHTML = ''; if (btn) btn.disabled = true; return; }

  const customer = store.customers.find(c => c.id === cid);
  if (!customer?.postingWeekdays && !customer?.autoPostingRhythm) {
    box.innerHTML = `<div class="series-no-config">
      ⚠ Für diesen Kunden sind noch keine Posting-Wochentage konfiguriert.<br>
      Bitte zuerst im Kunden-Stammdaten den Posting-Rhythmus einrichten.
    </div>`;
    if (btn) btn.disabled = true;
    return;
  }

  const dates = generatePostingDates(cid, shoot, count);
  if (dates.length === 0) {
    box.innerHTML = `<div class="series-no-config">⚠ Keine freien Posting-Tage gefunden (nächste ${365} Tage geprüft).</div>`;
    if (btn) btn.disabled = true;
    return;
  }

  // Nahtlose-Fortsetzung-Hinweis: letztes bereits belegtes Datum ermitteln
  const existingPostingDates = store.projects
    .filter(p => p.customerId === cid && p.postingDate)
    .map(p => p.postingDate)
    .sort();
  const lastExisting = existingPostingDates.length ? existingPostingDates[existingPostingDates.length - 1] : null;
  const minStart3Days = addDays(shoot, 3);
  const continuesFrom = lastExisting && lastExisting >= minStart3Days ? lastExisting : null;
  const continuationHint = continuesFrom
    ? `<div class="series-continuation-info">↪ Nahtlose Fortsetzung nach letztem Posting-Datum (${fmtDate(continuesFrom)})</div>`
    : '';

  const rows = dates.map((d, i) => {
    const warn = d.deadline <= shoot
      ? `<span title="Cutter-Deadline liegt am/vor Drehtag" style="color:#fbbf24;">⚠</span>` : '';
    return `<tr>
      <td class="series-preview-row-num">${i + 1}</td>
      <td><input type="text" name="title_${i}" placeholder="Titel Video ${i+1}" style="min-width:160px;" /></td>
      <td><input type="date" name="postingDate_${i}" value="${d.postingDate}" onchange="onSeriesRowDateChange(${i})" /></td>
      <td><input type="date" name="deadline_${i}" value="${d.deadline}" /> ${warn}</td>
      <td><select name="cutterId_${i}">${window._seriesCutterOptsTpl(d.cutterId)}</select></td>
    </tr>`;
  }).join('');

  box.innerHTML = `${continuationHint}<table class="series-preview-table">
    <thead><tr>
      <th>#</th><th>Titel</th><th>Posting-Datum</th><th>Cutter-Deadline</th><th>Cutter</th>
    </tr></thead>
    <tbody>${rows}</tbody>
  </table>
  <div class="text-sm text-muted" style="margin-top:8px;">Drehtag für alle: ${fmtDate(shoot)} · Titel kann leer bleiben (dann wird „Video N" verwendet).</div>`;
  if (btn) { btn.disabled = false; btn.textContent = `${dates.length} Projekt${dates.length === 1 ? '' : 'e'} anlegen`; }
}

function onSeriesRowDateChange(i) {
  const postingInput = document.querySelector(`[name="postingDate_${i}"]`);
  const deadlineInput = document.querySelector(`[name="deadline_${i}"]`);
  if (postingInput?.value && deadlineInput) {
    deadlineInput.value = addDays(postingInput.value, -2);
  }
}

async function submitSeriesPlan(e) {
  e.preventDefault();
  const form = e.target;
  const cid   = document.getElementById('sp-customer')?.value;
  const shoot = document.getElementById('sp-shootDate')?.value;
  const count = parseInt(document.getElementById('sp-count')?.value) || 0;
  const session = getCurrentUser();
  if (!session || !cid || !shoot || count < 1) return;

  const btn = document.getElementById('sp-submit-btn');
  btn.disabled = true; btn.textContent = 'Wird angelegt…';

  const errors = [];
  const created = [];
  const customer = store.customers.find(c => c.id === cid);
  // Nur die tatsächlich in der Vorschau gerenderten Zeilen anlegen (kann < count sein).
  const previewDates = generatePostingDates(cid, shoot, count);
  const actualCount = previewDates.length;

  for (let i = 0; i < actualCount; i++) {
    const postingDate = form[`postingDate_${i}`]?.value;
    const deadline    = form[`deadline_${i}`]?.value;
    const cutterId    = form[`cutterId_${i}`]?.value || null;
    const rawTitle    = (form[`title_${i}`]?.value || '').trim();
    const title       = rawTitle || `${escape(customer?.name || 'Video')} – Reel ${i + 1}`;
    const newId = uid('p');

    const payload = {
      id: newId, title, customerId: cid, shootDate: shoot,
      cutterId: cutterId || null,
      postingDate: postingDate || null,
      deadline: deadline || null,
      status: STATUS.GEPLANT, isInternal: 0,
    };
    try {
      const res = await fetch(`${API_BASE}/projects.php`, {
        method: 'POST', credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': CSRF },
        body: JSON.stringify(payload)
      });
      const json = await res.json();
      if (!res.ok || !json.ok) throw new Error(json.error || 'Fehler');
      store.projects.unshift(json.data ? { ...payload, ...json.data } : payload);
      created.push(title);
    } catch (err) {
      errors.push(`Video ${i+1}: ${err.message}`);
    }
  }

  closeModal();
  renderProjects(session);
  if (errors.length) {
    showToast(`${created.length} Projekt(e) angelegt, ${errors.length} Fehler.`, 'warn');
  } else {
    showToast(`${created.length} Projekt${created.length === 1 ? '' : 'e'} erfolgreich angelegt.`, 'success');
  }
}

  const pendingApproval = projects.filter(p => p.status === STATUS.FERTIG).sort((a,b) => (a.postingDate || '').localeCompare(b.postingDate || ''));

    const vg = store.users.find(u => u.id === p.videografId);

    let action = '';
    if (kind === 'ready' || kind === 'correction') {
      action = `<button class="btn btn-primary" onclick="event.stopPropagation(); cutterAccept('${p.id}')">Annehmen &amp; starten</button>`;
    } else if (kind === 'progress') {
      action = `<button class="btn btn-primary" onclick="event.stopPropagation(); cutterMarkDone('${p.id}')">Fertig melden</button>`;
    }
    return `
      <div class="cutter-card ${kind}" onclick="openProjectModal('${p.id}')">
        <div class="cutter-card-main">
          <div class="cutter-card-title">${escape(p.title)}</div>
          <div class="cutter-card-meta">
            <span>📁 ${escape(customerLabel)}</span>
            ${vg ? `<span style="display:inline-flex; align-items:center; gap:5px;">${renderAvatar(vg, 18, 9)} ${escape(vg.name)}</span>` : ''}
            ${deadline ? `<span class="${overdue ? 'cutter-card-overdue' : ''}">⏰ Deadline: ${fmtDate(deadline)} 17:00 ${daysLeft !== null && daysLeft >= 0 ? '· in ' + daysLeft + ' Tagen' : (overdue ? '· überfällig' : '')}</span>` : ''}
            ${kind === 'correction' ? `<span class="cutter-card-correction">⚠️ Korrektur angefragt</span>` : ''}
            ${scriptFileOf(p) ? `<span>📄 Skript-PDF</span>` : ''}
          </div>
        </div>
        ${action ? `<div class="cutter-card-action">${action}</div>` : ''}
      </div>
    `;
  }

  $('#content').innerHTML = `
    ${correction.length > 0 ? `
      <div class="cutter-section">
        <div class="cutter-section-title"><span class="cutter-section-icon" style="background:#fecaca; color:#7f1d1d;">⚠️</span> Korrektur angefragt · ${correction.length}</div>
        ${correction.map(p => renderCard(p, 'correction')).join('')}
      </div>` : ''}
    ${ready.length > 0 ? `
      <div class="cutter-section">
        <div class="cutter-section-title"><span class="cutter-section-icon" style="background:#bbf7d0; color:#14532d;">✅</span> Bereit zum Schnitt · ${ready.length}</div>
        ${ready.map(p => renderCard(p, 'ready')).join('')}
      </div>` : ''}
    ${inProgress.length > 0 ? `
      <div class="cutter-section">
        <div class="cutter-section-title"><span class="cutter-section-icon" style="background:#fde68a; color:#78350f;">✂️</span> In Bearbeitung · ${inProgress.length}</div>
        ${inProgress.map(p => renderCard(p, 'progress')).join('')}
      </div>` : ''}
    ${pendingApproval.length > 0 ? `
      <div class="cutter-section">
        <div class="cutter-section-title"><span class="cutter-section-icon" style="background:#dbeafe; color:#1e3a8a;">⏳</span> Wartet auf Freigabe · ${pendingApproval.length}</div>

      </div>` : ''}
    ${done.length > 0 ? `

/* ----------- AUSWERTUNGEN ----------- */
function renderReports(session) {
  const user = session.user;
  if (!hasRole(user, ROLES.ADMIN, ROLES.MANAGER)) {
    $('#content').innerHTML = '<div class="card"><div class="empty-state">Nur für Admin/Manager.</div></div>';
    $('#topbar-actions').innerHTML = '';
    return;
  }
  // Manager (Nicht-Admin) sieht nur eigene Kunden
  const isAdminUser = hasRole(user, ROLES.ADMIN);
  const filterCustomers = (cs) => isAdminUser ? cs : cs.filter(c => !c.managerId || c.managerId === user.id);
  $('#page-title').textContent = 'Auswertungen';
  $('#page-subtitle').textContent = 'Zahlen, Auslastung und KPIs';
  $('#topbar-actions').innerHTML = '';

  // 1. Umsatz pro Kunde (vertraglich monatlich)
  const customersByRevenue = filterCustomers(store.customers)
    .filter(c => customerStatus(c) !== 'paused')
    .map(c => ({
      name: c.name,
      monthly: parseFloat(c.monthlyRate) || 0,
      videosPerMonth: parseInt(c.videosPerMonth) || 0,
      status: customerStatus(c)
    }))
    .sort((a, b) => b.monthly - a.monthly);
  const totalMonthly = customersByRevenue.reduce((s, c) => s + c.monthly, 0);
  const totalVideos = customersByRevenue.reduce((s, c) => s + c.videosPerMonth, 0);

  // 2. Soll/Ist: tatsächlich produzierte Videos in den letzten 30 Tagen
  const now = Date.now();
  const monthAgo = now - 30 * 24 * 60 * 60 * 1000;
  const recentProjects = store.projects.filter(p => {
    if (!p.approvedAt) return false;
    return new Date(p.approvedAt).getTime() >= monthAgo;
  });
  const actualPerCustomer = {};
  recentProjects.forEach(p => {
    actualPerCustomer[p.customerId] = (actualPerCustomer[p.customerId] || 0) + 1;
  });

  // 3. Auslastung pro Videograf (Drehtage im aktuellen Monat)
  const monthStart = new Date(); monthStart.setDate(1); monthStart.setHours(0,0,0,0);
  const monthStartStr = localDateStr(monthStart);
  const monthEnd = new Date(monthStart); monthEnd.setMonth(monthEnd.getMonth() + 1);
  const monthEndStr = localDateStr(monthEnd);
  const videografs = store.users.filter(u => hasRole(u, ROLES.VIDEOGRAF));
  const videografStats = videografs.map(vg => {
    const days = (store.shootDays || []).filter(s => s.videografId === vg.id && s.date >= monthStartStr && s.date < monthEndStr);
    return { name: vg.name, count: days.length };
  }).sort((a, b) => b.count - a.count);

  // 4. Auslastung Cutter: laufende Projekte (status = GEDREHT, SCHNITT, KORREKTUR)
  const cutters = store.users.filter(u => hasRole(u, ROLES.CUTTER));
  const cutterStats = cutters.map(ct => {
    const queue = store.projects.filter(p => p.cutterId === ct.id && [STATUS.GEDREHT, STATUS.SCHNITT, STATUS.KORREKTUR].includes(p.status));
    return { name: ct.name, count: queue.length };
  }).sort((a, b) => b.count - a.count);

  // 5. Time-to-Approval (Durchschnitt Tage shotAt → approvedAt)
  const approvedProjects = store.projects.filter(p => p.shotAt && p.approvedAt);
  const avgDays = approvedProjects.length > 0
    ? Math.round(approvedProjects.reduce((s, p) => s + ((new Date(p.approvedAt) - new Date(p.shotAt)) / (1000*60*60*24)), 0) / approvedProjects.length * 10) / 10
    : null;

  // 6. Aktive Projekte nach Status
  const statusCounts = {};
  store.projects.filter(p => p.status !== STATUS.ARCHIVIERT && p.status !== STATUS.FREIGEGEBEN).forEach(p => {
    statusCounts[p.status] = (statusCounts[p.status] || 0) + 1;
  });

  const kpiCard = (label, value, sub = '') => `
    <div class="card" style="padding:18px;">
      <div class="text-sm text-muted" style="margin-bottom:6px;">${escape(label)}</div>
      <div style="font-size:28px; font-weight:600;">${escape(value)}</div>
      ${sub ? `<div class="text-sm text-muted" style="margin-top:4px;">${escape(sub)}</div>` : ''}
    </div>
  `;

  $('#content').innerHTML = `
    <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:14px; margin-bottom:22px;">
      ${kpiCard('Wiederkehrender Monatsumsatz', totalMonthly.toLocaleString('de-DE', { minimumFractionDigits: 2 }) + ' €', `${customersByRevenue.length} aktive Kunden`)}
      ${kpiCard('Soll-Videos / Monat', totalVideos.toString(), 'laut Verträgen')}
      ${kpiCard('Tatsächliche Videos (30 T)', recentProjects.length.toString(), `${totalVideos > 0 ? Math.round(recentProjects.length / totalVideos * 100) : 0}% vom Soll`)}
      ${kpiCard('Ø Time-to-Approval', avgDays !== null ? avgDays + ' Tage' : '–', `${approvedProjects.length} freigegebene Projekte`)}
    </div>

    <div style="display:grid; grid-template-columns:1fr 1fr; gap:14px;">
      <div class="card">
        <div class="card-header"><div class="card-title">Umsatz pro Kunde</div></div>

function renderShootDays(session) {

  $('#topbar-actions').innerHTML = `

  `;

  const todayStr = new Date().toISOString().slice(0, 10);
  const all = (store.shootDays || []).slice().sort((a, b) => a.date.localeCompare(b.date));
  const upcoming = all.filter(s => s.date >= todayStr);

async function saveShootDay(e, shootDayId) {
  e.preventDefault();
  const fd = new FormData(e.target);
  const data = {
    date: fd.get('date'),
    videografId: fd.get('videografId') || null,
    startTime: fd.get('startTime') || '09:00',
    endTime: fd.get('endTime') || '17:00',
    customerId: fd.get('customerId') || null,
    note: (fd.get('note') || '').trim()
  };
  if (!data.date) {
    appAlert('Bitte ein Datum wählen.', { title: 'Datum fehlt' });
    return;
  }
  if (!data.videografId) {
    appAlert('Bitte einen Videografen auswählen.', { title: 'Videograf fehlt' });
    return;
  }

  let rescheduledFrom = null;
  let prevEntry = null;
  let insertedId = null;

  if (shootDayId) {
    const idx = store.shootDays.findIndex(s => s.id === shootDayId);
    if (idx >= 0) {
      prevEntry = { ...store.shootDays[idx] };
      if (prevEntry.date && prevEntry.date !== data.date) rescheduledFrom = prevEntry.date;
      store.shootDays[idx] = { ...prevEntry, ...data, rescheduledFrom: rescheduledFrom ?? prevEntry.rescheduledFrom ?? null };
    }
  } else {
    insertedId = uid('sd');
    store.shootDays.push({ id: insertedId, ...data, rescheduledFrom: null, createdAt: new Date().toISOString() });
  }

  closeModal();
  renderPage();
  if (rescheduledFrom) {
    showToast('Drehtag verschoben', 'Von ' + fmtDate(rescheduledFrom) + ' auf ' + fmtDate(data.date) + ' – Kunde wird benachrichtigt.');
  } else {
    showToast('Drehtag gespeichert', fmtDate(data.date) + ' · ' + data.startTime + '–' + data.endTime);
  }

  // Direkt in DB schreiben
  try {
    const url = shootDayId
      ? `${API_BASE}/shootdays.php?id=${encodeURIComponent(shootDayId)}`
      : `${API_BASE}/shootdays.php`;
    const method = shootDayId ? 'PUT' : 'POST';
    const payload = shootDayId ? { ...data, rescheduledFrom } : { ...data, id: insertedId, rescheduledFrom: null };
    const res = await fetch(url, {
      method,
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': CSRF },
      body: JSON.stringify(payload)
    });
    const json = await res.json();
    if (!res.ok || !json.ok) throw new Error(json.error || 'Speichern fehlgeschlagen');
    if (json.data) {
      const targetId = shootDayId || insertedId;
      const idx = store.shootDays.findIndex(s => s.id === targetId);
      if (idx >= 0) store.shootDays[idx] = { ...store.shootDays[idx], ...json.data };
    }
  } catch (err) {
    // Rollback
    if (shootDayId && prevEntry) {
      const idx = store.shootDays.findIndex(s => s.id === shootDayId);
      if (idx >= 0) store.shootDays[idx] = prevEntry;
    } else if (insertedId) {
      store.shootDays = store.shootDays.filter(s => s.id !== insertedId);
    }
    renderPage();
    showToast('Fehler beim Speichern', err.message);
  }
}

async function deleteShootDay(shootDayId) {
  const session = getCurrentUser();
  if (!session || session.type !== 'staff' || !hasRole(session.user, ROLES.ADMIN, ROLES.MANAGER)) {
    appAlert('Nur Admin/Manager dürfen Drehtage löschen.', { title: 'Nicht erlaubt' });
    return;
  }
  const linkedCount = store.projects.filter(p => p.shootDayId === shootDayId).length;
  const msg = linkedCount > 0
    ? `${linkedCount} Projekt${linkedCount === 1 ? ' ist' : 'e sind'} diesem Drehtag zugewiesen. Die Projekte bleiben erhalten, sind dann aber ohne Drehtag.`
    : 'Der Drehtag wird gelöscht.';
  const ok = await appConfirm(msg, { title: 'Drehtag löschen?', okLabel: 'Löschen', danger: true });
  if (!ok) return;
  // Snapshot für Rollback
  const removedSd = store.shootDays.find(s => s.id === shootDayId);
  const unlinkedProjects = [];
  // Verlinkung in Projekten entfernen
  store.projects.forEach(p => {
    if (p.shootDayId === shootDayId) {
      unlinkedProjects.push({ p, id: p.shootDayId });
      delete p.shootDayId;
    }
  });
  trackDeletion('shootDays', shootDayId);
  store.shootDays = store.shootDays.filter(s => s.id !== shootDayId);
  closeModal();
  renderPage();
  // Direkt in DB löschen
  try {
    const res = await fetch(
      `${API_BASE}/shootdays.php?id=${encodeURIComponent(shootDayId)}`,
      { method: 'DELETE', credentials: 'same-origin', headers: { 'X-CSRF-Token': CSRF } }
    );
    const json = await res.json();
    if (!res.ok || !json.ok) throw new Error(json.error || 'Löschen fehlgeschlagen');
  } catch (err) {
    // Rollback
    if (removedSd) store.shootDays.push(removedSd);
    unlinkedProjects.forEach(({ p }) => { p.shootDayId = shootDayId; });
    await pullAllFromCloud().then(() => renderPage());
    showToast('Fehler beim Speichern', err.message);
  }
}

function openProjectModal(projectId = null, forceFull = false) {

  const project = projectId ? store.projects.find(p => p.id === projectId) : null;

  // Ideen (eigener Status 'idee') öffnen den schlanken Ideen-Editor – kein Kunde nötig.
  // Ausnahme: forceFull (z. B. „In Projekt umwandeln") öffnet das volle Projektformular,
  // damit Kunde/Deadline/Zuweisung ergänzt werden können.
  if (project && project.status === STATUS.IDEE && !forceFull) {
    if (isAdmin) return openQuickIdeaModal(project.id);
    return openProjectViewerModal(project);
  }

  if (isNew && !isManagerOrAdmin) return; // only managers/admins create

  // Manager dürfen nur Projekte ihrer EIGENEN Kunden bearbeiten (Owner-Prüfung)

      return openProjectViewerModal(project);
